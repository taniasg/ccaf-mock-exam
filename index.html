ur suppliers, what was attempted and what failed."}], "correct_answer": "D", "technical_explanation": "The principle is to recover locally and propagate selectively. Subagents resolve transient failures locally, propagate only what they cannot resolve, and include partial results and what they attempted, so the coordinator decides with complete information.", "distractor_analysis": [{"key": "A", "type": "Confusion distractor", "explanation": "It delivers useful data, but silently suppresses the error. The coordinator cannot distinguish \"there is nothing more\" from \"I could not search\", which is one of the two documented anti-patterns."}, {"key": "B", "type": "Conceptual distractor", "explanation": "It misapplies the fail-fast principle: it ends the whole workflow because of a single transient failure, which is the other documented anti-pattern."}, {"key": "C", "type": "Plausible alternative", "explanation": "Central handling can make sense in other designs, but here the coordinator receives transient failures the subagent could resolve on its own and does not receive the partial results."}, {"key": "D", "type": "Correct", "explanation": "Correct."}], "reference": "2_2 Structured Error Responses (\"Error Propagation in Multi-Agent Systems\", trap \"Silently suppressing subagent errors…\")"}, {"id": "D2-Q17", "domain": "2", "domain_name": "Tool Design & MCP Integration", "subdomain_code": "2.2", "subdomain_name": "Structured Error Responses", "difficulty": "Difficult", "question_type": "Long", "reference_topic": "Designing responses for four situations", "question": "You are designing the responses of a customer_lookup tool for four situations:\n(1) The customer database does not respond after 5 seconds.\n(2) The email address received is not in a valid format.\n(3) The query runs correctly and there is no customer with that email.\n(4) The service account does not have permission to read the requested financial records.\n\nWhich design follows the documentation?", "options": [{"key": "A", "text": "(1) isError: true, errorCategory \"transient\", isRetryable: true. (2) isError: true, errorCategory \"validation\", isRetryable: true, because the agent can correct the email. (3) isError: false, resultCount: 0. (4) isError: true, errorCategory \"permission\", isRetryable: false."}, {"key": "B", "text": "(1) isError: true, errorCategory \"transient\", isRetryable: true. (2) isError: true, errorCategory \"validation\", isRetryable: false. (3) isError: false, resultCount: 0. (4) isError: true, errorCategory \"permission\", isRetryable: false, to escalate or use another principal."}, {"key": "C", "text": "(1) isError: true, errorCategory \"transient\", isRetryable: true. (2) isError: true, errorCategory \"validation\", isRetryable: false. (3) isError: true, errorCategory \"validation\", isRetryable: false, so the agent does not retry. (4) isError: true, errorCategory \"permission\", isRetryable: false."}, {"key": "D", "text": "(1), (2) and (4) with isError: true and a detailed explanation in the content text, without errorCategory or isRetryable, because the model infers the category from the text. (3) with isError: false."}], "correct_answer": "B", "technical_explanation": "Each situation maps to a different category: transient (retryable), validation (correct the input and make a new call, isRetryable: false), valid empty result (not an error) and permission (escalate or use a principal with access). Only transient is retryable.", "distractor_analysis": [{"key": "A", "type": "Confusion distractor", "explanation": "It is almost identical, but marks validation as retryable, the documented trap: resending the same malformed email will fail every time."}, {"key": "B", "type": "Correct", "explanation": "Correct."}, {"key": "C", "type": "Conceptual distractor", "explanation": "It treats a successful query with no matches as an error. The documentation insists that a valid empty result is not an error."}, {"key": "D", "type": "Plausible alternative", "explanation": "A rich description helps, but without errorCategory and isRetryable the agent cannot reliably distinguish a timeout from a rule violation or decide on recovery."}], "reference": "2_2 Structured Error Responses (\"The Four Error Categories\", \"Access Failure vs Valid Empty Result\", exercise steps 2 to 4)"}, {"id": "D2-Q18", "domain": "2", "domain_name": "Tool Design & MCP Integration", "subdomain_code": "2.2", "subdomain_name": "Structured Error Responses", "difficulty": "Difficult", "question_type": "Long", "reference_topic": "Where protocol errors are fixed", "question": "An agent's logs show hundreds of JSON-RPC responses with error -32602 (\"Invalid params\") when calling book_slot. The reason is that the agent sends dates as \"05/11/2026\" and the input schema requires a different format. None of these calls actually runs the tool. A developer proposes adding logic based on errorCategory and isRetryable to the agent's recovery loop for these cases. What is correct?", "options": [{"key": "A", "text": "These are protocol errors: the tool did not run and the model does not receive a result. They are fixed in the tool's schema or in the client, not in the agent's recovery loop."}, {"key": "B", "text": "The proposal is correct: the loop should read the errorCategory \"validation\" from these responses, reformat the date according to the schema and issue a new call with the corrected value."}, {"key": "C", "text": "These responses should be marked with isRetryable: true so the host resends them automatically until they are accepted."}, {"key": "D", "text": "The number of retries with backoff in the MCP client should be increased, to absorb these failures without affecting the agent."}], "correct_answer": "A", "technical_explanation": "When arguments fail the input schema, the server returns a JSON-RPC protocol error with no result. The host handles it and the model never sees a tool result. The four categories and isRetryable describe execution errors. A protocol error means the call was built incorrectly, and it is fixed in the schema or the client.", "distractor_analysis": [{"key": "A", "type": "Correct", "explanation": "Correct."}, {"key": "B", "type": "Confusion distractor", "explanation": "It assumes protocol errors carry errorCategory and reach the agent as a result. That metadata belongs to the execution layer."}, {"key": "C", "type": "Conceptual distractor", "explanation": "isRetryable is metadata for execution errors, and resending the same invalid parameters would fail the same way."}, {"key": "D", "type": "Plausible alternative", "explanation": "Retries with backoff suit transient failures, but here each retry repeats the same invalid parameters."}], "reference": "2_2 Structured Error Responses (\"Two Error Layers\")"}, {"id": "D2-Q19", "domain": "2", "domain_name": "Tool Design & MCP Integration", "subdomain_code": "2.3", "subdomain_name": "Tool Distribution & Tool Choice", "difficulty": "Easy", "question_type": "Short", "reference_topic": "tool_choice \"any\" with several schemas", "question": "An extraction pipeline has one tool schema for invoices, another for receipts and another for contracts. The input document type is unknown and guaranteed structured output is required. Which tool_choice configuration applies, according to the exam guide?", "options": [{"key": "A", "text": "\"auto\", because it is the default mode and lets the model decide which schema to apply."}, {"key": "B", "text": "Forced selection of extract_invoice, because it always guarantees structured output."}, {"key": "C", "text": "Forced selection of a classify_document tool on the first turn and \"auto\" on the following ones."}, {"key": "D", "text": "\"any\", so the model must call a tool but chooses which one."}], "correct_answer": "D", "technical_explanation": "With \"any\" the model must call a tool but chooses which one. It is the mode for guaranteeing structured output when the input could match one of several schemas: the model picks one and never returns conversational text.", "distractor_analysis": [{"key": "A", "type": "Conceptual distractor", "explanation": "\"auto\" is the default mode for agentic loops, but it allows the model to answer with text instead of calling a tool, so it does not guarantee structured output."}, {"key": "B", "type": "Confusion distractor", "explanation": "Forced selection guarantees structure, but of a single schema. A receipt or a contract would be extracted with the invoice schema."}, {"key": "C", "type": "Plausible alternative", "explanation": "Adding a prior classification step can make sense in other workflows, but the later extraction with \"auto\" loses the structured-output guarantee again."}, {"key": "D", "type": "Correct", "explanation": "Correct."}], "reference": "2_3 Tool Distribution & Tool Choice (\"The tool_choice Configuration\"); Quick Reference Domain 2 (\"tool_choice Modes\")"}, {"id": "D2-Q20", "domain": "2", "domain_name": "Tool Design & MCP Integration", "subdomain_code": "2.3", "subdomain_name": "Tool Distribution & Tool Choice", "difficulty": "Easy", "question_type": "Short", "reference_topic": "Enforcing a mandatory first step", "question": "In a document analysis agent, extract_metadata must always run before any enrichment tool. How is this order guaranteed?", "options": [{"key": "A", "text": "With tool_choice \"any\" on the first call, to force the model to start with a tool."}, {"key": "B", "text": "With tool_choice {\"type\": \"tool\", \"name\": \"extract_metadata\"} on the first call and \"auto\" on the following ones."}, {"key": "C", "text": "With a system prompt instruction: \"Always call extract_metadata first\"."}, {"key": "D", "text": "With \"auto\" and extract_metadata placed first in the tools array."}], "correct_answer": "B", "technical_explanation": "Forced selection requires a call to one specific tool and can enforce a mandatory step: the model cannot skip or reorder it. Once the forced call completes, later turns can use \"auto\".", "distractor_analysis": [{"key": "A", "type": "Confusion distractor", "explanation": "It guarantees there will be a call, but not which one. The model could start with an enrichment tool."}, {"key": "B", "type": "Correct", "explanation": "Correct."}, {"key": "C", "type": "Plausible alternative", "explanation": "A prompt instruction is usually followed, but it is not a guarantee: the model can skip it."}, {"key": "D", "type": "Conceptual distractor", "explanation": "Position in the array imposes no execution order. With \"auto\" the model still decides freely."}], "reference": "2_3 Tool Distribution & Tool Choice (\"Forced selection\"); exercise step 3"}, {"id": "D2-Q21", "domain": "2", "domain_name": "Tool Design & MCP Integration", "subdomain_code": "2.3", "subdomain_name": "Tool Distribution & Tool Choice", "difficulty": "Easy", "question_type": "Medium", "reference_topic": "Least privilege with constrained tools", "question": "A document analysis subagent uses a generic fetch_url tool to load PDFs from the internal portal. Reviews show that it sometimes downloads arbitrary web pages unrelated to its task. What change does the documentation recommend?", "options": [{"key": "A", "text": "Keep fetch_url and add an instruction to the system prompt to download only documents from the portal."}, {"key": "B", "text": "Move fetch_url to a separate MCP server dedicated exclusively to documents."}, {"key": "C", "text": "Replace fetch_url with load_document, a tool that validates that the URL is a document URL and accepts only those."}, {"key": "D", "text": "Rename fetch_url to load_document and change its description to \"Loads documents from the portal\", without modifying its behaviour."}], "correct_answer": "C", "technical_explanation": "A constrained tool such as load_document applies the principle of least privilege: it prevents misuse (the agent cannot fetch arbitrary URLs), makes the tool's purpose clearer and reduces the risk of unintended side effects.", "distractor_analysis": [{"key": "A", "type": "Plausible alternative", "explanation": "It may reduce the problem, but the ability to fetch any URL remains, and the model does not always follow prompt instructions."}, {"key": "B", "type": "Conceptual distractor", "explanation": "Server boundaries are invisible to the model, which receives all tools as one flat list. Moving the tool does not restrict what it can reach."}, {"key": "C", "type": "Correct", "explanation": "Correct."}, {"key": "D", "type": "Confusion distractor", "explanation": "It clarifies the purpose, but the tool can still fetch any URL. The constraint has to be in the validation, not just the name."}], "reference": "2_3 Tool Distribution & Tool Choice (\"Replacing Generic Tools with Constrained Alternatives\")"}, {"id": "D2-Q22", "domain": "2", "domain_name": "Tool Design & MCP Integration", "subdomain_code": "2.3", "subdomain_name": "Tool Distribution & Tool Choice", "difficulty": "Intermediate", "question_type": "Medium", "reference_topic": "Consolidating variations of the same job", "question": "An analytics server exposes 22 tools to a single agent: three query tools (one per data source) and 19 transformation tools, such as pivot_table, calculate_percentile and normalise_currency. All the transformations take a dataset, apply an operation and return a dataset. Selection is unreliable. What solution does the documentation recommend?", "options": [{"key": "A", "text": "Consolidate the 19 transformations into a transform_data tool with an enum transform_type parameter, so the agent chooses among four tools."}, {"key": "B", "text": "Split by role: a query agent with the three query tools and a specialised transformation agent that receives the 19 transformations, each with its own description."}, {"key": "C", "text": "Rewrite all 22 descriptions with the five elements and explicit boundaries between the similar transformations."}, {"key": "D", "text": "Move the 19 transformations to a second MCP server so the agent perceives them as a separate group."}], "correct_answer": "A", "technical_explanation": "The 19 transformations are variations of the same job and share a shape (data in, an operation, data out). So they are consolidated into one parameterised tool: 22 tools become 4 with no loss of capability, and each transformation becomes an enum value the model picks inside a single call.", "distractor_analysis": [{"key": "A", "type": "Correct", "explanation": "Correct."}, {"key": "B", "type": "Confusion distractor", "explanation": "Splitting by role looks like the standard fix, but the transformation agent inherits the original problem: 19 near-identical tools it cannot choose between reliably."}, {"key": "C", "type": "Plausible alternative", "explanation": "Better descriptions are the fix for a small toolkit. With 22 tools, rewriting them leaves the decision just as complex."}, {"key": "D", "type": "Conceptual distractor", "explanation": "The client gives the model the tools from every server as one flat list. 22 tools on two servers are still 22 tools."}], "reference": "2_3 Tool Distribution & Tool Choice (\"Consolidating Near-Duplicate Tools\", fix table)"}, {"id": "D2-Q23", "domain": "2", "domain_name": "Tool Design & MCP Integration", "subdomain_code": "2.3", "subdomain_name": "Tool Distribution & Tool Choice", "difficulty": "Intermediate", "question_type": "Medium", "reference_topic": "Scoped cross-role tools", "question": "In a hotel booking system, a pricing agent checks the availability of a room type in almost every request. Today each check goes through the coordinator, which delegates it to the inventory agent and returns the answer. This adds 2-3 round trips per request. Some checks are complex: they span several hotels or require judgement. Which design is most appropriate?", "options": [{"key": "A", "text": "Give the pricing agent all of the inventory agent's tools, so it can resolve any availability check directly, simple or complex, without going through the coordinator."}, {"key": "B", "text": "Add a cache of availability responses in the coordinator to return repeated checks instantly."}, {"key": "C", "text": "Increase the coordinator's parallelism so it processes queued checks faster."}, {"key": "D", "text": "Give the pricing agent a scoped check_availability tool for simple checks, and keep the complex ones going through the coordinator."}], "correct_answer": "D", "technical_explanation": "A scoped cross-role tool is a constrained version of the capability that the agent uses directly for simple, high-frequency requests. It avoids the round trip to the coordinator, while complex cases (multiple sources, cross-referencing or judgement) still go through it.", "distractor_analysis": [{"key": "A", "type": "Confusion distractor", "explanation": "It removes the round trips, but violates least privilege and expands the agent's toolkit with capabilities outside its role."}, {"key": "B", "type": "Plausible alternative", "explanation": "A cache helps with repeated checks, but new ones still pay the full round trip, and availability changes constantly."}, {"key": "C", "type": "Conceptual distractor", "explanation": "More parallelism does not remove the hops per request. The latency comes from the route, not from the coordinator's capacity."}, {"key": "D", "type": "Correct", "explanation": "Correct."}], "reference": "2_3 Tool Distribution & Tool Choice (\"Scoped Cross-Role Tools\")"}, {"id": "D2-Q24", "domain": "2", "domain_name": "Tool Design & MCP Integration", "subdomain_code": "2.3", "subdomain_name": "Tool Distribution & Tool Choice", "difficulty": "Intermediate", "question_type": "Short", "reference_topic": "Expressing scope in a strict schema", "question": "You want check_stock, with strict: true, to accept exactly one product code per call. Which schema achieves this according to the documentation?", "options": [{"key": "A", "text": "An array stock_codes with maxItems: 1, included in required and with additionalProperties: false at object level."}, {"key": "B", "text": "A single string field stock_code with a pattern, included in required and with additionalProperties: false."}, {"key": "C", "text": "A free-text query field whose description says \"enter only one code\"."}, {"key": "D", "text": "An array stock_codes with minItems: 1, included in required."}], "correct_answer": "B", "technical_explanation": "Scope is built into the structure of the schema. Strict tool use supports enum, pattern and an array minItems of 0 or 1, but the API rejects maxItems, maxLength, minimum and maximum with a 400 error. So \"one code per call\" is expressed as a single string field, not an array with maxItems: 1.", "distractor_analysis": [{"key": "A", "type": "Confusion distractor", "explanation": "It looks like the natural way to limit to one element, but the API rejects maxItems in strict tool use with a 400 error."}, {"key": "B", "type": "Correct", "explanation": "Correct."}, {"key": "C", "type": "Plausible alternative", "explanation": "The description can guide the model, but free text does not enforce the limit and opens the door to queries beyond the scope."}, {"key": "D", "type": "Conceptual distractor", "explanation": "minItems: 1 is valid, but it requires at least one element: it does not prevent sending several codes."}], "reference": "2_3 Tool Distribution & Tool Choice (\"Scoped Cross-Role Tools\": check_stock example and strict limitations)"}, {"id": "D2-Q25", "domain": "2", "domain_name": "Tool Design & MCP Integration", "subdomain_code": "2.3", "subdomain_name": "Tool Distribution & Tool Choice", "difficulty": "Difficult", "question_type": "Long", "reference_topic": "Tool distribution in a research system", "question": "You are designing a multi-agent research system with a coordinator, a web search agent, a document analysis agent and a synthesis agent. 85% of the fact verifications the synthesis agent needs are simple lookups; the remaining 15% require several sources. Which tool distribution is most appropriate?", "options": [{"key": "A", "text": "A single agent with all 16 search, analysis, synthesis and review tools, to remove round trips between agents."}, {"key": "B", "text": "Search: search_web, fetch_page, extract_links, save_snippet. Analysis: extract_metadata, extract_data_points, summarize_content, verify_claim. Synthesis: compile_report, format_citation, assess_coverage and a verify_fact with query and url fields, to also cover complex verifications. Coordinator: Agent, review_output, request_revision."}, {"key": "C", "text": "Search: search_web, fetch_page, extract_links, save_snippet. Analysis: extract_metadata, extract_data_points, summarize_content, verify_claim. Synthesis: compile_report, verify_fact (one claim in, one verdict out), format_citation, assess_coverage. Coordinator: Agent, review_output, request_revision."}, {"key": "D", "text": "Search and analysis as in the standard design. Synthesis: compile_report, verify_fact (scoped), format_citation, assess_coverage. Coordinator: Agent, review_output, request_revision, search_web and summarize_content, so it can resolve complex verifications itself."}], "correct_answer": "C", "technical_explanation": "Each agent receives a small set of tools matching its role. The synthesis agent has a scoped verify_fact (one claim in, one verdict out, no query or URL fields) for the 85% simple cases, and the complex 15% goes to the search agent through the coordinator. The coordinator holds no domain-specific tools.", "distractor_analysis": [{"key": "A", "type": "Plausible alternative", "explanation": "It removes round trips, but an agent with 16 tools doing different jobs selects less reliably. It is the tool overload problem."}, {"key": "B", "type": "Confusion distractor", "explanation": "It is almost the correct design, but with query and url fields verify_fact is no longer scoped: the synthesis agent could run its own searches, exactly what should be avoided."}, {"key": "C", "type": "Correct", "explanation": "Correct."}, {"key": "D", "type": "Conceptual distractor", "explanation": "It misapplies the idea of delegating complex verifications: the coordinator should not hold domain tools, but delegate to the specialised agent."}], "reference": "2_3 Tool Distribution & Tool Choice (\"In the exam\": distribution table and Sample Question 9)"}, {"id": "D2-Q26", "domain": "2", "domain_name": "Tool Design & MCP Integration", "subdomain_code": "2.3", "subdomain_name": "Tool Distribution & Tool Choice", "difficulty": "Difficult", "question_type": "Long", "reference_topic": "Consolidation and constraint at the same time", "question": "An architecture review has proposed two changes:\n1. Consolidate 19 near-identical transformation tools into a transform_data tool with an enum transform_type parameter.\n2. Replace the document subagent's generic fetch_url tool with load_document, which accepts only validated document URLs.\n\nA security reviewer objects that change 1 contradicts the least-privilege principle that justifies change 2, because a single tool now does many things. Which assessment is correct?", "options": [{"key": "A", "text": "Both changes are compatible. Consolidating reduces how many tools the agent chooses between without giving it new capabilities, and constraining reduces what a tool can reach."}, {"key": "B", "text": "The reviewer is right: a parameterised tool expands the agent's privileges. The 19 separate tools should be kept and their descriptions improved."}, {"key": "C", "text": "Consolidation is correct and, for consistency with it, load_document and fetch_url should also be consolidated into a single fetch_resource tool with a resource_type parameter."}, {"key": "D", "text": "To respect least privilege, the 19 transformations should be divided among three transformation agents with 6 or 7 tools each."}], "correct_answer": "A", "technical_explanation": "Consolidating reduces the number of tools the agent chooses between; constraining reduces what a tool can reach. Combining the 19 transformations into transform_data gives the agent no new capabilities, so it does not undo least privilege. The documentation notes that both changes can be right in the same system.", "distractor_analysis": [{"key": "A", "type": "Correct", "explanation": "Correct."}, {"key": "B", "type": "Confusion distractor", "explanation": "It sounds like a rigorous security argument, but consolidation adds no capabilities, and with 19 tools descriptions do not solve the decision complexity."}, {"key": "C", "type": "Conceptual distractor", "explanation": "It uses consolidation to undo the constraint: fetch_resource would give the agent back the ability to fetch arbitrary resources."}, {"key": "D", "type": "Plausible alternative", "explanation": "It reduces the number of tools per agent, but adds coordination and leaves each agent with several near-identical tools, when the documented fix for variations of one job is to consolidate."}], "reference": "2_3 Tool Distribution & Tool Choice (\"Consolidating Near-Duplicate Tools\", \"Replacing Generic Tools…\", \"In the exam\")"}, {"id": "D2-Q27", "domain": "2", "domain_name": "Tool Design & MCP Integration", "subdomain_code": "2.3", "subdomain_name": "Tool Distribution & Tool Choice", "difficulty": "Difficult", "question_type": "Long", "reference_topic": "Tools outside the agent's role", "question": "A synthesis agent receives a package of already-verified results from the search agent. Because it has access to search_web, it often runs its own searches before writing. This duplicates work and consumes context. Even so, while writing it frequently needs to confirm isolated facts, such as a figure or a date.\n\nWhich change is most appropriate?", "options": [{"key": "A", "text": "Keep search_web and add a system prompt rule to use only the results received unless information is missing."}, {"key": "B", "text": "Remove search_web from the synthesis agent and give it a scoped verify_fact: one claim in and one verdict out, with no query or URL fields."}, {"key": "C", "text": "Replace search_web with a verify_fact that accepts the claim to check and an optional search_query field, for flexibility in verifications that turn out to be difficult."}, {"key": "D", "text": "Configure forced tool_choice with compile_report on every turn of the synthesis agent, so it cannot call search_web."}], "correct_answer": "B", "technical_explanation": "An agent with tools outside its specialisation tends to misuse them, for example by running its own searches instead of using the results it received. Each agent gets only the tools its role needs. For simple, frequent verifications it is given a tool whose scope is defined in its schema, with no fields that allow its own searches.", "distractor_analysis": [{"key": "A", "type": "Plausible alternative", "explanation": "It may reduce the problem, but the tool is still available and the model does not always follow prompt instructions."}, {"key": "B", "type": "Correct", "explanation": "Correct."}, {"key": "C", "type": "Confusion distractor", "explanation": "It looks like the correct solution, but the search_query field breaks the scope: the agent could search on its own again."}, {"key": "D", "type": "Conceptual distractor", "explanation": "Forced selection is for enforcing a specific step. Forcing it on every turn would also block legitimate fact verification."}], "reference": "2_3 Tool Distribution & Tool Choice (\"The Tool Overload Problem\", \"Scoped Cross-Role Tools\", \"In the exam\")"}, {"id": "D2-Q28", "domain": "2", "domain_name": "Tool Design & MCP Integration", "subdomain_code": "2.4", "subdomain_name": "MCP Server Integration", "difficulty": "Easy", "question_type": "Short", "reference_topic": "Server configuration for the whole team", "question": "A team of five developers wants all of them to have the same GitHub MCP server available in Claude Code when they clone the repository. Where should it be configured?", "options": [{"key": "A", "text": "In .mcp.json, at the repository root and under version control."}, {"key": "B", "text": "In each developer's ~/.claude.json, with the same entry copied into all of them."}, {"key": "C", "text": "In a .mcp.json file in each developer's home directory."}, {"key": "D", "text": "In no fixed configuration: each developer activates the server manually at the start of each session."}], "correct_answer": "A", "technical_explanation": "Project-level configuration goes in .mcp.json, at the repository root, under version control. Every team member who clones the repository receives it. It is the place for servers the whole team needs.", "distractor_analysis": [{"key": "A", "type": "Correct", "explanation": "Correct."}, {"key": "B", "type": "Plausible alternative", "explanation": "It would work if everyone copies it correctly, but ~/.claude.json is personal and not shared. The team's configuration can drift over time."}, {"key": "C", "type": "Confusion distractor", "explanation": "It uses the right file name in the wrong location. The shared .mcp.json lives at the project root, not in the home directory."}, {"key": "D", "type": "Conceptual distractor", "explanation": "There is no manual activation step: the tools of configured, reachable servers are discovered at connection time."}], "reference": "2_4 MCP Server Integration (\"The Scoping Hierarchy\"); Quick Reference Domain 2 (\"Configuration files\")"}, {"id": "D2-Q29", "domain": "2", "domain_name": "Tool Design & MCP Integration", "subdomain_code": "2.4", "subdomain_name": "MCP Server Integration", "difficulty": "Easy", "question_type": "Short", "reference_topic": "Credentials in .mcp.json", "question": "The project's shared .mcp.json needs a GitHub token to authenticate. The repository is private. How should it be configured?", "options": [{"key": "A", "text": "By writing the token directly into .mcp.json, since only team members can see the repository."}, {"key": "B", "text": "By moving the whole server configuration into each developer's ~/.claude.json so the token is not version-controlled."}, {"key": "C", "text": "With \"GITHUB_TOKEN\": \"${GITHUB_TOKEN}\", so each developer sets their token in their local environment."}, {"key": "D", "text": "With \"${GITHUB_TOKEN:-ghp_teamToken}\", using the real token as the default value for anyone who has not set it."}], "correct_answer": "C", "technical_explanation": "The ${VARIABLE_NAME} syntax references the variable name, not its value. The file is safe to commit, each developer authenticates with their own credentials, token rotation requires no configuration changes, and no secrets leak through history.", "distractor_analysis": [{"key": "A", "type": "Conceptual distractor", "explanation": "A private repository is not a secret store: every clone and fork carries the token in its history."}, {"key": "B", "type": "Plausible alternative", "explanation": "It keeps the token out of the repository, but loses the team's shared configuration."}, {"key": "C", "type": "Correct", "explanation": "Correct."}, {"key": "D", "type": "Confusion distractor", "explanation": "It uses the correct expansion syntax, but the default value embeds the real secret in the committed file. ${VAR:-default} is for non-sensitive values such as paths."}], "reference": "2_4 MCP Server Integration (\"Environment Variable Expansion\", trap \"Pasting a token into .mcp.json…\")"}, {"id": "D2-Q30", "domain": "2", "domain_name": "Tool Design & MCP Integration", "subdomain_code": "2.4", "subdomain_name": "MCP Server Integration", "difficulty": "Easy", "question_type": "Medium", "reference_topic": "Build or use an existing server", "question": "A team uses Linear for issue tracking and wants to integrate it into its Claude Code workflow. Its needs are the usual ones: querying, creating and updating issues. A developer proposes writing a custom MCP server. The team wants to maintain as little code as possible. What is the correct first step?", "options": [{"key": "A", "text": "Build a lightweight custom server that exposes only the Linear endpoints the team uses, to minimise the exposed surface."}, {"key": "B", "text": "Call the Linear REST API directly from Bash commands, without going through MCP."}, {"key": "C", "text": "Add the integration to each developer's ~/.claude.json so each can configure it their own way."}, {"key": "D", "text": "Evaluate the existing community MCP servers for Linear, and build a custom one only if they do not cover team-specific needs."}], "correct_answer": "D", "technical_explanation": "Standard integrations (Jira, GitHub, Slack, Linear, Notion) have maintained community servers that are tested and updated. Using them saves development time and maintenance. A custom server is only justified for specific workflows the community servers cannot handle, custom business logic, or internal systems without a community server.", "distractor_analysis": [{"key": "A", "type": "Confusion distractor", "explanation": "It sounds pragmatic because of its small size, but it is still custom code to maintain for a standard case already covered by community servers."}, {"key": "B", "type": "Plausible alternative", "explanation": "It may work technically, but it does not expose the integration as MCP tools and requires maintaining the scripts."}, {"key": "C", "type": "Conceptual distractor", "explanation": "It confuses the scope: ~/.claude.json is personal and neither decides which server to use nor shares it with the team."}, {"key": "D", "type": "Correct", "explanation": "Correct."}], "reference": "2_4 MCP Server Integration (\"The Build-vs-Use Decision\", \"In the exam\")"}, {"id": "D2-Q31", "domain": "2", "domain_name": "Tool Design & MCP Integration", "subdomain_code": "2.4", "subdomain_name": "MCP Server Integration", "difficulty": "Intermediate", "question_type": "Medium", "reference_topic": "MCP resources for content catalogues", "question": "At the start of every task, an agent calls list_tables and then describe_table for each of the database's 40 tables, just to learn what data exists. What change reduces these exploratory calls?", "options": [{"key": "A", "text": "Add a cache to describe_table so repeated calls respond faster."}, {"key": "B", "text": "Expose the database schema (tables, column types and relationships) as an MCP resource."}, {"key": "C", "text": "Create a get_full_schema tool that returns all tables in a single call."}, {"key": "D", "text": "Expose the schema as an MCP prompt that the client can retrieve."}], "correct_answer": "B", "technical_explanation": "An MCP resource exposes a content catalogue to the agent upfront, so it needs no exploratory calls to discover what data exists. Database schemas are one of the documented examples. Resources show what data is available; tools let the agent act on it.", "distractor_analysis": [{"key": "A", "type": "Plausible alternative", "explanation": "It speeds up the calls, but does not remove them: the agent still makes 41 exploratory calls per task."}, {"key": "B", "type": "Correct", "explanation": "Correct."}, {"key": "C", "type": "Confusion distractor", "explanation": "It reduces the number of calls, but still treats context information as an action. The documented mechanism for exposing a catalogue is a resource."}, {"key": "D", "type": "Conceptual distractor", "explanation": "MCP prompts are reusable message templates, not a mechanism for exposing data catalogues."}], "reference": "2_4 MCP Server Integration (\"MCP Resources\"); Glossary Domain 2 (\"Resources (MCP)\", \"Prompts (MCP)\")"}, {"id": "D2-Q32", "domain": "2", "domain_name": "Tool Design & MCP Integration", "subdomain_code": "2.4", "subdomain_name": "MCP Server Integration", "difficulty": "Intermediate", "question_type": "Short", "reference_topic": "Remote entry without type", "question": "In .mcp.json, a remote server is declared only with \"url\": \"https://mcp.example.com/mcp\", without the type field. What happens in Claude Code?", "options": [{"key": "A", "text": "Claude Code infers HTTP from the URL's https scheme and connects normally."}, {"key": "B", "text": "The server loads, but its tools stay inactive until they are activated manually."}, {"key": "C", "text": "Claude Code reads it as a stdio server, skips it, and tells you to add the type."}, {"key": "D", "text": "Loading of the entire .mcp.json fails and none of the project's servers are available."}], "correct_answer": "C", "technical_explanation": "A remote server must declare \"type\": \"http\" and a url; a local one declares command and args and communicates over stdio. An entry with a url but no type is a configuration error: Claude Code reads it as a stdio server, skips it and asks for the type to be added.", "distractor_analysis": [{"key": "A", "type": "Confusion distractor", "explanation": "It is the intuitive assumption, but the documentation states that the transport is not inferred from the URL."}, {"key": "B", "type": "Conceptual distractor", "explanation": "There is no manual activation step. What happens is that the entry is skipped."}, {"key": "C", "type": "Correct", "explanation": "Correct."}, {"key": "D", "type": "Plausible alternative", "explanation": "A strict parser might behave this way, but the failure affects only that entry, which is skipped with a warning."}], "reference": "2_4 MCP Server Integration (\"The Scoping Hierarchy\": remote and local entry forms)"}, {"id": "D2-Q33", "domain": "2", "domain_name": "Tool Design & MCP Integration", "subdomain_code": "2.4", "subdomain_name": "MCP Server Integration", "difficulty": "Intermediate", "question_type": "Medium", "reference_topic": "MCP descriptions versus built-in tools", "question": "A team added an MCP server with search_codebase, which performs semantic search with AST-aware indexing. Its description is \"Searches code\". Claude keeps using Grep even to find code by what it does. Which change is most appropriate?", "options": [{"key": "A", "text": "Expand the description of search_codebase: what it does, what it returns (path, lines and context) and when to use it instead of Grep."}, {"key": "B", "text": "Add the rule \"Always use search_codebase instead of Grep\" to the system prompt."}, {"key": "C", "text": "Remove Grep from the available tools so the agent can only use search_codebase."}, {"key": "D", "text": "Rename search_codebase to semantic_grep, so the model associates it with the kind of searches it currently handles with the built-in Grep tool."}], "correct_answer": "A", "technical_explanation": "Built-in tools such as Grep have rich descriptions, and when an MCP tool has a sparse description the agent may prefer the built-in one even if the MCP tool is more capable. The fix is a description that explains capabilities, outputs and when to use it versus the built-in alternative in detail.", "distractor_analysis": [{"key": "A", "type": "Correct", "explanation": "Correct."}, {"key": "B", "type": "Plausible alternative", "explanation": "It may help, but the model does not always follow prompt rules, and the sparse description still does not explain why the tool is better."}, {"key": "C", "type": "Conceptual distractor", "explanation": "Removing Grep breaks tasks that still need it, such as searching for exact strings. The documentation lists this as a trap."}, {"key": "D", "type": "Confusion distractor", "explanation": "It seems to leverage the association with Grep, but the name is not the primary selection signal and the description remains sparse."}], "reference": "2_4 MCP Server Integration (\"Detailed MCP Tool Descriptions\", trap \"Adding a system prompt rule or removing built-in tools…\")"}, {"id": "D2-Q34", "domain": "2", "domain_name": "Tool Design & MCP Integration", "subdomain_code": "2.4", "subdomain_name": "MCP Server Integration", "difficulty": "Difficult", "question_type": "Long", "reference_topic": "Complete configuration plan", "question": "An online store has four developers using Claude Code. They need:\n- GitHub and Jira, for the whole team. Both offer official remote servers.\n- A connector for the internal inventory system, which has no community server and applies its own business rules. Also for the whole team.\n- An experimental code search server that only one developer wants to try before proposing it.\n- Each developer must use their own credentials, and there must be no secrets in the repository.\n\nWhich plan meets all the requirements?", "options": [{"key": "A", "text": "Configure all four servers in .mcp.json, including the experimental one, so the team's configuration lives in a single place. Use ${VAR} for credentials."}, {"key": "B", "text": "Build custom servers for GitHub, Jira and inventory, to standardise maintenance. Configure them in .mcp.json with ${VAR} and put the experimental one in ~/.claude.json."}, {"key": "C", "text": "Configure GitHub and Jira in .mcp.json with only their url, the custom inventory connector also in .mcp.json, credentials with ${VAR}, and the experimental server in the developer's ~/.claude.json."}, {"key": "D", "text": "Configure GitHub and Jira in .mcp.json with \"type\": \"http\" and their url, build the custom inventory connector and configure it in .mcp.json too, use ${VAR} for credentials, and put the experimental server in the developer's ~/.claude.json."}], "correct_answer": "D", "technical_explanation": "Team servers go in .mcp.json (version-controlled and shared) and personal or experimental ones in ~/.claude.json. Standard integrations use existing servers, and only the connector for the internal system with no community server and custom logic is built. Credentials use ${VAR}, and remote entries must declare \"type\": \"http\".", "distractor_analysis": [{"key": "A", "type": "Plausible alternative", "explanation": "It centralises the configuration, but imposes on the whole team an experimental server that only one person wants to try. That case belongs at user level."}, {"key": "B", "type": "Conceptual distractor", "explanation": "It misapplies the build criterion: GitHub and Jira are standard integrations with existing servers. Building custom is only justified for the internal inventory."}, {"key": "C", "type": "Confusion distractor", "explanation": "It is almost identical to the correct plan, but remote entries without \"type\": \"http\" are read as stdio and skipped, so GitHub and Jira would not be available."}, {"key": "D", "type": "Correct", "explanation": "Correct."}], "reference": "2_4 MCP Server Integration (\"The Scoping Hierarchy\", \"Environment Variable Expansion\", \"The Build-vs-Use Decision\")"}, {"id": "D2-Q35", "domain": "2", "domain_name": "Tool Design & MCP Integration", "subdomain_code": "2.4", "subdomain_name": "MCP Server Integration", "difficulty": "Difficult", "question_type": "Long", "reference_topic": "Unset environment variable", "question": "The project's .mcp.json uses \"GITHUB_TOKEN\": \"${GITHUB_TOKEN}\". The team assumed that if someone was missing the variable, Claude Code would fail visibly at startup. A new developer clones the repository without setting GITHUB_TOKEN. They start Claude Code, the rest of the configuration loads, and they do not notice the problem until GitHub operations fail. What is correct?", "options": [{"key": "A", "text": "Claude Code aborted loading .mcp.json. To prevent this, declare ${GITHUB_TOKEN:-none} so the variable always has a value."}, {"key": "B", "text": "An unset variable with no default does not stop loading: Claude Code warns and continues. It cannot serve as a visible failure; each developer must set GITHUB_TOKEN in their local environment."}, {"key": "C", "text": "The most reliable option is to include a shared service token in .mcp.json for newcomers, since only the team can access the repository."}, {"key": "D", "text": "The GitHub server should be moved to each developer's ~/.claude.json, so each one configures it with their own token when needed and the project configuration does not depend on environment variables."}], "correct_answer": "B", "technical_explanation": "The documentation states that an unset variable with no default does not prevent the rest of the configuration from loading: Claude Code warns and continues, so you should not rely on a missing token causing a visible failure. The correct model is still for each developer to set their token locally (shell profile, .env file or secrets manager).", "distractor_analysis": [{"key": "A", "type": "Confusion distractor", "explanation": "It misdescribes the behaviour (loading is not aborted), and the default value does not provide a valid token, so GitHub would still fail."}, {"key": "B", "type": "Correct", "explanation": "Correct."}, {"key": "C", "type": "Conceptual distractor", "explanation": "A private repository is not a secret store. The token would end up in every clone's history and individual authentication would be lost."}, {"key": "D", "type": "Plausible alternative", "explanation": "It avoids committing the token, but breaks the shared configuration of the GitHub server, which belongs in .mcp.json."}], "reference": "2_4 MCP Server Integration (\"Environment Variable Expansion\": \"Current state\" note on unset variables)"}, {"id": "D2-Q36", "domain": "2", "domain_name": "Tool Design & MCP Integration", "subdomain_code": "2.4", "subdomain_name": "MCP Server Integration", "difficulty": "Difficult", "question_type": "Medium", "reference_topic": "Tool discovery across levels", "question": "Ana has an experimental code-search server in her ~/.claude.json. The repository has a .mcp.json with github and stock-db. In project sessions, Claude uses code-search tools without Ana doing anything. Her colleague Luis, with the same repository, does not see them. Ana wants to propose the server to the team. What explains the situation and what should she do?", "options": [{"key": "A", "text": "It is explained by ~/.claude.json being personal. For the team, it is enough for each colleague to add the same entry to their own ~/.claude.json."}, {"key": "B", "text": "Ana activated code-search manually in her session. Luis must activate it from his own session as well."}, {"key": "C", "text": "The tools of all configured servers, project and user level, are discovered at connection time and are available simultaneously. ~/.claude.json is not shared; to propose it, Ana should move it to .mcp.json."}, {"key": "D", "text": "The tools of all configured servers, project and user level, are discovered at connection time. Luis does not see it because he does not have the file. To share it, Ana should add her ~/.claude.json to the repository, at the root next to .mcp.json."}], "correct_answer": "C", "technical_explanation": "All tools from all configured servers, both project and user level, are discovered at connection time and available simultaneously, with no manual activation. ~/.claude.json is personal and not version-controlled, so Luis does not have it. Servers proposed to the team move to .mcp.json.", "distractor_analysis": [{"key": "A", "type": "Plausible alternative", "explanation": "The explanation is correct, but the solution keeps a configuration that can drift between people, instead of a shared, version-controlled one."}, {"key": "B", "type": "Conceptual distractor", "explanation": "There is no manual activation step: if a server is configured and reachable, its tools appear."}, {"key": "C", "type": "Correct", "explanation": "Correct."}, {"key": "D", "type": "Confusion distractor", "explanation": "It gets discovery right, but ~/.claude.json is a personal file in the home directory that also holds local entries. What gets shared is .mcp.json at the project root."}], "reference": "2_4 MCP Server Integration (\"The Scoping Hierarchy\")"}, {"id": "D2-Q37", "domain": "2", "domain_name": "Tool Design & MCP Integration", "subdomain_code": "2.5", "subdomain_name": "Built-in Tools", "difficulty": "Easy", "question_type": "Short", "reference_topic": "Finding who calls a function", "question": "You need to find every file that calls validatePayment(). Which Claude Code built-in tool is appropriate?", "options": [{"key": "A", "text": "Glob with the pattern \"**/*validatePayment*\"."}, {"key": "B", "text": "Grep with the pattern \"validatePayment\"."}, {"key": "C", "text": "Read on every source file, to review the calls one by one."}, {"key": "D", "text": "Bash with find . -name \"*.ts\" | xargs grep validatePayment."}], "correct_answer": "B", "technical_explanation": "Grep searches file contents for patterns and is the tool for finding function calls, error messages or imports. A function call is text inside a file.", "distractor_analysis": [{"key": "A", "type": "Confusion distractor", "explanation": "Glob finds files by path. A file's path contains no information about what it calls, so it does not find the callers."}, {"key": "B", "type": "Correct", "explanation": "Correct."}, {"key": "C", "type": "Conceptual distractor", "explanation": "It uses Read as a search tool. Reading every file upfront is the most costly mistake when exploring a codebase."}, {"key": "D", "type": "Plausible alternative", "explanation": "It would work technically, but the documentation says to use the most specific tool and avoid Bash when a specialised tool handles the task better."}], "reference": "2_5 Built-in Tools (\"Grep vs Glob: The Core Distinction\"); Quick Reference Domain 2 (\"Selection principle\")"}, {"id": "D2-Q38", "domain": "2", "domain_name": "Tool Design & MCP Integration", "subdomain_code": "2.5", "subdomain_name": "Built-in Tools", "difficulty": "Easy", "question_type": "Short", "reference_topic": "Finding files by name", "question": "You need to locate all the repository's configuration files, which follow the naming pattern config.*. What do you do?", "options": [{"key": "A", "text": "Grep with the pattern \"config\" across the whole repository."}, {"key": "B", "text": "Bash with find . -name \"config.*\"."}, {"key": "C", "text": "Grep with the pattern \"**/config.*\"."}, {"key": "D", "text": "Glob with the pattern \"**/config.*\"."}], "correct_answer": "D", "technical_explanation": "Glob finds files by name, extension or directory structure patterns, and is the purpose-built tool for locating configuration or test files.", "distractor_analysis": [{"key": "A", "type": "Confusion distractor", "explanation": "Technically it could find files that mention \"config\", but it searches content. It is a documented trap: for paths the exam expects Glob."}, {"key": "B", "type": "Plausible alternative", "explanation": "It works, but Bash is not the most specific tool for this case."}, {"key": "C", "type": "Conceptual distractor", "explanation": "It applies a path pattern to a tool that searches inside file contents."}, {"key": "D", "type": "Correct", "explanation": "Correct."}], "reference": "2_5 Built-in Tools (\"Grep vs Glob\", trap \"Using Grep to find files by extension…\")"}, {"id": "D2-Q39", "domain": "2", "domain_name": "Tool Design & MCP Integration", "subdomain_code": "2.5", "subdomain_name": "Built-in Tools", "difficulty": "Easy", "question_type": "Medium", "reference_topic": "Edit as the default tool", "question": "In an 800-line file, the signature function applyDiscount(total: number) must be changed to function applyDiscount(total: number, coupon?: string). That signature appears only once in the file. Which tool do you use?", "options": [{"key": "A", "text": "Edit, with old_string set to the current signature and new_string set to the new signature."}, {"key": "B", "text": "Read to load the full file and Write to save the modified version."}, {"key": "C", "text": "Write directly with the full file contents, rebuilt from what is already known about it."}, {"key": "D", "text": "Edit with replace_all: true, in case the same signature appears elsewhere in the file."}], "correct_answer": "A", "technical_explanation": "Edit makes targeted changes by finding unique text and replacing it. It is fast, precise and changes only that text, so it is the default tool for modifications. Read + Write is the fallback when Edit cannot find a unique anchor.", "distractor_analysis": [{"key": "A", "type": "Correct", "explanation": "Correct."}, {"key": "B", "type": "Plausible alternative", "explanation": "It always works, but spends tokens on the whole file for a one-line change. It is the fallback, not the default."}, {"key": "C", "type": "Conceptual distractor", "explanation": "Write saves a complete file. Using it without reading the file risks losing content; it is not a targeted editing tool."}, {"key": "D", "type": "Confusion distractor", "explanation": "It uses Edit, but replace_all is meant for deliberately changing every occurrence. Here there is only one, and it is not needed."}], "reference": "2_5 Built-in Tools (\"Read, Write, and Edit\"); Quick Reference Domain 2 (\"Tool Selection in Claude Code\")"}, {"id": "D2-Q40", "domain": "2", "domain_name": "Tool Design & MCP Integration", "subdomain_code": "2.5", "subdomain_name": "Built-in Tools", "difficulty": "Intermediate", "question_type": "Medium", "reference_topic": "Incremental codebase exploration", "question": "A refund bug must be investigated in a codebase of about 200 files. The only clue is the error message \"Refund window expired\", which appears in the logs. What approach does the documentation recommend?", "options": [{"key": "A", "text": "Read all 200 files at the start, to get a complete picture before forming hypotheses."}, {"key": "B", "text": "Glob with \"**/*refund*\" and Read every matching file."}, {"key": "C", "text": "Grep for the error message, read the file it points to, follow its imports and Grep again for any new names that come up."}, {"key": "D", "text": "Read the application's entry points (index, main) first and follow all their imports, module by module, until reaching the code that throws the error."}], "correct_answer": "C", "technical_explanation": "Incremental exploration starts with Grep to find entry points (here the error message), continues with Read to trace the flow and imports, uses Grep again to trace usage, and reads only what the previous step justifies. This uses the minimum context.", "distractor_analysis": [{"key": "A", "type": "Conceptual distractor", "explanation": "It is the most costly mistake when exploring a codebase: it fills the context window with files that are mostly unrelated to the task."}, {"key": "B", "type": "Confusion distractor", "explanation": "It looks targeted, but it searches by path instead of content: it may not include the file that throws the error and forces reading irrelevant files."}, {"key": "C", "type": "Correct", "explanation": "Correct."}, {"key": "D", "type": "Plausible alternative", "explanation": "It is a reasonable top-down approach in other contexts, but it reads many files before reaching the relevant one. The error message already tells you where to start."}], "reference": "2_5 Built-in Tools (\"Incremental Codebase Understanding\")"}, {"id": "D2-Q41", "domain": "2", "domain_name": "Tool Design & MCP Integration", "subdomain_code": "2.5", "subdomain_name": "Built-in Tools", "difficulty": "Intermediate", "question_type": "Long", "reference_topic": "Tracing usage through a barrel file", "question": "processOrder is defined in orders.ts. The barrel file utils/index.ts re-exports it as follows: export { processOrder as submitOrder }. A Grep for \"processOrder\" returns the definition, the barrel line and two consumers. The team knows there are more consumers, because several screens use the function and do not appear in the results. What is the correct next step to find them all?", "options": [{"key": "A", "text": "Repeat the Grep with a broader regular expression, such as \"process.*Order\" and case-insensitive, to cover spelling variants."}, {"key": "B", "text": "Read the barrel file to identify the exported names and Grep for submitOrder across the whole codebase."}, {"key": "C", "text": "Glob with \"**/*Order*\" to locate order-related files and review their imports."}, {"key": "D", "text": "Read every file in src/ that did not appear in the first Grep, to confirm which ones use the function."}], "correct_answer": "B", "technical_explanation": "When a barrel file re-exports a function under another name, consumers that import it by that name never contain the original name. You must read the file that defines or re-exports it to identify the exported names, then Grep for each one across the codebase.", "distractor_analysis": [{"key": "A", "type": "Confusion distractor", "explanation": "It widens the pattern, but the string \"submitOrder\" does not match \"process.*Order\". The search still misses those importing the alias."}, {"key": "B", "type": "Correct", "explanation": "Correct."}, {"key": "C", "type": "Conceptual distractor", "explanation": "Glob searches by path, and file names do not indicate which functions they import."}, {"key": "D", "type": "Plausible alternative", "explanation": "It could find the consumers, but consumes context massively when a single targeted search locates them."}], "reference": "2_5 Built-in Tools (\"Tracing Function Usage Across Wrapper Modules\")"}, {"id": "D2-Q42", "domain": "2", "domain_name": "Tool Design & MCP Integration", "subdomain_code": "2.5", "subdomain_name": "Built-in Tools", "difficulty": "Intermediate", "question_type": "Short", "reference_topic": "Why Edit fails", "question": "An Edit with old_string \"processOrder(orderId)\" fails with the message \"old_string matches 3 locations\". What does this mean?", "options": [{"key": "A", "text": "That the file changed since it was last read and must be read again with Read before editing."}, {"key": "B", "text": "That old_string must match the entire file contents, as with Write."}, {"key": "C", "text": "That Edit applied the change at the first match and warns that two others remain unchanged."}, {"key": "D", "text": "That the anchor is not unique. Edit fails as a safety mechanism so as not to change text you did not mean to change."}], "correct_answer": "D", "technical_explanation": "Edit needs its anchor (the exact text it searches for) to be unique in the file. If it appears in several places, Edit cannot tell which one you mean and fails. This failure is a safety mechanism, not a tool bug.", "distractor_analysis": [{"key": "A", "type": "Plausible alternative", "explanation": "It is a real problem in other contexts, but the message indicates a multiple match, not a stale file."}, {"key": "B", "type": "Conceptual distractor", "explanation": "It confuses Edit with Write: Edit replaces an exact fragment of text, not the whole file."}, {"key": "C", "type": "Confusion distractor", "explanation": "It sounds plausible, but Edit modifies nothing when the anchor is not unique. That is precisely how it prevents unwanted changes."}, {"key": "D", "type": "Correct", "explanation": "Correct."}], "reference": "2_5 Built-in Tools (\"Read, Write, and Edit\")"}, {"id": "D2-Q43", "domain": "2", "domain_name": "Tool Design & MCP Integration", "subdomain_code": "2.5", "subdomain_name": "Built-in Tools", "difficulty": "Difficult", "question_type": "Long", "reference_topic": "Callers of a deprecated function and their tests", "question": "The deprecated function processLegacyOrder() must be removed. First you must locate every file that calls it and the tests that exercise it, including those that do so indirectly through the module that uses it. The repository has several thousand source files, far more than fit in context, and the project's settings do not allow Bash. Which sequence is correct?", "options": [{"key": "A", "text": "Grep for \"processLegacyOrder\" for the callers; Glob for their tests by naming convention (e.g. **/OrderProcessor.test.*); and a new Grep for any wrappers that expose the function under another name."}, {"key": "B", "text": "Glob for \"**/*.test.*\" to get all the repository's tests and then Grep for \"processLegacyOrder\" over those files, to keep the tests that exercise the function and infer the callers from them."}, {"key": "C", "text": "Grep for \"processLegacyOrder\" across the whole repository, because a single content search returns both the files that call the function and all the tests that exercise it, directly or indirectly."}, {"key": "D", "text": "Glob for \"*processLegacyOrder*\" to find the callers and Grep over the results to identify the tests."}], "correct_answer": "A", "technical_explanation": "The documented sequence is Grep, then Glob, then Grep again. Grep finds the files that reference the function. Glob finds each caller's paired test by naming convention, even when the test does not contain the function name. The second Grep covers wrappers. Starting with Glob is wrong.", "distractor_analysis": [{"key": "A", "type": "Correct", "explanation": "Correct."}, {"key": "B", "type": "Confusion distractor", "explanation": "It combines the two right tools, but a test that exercises the function through the source module may not contain its name, so the Grep over the tests misses it."}, {"key": "C", "type": "Plausible alternative", "explanation": "It finds the callers and the tests that import the function directly, but not those that exercise it indirectly."}, {"key": "D", "type": "Conceptual distractor", "explanation": "Glob searches by path and cannot find callers, because the function name is not in the files' paths."}], "reference": "2_5 Built-in Tools (\"Finding Callers and Their Tests\", \"In the exam\", \"Practice Scenario\")"}, {"id": "D2-Q44", "domain": "2", "domain_name": "Tool Design & MCP Integration", "subdomain_code": "2.5", "subdomain_name": "Built-in Tools", "difficulty": "Difficult", "question_type": "Medium", "reference_topic": "Fallback when there is no unique anchor", "question": "A generated configuration file contains three blocks that are identical line by line, including the surrounding context. Only the second one must be modified. According to the exam guide, how is this done?", "options": [{"key": "A", "text": "Widen old_string with more lines of context until it matches a single location."}, {"key": "B", "text": "Use Edit with replace_all: true and then review the file."}, {"key": "C", "text": "Load the full file with Read and write the modified version with Write."}, {"key": "D", "text": "Use Bash with sed to replace the text at the line number of the second block."}], "correct_answer": "C", "technical_explanation": "The exam guide states that Read + Write is the fallback when Edit cannot find unique anchor text. Here no anchor, however long, can be unique, and only one of the occurrences should change, so Read + Write is the only valid option.", "distractor_analysis": [{"key": "A", "type": "Confusion distractor", "explanation": "It is the preferred recovery in real work, but it requires a unique anchor to exist. With identical blocks, including their context, none exists. This is the documented trap."}, {"key": "B", "type": "Conceptual distractor", "explanation": "replace_all changes every occurrence, and here only one should change."}, {"key": "C", "type": "Correct", "explanation": "Correct."}, {"key": "D", "type": "Plausible alternative", "explanation": "It could work, but it uses Bash for a task the specialised tools handle, and the exam guide names Read + Write as the fallback."}], "reference": "2_5 Built-in Tools (\"Read, Write, and Edit\", trap \"Widening old_string or setting replace_all…\")"}, {"id": "D2-Q45", "domain": "2", "domain_name": "Tool Design & MCP Integration", "subdomain_code": "2.5", "subdomain_name": "Built-in Tools", "difficulty": "Difficult", "question_type": "Long", "reference_topic": "Choosing the tool for each task", "question": "A developer has four tasks to do in a repository:\n(1) Locate all .mdx files under content/domains/.\n(2) Find where the error \"PAYMENT_DECLINED\" is thrown.\n(3) Run the test suite.\n(4) Change a constant whose definition appears only once in a file.\n\nWhich tool assignment applies the principle of using the most specific tool?", "options": [{"key": "A", "text": "(1) Grep, (2) Glob, (3) Bash, (4) Edit."}, {"key": "B", "text": "Bash for all four tasks, since it can list files, search text, run tests and edit with sed."}, {"key": "C", "text": "(1) Glob, (2) Grep, (3) Bash, (4) Read + Write."}, {"key": "D", "text": "(1) Glob, (2) Grep, (3) Bash, (4) Edit."}], "correct_answer": "D", "technical_explanation": "Glob finds files by path pattern, Grep searches content, Bash runs commands such as tests (which no other tool covers), and Edit is the default tool for a targeted change with a unique anchor. The principle is always to use the most specific tool.", "distractor_analysis": [{"key": "A", "type": "Conceptual distractor", "explanation": "It swaps Grep and Glob: Grep searches content and Glob searches paths."}, {"key": "B", "type": "Plausible alternative", "explanation": "Bash could do everything, but the documentation says to avoid it when a specialised tool handles the task better."}, {"key": "C", "type": "Confusion distractor", "explanation": "The first three assignments are correct, but Read + Write is the fallback. With a unique anchor, Edit is the default and uses less context."}, {"key": "D", "type": "Correct", "explanation": "Correct."}], "reference": "2_5 Built-in Tools (\"Grep vs Glob\", \"Read, Write, and Edit\"); Quick Reference Domain 2 (\"Tool Selection in Claude Code\")"}]}

{"metadata": {"title": "Question bank – Domain 3: Claude Code Configuration & Workflows", "certification": "Claude Certified Architect – Foundations", "language": "en", "version": "1.0", "total_questions": 45, "difficulty_levels": ["Easy", "Intermediate", "Difficult"], "question_types": ["Short", "Medium", "Long"], "distractor_types": ["Correct", "Plausible alternative", "Conceptual distractor", "Confusion distractor"], "subdomains": [{"code": "3.1", "name": "CLAUDE.md Hierarchy, Scoping, and Modular Organisation"}, {"code": "3.2", "name": "Custom Slash Commands and Skills"}, {"code": "3.3", "name": "Path-Specific Rules for Conditional Convention Loading"}, {"code": "3.4", "name": "Plan Mode vs Direct Execution"}, {"code": "3.5", "name": "Iterative Refinement Techniques"}, {"code": "3.6", "name": "CI/CD Integration"}], "sources": ["3_1 CLAUDE.md Hierarchy, Scoping, and Modular Organisation", "3_2 Custom Slash Commands and Skills", "3_3 Path-Specific Rules for Conditional Convention Loading", "3_4 Plan Mode vs Direct Execution", "3_5 Iterative Refinement Techniques", "3_6 CI/CD Integration", "Glossary Domain 3", "Quick Reference Domain 3"]}, "questions": [{"id": "D3-Q01", "domain": "3", "domain_name": "Claude Code Configuration & Workflows", "subdomain_code": "3.1", "subdomain_name": "CLAUDE.md Hierarchy, Scoping, and Modular Organisation", "difficulty": "Easy", "question_type": "Short", "reference_topic": "User scope vs project scope", "question": "Which of these Claude Code instruction locations does NOT reach teammates who clone the repository?", "options": [{"key": "A", "text": "~/.claude/CLAUDE.md, in the developer's home directory."}, {"key": "B", "text": "packages/api/CLAUDE.md, the CLAUDE.md for one specific monorepo subdirectory."}, {"key": "C", "text": ".claude/CLAUDE.md, inside the repository's .claude directory."}, {"key": "D", "text": ".claude/rules/testing.md without frontmatter, which loads in every session."}], "correct_answer": "A", "technical_explanation": "The user-level CLAUDE.md lives in the home directory, outside any repository: it is not version-controlled and git never shares it. The other locations are inside the repository and reach everyone who clones or pulls.", "distractor_analysis": [{"key": "A", "type": "Correct", "explanation": "Correct. The user level is strictly personal and is not shared via git."}, {"key": "B", "type": "Plausible alternative", "explanation": "It looks \"narrow\" or local because it applies to a single directory, but the file is in the repository and is shared with the team; its scope is directory-level, not personal."}, {"key": "C", "type": "Confusion distractor", "explanation": "The name .claude/ resembles the personal ~/.claude/ folder, but .claude/CLAUDE.md is a valid project-level location that is version-controlled and shared."}, {"key": "D", "type": "Conceptual distractor", "explanation": "Confuses \"loads in every session\" with \"personal\". A .claude/rules/ file is in the repository and is shared; without frontmatter it simply always loads."}], "reference": "3_1 CLAUDE.md Hierarchy, Scoping, and Modular Organisation (\"The Three-Level Hierarchy\"); Quick Reference Domain 3 (\"Configuration Hierarchy\")"}, {"id": "D3-Q02", "domain": "3", "domain_name": "Claude Code Configuration & Workflows", "subdomain_code": "3.1", "subdomain_name": "CLAUDE.md Hierarchy, Scoping, and Modular Organisation", "difficulty": "Easy", "question_type": "Medium", "reference_topic": "Concatenation and load order", "question": "A developer starts Claude Code inside packages/api/. Three applicable files exist: ~/.claude/CLAUDE.md, the CLAUDE.md at the repository root, and packages/api/CLAUDE.md. How does Claude Code treat them?", "options": [{"key": "A", "text": "It loads only the file closest to the working directory, because it replaces the broader-scope files."}, {"key": "B", "text": "It concatenates them and, if two instructions contradict each other, the package file always wins because it is read last."}, {"key": "C", "text": "It concatenates them into context, from the broadest scope to the most specific, without any one overriding another."}, {"key": "D", "text": "It combines them with the same precedence as settings.json, so the user file prevails over the project files."}], "correct_answer": "C", "technical_explanation": "According to the memory documentation, all discovered files are concatenated into context rather than overriding each other. The order is a load order (user, project, directory), not a precedence order: if two rules contradict each other, Claude may pick one arbitrarily.", "distractor_analysis": [{"key": "A", "type": "Plausible alternative", "explanation": "This is the inheritance model of other configuration tools, where the closest file replaces the rest, but in Claude Code all applicable files load together."}, {"key": "B", "type": "Confusion distractor", "explanation": "Right about concatenation and that the package file is read last, but confuses load order with precedence: being read last does not guarantee winning a conflict."}, {"key": "C", "type": "Correct", "explanation": "Correct. Concatenation in order of increasing specificity, with no overriding."}, {"key": "D", "type": "Conceptual distractor", "explanation": "Applies the settings.json precedence chain to CLAUDE.md. CLAUDE.md has no strict precedence, and in settings.json it is not the user level that wins anyway."}], "reference": "3_1 CLAUDE.md Hierarchy, Scoping, and Modular Organisation (\"Loading Order and Conflict Handling\"); Glossary Domain 3 (\"CLAUDE.md\")"}, {"id": "D3-Q03", "domain": "3", "domain_name": "Claude Code Configuration & Workflows", "subdomain_code": "3.1", "subdomain_name": "CLAUDE.md Hierarchy, Scoping, and Modular Organisation", "difficulty": "Intermediate", "question_type": "Medium", "reference_topic": "New team member without instructions", "question": "For months, Claude Code has followed the API naming conventions perfectly for Developer A. Developer B joined last week, works on the same repository and the same branch, and gets inconsistent naming. What is the most likely root cause?", "options": [{"key": "A", "text": "Developer B has not yet run /memory to load the configuration files into the session."}, {"key": "B", "text": "The conventions are exposed through an MCP server that Developer B has not yet configured on their machine."}, {"key": "C", "text": "The conventions are in Developer A's ~/.claude/CLAUDE.md, which is neither version-controlled nor shared via git."}, {"key": "D", "text": "The conventions are in a .claude/rules/ file without frontmatter, which only loads in the session of whoever created it."}], "correct_answer": "C", "technical_explanation": "This is the favourite trap of Task Statement 3.1: \"new team member\" + \"inconsistent behaviour\" points to a hierarchy problem. The conventions are in A's user-level configuration, which B never receives when cloning. The fix is to move them to project-level configuration (.claude/CLAUDE.md or root CLAUDE.md).", "distractor_analysis": [{"key": "A", "type": "Conceptual distractor", "explanation": "Uses a real command for the wrong purpose: /memory is diagnostic and loads nothing. Configuration loads automatically based on its level and location."}, {"key": "B", "type": "Plausible alternative", "explanation": "A difference between machine environments can explain other divergences, but code conventions are delivered through CLAUDE.md or rules, not through MCP servers."}, {"key": "C", "type": "Correct", "explanation": "Correct. The user level does not travel with the repository."}, {"key": "D", "type": "Confusion distractor", "explanation": "Looks like a scoping problem, but a .claude/rules/ file without frontmatter is in the repository and loads in every session for every developer."}], "reference": "3_1 CLAUDE.md Hierarchy, Scoping, and Modular Organisation (\"In the exam\", \"Exam Traps\", \"Practice Scenario\")"}, {"id": "D3-Q04", "domain": "3", "domain_name": "Claude Code Configuration & Workflows", "subdomain_code": "3.1", "subdomain_name": "CLAUDE.md Hierarchy, Scoping, and Modular Organisation", "difficulty": "Intermediate", "question_type": "Medium", "reference_topic": "@ imports and context size", "question": "A team splits a 600-line project CLAUDE.md into six 100-line files, referenced from .claude/CLAUDE.md with lines such as @./standards/testing.md. Their stated goal is to reduce the tokens each session consumes. What is the correct assessment of this decision?", "options": [{"key": "A", "text": "It does not meet the goal; they should turn the six standards into skills in .claude/skills/, which keep only their description in context and still apply to every edit."}, {"key": "B", "text": "It meets the goal, because each file imported with @ only loads when Claude works on paths related to that standard."}, {"key": "C", "text": "It meets the goal only if they replace the @path lines with @import directives, which are the ones that defer loading each file."}, {"key": "D", "text": "It improves maintainability but does not reduce context: each @path is inlined when the CLAUDE.md is read. To reduce it, the specific rules must move to .claude/rules/ with paths frontmatter."}], "correct_answer": "D", "technical_explanation": "Imported files load alongside the CLAUDE.md that references them, as if their text had been pasted there. Splitting the file makes the source easier to maintain, but the context stays the same size. To make each session load less, use .claude/rules/ with paths, which only load when working on matching paths.", "distractor_analysis": [{"key": "A", "type": "Plausible alternative", "explanation": "Skills do reduce context, but they only load their body when invoked; they do not shape every edit by default, so they are not suitable for always-on standards."}, {"key": "B", "type": "Conceptual distractor", "explanation": "Attributes to @ imports the conditional loading behaviour of rules with paths. Imports are always resolved when the CLAUDE.md is read."}, {"key": "C", "type": "Confusion distractor", "explanation": "Relies on a non-existent syntax: there is no @import keyword; the directive is simply @ followed by a path, and no variant defers loading."}, {"key": "D", "type": "Correct", "explanation": "Correct. Modular organisation without context reduction; the reduction comes from rules with paths."}], "reference": "3_1 CLAUDE.md Hierarchy, Scoping, and Modular Organisation (\"Modular Organisation with @ path imports\"); 3_2 Custom Slash Commands and Skills (\"Skills vs CLAUDE.md\")"}, {"id": "D3-Q05", "domain": "3", "domain_name": "Claude Code Configuration & Workflows", "subdomain_code": "3.1", "subdomain_name": "CLAUDE.md Hierarchy, Scoping, and Modular Organisation", "difficulty": "Intermediate", "question_type": "Short", "reference_topic": "CLAUDE.md vs settings.json", "question": "A team needs a specific tool to be blocked in every Claude Code run, without exception. Where should it define that restriction?", "options": [{"key": "A", "text": "In settings.json (permission rules) or in a hook, which the client always enforces."}, {"key": "B", "text": "In each developer's ~/.claude/CLAUDE.md, since the user level loads first."}, {"key": "C", "text": "At the end of the project CLAUDE.md, in capital letters and marked as mandatory, so it is the last instruction Claude reads and the one that prevails."}, {"key": "D", "text": "In a .claude/rules/ file without frontmatter, to guarantee it loads in every session."}], "correct_answer": "A", "technical_explanation": "CLAUDE.md is delivered as a user message and does not guarantee strict compliance. Rules that must apply on every run (a blocked tool, a required formatter, a permission policy) belong in settings.json, which the client enforces, or in a hook, which runs at a fixed lifecycle event.", "distractor_analysis": [{"key": "A", "type": "Correct", "explanation": "Correct. Only settings.json and hooks provide deterministic enforcement."}, {"key": "B", "type": "Conceptual distractor", "explanation": "Misreads the hierarchy: the user level has no greater authority, and it also depends on each person configuring it by hand."}, {"key": "C", "type": "Confusion distractor", "explanation": "Confuses load order with precedence and emphasis with guarantee. Even if Claude reads it last, it is still guidance the model usually follows, not a rule enforced by the client."}, {"key": "D", "type": "Plausible alternative", "explanation": "Ensures the instruction is always in context, which is enough for conventions, but it is still guidance for the model, not a real block."}], "reference": "3_1 CLAUDE.md Hierarchy, Scoping, and Modular Organisation (\"Loading Order and Conflict Handling\", \"Don't confuse CLAUDE.md with settings.json\"); Quick Reference Domain 3 (\"Hooks — Deterministic Enforcement\")"}, {"id": "D3-Q06", "domain": "3", "domain_name": "Claude Code Configuration & Workflows", "subdomain_code": "3.1", "subdomain_name": "CLAUDE.md Hierarchy, Scoping, and Modular Organisation", "difficulty": "Difficult", "question_type": "Long", "reference_topic": "What survives compaction", "question": "A developer has spent three hours in one session working on packages/api/. The package's REST conventions are in packages/api/CLAUDE.md and the general conventions are in the root CLAUDE.md. She runs /compact to free up context. Immediately afterwards, Claude still follows the general conventions, but in its first two responses it ignores the REST conventions, even though no configuration file has changed. What best explains this behaviour?", "options": [{"key": "A", "text": "Compaction keeps the broadest-scope file and discards narrower ones, because the root CLAUDE.md takes precedence over subdirectory files."}, {"key": "B", "text": "After /compact every CLAUDE.md reloads, including the package one, so the cause must be a contradiction between the REST conventions
