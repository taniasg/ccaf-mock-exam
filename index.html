and those in the root CLAUDE.md, which Claude resolved arbitrarily."}, {"key": "C", "text": "The root CLAUDE.md is re-read from disk after compaction; nested CLAUDE.md files load on demand and return when Claude reads another file in that directory."}, {"key": "D", "text": "The REST conventions had only been given in the chat and the /compact summary compressed them; they should be saved to a file."}], "correct_answer": "C", "technical_explanation": "After /compact, the project-root CLAUDE.md is re-read in full and injected again. Two things are not reloaded automatically: subdirectory CLAUDE.md files and rules with paths. Both load on demand, when Claude next reads a matching file, not when compaction ends.", "distractor_analysis": [{"key": "A", "type": "Conceptual distractor", "explanation": "Introduces a precedence between levels that does not exist; the difference comes from when each file loads, not from which one \"wins\"."}, {"key": "B", "type": "Confusion distractor", "explanation": "Starts from an almost correct but false premise: only the root CLAUDE.md reloads automatically; nested ones do not."}, {"key": "C", "type": "Correct", "explanation": "Correct. On-demand loading of nested CLAUDE.md files."}, {"key": "D", "type": "Plausible alternative", "explanation": "This is the other documented cause of instructions disappearing after /compact, but the scenario states that the conventions are in packages/api/CLAUDE.md."}], "reference": "3_1 CLAUDE.md Hierarchy, Scoping, and Modular Organisation (\"What Survives Compaction\")"}, {"id": "D3-Q07", "domain": "3", "domain_name": "Claude Code Configuration & Workflows", "subdomain_code": "3.1", "subdomain_name": "CLAUDE.md Hierarchy, Scoping, and Modular Organisation", "difficulty": "Easy", "question_type": "Short", "reference_topic": "Using CLAUDE.local.md", "question": "Which content best fits a CLAUDE.local.md placed next to the CLAUDE.md at the repository root?", "options": [{"key": "A", "text": "The verbosity preferences the developer wants in all of their projects."}, {"key": "B", "text": "The team's testing requirements, so each developer can adjust them to their liking."}, {"key": "C", "text": "The path to their personal scratchpad and a temporary debugging note for this repository."}, {"key": "D", "text": "A blocked-tools policy that must be followed on every run."}], "correct_answer": "C", "technical_explanation": "CLAUDE.local.md is a project-scoped version of ~/.claude/CLAUDE.md: it holds personal preferences for one specific repository and is, by convention, added to .gitignore. A scratchpad path or a temporary debugging note are its typical use cases.", "distractor_analysis": [{"key": "A", "type": "Plausible alternative", "explanation": "It is a personal preference, but if it applies to all projects its place is ~/.claude/CLAUDE.md, not a local file in one repository."}, {"key": "B", "type": "Confusion distractor", "explanation": "Seems reasonable because the file is \"local\", but a team rule belongs in the shared CLAUDE.md; the documentation explicitly says testing requirements do not go here."}, {"key": "C", "type": "Correct", "explanation": "Correct. Personal preferences specific to that repository."}, {"key": "D", "type": "Conceptual distractor", "explanation": "A rule that must always apply does not belong in any CLAUDE.md; it goes in settings.json or a hook."}], "reference": "3_1 CLAUDE.md Hierarchy, Scoping, and Modular Organisation (\"CLAUDE.local.md, local-only overrides\")"}, {"id": "D3-Q08", "domain": "3", "domain_name": "Claude Code Configuration & Workflows", "subdomain_code": "3.1", "subdomain_name": "CLAUDE.md Hierarchy, Scoping, and Modular Organisation", "difficulty": "Difficult", "question_type": "Long", "reference_topic": "Resolving contradictions between levels", "question": "A team notices that Claude Code sometimes indents with tabs and sometimes with two spaces. Investigating, they find that one developer's ~/.claude/CLAUDE.md says \"use tabs\" and the project CLAUDE.md says \"use two spaces\". The team decides that the project formatter must be applied deterministically on every edit, for everyone. Which solution meets the requirement?", "options": [{"key": "A", "text": "Ask everyone to run /memory at the start of each session to reload the project CLAUDE.md with higher priority."}, {"key": "B", "text": "Keep both files and add the sentence \"this rule overrides any user instruction\" to the project CLAUDE.md."}, {"key": "C", "text": "Copy the two-space rule into each package's CLAUDE.md, since the file closest to the working directory is read last and prevails."}, {"key": "D", "text": "Remove the contradiction from the user file and apply the formatter through a hook (or settings.json), leaving CLAUDE.md as guidance only."}], "correct_answer": "D", "technical_explanation": "With contradictory instructions, Claude may pick one arbitrarily, so the contradiction must be fixed in the files themselves. And since CLAUDE.md is not a strict enforcement layer, a mandatory formatter must be implemented with a hook or settings.json, which the client enforces.", "distractor_analysis": [{"key": "A", "type": "Conceptual distractor", "explanation": "/memory is a diagnostic command; it neither loads nor prioritises files."}, {"key": "B", "type": "Plausible alternative", "explanation": "The model might follow the note often, but there is no guarantee of compliance and the contradiction remains; it does not meet the deterministic enforcement requirement."}, {"key": "C", "type": "Confusion distractor", "explanation": "Builds on the real load order, but assumes that being read last means winning. The contradiction still exists and the result is not deterministic."}, {"key": "D", "type": "Correct", "explanation": "Correct. Removes the conflict and moves the requirement to a deterministic mechanism."}], "reference": "3_1 CLAUDE.md Hierarchy, Scoping, and Modular Organisation (\"Loading Order and Conflict Handling\"); Quick Reference Domain 3 (\"Configuration Hierarchy\")"}, {"id": "D3-Q09", "domain": "3", "domain_name": "Claude Code Configuration & Workflows", "subdomain_code": "3.2", "subdomain_name": "Custom Slash Commands and Skills", "difficulty": "Easy", "question_type": "Short", "reference_topic": "Skill file structure", "question": "A developer creates the file .claude/skills/review.md and expects a /review command to become available. What happens?", "options": [{"key": "A", "text": "/review is created, but with user scope, because Claude Code treats flat .md files in .claude/skills/ as personal, non-version-controlled configuration."}, {"key": "B", "text": "No command is created: a skill is a directory, so .claude/skills/review/SKILL.md is required."}, {"key": "C", "text": "/review is created, but it can only be invoked by typing it manually, because the file lacks a description field."}, {"key": "D", "text": "/review is created, although it should be moved to .claude/commands/ so the team receives it when cloning."}], "correct_answer": "B", "technical_explanation": "The two paths create equivalent commands but with different structures: .claude/commands/ uses flat .md files, while .claude/skills/ requires one directory per skill with SKILL.md as the mandatory entrypoint. A flat file directly inside .claude/skills/ creates no command.", "distractor_analysis": [{"key": "A", "type": "Conceptual distractor", "explanation": "Confuses file shape with scope. Scope depends on location (.claude/ vs ~/.claude/), not on whether the file is flat."}, {"key": "B", "type": "Correct", "explanation": "Correct. SKILL.md is the mandatory entrypoint."}, {"key": "C", "type": "Confusion distractor", "explanation": "Mixes a real fact (without a useful description, a skill only runs when invoked manually) with a false premise: the file does not even create the command."}, {"key": "D", "type": "Plausible alternative", "explanation": "Moving the file to .claude/commands/review.md would create the command, but the premise is false: in its current location /review does not exist, and .claude/skills/ is already shared via git."}], "reference": "3_2 Custom Slash Commands and Skills (\"The Unified Skills System\", \"Exam Traps\")"}, {"id": "D3-Q10", "domain": "3", "domain_name": "Claude Code Configuration & Workflows", "subdomain_code": "3.2", "subdomain_name": "Custom Slash Commands and Skills", "difficulty": "Easy", "question_type": "Short", "reference_topic": "context: fork", "question": "Which frontmatter option prevents the verbose output of a codebase-analysis skill from consuming the main conversation's context?", "options": [{"key": "A", "text": "allowed-tools, limited to Read, Grep and Glob."}, {"key": "B", "text": "argument-hint, specifying the code area to analyse."}, {"key": "C", "text": "disable-model-invocation: true."}, {"key": "D", "text": "context: fork."}], "correct_answer": "D", "technical_explanation": "context: fork runs the skill in an isolated sub-agent context: the verbose output stays in the fork and the main conversation stays clean. Without it, the output enters the main conversation, consumes tokens and degrades later responses.", "distractor_analysis": [{"key": "A", "type": "Conceptual distractor", "explanation": "Uses a real frontmatter option for a different goal: it controls tool approval, not where the output goes."}, {"key": "B", "type": "Plausible alternative", "explanation": "Narrowing the area might produce less output in some cases, but it isolates nothing: whatever is generated still enters the main conversation."}, {"key": "C", "type": "Confusion distractor", "explanation": "Another skill frontmatter option that sounds like \"isolation\", but it only requires explicit invocation; it does not change where the skill runs or where its output ends up."}, {"key": "D", "type": "Correct", "explanation": "Correct."}], "reference": "3_2 Custom Slash Commands and Skills (\"Skills Frontmatter: context: fork\")"}, {"id": "D3-Q11", "domain": "3", "domain_name": "Claude Code Configuration & Workflows", "subdomain_code": "3.2", "subdomain_name": "Custom Slash Commands and Skills", "difficulty": "Easy", "question_type": "Medium", "reference_topic": "Precedence between skill and command", "question": "A repository contains both .claude/commands/deploy.md and .claude/skills/deploy/SKILL.md, with different instructions. A developer types /deploy. What runs?", "options": [{"key": "A", "text": "Either one arbitrarily, just as with contradictory instructions in CLAUDE.md."}, {"key": "B", "text": "The command, because .claude/commands/ is the original location and is kept for backward compatibility."}, {"key": "C", "text": "Whichever file was modified most recently."}, {"key": "D", "text": "The skill, because when a skill and a command share a name, the skill takes precedence."}], "correct_answer": "D", "technical_explanation": "The documentation lists precedence as one of the three advantages of .claude/skills/ over .claude/commands/: if a skill and a command share a name, the skill wins.", "distractor_analysis": [{"key": "A", "type": "Conceptual distractor", "explanation": "Transfers the behaviour of CLAUDE.md conflicts to commands. Between a skill and a command there is a defined precedence rule."}, {"key": "B", "type": "Confusion distractor", "explanation": "It is true that .claude/commands/ still works for backward compatibility, but that gives it no priority; with the same name, the skill wins."}, {"key": "C", "type": "Plausible alternative", "explanation": "A common criterion in other tools, but not the one Claude Code documents."}, {"key": "D", "type": "Correct", "explanation": "Correct."}], "reference": "3_2 Custom Slash Commands and Skills (\"The Unified Skills System\")"}, {"id": "D3-Q12", "domain": "3", "domain_name": "Claude Code Configuration & Workflows", "subdomain_code": "3.2", "subdomain_name": "Custom Slash Commands and Skills", "difficulty": "Intermediate", "question_type": "Medium", "reference_topic": "Placing team and personal skills", "question": "A team wants a /release-check available to everyone who clones the repository, with its checklist stored as a supporting file next to the instructions. In addition, one developer wants a /rota-deep just for herself, which produces very verbose exploratory analysis. Which configuration is correct?", "options": [{"key": "A", "text": "Both in .claude/skills/, each in its own directory with SKILL.md, and /rota-deep with context: fork."}, {"key": "B", "text": "/release-check in .claude/skills/release-check/SKILL.md with the checklist as a supporting file, and /rota-deep in ~/.claude/skills/rota-deep/SKILL.md with context: fork."}, {"key": "C", "text": "/release-check as .claude/commands/release-check.md with the checklist next to it, and /rota-deep in ~/.claude/skills/rota-deep/SKILL.md with context: fork."}, {"key": "D", "text": "/release-check in ~/.claude/skills/ with README instructions for everyone to copy it, and /rota-deep in .claude/commands/rota-deep.md."}], "correct_answer": "B", "technical_explanation": "Team workflows go in project scope (.claude/), shared via git; personal ones go in ~/.claude/. The .claude/skills/ path is the canonical one and adds a supporting-files directory that the commands path does not offer. The verbose analysis needs context: fork.", "distractor_analysis": [{"key": "A", "type": "Plausible alternative", "explanation": "Handles the team command and the isolation correctly, but publishes the personal skill to the whole team when only one person needs it."}, {"key": "B", "type": "Correct", "explanation": "Correct."}, {"key": "C", "type": "Confusion distractor", "explanation": "Almost correct, but a flat command in .claude/commands/ has no supporting-files directory; that feature belongs to skills."}, {"key": "D", "type": "Conceptual distractor", "explanation": "Inverts the scopes: ~/.claude/ is not shared via git, while .claude/commands/ inside the repository is."}], "reference": "3_2 Custom Slash Commands and Skills (\"The Unified Skills System\", \"Two Scoping Levels\", \"Practice Scenario\")"}, {"id": "D3-Q13", "domain": "3", "domain_name": "Claude Code Configuration & Workflows", "subdomain_code": "3.2", "subdomain_name": "Custom Slash Commands and Skills", "difficulty": "Intermediate", "question_type": "Long", "reference_topic": "Skills vs CLAUDE.md vs rules", "question": "A team is reorganising its Claude Code configuration and has three pieces of content:\n(1) API naming conventions that must apply to all code generation.\n(2) A multi-step dependency audit workflow that runs once a month and produces a lot of text.\n(3) Conventions that only affect *.test.ts files, spread across more than 40 directories.\nWhich placement is most appropriate?", "options": [{"key": "A", "text": "(1) in a skill; (2) in the project CLAUDE.md; (3) in .claude/rules/ with paths frontmatter."}, {"key": "B", "text": "(1) in the project CLAUDE.md; (2) in a skill; (3) in another skill with a paths field, which activates by itself when working on tests."}, {"key": "C", "text": "(1) in the project CLAUDE.md; (2) in a skill in .claude/skills/; (3) in .claude/rules/ with paths frontmatter."}, {"key": "D", "text": "All three in the project CLAUDE.md, split into topic files with @ imports for easier maintenance."}], "correct_answer": "C", "technical_explanation": "CLAUDE.md holds always-loaded universal standards; skills are on-demand workflows for specific tasks; and conventions for one file type spread across many directories fit best in .claude/rules/ rules with paths, which stay in context as guidance once Claude reads a matching file.", "distractor_analysis": [{"key": "A", "type": "Conceptual distractor", "explanation": "Inverts the roles: a convention for all generation must not depend on invoking a skill, and a monthly procedure should not load in every session."}, {"key": "B", "type": "Confusion distractor", "explanation": "Skills can also auto-activate through paths, but they load as task workflows; for conventions that must guide every edit of a file type, the documented option is rules."}, {"key": "C", "type": "Correct", "explanation": "Correct."}, {"key": "D", "type": "Plausible alternative", "explanation": "Technically works and improves organisation, but imports do not reduce context: everything would load in every session, including a monthly workflow and test conventions that are irrelevant most of the time."}], "reference": "3_2 Custom Slash Commands and Skills (\"Skills vs CLAUDE.md\"); 3_3 Path-Specific Rules for Conditional Convention Loading (\"When to Use Each Approach\", \"Exam Traps\")"}, {"id": "D3-Q14", "domain": "3", "domain_name": "Claude Code Configuration & Workflows", "subdomain_code": "3.2", "subdomain_name": "Custom Slash Commands and Skills", "difficulty": "Difficult", "question_type": "Medium", "reference_topic": "Personal variants of a team skill", "question": "The team uses the project skill /meds-check. One developer wants a more detailed version, isolated with context: fork, just for herself. She does not want to affect her teammates or lose access to the team version, which is updated frequently. What should she do?", "options": [{"key": "A", "text": "Create .claude/commands/deep-meds-check.md in the repository, since flat commands are only visible to whoever creates them."}, {"key": "B", "text": "Edit .claude/skills/meds-check/SKILL.md by adding a detailed section and explain in her CLAUDE.local.md when to use it."}, {"key": "C", "text": "Create ~/.claude/skills/meds-check/SKILL.md with the same name, so her version replaces the team one only on her machine."}, {"key": "D", "text": "Create ~/.claude/skills/deep-meds-check/SKILL.md, with a different name and context: fork."}], "correct_answer": "D", "technical_explanation": "Personal variants are created in ~/.claude/skills/ (or ~/.claude/commands/) with a different name. A personal skill with its own name neither overrides nor conflicts with the team version, so the developer keeps both.", "distractor_analysis": [{"key": "A", "type": "Conceptual distractor", "explanation": "Misreads scope: .claude/commands/ inside the repository is project scope and is shared with everyone."}, {"key": "B", "type": "Plausible alternative", "explanation": "Gives her access to the detailed content, but modifies a skill shared via git and affects the whole team."}, {"key": "C", "type": "Confusion distractor", "explanation": "Uses the correct personal location, but reusing the name is meant to replace the team version, which is exactly what she does not want to lose. The documentation recommends different names precisely to avoid that conflict."}, {"key": "D", "type": "Correct", "explanation": "Correct."}], "reference": "3_2 Custom Slash Commands and Skills (\"Personal Skill Customisation\", \"Two Scoping Levels\")"}, {"id": "D3-Q15", "domain": "3", "domain_name": "Claude Code Configuration & Workflows", "subdomain_code": "3.2", "subdomain_name": "Custom Slash Commands and Skills", "difficulty": "Difficult", "question_type": "Medium", "reference_topic": "allowed-tools: current behaviour vs exam guide", "question": "According to Claude Code's current behaviour as documented in the materials (checked 6 October 2026), a read-only analysis skill declares allowed-tools with Read, Grep and Glob. The team wants to guarantee that the skill cannot use Write or Bash while it runs. What should it do?", "options": [{"key": "A", "text": "Add an explicit instruction to the body of SKILL.md: \"Do not use Write or Bash under any circumstances\"."}, {"key": "B", "text": "Add context: fork, because the isolated sub-agent in which the skill runs only inherits the tools listed in allowed-tools and not those of the rest of the session."}, {"key": "C", "text": "Nothing more: allowed-tools already prevents the skill from using any tool that is not on the list."}, {"key": "D", "text": "Declare Write and Bash in disallowed-tools or add deny rules; allowed-tools only pre-approves the listed tools."}], "correct_answer": "D", "technical_explanation": "In current behaviour, allowed-tools pre-approves the listed tools so they run without a permission prompt, but it does not restrict others, which remain available under normal permissions. The real security boundary is disallowed-tools and deny rules. Note: exam guide v1.0 describes allowed-tools as \"restricts\"; if an exam question asks what the field does according to the guide, the expected answer is \"restricts\".", "distractor_analysis": [{"key": "A", "type": "Plausible alternative", "explanation": "Might reduce the likelihood of use, but a text instruction is probabilistic guidance, not a guarantee."}, {"key": "B", "type": "Conceptual distractor", "explanation": "context: fork isolates output in a sub-agent; the documentation attributes no tool-restriction effect to it."}, {"key": "C", "type": "Confusion distractor", "explanation": "Matches the wording of exam guide v1.0, but not the current behaviour the question asks about: unlisted tools remain callable."}, {"key": "D", "type": "Correct", "explanation": "Correct. Restricting requires disallowed-tools or deny rules."}], "reference": "3_2 Custom Slash Commands and Skills (\"allowed-tools\", \"Current state\", \"In the exam\"); Glossary Domain 3 (\"Allowlist/Denylist\")"}, {"id": "D3-Q16", "domain": "3", "domain_name": "Claude Code Configuration & Workflows", "subdomain_code": "3.2", "subdomain_name": "Custom Slash Commands and Skills", "difficulty": "Difficult", "question_type": "Long", "reference_topic": "description and disable-model-invocation", "question": "A team has two project skills:\n• .claude/skills/db-migrate/SKILL.md: its frontmatter only includes context: fork and allowed-tools, and its body starts with the generic line \"# Notes\". When someone asks \"migrate the database schema\", Claude never loads it by itself; it only works by typing /db-migrate.\n• .claude/skills/prod-deploy/SKILL.md: the team wants this one to run only when a person invokes it explicitly, never on Claude's initiative.\nWhich change solves both requirements?", "options": [{"key": "A", "text": "Add a clear description of when it applies to db-migrate and add disable-model-invocation: true to prod-deploy."}, {"key": "B", "text": "Add to db-migrate an argument-hint describing the workflow, so Claude compares it with requests, and remove allowed-tools from prod-deploy."}, {"key": "C", "text": "Move db-migrate to .claude/commands/db-migrate.md so it is discovered automatically, and move prod-deploy to ~/.claude/skills/ so only whoever installs it can invoke it."}, {"key": "D", "text": "Copy the db-migrate instructions into the project CLAUDE.md so Claude always knows they exist, and add context: fork to prod-deploy."}], "correct_answer": "A", "technical_explanation": "Claude decides whether a skill applies by reading its description; without one, Claude Code uses the first non-empty line of the body, here a \"# Notes\" that is useless as a summary, so the skill only runs via /db-migrate. To prevent automatic invocation, use disable-model-invocation: true, which requires explicit user invocation.", "distractor_analysis": [{"key": "A", "type": "Correct", "explanation": "Correct."}, {"key": "B", "type": "Confusion distractor", "explanation": "argument-hint is a real frontmatter option, but it only indicates the expected arguments; it is not the text Claude uses to decide whether the skill applies."}, {"key": "C", "type": "Conceptual distractor", "explanation": "Inverts a documented advantage: automatic discovery is a feature of .claude/skills/ that the commands path lacks. Also, moving prod-deploy to personal scope does not prevent automatic invocation."}, {"key": "D", "type": "Plausible alternative", "explanation": "Would make the instructions visible in every session, but puts a task procedure in CLAUDE.md and does not solve invocation control for prod-deploy; context: fork isolates output, not invocation."}], "reference": "3_2 Custom Slash Commands and Skills (\"Current state: description is the most important field\", \"Skills vs CLAUDE.md\")"}, {"id": "D3-Q17", "domain": "3", "domain_name": "Claude Code Configuration & Workflows", "subdomain_code": "3.3", "subdomain_name": "Path-Specific Rules for Conditional Convention Loading", "difficulty": "Easy", "question_type": "Short", "reference_topic": "The paths frontmatter field", "question": "Which YAML frontmatter field in a .claude/rules/ file makes its conventions load only when working on certain files?", "options": [{"key": "A", "text": "globs, with a list of file extensions."}, {"key": "B", "text": "None: for that you must create a CLAUDE.md in each affected directory."}, {"key": "C", "text": "paths, with a list of glob patterns."}, {"key": "D", "text": "context: fork, which isolates the rule in its own context."}], "correct_answer": "C", "technical_explanation": ".claude/rules/ files can include YAML frontmatter with a paths field listing glob patterns; the rule only loads when Claude works on files that match those patterns.", "distractor_analysis": [{"key": "A", "type": "Confusion distractor", "explanation": "The name sounds right because the values are glob patterns, but the documented field is called paths."}, {"key": "B", "type": "Plausible alternative", "explanation": "A directory-level CLAUDE.md does apply conventions only in its directory, but there is a specific mechanism (paths) that avoids duplicating files."}, {"key": "C", "type": "Correct", "explanation": "Correct."}, {"key": "D", "type": "Conceptual distractor", "explanation": "context: fork is a skill frontmatter option used to isolate output, not to load conventions by path."}], "reference": "3_3 Path-Specific Rules for Conditional Convention Loading (\"How Path-Specific Rules Work\"); Quick Reference Domain 3 (\".claude/rules/ — Conditional Rules\")"}, {"id": "D3-Q18", "domain": "3", "domain_name": "Claude Code Configuration & Workflows", "subdomain_code": "3.3", "subdomain_name": "Path-Specific Rules for Conditional Convention Loading", "difficulty": "Easy", "question_type": "Short", "reference_topic": "Semantics of ** in glob patterns", "question": "Which files match the pattern **/*.test.tsx in a rule's paths field?", "options": [{"key": "A", "text": "Any .test.tsx file, at any directory level in the project."}, {"key": "B", "text": "Only the .test.tsx files inside directories named test/ or tests/."}, {"key": "C", "text": "Only the .test.tsx files at the repository root."}, {"key": "D", "text": "All .test.tsx files and also .test.ts files, because the pattern covers both extensions."}], "correct_answer": "A", "technical_explanation": "In a glob, ** matches across any number of directory levels, so **/*.test.tsx reaches every .tsx test file in the codebase, wherever it is. To include .test.ts files you must add their own pattern, as in the example [\"**/*.test.tsx\", \"**/*.test.ts\"].", "distractor_analysis": [{"key": "A", "type": "Correct", "explanation": "Correct."}, {"key": "B", "type": "Plausible alternative", "explanation": "A common test-organisation convention, but the pattern requires no directory name; it is precisely meant for tests located next to the source code."}, {"key": "C", "type": "Conceptual distractor", "explanation": "Reads ** as if it did not traverse subdirectories; that would be the behaviour of *.test.tsx without the prefix."}, {"key": "D", "type": "Confusion distractor", "explanation": "Right about the reach of **, but the .tsx suffix is literal; .test.ts files need an additional pattern."}], "reference": "3_3 Path-Specific Rules for Conditional Convention Loading (\"Glob Patterns Match Across the Entire Codebase\")"}, {"id": "D3-Q19", "domain": "3", "domain_name": "Claude Code Configuration & Workflows", "subdomain_code": "3.3", "subdomain_name": "Path-Specific Rules for Conditional Convention Loading", "difficulty": "Intermediate", "question_type": "Medium", "reference_topic": "Path rules vs per-directory CLAUDE.md", "question": "A codebase has test files next to their source code in more than 50 directories (Button.test.tsx next to Button.tsx). The team wants the same conventions for every test, loaded only when working on a test file and with nothing anyone has to invoke. A colleague proposes a \"duplication-free\" solution. What is the most maintainable approach?", "options": [{"key": "A", "text": "Add the conventions to the root CLAUDE.md, so they are present whenever a test is edited."}, {"key": "B", "text": "A skill in .claude/skills/test-conventions/SKILL.md that developers invoke with /test-conventions before editing tests."}, {"key": "C", "text": "A CLAUDE.md in each of the 50 directories, each with a single @ line importing a shared file with the conventions."}, {"key": "D", "text": "A .claude/rules/testing.md file with frontmatter paths: [\"**/*.test.tsx\", \"**/*.test.ts\"] containing the conventions."}], "correct_answer": "D", "technical_explanation": "For conventions of a file type spread across many directories, the answer is a rule with glob patterns: one file, automatic loading only with matching files, and new directories are covered without doing anything.", "distractor_analysis": [{"key": "A", "type": "Conceptual distractor", "explanation": "Relies on the root CLAUDE.md \"also covering tests\", but it loads in every session regardless of what the developer edits and consumes tokens needlessly."}, {"key": "B", "type": "Plausible alternative", "explanation": "Keeps the conventions in one place, but requires manual invocation, which the requirement rules out."}, {"key": "C", "type": "Confusion distractor", "explanation": "The import avoids duplicating content, but it still needs one file per directory, and every new directory with tests requires another one. It does not solve the maintenance problem."}, {"key": "D", "type": "Correct", "explanation": "Correct."}], "reference": "3_3 Path-Specific Rules for Conditional Convention Loading (\"Why Not Directory-Level CLAUDE.md?\", \"Practice Scenario\")"}, {"id": "D3-Q20", "domain": "3", "domain_name": "Claude Code Configuration & Workflows", "subdomain_code": "3.3", "subdomain_name": "Path-Specific Rules for Conditional Convention Loading", "difficulty": "Intermediate", "question_type": "Short", "reference_topic": "Rules without frontmatter", "question": "When does a .claude/rules/deployment.md file with no frontmatter load?", "options": [{"key": "A", "text": "At the start of every session, just like .claude/CLAUDE.md."}, {"key": "B", "text": "Only when a developer invokes it with /deployment."}, {"key": "C", "text": "Only when Claude edits files whose name or path contains \"deployment\"."}, {"key": "D", "text": "Never, because without a paths field Claude Code ignores the file."}], "correct_answer": "A", "technical_explanation": "Without frontmatter, .claude/rules/ files load in every session. The quick reference specifies that they load at launch with the same priority as .claude/CLAUDE.md: they are a way to split a monolithic file, not a more specific layer.", "distractor_analysis": [{"key": "A", "type": "Correct", "explanation": "Correct."}, {"key": "B", "type": "Plausible alternative", "explanation": "That is the behaviour of a command or a skill; rule files are not invoked."}, {"key": "C", "type": "Conceptual distractor", "explanation": "Assumes Claude infers scope from the file name; conditional scope is defined only by the paths field."}, {"key": "D", "type": "Confusion distractor", "explanation": "Seems logical if you believe paths is mandatory, but frontmatter is optional; without it, the rule always loads."}], "reference": "3_1 CLAUDE.md Hierarchy, Scoping, and Modular Organisation (\"The .claude/rules/ Directory\"); Quick Reference Domain 3 (\"Configuration Hierarchy\")"}, {"id": "D3-Q21", "domain": "3", "domain_name": "Claude Code Configuration & Workflows", "subdomain_code": "3.3", "subdomain_name": "Path-Specific Rules for Conditional Convention Loading", "difficulty": "Intermediate", "question_type": "Long", "reference_topic": "Token efficiency with conditional rules", "question": "A catering firm's root CLAUDE.md has 900 lines: universal team standards, Terraform conventions (all infrastructure code is in terraform/) and API conventions. API handlers live in src/api/ and also in routes/ folders inside six different modules. 80% of daily work is on React components, and the team notices responses are less precise. It wants all conventions to keep applying automatically. Which reorganisation is best?", "options": [{"key": "A", "text": "Keep the universal standards at the root and move Terraform and API to .claude/rules/ with paths [\"terraform/**/*\", \"**/*.tf\"] and [\"src/api/**/*\", \"**/routes/**/*\"]."}, {"key": "B", "text": "Turn the Terraform and API conventions into two skills in .claude/skills/, which keep only their description in context until used, and keep the universal standards at the root."}, {"key": "C", "text": "Move the Terraform conventions to terraform/CLAUDE.md and the API conventions to src/api/CLAUDE.md, keeping the universal standards at the root."}, {"key": "D", "text": "Split the root CLAUDE.md into topic files with @ imports, so Claude only processes the block relevant to each task."}], "correct_answer": "A", "technical_explanation": "Rules with paths only load when editing matching files, so Terraform and API conventions stop consuming tokens while working on React. Glob patterns also cover handlers spread across several modules, which a directory-level CLAUDE.md cannot do.", "distractor_analysis": [{"key": "A", "type": "Correct", "explanation": "Correct. Conditional loading and cross-directory coverage."}, {"key": "B", "type": "Plausible alternative", "explanation": "Reduces context, but skills load as on-demand task workflows; they do not apply the conventions as guidance on every edit, which is what the team requires."}, {"key": "C", "type": "Confusion distractor", "explanation": "Would work for Terraform, which lives in a single directory, but src/api/CLAUDE.md does not cover the routes/ folders of the other six modules."}, {"key": "D", "type": "Conceptual distractor", "explanation": "Imports are inlined when the CLAUDE.md is read; context is not reduced."}], "reference": "3_3 Path-Specific Rules for Conditional Convention Loading (\"Why Not Root CLAUDE.md?\", \"Practical Rule File Examples\", \"Key Concept\")"}, {"id": "D3-Q22", "domain": "3", "domain_name": "Claude Code Configuration & Workflows", "subdomain_code": "3.3", "subdomain_name": "Path-Specific Rules for Conditional Convention Loading", "difficulty": "Difficult", "question_type": "Medium", "reference_topic": "Verifying conditional loading", "question": "A developer creates three rules with paths frontmatter (testing, API and Terraform). On opening a session he runs /context and sees none of them under \"Memory files\". He concludes they are misconfigured. What is the correct assessment, and how should he verify it?", "options": [{"key": "A", "text": "He should temporarily remove the frontmatter to confirm the rules appear under \"Memory files\", and then add it back."}, {"key": "B", "text": "This is expected: they load on demand; when a matching file is edited, a \"Loaded\" line appears in the terminal."}, {"key": "C", "text": "He should run /memory, which is the command that loads conditional rules into the current session."}, {"key": "D", "text": "The conclusion is correct: a properly configured rule appears under \"Memory files\" from launch, even though its content only applies when Claude works on files matching its patterns."}], "correct_answer": "B", "technical_explanation": "/context shows what loaded at launch. Rules with paths are not on that list because they load when Claude reads a matching file; at that point Claude Code prints a \"Loaded\" line with the path. Editing a .test.ts file should show only the testing rule.", "distractor_analysis": [{"key": "A", "type": "Plausible alternative", "explanation": "Would confirm the file is readable, but does not check what matters: that the glob patterns activate the right rule with the right files."}, {"key": "B", "type": "Correct", "explanation": "Correct."}, {"key": "C", "type": "Conceptual distractor", "explanation": "Diagnostic commands load nothing; rules load by path matching."}, {"key": "D", "type": "Confusion distractor", "explanation": "It seems reasonable that a valid configuration would \"show\" from the start, but this describes files that load at launch, not rules with paths."}], "reference": "3_3 Path-Specific Rules for Conditional Convention Loading (\"Build Exercise\", steps 4-5); 3_1 CLAUDE.md Hierarchy, Scoping, and Modular Organisation (\"Diagnosing What Loaded: /memory and /context\")"}, {"id": "D3-Q23", "domain": "3", "domain_name": "Claude Code Configuration & Workflows", "subdomain_code": "3.3", "subdomain_name": "Path-Specific Rules for Conditional Convention Loading", "difficulty": "Difficult", "question_type": "Medium", "reference_topic": "Skills with paths vs rules with paths", "question": "A team has (1) security conventions that must guide every edit of any file under auth/ folders spread across several services, and (2) a multi-step \"authentication audit\" workflow run occasionally. An engineer recalls that skills can also auto-activate with a paths field. Which configuration is most appropriate?", "options": [{"key": "A", "text": "Both in a single skill with paths: [\"**/auth/**\"] and context: fork, so it activates by itself and does not clutter the conversation."}, {"key": "B", "text": "The conventions in .claude/rules/auth.md with paths: [\"**/auth/**\"] and the audit in .claude/skills/auth-audit/SKILL.md."}, {"key": "C", "text": "Both in the root CLAUDE.md, to ensure they are always available."}, {"key": "D", "text": "The conventions in a skill with paths: [\"**/auth/**\"], which activates when those files are touched, and the audit in another skill with explicit invocation."}], "correct_answer": "B", "technical_explanation": "Both skills and rules can activate through paths, but rules stay in context as guidance once Claude reads a matching file, so they shape every edit. Skills are on-demand task workflows. Conventions go in rules; the occasional procedure goes in a skill.", "distractor_analysis": [{"key": "A", "type": "Conceptual distractor", "explanation": "Combines two valid mechanisms incorrectly: with context: fork the skill runs in an isolated sub-agent, so its conventions would not guide edits in the main conversation."}, {"key": "B", "type": "Correct", "explanation": "Correct."}, {"key": "C", "type": "Plausible alternative", "explanation": "Guarantees the conventions are present, but loads them in every session and puts a task procedure in CLAUDE.md."}, {"key": "D", "type": "Confusion distractor", "explanation": "Relies on a real fact (skills support paths), but a skill loads as a task workflow, not as persistent guidance; for conventions by file type, the documentation points to rules."}], "reference": "3_3 Path-Specific Rules for Conditional Convention Loading (\"Exam Traps\": Confusing skills with path-specific rules); 3_2 Custom Slash Commands and Skills (\"Skills vs CLAUDE.md\")"}, {"id": "D3-Q24", "domain": "3", "domain_name": "Claude Code Configuration & Workflows", "subdomain_code": "3.4", "subdomain_name": "Plan Mode vs Direct Execution", "difficulty": "Easy", "question_type": "Short", "reference_topic": "How to enter plan mode", "question": "In the middle of a normal session, a developer wants Claude to analyse and propose an approach without touching any files, just for the next request. What should she do?", "options": [{"key": "A", "text": "Close the session and open another one with claude --permission-mode plan."}, {"key": "B", "text": "Relaunch Claude Code with claude -p so it only generates a plan."}, {"key": "C", "text": "Start that prompt with /plan, which activates plan mode for that request."}, {"key": "D", "text": "Write in the prompt \"in plan mode, analyse the booking module and propose an approach\"."}], "correct_answer": "C", "technical_explanation": "You switch into plan mode rather than ask for it. There are three ways: start with claude --permission-mode plan, press Shift+Tab until the status bar shows plan mode, or start a single prompt with /plan. Writing \"in plan mode\" in the text does nothing.", "distractor_analysis": [{"key": "A", "type": "Plausible alternative", "explanation": "Enables plan mode, but for a whole new session; it forces her to abandon the current one when a single request was enough."}, {"key": "B", "type": "Conceptual distractor", "explanation": "-p enables print (non-interactive) mode for CI, not plan mode."}, {"key": "C", "type": "Correct", "explanation": "Correct. /plan at the start of the prompt switches to plan mode for that request."}, {"key": "D", "type": "Confusion distractor", "explanation": "Expresses the right intent, but the documentation is explicit: writing \"in plan mode\" in the body of a prompt does not switch modes."}], "reference": "3_4 Plan Mode vs Direct Execution (\"Plan Mode: When to Use It\"); Quick Reference Domain 3 (\"Common Exam Traps\": -p flag)"}, {"id": "D3-Q25", "domain": "3", "domain_name": "Claude Code Configuration & Workflows", "subdomain_code": "3.4", "subdomain_name": "Plan Mode vs Direct Execution", "difficulty": "Easy", "question_type": "Short", "reference_topic": "Ambiguity vs difficulty", "question": "Which criterion mainly determines whether a task should be handled in plan mode or with direct execution?", "options": [{"key": "A", "text": "The technical difficulty of the code to be modified and the risk of introducing errors into it."}, {"key": "B", "text": "Ambiguity: whether there are design decisions or several valid approaches."}, {"key": "C", "text": "The approximate number of lines that will change."}, {"key": "D", "text": "Whether the task will run interactively or in a CI pipeline."}], "correct_answer": "B", "technical_explanation": "The choice depends on ambiguity, not difficulty. A difficult but well-defined bug fits direct execution; a seemingly simple feature with several possible implementations that affects several modules fits plan mode.", "distractor_analysis": [{"key": "A", "type": "Confusion distractor", "explanation": "This is the confusion the documentation explicitly flags: difficult does not mean ambiguous."}, {"key": "B", "type": "Correct", "explanation": "Correct."}, {"key": "C", "type": "Plausible alternative", "explanation": "Size often correlates with complexity, but a small change can have several approaches and a large one can be fully defined."}, {"key": "D", "type": "Conceptual distractor", "explanation": "Mixes working modes with non-interactive mode (-p), which depends on whether a person is present, not on how to plan."}], "reference": "3_4 Plan Mode vs Direct Execution (\"Key Concept\")"}, {"id": "D3-Q26", "domain": "3", "domain_name": "Claude Code Configuration & Workflows", "subdomain_code": "3.4", "subdomain_name": "Plan Mode vs Direct Execution", "difficulty": "Easy", "question_type": "Medium", "reference_topic": "Difficult but well-defined bug", "question": "A NullPointerException in a single function of a very intricate concurrency module has a clear stack trace. The developer already knows the cause and the exact line to fix. Which mode should he use?", "options": [{"key": "A", "text": "Plan mode, because concurrency code is complex and a mistake could have side effects."}, {"key": "B", "text": "Direct execution with --permission-mode plan, to review the change before writing it."}, {"key": "C", "text": "Direct execution: the problem, location and solution are all known."}, {"key": "D", "text": "Launch the Explore subagent first to map the module, then apply the fix."}], "correct_answer": "C", "technical_explanation": "A single-function fix with a known cause and a clear stack trace is the clearest case for direct execution. Plan mode adds unnecessary overhead when the problem, location and solution are all clear.", "distractor_analysis": [{"key": "A", "type": "Confusion distractor", "explanation": "Chooses the mode by difficulty rather than ambiguity. No design decision remains open here."}, {"key": "B", "type": "Conceptual distractor", "explanation": "Combines incompatible concepts: --permission-mode plan is not a variant of direct execution but plan mode itself, in which nothing is written until the plan is approved."}, {"key": "C", "type": "Correct", "explanation": "Correct."}, {"key": "D", "type": "Plausible alternative", "explanation": "Explore is useful when discovery is extensive, but here there is nothing to discover; it only adds steps."}], "reference": "3_4 Plan Mode vs Direct Execution (\"Direct Execution: When to Use It\", \"Exam Traps\")"}, {"id": "D3-Q27", "domain": "3", "domain_name": "Claude Code Configuration & Workflows", "subdomain_code": "3.4", "subdomain_name": "Plan Mode vs Direct Execution", "difficulty": "Intermediate", "question_type": "Medium", "reference_topic": "Selecting the mode for several tasks", "question": "A wedding venue's team has three tasks: (1) split the booking system into independent services; (2) change the deposit percentage, which is a configuration value; (3) migrate from one logging library to another across 30 files, where the two libraries handle log levels and structured context differently. Which mode fits each?", "options": [{"key": "A", "text": "Plan mode for (1); direct execution for (2) and (3), giving detailed instructions upfront for (3)."}, {"key": "B", "text": "Plan mode for (1) and for (3), followed by direct execution in (3); direct execution for (2)."}, {"key": "C", "text": "Plan mode for all three, since they all modify production code."}, {"key": "D", "text": "Direct execution for all three, switching to plan mode if unexpected complexity appears."}], "correct_answer": "B", "technical_explanation": "(1) is an architectural restructuring; (3) is a many-file migration with API differences that needs a consistent strategy, the typical case for the plan-then-execute hybrid; (2) is a configuration change with a known approach.", "distractor_analysis": [{"key": "A", "type": "Confusion distractor", "explanation": "Gets (1) and (2) right but treats the migration as trivial. With API differences across 30 files, without a plan there is a risk of applying it inconsistently."}, {"key": "B", "type": "Correct", "explanation": "Correct."}, {"key": "C", "type": "Plausible alternative", "explanation": "Would be safe, but over-plans task (2), which has no design decisions."}, {"key": "D", "type": "Conceptual distractor", "explanation": "This is the late-switch trap: the complexity of (1) and (3) is already in the requirements; it is not speculative."}], "reference": "3_4 Plan Mode vs Direct Execution (\"Decision Framework Summary\", \"The Hybrid Approach\", \"Practice Scenario\")"}, {"id": "D3-Q28", "domain": "3", "domain_name": "Claude Code Configuration & Workflows", "subdomain_code": "3.4", "subdomain_name": "Plan Mode vs Direct Execution", "difficulty": "Intermediate", "question_type": "Long", "reference_topic": "Explore subagent", "question": "Before migrating a library, about 200 files that import it must be identified and their usage patterns mapped. In a previous attempt, discovery was done in the main conversation: file listings, dependency graphs and code excerpts filled the context, and the responses during the subsequent implementation got worse. How should the new attempt be organised?", "options": [{"key": "A", "text": "Delegate discovery to the Explore subagent and implement in the main conversation based on the summaries it returns."}, {"key": "B", "text": "Do the discovery in the main conversation in plan mode, since in that mode Claude does not write files and the context is not affected."}, {"key": "C", "text": "Do the discovery in the main conversation and run /compact when finished, before starting the implementation."}, {"key": "D", "text": "Create a discovery skill with allowed-tools limited to Read, Grep and Glob, so exploration is read-only."}], "correct_answer": "A", "technical_explanation": "The Explore subagent runs exploration in isolation, produces summaries, returns them to the main conversation and keeps the context window free for implementation. It is the right tool when discovery is verbose but implementation needs focused context.", "distractor_analysis": [{"key": "A", "type": "Correct", "explanation": "Correct."}, {"key": "B", "type": "Confusion distractor", "explanation": "Plan mode does avoid modifying files, but it does not isolate output: all the discovery would still fill the main context."}, {"key": "C", "type": "Plausible alternative", "explanation": "Reduces context after the fact, but the summary may lose useful detail and the degradation would already have happened during discovery."}, {"key": "D", "type": "Conceptual distractor", "explanation": "allowed-tools controls tools, not where output goes; without context: fork, the skill's output still enters the main conversation."}], "reference": "3_4 Plan Mode vs Direct Execution (\"The Explore Subagent\", \"Exam Traps\")"}, {"id": "D3-Q29", "domain": "3", "domain_name": "Claude Code Configuration & Workflows", "subdomain_code": "3.4", "subdomain_name": "Plan Mode vs Direct Execution", "difficulty": "Difficult", "question_type": "Long", "reference_topic": "Recognising complexity upfront", "question": "A product manager asks: \"Restructure the booking monolith into three services (availability, payments and notifications), keeping the current API contracts. There are two options for inter-service communication: message queues or synchronous calls, with different infrastructure requirements.\" A developer suggests starting with direct execution on the availability service and switching to plan mode if dependency problems appear. What is the best approach?", "options": [{"key": "A", "text": "Work entirely in plan mode, including the implementation of the three services, so every change is reviewed and consistency across services is maintained until the end of the project."}, {"key": "B", "text": "Plan mode from the start to compare the two options and define boundaries and contracts for all three services; then direct execution service by service."}, {"key": "C", "text": "Use direct execution with a very detailed prompt listing the three services, the contracts and the two options, asking Claude to choose the best one along the way."}, {"key": "D", "text": "Start in plan mode only for the availability service and directly execute the other two by reusing the resulting pattern."}], "correct_answer": "B", "technical_explanation": "When the requirements already state that the task is complex (restructuring a monolith with several valid approaches), plan mode is chosen upfront; that complexity is not going to \"emerge\", it is already in the request. The expected pattern is the hybrid: plan, then execute.", "distractor_analysis": [{"key": "A", "type": "Conceptual distractor", "explanation": "Misunderstands plan mode: in it Claude writes nothing to disk until the plan is approved, so it cannot serve as an implementation mode."}, {"key": "B", "type": "Correct", "explanation": "Correct. Plan mode from the start, then direct execution."}, {"key": "C", "type": "Plausible alternative", "explanation": "Comprehensive instructions help, but they do not replace exploring dependencies and comparing approaches before editing; the risk of rework remains."}, {"key": "D", "type": "Confusion distractor", "explanation": "Looks like the correct hybrid, but the plan's scope is insufficient: the communication choice and the contracts affect all three services, so they must be planned together."}], "reference": "3_4 Plan Mode vs Direct Execution (\"Recognising Complexity Upfront\", \"The Hybrid Approach\", \"Exam Traps\")"}, {"id": "D3-Q30", "domain": "3", "domain_name": "Claude Code Configuration & Workflows", "subdomain_code": "3.4", "subdomain_name": "Plan Mode vs Direct Execution", "difficulty": "Difficult", "question_type": "Medium", "reference_topic": "Seemingly simple feature", "question": "Automatic reminders must be added for couples before their wedding. They could be sent by email, by SMS or as push notifications, and they affect the booking module, user preferences and the task scheduler. The developer thinks it is \"just a few lines\". Which mode is appropriate?", "options": [{"key": "A", "text": "Plan mode, because there are several valid approaches and the change affects several modules."}, {"key": "B", "text": "Execution with claude -p, so the implementation finishes without interruptions."}, {"key": "C", "text": "Direct execution, because the feature is small and easy to describe."}, {"key": "D", "text": "Direct execution, preceded by the Explore subagent to locate the affected modules."}], "correct_answer": "A", "technical_explanation": "A request that seems simple but can be implemented in several ways and affects several modules fits plan mode. What decides is ambiguity, not a sense of ease.", "distractor_analysis": [{"key": "A", "type": "Correct", "explanation": "Correct."}, {"key": "B", "type": "Conceptual distractor", "explanation": "-p is for non-interactive runs in CI; it is not a planning mode and does not remove the need to decide the approach."}, {"key": "C", "type": "Confusion distractor", "explanation": "Confuses \"simple\" with \"well-defined\". Here the design decision (channel and integration point) is still open."}, {"key": "D", "type": "Plausible alternative", "explanation": "Explore helps locate files, but it does not resolve the choice between approaches; the problem is one of design, not just discovery."}], "reference": "3_4 Plan Mode vs Direct Execution (\"Key Concept\", \"Plan Mode: When to Use It\")"}, {"id": "D3-Q31", "domain": "3", "domain_name": "Claude Code Configuration & Workflows", "subdomain_code": "3.5", "subdomain_name": "Iterative Refinement Techniques", "difficulty": "Easy", "question_type": "Short", "reference_topic": "Concrete examples vs prose", "question": "A developer describes a code transformation in prose, and Claude Code applies it differently on each run. The developer knows exactly what the code should look like. Which technique should he try first?", "options": [{"key": "A", "text": "Rewrite the prose description with more precise language and technical terminology."}, {"key": "B", "text": "Give 2-3 concrete input/output examples showing the exact transformation."}, {"key": "C", "text": "Use the interview pattern so Claude asks clarifying questions before implementing."}, {"key": "D", "text": "First write a complete test suite covering the happy path and edge cases, and iterate by sharing the failures with Claude Code."}], "correct_answer": "B", "technical_explanation": "Concrete input/output examples are the most effective technique when a prose description is interpreted inconsistently: the model generalises from examples more reliably than from any description.", "distractor_analysis": [{"key": "A", "type": "Plausible alternative", "explanation": "The usual first instinct, but more precise prose still depends on interpretation, so the inconsistency continues."}, {"key": "B", "type": "Correct", "explanation": "Correct."}, {"key": "C", "type": "Conceptual distractor", "explanation": "The interview pattern is for unfamiliar domains; here the developer already knows the transformation, so there are no hidden considerations to uncover."}, {"key": "D", "type": "Confusion distractor", "explanation": "Test-driven iteration is the technique for complex transformations with many edge cases, but it is not the first step for a known transformation that is being misread."}], "reference": "3_5 Iterative Refinement Techniques (\"The Technique Hierarchy\", \"Practice Scenario\")"}, {"id": "D3-Q32", "domain": "3", "domain_name": "Claude Code Configuration & Workflows", "subdomain_code": "3.5", "subdomain_name": "Iterative Refinement Techniques", "difficulty": "Easy", "question_type": "Medium", "reference_topic": "Interview pattern", "question": "A guest house's developer has never built a caching layer, and the booking site needs one for its API. He wants to avoid overlooking requirements an expert would consider. How should he frame the request to Claude Code?", "options": [{"key": "A", "text": "\"Build a caching layer for the API with a 5-minute TTL for all responses.\""}, {"key": "B", "text": "Send all the cache requirements in a single message, since they interact with each other."}, {"key": "C", "text": "Provide 2-3 concrete examples of API responses before and after going through the cache, so Claude infers from them the expected behaviour of the whole layer."}, {"key": "D", "text": "\"I need a caching layer for the API. Before implementing, ask me questions about the requirements, edge cases and constraints I should consider.\""}], "correct_answer": "D", "technical_explanation": "In a domain where the developer lacks expertise, the interview pattern has Claude ask questions before implementing, surfacing considerations such as cache invalidation, TTL policies, consistency requirements or failure modes.", "distractor_analysis": [{"key": "A", "type": "Plausible alternative", "explanation": "Works if the developer already knows the requirements, but prescribing a solution in an unfamiliar domain shuts out what he has not anticipated."}, {"key": "B", "type": "Conceptual distractor", "explanation": "Batching is useful for fixes that interact, but the developer cannot send requirements he has not yet identified."}, {"key": "C", "type": "Confusion distractor", "explanation": "Input/output examples are for when the exact transformation is known; here the problem is that the requirements are unknown."}, {"key": "D", "type": "Correct", "explanation": "Correct."}], "reference": "3_5 Iterative Refinement Techniques (\"Interview pattern\", \"Key Concept\")"}, {"id": "D3-Q33", "domain": "3", "domain_name": "Claude Code Configuration & Workflows", "subdomain_code": "3.5", "subdomain_name": "Iterative Refinement Techniques", "difficulty": "Intermediate", "question_type": "Medium", "reference_topic": "Batch feedback for interacting changes", "question": "A review lists three related changes: error responses must include an error-code field, logs must record that code in structured format, and the client SDK type definitions must reflect the new field. How should the developer deliver the feedback?", "options": [{"key": "A", "text": "In three parallel sessions, each in its own git worktree, so the changes do not overwrite each other."}, {"key": "B", "text": "In a single message describing the three changes and stating that they interact with each other."}, {"key": "C", "text": "In three successive messages, waiting for the result of each, so Claude focuses on one change at a time."}, {"key": "D", "text": "By asking Claude to ask questions about the error format before implementing any of the three changes."}], "correct_answer": "B", "technical_explanation": "When fixes interact, they must be sent together: the model needs to see all the constraints at once to produce a coherent fix. If they are sent separately, one fix targets a state that the next one changes.", "distractor_analysis": [{"key": "A", "type": "Plausible alternative", "explanation": "Worktrees isolate parallel, independent work; here the three changes depend on the same error format and must be designed together."}, {"key": "B", "type": "Correct", "explanation": "Correct."}, {"key": "C", "type": "Confusion distractor", "explanation": "Sequential feedback is right, but for independent issues; with interacting changes, each fix may conflict with the next."}, {"key": "D", "type": "Conceptual distractor", "explanation": "The interview pattern reveals requirements in unfamiliar domains; here the requirements are already defined."}], "reference": "3_5 Iterative Refinement Techniques (\"Batch vs Sequential Feedback\", \"Exam Traps\")"}, {"id": "D3-Q34", "domain": "3", "domain_name": "Claude Code Configuration & Workflows", "subdomain_code": "3.5", "subdomain_name": "Iterative Refinement Techniques", "difficulty": "Intermediate", "question_type": "Short", "reference_topic": "Sequential feedback for independent issues", "question": "Claude Code's output has two issues that do not affect each other: functions do not use camelCase and indentation is not 2 spaces. What is the best way to give the feedback?", "options": [{"key": "A", "text": "Send both fixes in a single message to save an iteration."}, {"key": "B", "text": "Sequentially: naming first, wait for the result, then indentation."}, {"key": "C", "text": "Give 2-3 input/output examples combining the renaming and the indentation."}, {"key": "D", "text": "Send them together, but numbered, so the model knows which part of the code each one applies to."}], "correct_answer": "B", "technical_explanation": "When issues are independent, they are fixed one at a time. Batching independent issues can confuse the model about which feedback applies to which part of the code.", "distractor_analysis": [{"key": "A", "type": "Plausible alternative", "explanation": "Saves a round and looks efficient, but the documentation recommends batch feedback only when fixes interact."}, {"key": "B", "type": "Correct", "explanation": "Correct."}, {"key": "C", "type": "Conceptual distractor", "explanation": "Examples are used when a description is interpreted inconsistently; here the instructions are clear and the issue is how to organise feedback."}, {"key": "D", "type": "Confusion distractor", "explanation": "Numbering seems to resolve the ambiguity, but it is still batch feedback for independent issues, which is what should be avoided."}], "reference": "3_5 Iterative Refinement Techniques (\"Batch vs Sequential Feedback\")"}, {"id": "D3-Q35", "domain": "3", "domain_name": "Claude Code Configuration & Workflows", "subdomain_code": "3.5", "subdomain_name": "Iterative Refinement Techniques", "difficulty": "Difficult", "question_type": "Long", "reference_topic": "Test-driven iteration", "question": "Legacy booking records must be migrated to a new JSON format. The transformation is complex: null values that must be preserved, empty fields, dates on daylight-saving boundaries, and a performance requirement for batches of 100,000 records. The developer already gave three input/output examples, including one edge case; the standard case now comes out right, but a different edge case fails on each run. What is the most effective next step?", "options": [{"key": "A", "text": "Write the tests first (happy path, edge cases, performance) and share their failures."}, {"key": "B", "text": "Ask Claude to ask questions about the target format before continuing."}, {"key": "C", "text": "Add 15-20 more input/output pairs, one for each combination of nulls, empty fields and boundary dates, until the model has no case without an example."}, {"key": "D", "text": "Write a formal prose specification describing every transformation rule."}], "correct_answer": "A", "technical_explanation": "For complex transformations with many edge cases, the most effective technique is test-driven iteration: the tests define the expected behaviour and each failure is concrete, unambiguous feedback. For example: \"FAIL: testMigrationHandlesNullValues. Expected: null preserved; Actual: empty string\".", "distractor_analysis": [{"key": "A", "type": "Correct", "explanation": "Correct."}, {"key": "B", "type": "Conceptual distractor", "explanation": "The interview pattern is for unfamiliar domains; here the target format is already defined."}, {"key": "C", "type": "Confusion distractor", "explanation": "Adding edge-case examples is a documented step, but covering every case is unnecessary: two or three well-chosen ones are enough for the pattern. For a complex transformation that includes performance, tests give a verifiable signal that examples do not."}, {"key": "D", "type": "Plausible alternative", "explanation": "May document the system, but prose still depends on interpretation and provides no objective signal of what is failing."}], "reference": "3_5 Iterative Refinement Techniques (\"Test-driven iteration\", \"In the exam\")"}, {"id": "D3-Q36", "domain": "3", "domain_name": "Claude Code Configuration & Workflows", "subdomain_code": "3.5", "subdomain_name": "Iterative Refinement Techniques", "difficulty": "Difficult", "question_type": "Medium", "reference_topic": "Verifying generalisation", "question": "To convert signatures such as getUserData(userId: string): Promise<UserData> into Promise<Result<UserData, ApiError>>, the developer gave Claude three input/output pairs. The three functions from the examples now come out right on every run. What is the recommended next step?", "options": [{"key": "A", "text": "Try it on a function that is not in the examples and, if an edge case fails, add an example specific to that case."}, {"key": "B", "text": "Consider the process finished, because if the examples already work, the model has learned the pattern."}, {"key": "C", "text": "Add ten more examples so the pattern is fully fixed before applying it to the rest of the code."}, {"key": "D", "text": "Rewrite the rule in prose now that the pattern is clear, and remove the examples, so the instructions are shorter and easier to maintain in the long run."}], "correct_answer": "A", "technical_explanation": "The documented process for switching from prose to examples has four steps: observe the inconsistency, switch to 2-3 examples, verify generalisation on a new case and, if needed, add edge-case examples.", "distractor_analysis": [{"key": "A", "type": "Correct", "explanation": "Correct."}, {"key": "B", "type": "Confusion distractor", "explanation": "Skips the verification step: the example cases working does not prove the pattern applies to new cases."}, {"key": "C", "type": "Plausible alternative", "explanation": "More examples do no harm, but they are unnecessary: the model generalises from 2-3 well-chosen ones, and without a new case nothing has been verified."}, {"key": "D", "type": "Conceptual distractor", "explanation": "Returns to the format that caused the inconsistency; prose depends on interpretation even if the pattern is clear to the developer."}], "reference": "3_5 Iterative Refinement Techniques (\"Switching From Prose to Examples\")"}, {"id": "D3-Q37", "domain": "3", "domain_name": "Claude Code Configuration & Workflows", "subdomain_code": "3.5", "subdomain_name": "Iterative Refinement Techniques", "difficulty": "Difficult", "question_type": "Long", "reference_topic": "Combining batch and sequential feedback", "question": "After a review, a developer has four pending comments on code generated by Claude Code:\n(1) Error responses must include an errorCode field.\n(2) Structured logs must record that errorCode.\n(3) Variables in an unrelated utilities file must switch to camelCase.\n(4) The client SDK types must reflect the new errorCode field.\nWhat is the most effective feedback plan?", "options": [{"key": "A", "text": "All four in a single message, so Claude has all the review information."}, {"key": "B", "text": "One message with (1) and (2); then (3); and finally (4), once the error format is stable."}, {"key": "C", "text": "One message with (1), (2) and (4) together, stating that they interact, and (3) in a separate iteration."}, {"key": "D", "text": "All four sequentially, ordered by dependency: (1), then (2), then (4) and finally (3)."}], "correct_answer": "C", "technical_explanation": "Fixes that interact (error format, logs and SDK types) must be seen together for the solution to be coherent. The independent fix (camelCase in another file) is handled separately, because batching independent issues can confuse the model.", "distractor_analysis": [{"key": "A", "type": "Plausible alternative", "explanation": "Keeps the interacting changes together, but adds an independent issue that may confuse the model about which feedback applies to which code."}, {"key": "B", "type": "Confusion distractor", "explanation": "Groups almost correctly, but separates (4), which depends on the same errorCode field; SDK types designed separately may not match the chosen format."}, {"key": "C", "type": "Correct", "explanation": "Correct."}, {"key": "D", "type": "Conceptual distractor", "explanation": "Ordering by dependency does not make up for sending interacting fixes separately: each would target a state the next one changes."}], "reference": "3_5 Iterative Refinement Techniques (\"Batch vs Sequential Feedback\", \"Exam Traps\"); Quick Reference Domain 3 (\"Feedback Techniques\")"}, {"id": "D3-Q38", "domain": "3", "domain_name": "Claude Code Configuration & Workflows", "subdomain_code": "3.6", "subdomain_name": "CI/CD Integration", "difficulty": "Easy", "question_type": "Short", "reference_topic": "Non-interactive mode with -p", "question": "A CI script runs claude \"Analyse this PR\" and the job hangs indefinitely. The logs show that Claude Code is waiting for interactive input. What is the fix?", "options": [{"key": "A", "text": "Add the --batch flag: claude --batch \"Analyse this PR\"."}, {"key": "B", "text": "Redirect standard input from /dev/null: claude \"Analyse this PR\" < /dev/null."}, {"key": "C", "text": "Add the -p flag: claude -p \"Analyse this PR\"."}, {"key": "D", "text": "Set the environment variable CLAUDE_HEADLESS=true before running the command."}], "correct_answer": "C", "technical_explanation": "The -p (or --print) flag switches Claude Code to print mode: it processes the prompt, writes the result to stdout and exits without waiting for user input. It is the most tested fact in Domain 3.", "distractor_analysis": [{"key": "A", "type": "Confusion distractor", "explanation": "Sounds plausible because of its resemblance to the Batch API, but --batch does not exist as a Claude Code flag."}, {"key": "B", "type": "Plausible alternative", "explanation": "A typical Unix workaround to avoid hangs, but it does not properly address Claude Code's interactive mode."}, {"key": "C", "type": "Correct", "explanation": "Correct."}, {"key": "D", "type": "Conceptual distractor", "explanation": "Imagines an environment-variable configuration mechanism that does not exist; CLAUDE_HEADLESS is not a documented option."}], "reference": "3_6 CI/CD Integration (\"The -p Flag: Non-Interactive Mode\", \"Exam Traps\", \"Practice Scenario\")"}, {"id": "D3-Q39", "domain": "3", "domain_name": "Claude Code Configuration & Workflows", "subdomain_code": "3.6", "subdomain_name": "CI/CD Integration", "difficulty": "Easy", "question_type": "Short", "reference_topic": "Structured output in CI", "question": "A pipeline runs claude -p --output-format json --json-schema '<schema>' \"Review this PR\". Where is the schema-validated data?", "options": [{"key": "A", "text": "In a separate file that Claude writes to the working directory, because --json-schema only works in interactive mode."}, {"key": "B", "text": "In the structured_output field of the JSON envelope; extract it with jq '.structured_output'."}, {"key": "C", "text": "In the envelope's result field, as text the pipeline must parse."}, {"key": "D", "text": "At the top level of the JSON object, instead of the usual envelope."}], "correct_answer": "B", "technical_explanation": "--output-format json returns a JSON envelope with the result text, session ID, and cost and usage metadata. With --json-schema (print mode only), data matching the schema appears in the envelope's structured_output field, not at the top level.", "distractor_analysis": [{"key": "A", "type": "Conceptual distractor", "explanation": "Inverts the restriction: --json-schema works only in print mode (-p), not in interactive mode."}, {"key": "B", "type": "Correct", "explanation": "Correct."}, {"key": "C", "type": "Plausible alternative", "explanation": "The envelope does contain a result field with text, but the schema-validated data is in structured_output."}, {"key": "D", "type": "Confusion distractor", "explanation": "The most common extraction mistake: the documentation explicitly says to read .structured_output, not the top level."}], "reference": "3_6 CI/CD Integration (\"Structured Output for CI\", \"CLI Flags Reference\")"}, {"id": "D3-Q40", "domain": "3", "domain_name": "Claude Code Configuration & Workflows", "subdomain_code": "3.6", "subdomain_name": "CI/CD Integration", "difficulty": "Intermediate", "question_type": "Medium", "reference_topic": "Appending vs replacing the system prompt", "question": "An automated PR reviewer must keep behaving like Claude Code's coding assistant, with its tool guidance and safety instructions, while also applying the team's severity criteria. Which flag should be used?", "options": [{"key": "A", "text": "--system-prompt \"<team criteria>\"."}, {"key": "B", "text": "--bare together with --system-prompt-file criteria.md, for a faster start."}, {"key": "C", "text": "--system-prompt-file with a file that copies the default prompt and adds the criteria at the end."}, {"key": "D", "text": "--append-system-prompt \"<team criteria>\"."}], "correct_answer": "D", "technical_explanation": "--append-system-prompt adds text to the default prompt and keeps its tool guidance, safety instructions and coding conventions. --system-prompt replaces the entire prompt and leaves you responsible for everything the task needs; it is used when the identity or permission model differs from Claude Code's.", "distractor_analysis": [{"key": "A", "type": "Confusion distractor", "explanation": "Very close to the correct option, but it replaces the default prompt and discards the tool and safety guidance the reviewer must keep."}, {"key": "B", "type": "Conceptual distractor", "explanation": "Combines two real flags without understanding their effect: --bare skips discovery of CLAUDE.md, skills and hooks, and --system-prompt-file also replaces the default prompt."}, {"key": "C", "type": "Plausible alternative", "explanation": "Could get close to the result, but forces the team to maintain a manual copy of the default prompt; by replacing, the team becomes responsible for all its content."}, {"key": "D", "type": "Correct", "explanation": "Correct."}], "reference": "3_6 CI/CD Integration (\"CLI Flags Reference\": System prompt flags); Quick Reference Domain 3 (\"System prompt — append vs replace\")"}, {"id": "D3-Q41", "domain": "3", "domain_name": "Claude Code Configuration & Workflows", "subdomain_code": "3.6", "subdomain_name": "CI/CD Integration", "difficulty": "Intermediate", "question_type": "Long", "reference_topic": "Incremental review context", "question": "An online shop runs an automated review with claude -p on every push to a PR. After several pushes, developers always receive the same five comments. One of them flags a hard-coded postcode list that the developer reviewed and decided to keep on purpose. The team starts ignoring all of the bot's comments. Which change solves the problem?", "options": [{"key": "A", "text": "Run a new review of the whole PR with the previous findings in context, asking only for new or still-unaddressed issues."}, {"key": "B", "text": "Lower --max-turns so each run produces fewer findings and fewer repeated comments."}, {"key": "C", "text": "Resume the first review's session with -r on every push, so Claude remembers what it commented, what the developer replied and what was kept on purpose."}, {"key": "D", "text": "Review only the diff of the latest commit, so findings from earlier pushes do not reappear."}], "correct_answer": "A", "technical_explanation": "Without context from previous reviews, each run analyses the PR from scratch and repeats findings. Fixed issues disappear by themselves; those that reappear are the ones the developer saw and chose not to change. The fix is to pass the previous findings into a fresh run over the whole PR and ask only for new or pending issues.", "distractor_analysis": [{"key": "A", "type": "Correct", "explanation": "Correct."}, {"key": "B", "type": "Conceptual distractor", "explanation": "--max-turns caps agentic turns and does not distinguish new findings from repeated ones; it only makes the review less thorough."}, {"key": "C", "type": "Confusion distractor", "explanation": "Seems to provide \"memory\", but the resumed session carries over stale tool results about code that has since changed."}, {"key": "D", "type": "Plausible alternative", "explanation": "Eliminates repetition, but hides findings the contributor has not yet addressed in earlier commits."}], "reference": "3_6 CI/CD Integration (\"Incremental Review Context\", \"Exam Traps\")"}, {"id": "D3-Q42", "domain": "3", "domain_name": "Claude Code Configuration & Workflows", "subdomain_code": "3.6", "subdomain_name": "CI/CD Integration", "difficulty": "Intermediate", "question_type": "Medium", "reference_topic": "Batch API vs real time", "question": "A team wants to cut costs on two Claude workflows: (a) a pre-merge check that blocks the PR until it finishes, and (b) a weekly technical-debt audit that is reviewed on Monday morning. Which combination is appropriate?", "options": [{"key": "A", "text": "Batch API for both, since the 50% saving applies to both and batches usually finish in a few minutes."}, {"key": "B", "text": "Batch API for (a) with a low --max-turns to bound the waiting time, and real time for (b)."}, {"key": "C", "text": "Real-time (synchronous) API for (a) and the Message Batches API for (b)."}, {"key": "D", "text": "Real-time API for both, to keep a single mechanism and consistent latency."}], "correct_answer": "C", "technical_explanation": "The Message Batches API offers 50% savings, but processing can take up to 24 hours with no latency SLA. Pre-merge checks block developers, so they need real time; scheduled, latency-tolerant analyses such as a weekly audit fit batch.", "distractor_analysis": [{"key": "A", "type": "Confusion distractor", "explanation": "The saving is real, but it assumes a latency the Batch API does not guarantee; a blocking check cannot depend on it."}, {"key": "B", "type": "Conceptual distractor", "explanation": "--max-turns caps the agent's turns, not the time a batch takes to process; it also inverts the workflow assignment."}, {"key": "C", "type": "Correct", "explanation": "Correct."}, {"key": "D", "type": "Plausible alternative", "explanation": "Technically works, but gives up the 50% saving on a non-urgent workflow, which was exactly the goal."}], "reference": "3_6 CI/CD Integration (\"Batch API vs Real-Time for CI Workflows\")"}, {"id": "D3-Q43", "domain": "3", "domain_name": "Claude Code Configuration & Workflows", "subdomain_code": "3.6", "subdomain_name": "CI/CD Integration", "difficulty": "Difficult", "question_type": "Long", "reference_topic": "Session isolation for review", "question": "A pipeline generates an authentication middleware with claude -p and, in the next step, reviews it with claude -c -p \"Review the middleware you just wrote for security issues\", to \"take advantage of the context\". The reviews almost never find problems, but manual audits do. Which change improves review quality?", "options": [{"key": "A", "text": "Run the review with --bare so it does not load CLAUDE.md or any other configuration that could bias it."}, {"key": "B", "text": "Keep -c, but add --append-system-prompt \"Be very critical of the code, even if you wrote it\"."}, {"key": "C", "text": "Launch the review in another job with -r and the generation session ID, so it knows the reasons behind each decision and evaluates with better judgement."}, {"key": "D", "text": "Review with an independent claude -p invocation, without -c or -r, so it does n
