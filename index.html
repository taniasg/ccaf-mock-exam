ot inherit the generation reasoning."}], "correct_answer": "D", "technical_explanation": "The session that generated the code retains the reasoning that justified its decisions, so it is less likely to question them. An independent call without that context judges only the code. -c resumes the most recent conversation and -r a specific one, so both reintroduce the bias.", "distractor_analysis": [{"key": "A", "type": "Conceptual distractor", "explanation": "Attributes the bias to CLAUDE.md, when it comes from the session context; moreover, --bare drops the review criteria the project defines in CLAUDE.md."}, {"key": "B", "type": "Plausible alternative", "explanation": "An additional instruction may help somewhat, but the bias comes from the retained reasoning context, not from a lack of instructions."}, {"key": "C", "type": "Confusion distractor", "explanation": "Changes the job but not the context: resuming the generation session brings back exactly the prior reasoning that causes the bias."}, {"key": "D", "type": "Correct", "explanation": "Correct."}], "reference": "3_6 CI/CD Integration (\"Session Context Isolation\", \"CLI Flags Reference\": Session and start-up); Quick Reference Domain 3 (\"Feedback Techniques\")"}, {"id": "D3-Q44", "domain": "3", "domain_name": "Claude Code Configuration & Workflows", "subdomain_code": "3.6", "subdomain_name": "CI/CD Integration", "difficulty": "Difficult", "question_type": "Long", "reference_topic": "GitHub Action in automation mode", "question": "A team wants Claude to review every new PR and leave comments on it. Its workflow triggers on pull_request: [opened], checks out the repository and runs anthropics/claude-code-action@v1 with anthropic_api_key from a secret and claude_args: --append-system-prompt \"Review against the checklist in CLAUDE.md\". It defines no other input. The workflow runs, but no review ever appears. Which change fixes it?", "options": [{"key": "A", "text": "Add the custom_instructions input with the review request."}, {"key": "B", "text": "Add the direct_prompt input with the review request."}, {"key": "C", "text": "Add the input mode: automation, so the action stops waiting for an @claude mention and runs on the pull_request event that triggers the workflow."}, {"key": "D", "text": "Add a prompt input asking for the review and the comments, and grant a tool to post them with --allowedTools in claude_args."}], "correct_answer": "D", "technical_explanation": "In v1, the mode follows the prompt input: with no prompt, the action runs in interactive mode and waits for the trigger phrase (@claude); with a prompt, it runs in automation mode on the event that started the workflow. With a plain-text prompt, Claude has no shell or GitHub API access until the workflow grants the tools, for example with --allowedTools in claude_args or a permissions.allow rule in settings.", "distractor_analysis": [{"key": "A", "type": "Conceptual distractor", "explanation": "custom_instructions was a pre-v1 input that became --append-system-prompt: it adds rules to the system prompt but does not define the task that triggers automation mode."}, {"key": "B", "type": "Plausible alternative", "explanation": "This was the correct input before v1; in v1, direct_prompt became prompt."}, {"key": "C", "type": "Confusion distractor", "explanation": "Correctly identifies that the action is in interactive mode, but the mode input disappeared in v1: the action infers the mode from prompt."}, {"key": "D", "type": "Correct", "explanation": "Correct."}], "reference": "3_6 CI/CD Integration (\"GitHub Actions: Claude Code as a Workflow Step\")"}, {"id": "D3-Q45", "domain": "3", "domain_name": "Claude Code Configuration & Workflows", "subdomain_code": "3.6", "subdomain_name": "CI/CD Integration", "difficulty": "Difficult", "question_type": "Long", "reference_topic": "Project context for test generation in CI", "question": "A nightly job runs claude -p --bare \"Generate tests for the modules changed today\". The generated tests are generic boilerplate, use object literals instead of the factories in test/factories/, and duplicate basket-total scenarios that are already covered. The project CLAUDE.md has a \"Testing Standards\" section with the factories, the available fixtures and the coverage target. Which change addresses both causes?", "options": [{"key": "A", "text": "Remove --bare so CLAUDE.md is read and add --json-schema with a schema that validates the name, file and cases covered by each generated test."}, {"key": "B", "text": "Keep --bare and add --append-system-prompt \"Follow good testing practices and avoid duplicate tests\"."}, {"key": "C", "text": "Remove --bare so CLAUDE.md is read and include the existing tests in the context, so it looks for coverage gaps."}, {"key": "D", "text": "Replace --bare with --system-prompt-file pointing to CLAUDE.md, since in -p mode Claude Code does not read CLAUDE.md on its own."}], "correct_answer": "C", "technical_explanation": "--bare skips automatic discovery of CLAUDE.md, skills, hooks, MCP and memory, so the run loses the project standards. In CI, Claude Code reads CLAUDE.md just as it does interactively, and that is how to give it context. Including the existing tests also prevents it from suggesting tests that already exist.", "distractor_analysis": [{"key": "A", "type": "Confusion distractor", "explanation": "Fixes the first cause by restoring CLAUDE.md, but a schema only validates the shape of the output; it does not tell Claude what coverage already exists, so duplication continues."}, {"key": "B", "type": "Plausible alternative", "explanation": "A generic instruction provides neither the project specifics (factories, fixtures) nor information about which tests already exist."}, {"key": "C", "type": "Correct", "explanation": "Correct. Solves both the boilerplate and the duplication."}, {"key": "D", "type": "Conceptual distractor", "explanation": "Starts from a false premise (Claude Code reads CLAUDE.md in CI just as interactively) and, moreover, replacing the system prompt discards its default behaviour."}], "reference": "3_6 CI/CD Integration (\"CLAUDE.md for CI Context\", \"Providing Existing Tests to Avoid Duplication\", \"CLI Flags Reference\": --bare)"}]}

{"metadata": {"title": "Question Bank – Domain 4: Prompt Engineering & Structured Output", "certification": "Claude Certified Architect – Foundations", "language": "en", "version": "1.0", "total_questions": 45, "difficulty_levels": ["Easy", "Intermediate", "Difficult"], "question_types": ["Short", "Medium", "Long"], "distractor_types": ["Correct", "Plausible alternative", "Conceptual distractor", "Confusion distractor"], "subdomains": [{"code": "4.1", "name": "System Prompts with Explicit Criteria"}, {"code": "4.2", "name": "Few-Shot Prompting"}, {"code": "4.3", "name": "Structured Output with Tool Use"}, {"code": "4.4", "name": "Validation, Retry, and Feedback Loops"}, {"code": "4.5", "name": "Batch Processing Strategies"}, {"code": "4.6", "name": "Multi-Instance and Multi-Pass Review"}], "sources": ["4_1 System Prompts with Explicit Criteria", "4_2 Few-Shot Prompting", "4_3 Structured Output with Tool Use", "4_4 Validation, Retry, and Feedback Loops", "4_5 Batch Processing Strategies", "4_6 Multi-Instance and Multi-Pass Review", "Glossary Domain 4", "Quick Reference Domain 4"]}, "questions": [{"id": "D4-Q01", "domain": "4", "domain_name": "Prompt Engineering & Structured Output", "subdomain_code": "4.1", "subdomain_name": "System Prompts with Explicit Criteria", "difficulty": "Easy", "question_type": "Short", "reference_topic": "Vague instructions vs. explicit criteria", "question": "A code review tool produces too many false positives. Which system prompt change is most likely to improve its precision?", "options": [{"key": "A", "text": "Expand the system prompt with a more detailed prose description of the team's quality goals and what it considers important."}, {"key": "B", "text": "Ask the model for a confidence score per finding and automatically discard any below 0.8."}, {"key": "C", "text": "Use categorical criteria: report bugs and security vulnerabilities, and skip style preferences and local patterns."}, {"key": "D", "text": "Add the instruction \"be conservative and only report findings you are highly confident about\"."}], "correct_answer": "C", "technical_explanation": "The documentation identifies vague instructions (\"be conservative\", \"only report high-confidence findings\", \"use your best judgement\") as the biggest mistake in production prompts. Explicit categorical criteria name what to report (bugs, security) and what to skip (style, local patterns), giving the model a rule it can apply to every input and reducing false positives.", "distractor_analysis": [{"key": "A", "type": "Plausible alternative", "explanation": "More context can help in other situations, but a prose description of goals still does not say what to flag and what to skip; the model still has to interpret."}, {"key": "B", "type": "Conceptual distractor", "explanation": "It misapplies self-reported confidence: it is poorly calibrated (the model is often sure about wrong findings) and is no substitute for criteria that define what a valid finding is."}, {"key": "C", "type": "Correct", "explanation": "Correct."}, {"key": "D", "type": "Confusion distractor", "explanation": "It sounds like good engineering, but these are vague instructions: \"conservative\" and \"high confidence\" give the model no actionable rule for deciding what to flag, so precision does not improve."}], "reference": "4_1 System Prompts with Explicit Criteria (\"Vague Instructions and Explicit Criteria\", \"Exam Traps\")"}, {"id": "D4-Q02", "domain": "4", "domain_name": "Prompt Engineering & Structured Output", "subdomain_code": "4.1", "subdomain_name": "System Prompts with Explicit Criteria", "difficulty": "Easy", "question_type": "Short", "reference_topic": "Severity calibration", "question": "A team wants its automated reviewer to assign the severity levels \"critical\", \"major\" and \"minor\" consistently. How should it define those levels in the system prompt?", "options": [{"key": "A", "text": "By letting the model assign severity freely and asking it for a confidence score so the team can re-rank the findings."}, {"key": "B", "text": "With precise prose definitions for each level, such as \"critical: issues that could cause system failures or data loss\" and \"minor: issues that affect readability but not functionality\"."}, {"key": "C", "text": "With concrete code examples for each level; for example, a SQL query built with an f-string from user input as critical, and userName vs user_name in the same module as minor."}, {"key": "D", "text": "By reducing the scale to two levels, blocking and non-blocking, so there are fewer ambiguous boundaries."}], "correct_answer": "C", "technical_explanation": "Severity calibration requires concrete code examples, not prose descriptions. When the model sees real patterns attached to each level, it classifies consistently from one invocation to the next. The Quick Reference recommends 2–3 calibration examples with specific code samples.", "distractor_analysis": [{"key": "A", "type": "Conceptual distractor", "explanation": "It uses a valid mechanism (confidence) for a problem it does not solve: without a definition of severity there is no criterion to calibrate, and self-reported confidence is poorly calibrated."}, {"key": "B", "type": "Confusion distractor", "explanation": "This is the approach the documentation cites as insufficient: prose forces the model to interpret what \"could cause failures\" means, and that interpretation varies between invocations."}, {"key": "C", "type": "Correct", "explanation": "Correct."}, {"key": "D", "type": "Plausible alternative", "explanation": "Simplifying the scale may make sense in another context, but it does not meet the three-level requirement and still does not define with examples which pattern belongs to each level."}], "reference": "4_1 System Prompts with Explicit Criteria (\"Severity Calibration with Code Examples\"); Quick Reference Domain 4 (\"System Prompts\")"}, {"id": "D4-Q03", "domain": "4", "domain_name": "Prompt Engineering & Structured Output", "subdomain_code": "4.1", "subdomain_name": "System Prompts with Explicit Criteria", "difficulty": "Easy", "question_type": "Medium", "reference_topic": "The false positive trust problem", "question": "An automated reviewer has three categories. Its security findings are correct 97% of the time, but since a \"naming conventions\" category with a 45% false positive rate was added, developers have stopped reading the security findings too. What best explains this behaviour?", "options": [{"key": "A", "text": "The new category degrades the model's precision on security because both share the same system prompt."}, {"key": "B", "text": "Trust applies to the whole output: a high false positive rate in one category destroys trust in every category, including the accurate ones."}, {"key": "C", "text": "It is a calibration problem: the model reports the wrong naming findings with high confidence, and that drags down the credibility of the security findings."}, {"key": "D", "text": "The total volume of findings exceeds what developers can read; shortening the report would be enough to get them reading the security findings again."}], "correct_answer": "B", "technical_explanation": "The documentation explains that a high false positive rate in one category destroys developer trust in every category, even those at 98% accuracy, because trust applies to the whole output. The fix is to temporarily disable the problematic category while its prompt is reworked.", "distractor_analysis": [{"key": "A", "type": "Conceptual distractor", "explanation": "It misreads the problem: the scenario states that security precision remains at 97%. What degrades is human trust, not the technical quality of that category."}, {"key": "B", "type": "Correct", "explanation": "Correct."}, {"key": "C", "type": "Confusion distractor", "explanation": "It combines a true statement (self-reported confidence is poorly calibrated) with the wrong cause; the effect described comes from how users judge the whole output, not from the model's scores."}, {"key": "D", "type": "Plausible alternative", "explanation": "Excess volume can be a real problem in other cases, but here the documented cause is lost trust from visible wrong findings; shortening the report while keeping the false positives does not restore it."}], "reference": "4_1 System Prompts with Explicit Criteria (\"The False Positive Trust Problem\")"}, {"id": "D4-Q04", "domain": "4", "domain_name": "Prompt Engineering & Structured Output", "subdomain_code": "4.1", "subdomain_name": "System Prompts with Explicit Criteria", "difficulty": "Intermediate", "question_type": "Medium", "reference_topic": "Trust recovery strategy", "question": "In a CI/CD review pipeline, the \"outdated comments\" category has a 40% false positive rate, and developers now ignore the other categories as well. The team wants to restore trust and also keep the category in the long term. Which plan is most appropriate?", "options": [{"key": "A", "text": "Temporarily disable the category and re-enable it after a fixed two-week period, once developers have regained trust in the report's other categories."}, {"key": "B", "text": "Keep it active, but demote its findings to collapsible informational notes at the end of the report, without changing its prompt."}, {"key": "C", "text": "Set the temperature to 0 so that this category's findings are deterministic and therefore reliable."}, {"key": "D", "text": "Temporarily disable that category, rewrite its prompt with explicit criteria and concrete code examples, and re-enable it only once its measured precision has improved."}], "correct_answer": "D", "technical_explanation": "The documented strategy is to temporarily disable categories with high false positive rates while their prompts are reworked, iterate with concrete code examples, and re-enable them only once precision (the share of their findings that are correct) improves. Once the wrong findings are gone, trust in the working categories returns immediately.", "distractor_analysis": [{"key": "A", "type": "Confusion distractor", "explanation": "It is right to disable, but it omits the essential part: iterating on the category's prompt and re-enabling it only once precision improves. If it returns with the same prompt, the false positives and the loss of trust come back."}, {"key": "B", "type": "Plausible alternative", "explanation": "Reducing visibility looks like a middle ground, but the wrong findings still appear and the prompt does not improve; users distrust any wrong finding they can see."}, {"key": "C", "type": "Conceptual distractor", "explanation": "It misapplies a sampling parameter: determinism is not correctness (a repeated wrong finding is still wrong). In addition, the exam guide does not mention temperature, and current models reject non-default values."}, {"key": "D", "type": "Correct", "explanation": "Correct."}], "reference": "4_1 System Prompts with Explicit Criteria (\"The False Positive Trust Problem\", \"Exam Traps\"); Glossary Domain 4 (\"Temperature\")"}, {"id": "D4-Q05", "domain": "4", "domain_name": "Prompt Engineering & Structured Output", "subdomain_code": "4.1", "subdomain_name": "System Prompts with Explicit Criteria", "difficulty": "Intermediate", "question_type": "Short", "reference_topic": "Order: explicit criteria and confidence-based routing", "question": "How should explicit criteria and confidence-based routing be combined in a review system?", "options": [{"key": "A", "text": "Filter noise by confidence first; then apply the explicit criteria only to the findings that pass the threshold."}, {"key": "B", "text": "Explicit criteria defining a valid finding come first; then confidence is used to send uncertain findings to human review."}, {"key": "C", "text": "Confidence-based routing is enough if the threshold has been calibrated on a labelled validation set, because it can then replace the explicit criteria."}, {"key": "D", "text": "Ask the model to report only high-confidence findings, because its self-reported confidence reflects the actual accuracy of each finding."}], "correct_answer": "B", "technical_explanation": "The documented order is explicit criteria first, confidence-based routing second. Confidence scores are useful for routing low-confidence findings to human review, but they do not replace the criteria that define a valid finding.", "distractor_analysis": [{"key": "A", "type": "Plausible alternative", "explanation": "It uses both mechanisms, but in reverse order: the initial filter relies on poorly calibrated confidence and may discard correct findings before the criteria are applied."}, {"key": "B", "type": "Correct", "explanation": "Correct."}, {"key": "C", "type": "Confusion distractor", "explanation": "Calibrating on labelled sets is good practice (4.6), but the documentation is clear: confidence is no substitute for criteria that define what counts as a valid finding. The first step is never skipped."}, {"key": "D", "type": "Conceptual distractor", "explanation": "It rests on a false premise: an LLM's self-reported confidence is poorly calibrated; the model is often sure about wrong findings and hesitant about right ones."}], "reference": "4_1 System Prompts with Explicit Criteria (\"Why Confidence-Based Filtering Fails\")"}, {"id": "D4-Q06", "domain": "4", "domain_name": "Prompt Engineering & Structured Output", "subdomain_code": "4.1", "subdomain_name": "System Prompts with Explicit Criteria", "difficulty": "Difficult", "question_type": "Long", "reference_topic": "Trust recovery under constraints", "question": "A law firm uses Claude to review contracts with three categories: \"unlimited liability\" (96% precision), \"inconsistent deadlines\" (91% precision) and \"ambiguous wording\" (38% false positives). The lawyers have started ignoring all the flags. Adding \"be conservative\" to the prompt was already tried, with no effect. There are three constraints: the budget allows no additional model calls per contract; the lawyers distrust any wrong flag they can see, even one marked as informational; and the firm wants to bring back the \"ambiguous wording\" category once it works well. Which plan meets every requirement?", "options": [{"key": "A", "text": "Ask the model for a confidence score on each \"ambiguous wording\" flag and automatically suppress those below 0.7."}, {"key": "B", "text": "Temporarily disable \"ambiguous wording\" and keep the other two; rewrite its criteria with a concrete trigger (flag only terms with two readings that change an obligation) and example clauses per severity; re-enable it once its measured precision improves."}, {"key": "C", "text": "Rewrite the \"ambiguous wording\" criteria with a concrete trigger (flag only terms with two readings that change an obligation) and example clauses for each severity level, and keep the category active while iterating to collect the lawyers' reactions to real flags."}, {"key": "D", "text": "Add a second pass with an independent instance that verifies each \"ambiguous wording\" flag before showing it and removes the ones it does not confirm."}], "correct_answer": "B", "technical_explanation": "The correct plan combines the trust recovery strategy (temporarily disabling the category with many false positives), better criteria (a concrete trigger and examples per severity level) and a re-enablement condition based on measured precision. It adds no calls, leaves no wrong flags visible and keeps the category in the long term.", "distractor_analysis": [{"key": "A", "type": "Conceptual distractor", "explanation": "It uses self-reported confidence as an automatic filter: it is poorly calibrated and no substitute for explicit criteria. In addition, the threshold has not been validated against labelled data."}, {"key": "B", "type": "Correct", "explanation": "Correct."}, {"key": "C", "type": "Confusion distractor", "explanation": "It improves the criteria correctly, but leaves the wrong flags visible during iteration. At 62% precision, the category keeps eroding trust in all three; keeping a problematic category active while iterating is a documented trap."}, {"key": "D", "type": "Plausible alternative", "explanation": "Independent verification is useful in other contexts (4.6), but it requires an extra call per contract, which the budget does not allow, and it does not fix the criteria at source."}], "reference": "4_1 System Prompts with Explicit Criteria (\"The False Positive Trust Problem\", \"Severity Calibration with Code Examples\", \"Exam Traps\")"}, {"id": "D4-Q07", "domain": "4", "domain_name": "Prompt Engineering & Structured Output", "subdomain_code": "4.1", "subdomain_name": "System Prompts with Explicit Criteria", "difficulty": "Difficult", "question_type": "Short", "reference_topic": "An actionable criterion for comments", "question": "The goal of a review category is to detect comments that are misleading about what the code does. Which system prompt criterion is most actionable for that goal?", "options": [{"key": "A", "text": "Flag a comment only when the behaviour it claims contradicts the code's actual behaviour; skip incomplete comments or ones with typos."}, {"key": "B", "text": "Flag every comment that does not follow the team's JSDoc template, with its @param and @returns tags."}, {"key": "C", "text": "Define a misleading comment in prose: \"one that could cause serious confusion during maintenance\"."}, {"key": "D", "text": "Flag comments that are inaccurate, ambiguous or could mislead whoever maintains the code, prioritising the ones the model is most confident about."}], "correct_answer": "A", "technical_explanation": "The documentation gives this trigger as an example of an explicit criterion: flag comments only when claimed behaviour contradicts actual behaviour. It states precisely what to flag, leaves everything else out and removes subjective interpretation.", "distractor_analysis": [{"key": "A", "type": "Correct", "explanation": "Correct."}, {"key": "B", "type": "Plausible alternative", "explanation": "It is an explicit, verifiable criterion, but it targets a local style pattern, exactly what the documentation recommends skipping; it does not detect comments that contradict behaviour."}, {"key": "C", "type": "Conceptual distractor", "explanation": "It confuses a description with a criterion: prose forces the model to interpret what \"serious confusion\" is, just like prose severity definitions."}, {"key": "D", "type": "Confusion distractor", "explanation": "It looks specific, but \"inaccurate\" and \"could mislead\" are subjective thresholds, and prioritising by the model's confidence introduces poorly calibrated confidence."}], "reference": "4_1 System Prompts with Explicit Criteria (\"Vague Instructions and Explicit Criteria\")"}, {"id": "D4-Q08", "domain": "4", "domain_name": "Prompt Engineering & Structured Output", "subdomain_code": "4.2", "subdomain_name": "Few-Shot Prompting", "difficulty": "Easy", "question_type": "Short", "reference_topic": "Number and content of examples", "question": "According to the exam guide, which practice is recommended when building few-shot examples?", "options": [{"key": "A", "text": "Include as many examples as the context window allows, because each extra example improves consistency proportionally."}, {"key": "B", "text": "Use 2 to 4 input-output pairs without reasoning, to avoid spending tokens on explanations."}, {"key": "C", "text": "Use a single, very complete example that shows every possible field and format."}, {"key": "D", "text": "Use 2 to 4 examples targeted at the ambiguous cases that cause problems, each with its reasoning."}], "correct_answer": "D", "technical_explanation": "The exam guide recommends 2–4 targeted examples that cover the problematic ambiguous cases, with reasoning on why one action was chosen over plausible alternatives. Current documentation suggests 3–5, but on the exam you answer according to the guide.", "distractor_analysis": [{"key": "A", "type": "Conceptual distractor", "explanation": "It misunderstands diminishing returns: going from 0 to 2 examples has the largest impact, and more than 4 wastes tokens without proportional benefit."}, {"key": "B", "type": "Confusion distractor", "explanation": "It gets the quantity right but removes the reasoning, which is what teaches the model to generalise its judgement to new patterns instead of just imitating the cases shown."}, {"key": "C", "type": "Plausible alternative", "explanation": "A detailed example can serve as a template in other contexts, but fewer than two examples do not establish a pattern."}, {"key": "D", "type": "Correct", "explanation": "Correct."}], "reference": "4_2 Few-Shot Prompting (\"How to Construct Effective Examples\", \"Exam Traps\"); Quick Reference Domain 4 (\"Few-Shot Examples\")"}, {"id": "D4-Q09", "domain": "4", "domain_name": "Prompt Engineering & Structured Output", "subdomain_code": "4.2", "subdomain_name": "Few-Shot Prompting", "difficulty": "Easy", "question_type": "Medium", "reference_topic": "Inconsistent formatting", "question": "A bookshop uses Claude to write its weekly new-releases newsletter. The prompt describes the format in great detail, but the structure changes between runs: sometimes a bulleted list, sometimes a table, sometimes prose. What should be tried first?", "options": [{"key": "A", "text": "Rewrite the format instructions even more precisely, listing every section and its order."}, {"key": "B", "text": "Add one complete example of the newsletter in the correct format, since one is enough to fix the structure."}, {"key": "C", "text": "Add two or three examples of the newsletter in the exact expected format."}, {"key": "D", "text": "Lower the temperature so that the model always produces the same structure."}], "correct_answer": "C", "technical_explanation": "When detailed instructions produce inconsistent formatting, few-shot examples showing the exact format are the most effective fix, ahead of more instructions, confidence thresholds or temperature adjustments.", "distractor_analysis": [{"key": "A", "type": "Plausible alternative", "explanation": "It is the usual reflex and the exam trap: instructions describe the format again, while examples show it. More instructions rarely fix inconsistency."}, {"key": "B", "type": "Confusion distractor", "explanation": "It goes in the right direction (showing the format), but fewer than two examples do not establish a pattern; the guide recommends 2–4."}, {"key": "C", "type": "Correct", "explanation": "Correct."}, {"key": "D", "type": "Conceptual distractor", "explanation": "It uses a sampling parameter for a format specification problem. Temperature does not appear in the exam guide and is used only as a wrong option; current models reject non-default values."}], "reference": "4_2 Few-Shot Prompting (\"When to Deploy Few-Shot Examples\", \"Exam Traps\"); Glossary Domain 4 (\"Temperature\")"}, {"id": "D4-Q10", "domain": "4", "domain_name": "Prompt Engineering & Structured Output", "subdomain_code": "4.2", "subdomain_name": "Few-Shot Prompting", "difficulty": "Intermediate", "question_type": "Short", "reference_topic": "Reasoning in examples", "question": "Why should each few-shot example include the reasoning behind the decision, in addition to the input and output?", "options": [{"key": "A", "text": "Because the reasoning teaches the model the general principle, so it can apply the same judgement to cases that do not appear in the examples."}, {"key": "B", "text": "Because that way the model learns the specific rules of the cases shown, for example that every query with an order number must go to lookup_order."}, {"key": "C", "text": "Because the reasoning lets the model compute a calibrated confidence score for each decision."}, {"key": "D", "text": "Because it forces the model to explain its decisions in the output, which makes each response easier to audit."}], "correct_answer": "A", "technical_explanation": "Without reasoning, the model only learns to imitate the cases shown. With reasoning, it learns why one action was chosen over plausible alternatives and generalises that judgement to new patterns.", "distractor_analysis": [{"key": "A", "type": "Correct", "explanation": "Correct."}, {"key": "B", "type": "Confusion distractor", "explanation": "This describes exactly what is learned without reasoning: surface pattern matching. With reasoning, the model learns the general principle (specific identifiers route to specific lookup tools)."}, {"key": "C", "type": "Conceptual distractor", "explanation": "It mixes up two different mechanisms: calibrating confidence requires labelled validation sets (4.6), not reasoning in examples."}, {"key": "D", "type": "Plausible alternative", "explanation": "Traceability may be desirable in other contexts, but it is not the documented reason: the reasoning in examples is there to generalise judgement, not to add explanations to the output."}], "reference": "4_2 Few-Shot Prompting (\"How to Construct Effective Examples\")"}, {"id": "D4-Q11", "domain": "4", "domain_name": "Prompt Engineering & Structured Output", "subdomain_code": "4.2", "subdomain_name": "Few-Shot Prompting", "difficulty": "Intermediate", "question_type": "Medium", "reference_topic": "Empty fields in narrative text", "question": "A pipeline extracts data from supplier invoices. When quantities appear in a table, they are extracted correctly; when they appear in a sentence (\"thirty crates of oranges at four euros a crate\"), the price field comes back empty. The instructions already list every field, the problem affects a third of the invoices, re-running the extraction returns the same empty fields, and documents must reach the model in their original form. What should be tried first?", "options": [{"key": "A", "text": "Add the instruction \"also look for prices in the narrative text, not only in tables, including quantities written out in words\" to the prompt."}, {"key": "B", "text": "Mark the price field as required in the schema so the model cannot leave it empty."}, {"key": "C", "text": "Add a retry with error feedback for every invoice that arrives with an empty price."}, {"key": "D", "text": "Add few-shot examples of correct extraction from both tables and narrative text, with the reasoning for how each value was located."}], "correct_answer": "D", "technical_explanation": "One of the three documented triggers for few-shot is extraction returning empty fields for information the document does contain, but in an unexpected format (narrative text instead of a table). Examples showing extraction from varied structures solve the problem and also reduce fabrication.", "distractor_analysis": [{"key": "A", "type": "Confusion distractor", "explanation": "It identifies the cause correctly but responds with more instructions instead of examples. According to the documentation, showing extraction across varied structures is what fixes this case."}, {"key": "B", "type": "Conceptual distractor", "explanation": "It uses a schema mechanism in the wrong direction: required fields push the model to fabricate values when it cannot find them, instead of teaching it to locate them."}, {"key": "C", "type": "Plausible alternative", "explanation": "Retry with a specific error works for misplaced values, but here it would be a per-document patch on a third of the volume and does not fix the cause: the model does not know how to extract from narrative text."}, {"key": "D", "type": "Correct", "explanation": "Correct."}], "reference": "4_2 Few-Shot Prompting (\"When to Deploy Few-Shot Examples\", \"The Hallucination Reduction Effect\")"}, {"id": "D4-Q12", "domain": "4", "domain_name": "Prompt Engineering & Structured Output", "subdomain_code": "4.2", "subdomain_name": "Few-Shot Prompting", "difficulty": "Intermediate", "question_type": "Long", "reference_topic": "Tool selection in ambiguous cases", "question": "A support agent has two tools: get_customer (customer account data) and lookup_order (status of a specific order). The team has already rewritten both descriptions to differentiate them clearly, and several engineers reviewed them. Even so, queries such as \"where is the thing I bought?\" or \"check my order 48213\" are routed inconsistently: the same query goes to one tool or the other depending on how it is worded. What is the most effective next step?", "options": [{"key": "A", "text": "Rewrite the tool descriptions again in more detail, with usage examples in each."}, {"key": "B", "text": "Add 2 to 4 examples with the ambiguous queries and the correct tool for each, without explanation, so the model memorises the routing."}, {"key": "C", "text": "Add 2 to 4 examples of ambiguous queries, with and without an order number, that state the selected tool and explain why it is preferred over the other."}, {"key": "D", "text": "Ask the model to ask the user which tool to use whenever its confidence in the choice is below 0.7."}], "correct_answer": "C", "technical_explanation": "For wrong tool selection, the documented order is to improve the descriptions first and then add few-shot examples. Since the descriptions are already optimised, the remaining problem (inconsistent judgement on ambiguous cases) needs examples with reasoning that teach the principle: a specific identifier routes to the specific lookup tool.", "distractor_analysis": [{"key": "A", "type": "Plausible alternative", "explanation": "Improving descriptions is the first step for wrong tool selection, but it has already been done; the remaining problem is inconsistent judgement on ambiguous cases, which few-shot solves."}, {"key": "B", "type": "Confusion distractor", "explanation": "It covers the right cases, but without reasoning the model learns surface matches and does not generalise to new wordings of the same query."}, {"key": "C", "type": "Correct", "explanation": "Correct."}, {"key": "D", "type": "Conceptual distractor", "explanation": "It applies a confidence threshold to a judgement problem: confidence is poorly calibrated and does not address the root cause, whereas examples showing the correct decision teach the criterion directly."}], "reference": "4_2 Few-Shot Prompting (\"When to Deploy Few-Shot Examples\", \"How to Construct Effective Examples\", table in \"In the exam\")"}, {"id": "D4-Q13", "domain": "4", "domain_name": "Prompt Engineering & Structured Output", "subdomain_code": "4.2", "subdomain_name": "Few-Shot Prompting", "difficulty": "Difficult", "question_type": "Long", "reference_topic": "Few-shot for severity and false positives", "question": "A code reviewer already has explicit criteria in its system prompt. However, it classifies variable shadowing as \"critical\" in some files and \"minor\" in others, and it produces many false positives on harmless cases, such as an inner variable in an arrow function that shadows an outer one without changing the result. At the same time, the team does not want to stop detecting shadowing that does cause bugs, such as shadowing that makes a function return the wrong variable. Which change best solves both problems?", "options": [{"key": "A", "text": "Keep the prompt and add a pass with an independent instance that reviews only the shadowing findings before publishing them."}, {"key": "B", "text": "Add a dozen examples covering every shadowing variant in every language in the repository."}, {"key": "C", "text": "Add a few shadowing examples at different severity levels (the harmless limited-scope case as minor, the one that changes the returned value as a bug), with the reasoning for each."}, {"key": "D", "text": "Add several examples of harmless shadowing in limited scopes, classified as \"minor\" with their reasoning, so the model stops flagging them as critical in any file in the repository."}], "correct_answer": "C", "technical_explanation": "The documentation proposes exactly this use: classifying shadowing cases at different severity levels, with reasoning. Examples that separate acceptable patterns from real issues reduce false positives without losing genuine cases, and the model can generalise to shadowing that really is a problem.", "distractor_analysis": [{"key": "A", "type": "Plausible alternative", "explanation": "Independent review helps catch subtle errors, but it adds cost to every review and does not fix the cause: the model has no consistent criterion for classifying this pattern."}, {"key": "B", "type": "Conceptual distractor", "explanation": "It misapplies the technique: more than 4 examples waste tokens without proportional benefit; what teaches generalisation is the reasoning in a few targeted examples."}, {"key": "C", "type": "Correct", "explanation": "Correct."}, {"key": "D", "type": "Confusion distractor", "explanation": "It reduces false positives, but shows only one side of the boundary: without an example of shadowing that really is a bug, the model tends to downgrade the real cases too."}], "reference": "4_2 Few-Shot Prompting (\"How to Construct Effective Examples\", \"Few-Shot for Reducing False Positives\")"}, {"id": "D4-Q14", "domain": "4", "domain_name": "Prompt Engineering & Structured Output", "subdomain_code": "4.2", "subdomain_name": "Few-Shot Prompting", "difficulty": "Difficult", "question_type": "Medium", "reference_topic": "Matching the technique to the problem", "question": "An extraction pipeline has three problems: (1) it misses data that appears in narrative paragraphs; (2) it invents order numbers for documents that have none; (3) the extracted line items do not sum to the stated total. Which technique matches each problem?", "options": [{"key": "A", "text": "(1) few-shot examples of extraction from narrative text; (2) optional/nullable schema fields; (3) a validation-retry loop."}, {"key": "B", "text": "(1) few-shot examples of extraction from narrative text; (2) optional/nullable schema fields; (3) additional few-shot examples with line items that sum correctly."}, {"key": "C", "text": "Few-shot examples for all three problems, since they also reduce hallucination in extraction tasks."}, {"key": "D", "text": "tool_use with a strict JSON schema for all three, since the schema guarantees the values are correct."}], "correct_answer": "A", "technical_explanation": "The documentation's table maps each problem to its technique: information missed in narrative text → few-shot with narrative extraction; fabricated values for missing fields → optional/nullable fields; extraction sum does not match total → validation-retry loop.", "distractor_analysis": [{"key": "A", "type": "Correct", "explanation": "Correct."}, {"key": "B", "type": "Confusion distractor", "explanation": "It gets two out of three right, but the sum discrepancy is a semantic error: it is detected by validation and fixed with retry-with-error-feedback. Examples do not guarantee the arithmetic check."}, {"key": "C", "type": "Plausible alternative", "explanation": "Examples do reduce hallucination across varied structures, but fabrication of absent values is addressed in the schema (nullable fields), and sums require validation."}, {"key": "D", "type": "Conceptual distractor", "explanation": "It misunderstands what a schema does: it guarantees structure and eliminates syntax errors, not semantic ones (sums, fabrication, missed data)."}], "reference": "4_2 Few-Shot Prompting (\"Problem / Correct Technique\" table in \"In the exam\"); 4_3 Structured Output with Tool Use (\"Schema Design for Production\"); 4_4 Validation, Retry, and Feedback Loops (\"Retry-with-Error-Feedback\")"}, {"id": "D4-Q15", "domain": "4", "domain_name": "Prompt Engineering & Structured Output", "subdomain_code": "4.2", "subdomain_name": "Few-Shot Prompting", "difficulty": "Difficult", "question_type": "Long", "reference_topic": "When few-shot is not the right technique", "question": "An accounting pipeline asks Claude to return JSON in a text response (\"respond only with a JSON object containing these fields\"). The field format is consistent between runs, but around 2% of responses cannot be parsed: trailing commas, unclosed brackets or unquoted keys. Every invalid response halts the import into the ledger. The tech lead proposes adding four few-shot examples of perfect JSON, arguing that few-shot is the most effective technique for consistent, well-formatted output. What is the best response?", "options": [{"key": "A", "text": "Move to tool_use with a JSON schema and force the tool call, because the schema eliminates the syntax errors that prompt-based JSON cannot prevent."}, {"key": "B", "text": "Accept the proposal: add the four valid JSON examples, each with reasoning about its structure, since the problem is one of format and few-shot is the first choice."}, {"key": "C", "text": "Set the temperature to 0 so the JSON syntax is deterministic."}, {"key": "D", "text": "Keep prompt-based JSON and add a retry that, when parsing fails, resends the response and asks for the syntax to be fixed."}], "correct_answer": "A", "technical_explanation": "The few-shot documentation warns that some problems need another technique: malformed JSON is solved with tool_use and JSON schemas. In the reliability hierarchy, tool_use with a schema comes first and prompt-based JSON second, because the latter is plain text with no structural guarantees.", "distractor_analysis": [{"key": "A", "type": "Correct", "explanation": "Correct."}, {"key": "B", "type": "Confusion distractor", "explanation": "It is convincing because few-shot is the first choice for inconsistent formatting. But here the format is already consistent: the problem is malformed syntax, and prompt-based JSON has no structural guarantees, so it will keep failing periodically."}, {"key": "C", "type": "Conceptual distractor", "explanation": "It uses a sampling parameter for a structural problem: determinism does not guarantee valid JSON. In this domain, temperature appears only as a wrong option."}, {"key": "D", "type": "Plausible alternative", "explanation": "It is reasonable as a safety net, but it does not eliminate the failure at source and adds calls and latency; the documented hierarchy places tool_use with a schema above prompt-based JSON."}], "reference": "4_2 Few-Shot Prompting (table in \"In the exam\"); 4_3 Structured Output with Tool Use (\"What You Need to Know\": two-tier hierarchy)"}, {"id": "D4-Q16", "domain": "4", "domain_name": "Prompt Engineering & Structured Output", "subdomain_code": "4.3", "subdomain_name": "Structured Output with Tool Use", "difficulty": "Easy", "question_type": "Short", "reference_topic": "tool_choice with an unknown document type", "question": "A system has three extraction tools (extract_invoice, extract_receipt and extract_contract) and receives documents of unknown type. It needs guaranteed structured output. Which tool_choice setting does the exam guide indicate?", "options": [{"key": "A", "text": "{\"type\": \"tool\", \"name\": \"extract_invoice\"}"}, {"key": "B", "text": "{\"type\": \"any\"}"}, {"key": "C", "text": "Pass no tools and instruct the prompt to return JSON according to the detected document type."}, {"key": "D", "text": "{\"type\": \"auto\"}"}], "correct_answer": "B", "technical_explanation": "With \"any\", the model must call a tool but chooses which one, so the output is guaranteed to be structured and the choice of schema stays flexible. Some current models reject \"any\", but on the exam you answer with the guide's three modes.", "distractor_analysis": [{"key": "A", "type": "Conceptual distractor", "explanation": "Forcing a specific tool is useful for a mandatory step, but here it would force the invoice schema onto receipts and contracts as well."}, {"key": "B", "type": "Correct", "explanation": "Correct."}, {"key": "C", "type": "Plausible alternative", "explanation": "It can work for prototypes, but prompt-based JSON offers no structural guarantees."}, {"key": "D", "type": "Confusion distractor", "explanation": "It is the default mode and the model usually calls a tool, but it may reply with text instead, so it does not guarantee structured output."}], "reference": "4_3 Structured Output with Tool Use (\"tool_choice: The Three Modes\", \"Current State\"); Quick Reference Domain 4 (\"Structured Output — tool_use vs Text\")"}, {"id": "D4-Q17", "domain": "4", "domain_name": "Prompt Engineering & Structured Output", "subdomain_code": "4.3", "subdomain_name": "Structured Output with Tool Use", "difficulty": "Easy", "question_type": "Short", "reference_topic": "What tool_use does not prevent", "question": "A team migrates from prompt-based JSON to tool_use with a JSON schema. Which statement correctly describes what it gains?", "options": [{"key": "A", "text": "It guarantees that the model calls the tool on every request, whatever the value of tool_choice."}, {"key": "B", "text": "It eliminates syntax errors and semantic errors too, provided every field is precisely typed and marked as required in the required array."}, {"key": "C", "text": "It eliminates syntax errors but not semantic ones, such as line items that do not sum to the total or invented values; semantic validation is still needed."}, {"key": "D", "text": "It eliminates syntax errors, and adding a detailed description to each property makes later semantic validation unnecessary."}], "correct_answer": "C", "technical_explanation": "tool_use with a JSON schema eliminates syntax errors (unclosed brackets, trailing commas, unquoted keys), but it does not prevent semantic errors: sum discrepancies, values in the wrong field or fabrication. The schema guarantees structure, not correctness.", "distractor_analysis": [{"key": "A", "type": "Conceptual distractor", "explanation": "It confuses the schema with tool_choice: the schema constrains the shape of the arguments, and it is tool_choice that forces (or does not force) the tool call; with \"auto\" the model may reply with text."}, {"key": "B", "type": "Confusion distractor", "explanation": "Making everything required does not provide semantic correctness; on the contrary, it pushes the model to fabricate values when the document does not contain them."}, {"key": "C", "type": "Correct", "explanation": "Correct."}, {"key": "D", "type": "Plausible alternative", "explanation": "Property descriptions are good practice that guides extraction, but they do not prevent wrong sums or misplaced values; semantic validation is still required."}], "reference": "4_3 Structured Output with Tool Use (\"What tool_use Does NOT Prevent\", \"Exam Traps\"); Quick Reference Domain 4"}, {"id": "D4-Q18", "domain": "4", "domain_name": "Prompt Engineering & Structured Output", "subdomain_code": "4.3", "subdomain_name": "Structured Output with Tool Use", "difficulty": "Easy", "question_type": "Medium", "reference_topic": "Nullable fields against fabrication", "question": "Many of the receipts an accounting firm processes have no purchase order number. In the extraction tool's schema, purchase_order is of type \"string\" and is listed in the required array, and the model invents plausible-looking order numbers for those receipts. Which schema change addresses the problem at source?", "options": [{"key": "A", "text": "Go back to prompt-based JSON so the schema does not force the model to fill in the field."}, {"key": "B", "text": "Define purchase_order as {\"type\": [\"string\", \"null\"]} and remove it from the object's required array."}, {"key": "C", "text": "Add \"nullable\": true to the purchase_order property and keep it in the required array."}, {"key": "D", "text": "Keep the schema and add a later validation step that compares each order number with the original document and logs mismatches."}], "correct_answer": "B", "technical_explanation": "Optional/nullable fields are the primary defence against fabrication. A required field pushes the model to produce a value even when the source has none; a union type with null, left out of the required array, lets it honestly return null. In JSON Schema, required is an array on the parent object, not a per-property boolean.", "distractor_analysis": [{"key": "A", "type": "Conceptual distractor", "explanation": "It gives up tool_use's structural guarantees without solving anything: the problem is not using a schema, but how it is designed."}, {"key": "B", "type": "Correct", "explanation": "Correct."}, {"key": "C", "type": "Confusion distractor", "explanation": "It looks right, but nullable: true is OpenAPI syntax, not JSON Schema, and an input_schema written that way is rejected; also, keeping the field in required still pushes the model to produce a value."}, {"key": "D", "type": "Plausible alternative", "explanation": "Later validation may catch some cases, but it comes after the fabrication; the cause (a required field for data that may be missing) remains."}], "reference": "4_3 Structured Output with Tool Use (\"Schema Design for Production\"); Quick Reference Domain 4 (\"Schema Design for Structured Output\")"}, {"id": "D4-Q19", "domain": "4", "domain_name": "Prompt Engineering & Structured Output", "subdomain_code": "4.3", "subdomain_name": "Structured Output with Tool Use", "difficulty": "Intermediate", "question_type": "Medium", "reference_topic": "Enum with unclear and other", "question": "A tool classifies accounting documents with the enum [\"invoice\", \"receipt\", \"contract\"]. Two cases cause problems: torn scans that could be either a receipt or an invoice, and legitimate documents of unforeseen types, such as bank statements, which the business wants to be able to identify later. Which schema design is most appropriate?", "options": [{"key": "A", "text": "Add \"unclear\" and \"other\" to the enum, together with a category_detail field of type [\"string\", \"null\"] that describes the type when the category is \"other\"."}, {"key": "B", "text": "Keep the three categories and make the field nullable, so the model returns null when it cannot classify."}, {"key": "C", "text": "Replace the enum with a free-text field so the model can describe any type of document."}, {"key": "D", "text": "Add only \"other\" to the enum, with a category_detail field, and use it both for doubtful scans and for document types the business did not foresee."}], "correct_answer": "A", "technical_explanation": "The \"unclear\" value lets the model answer honestly when a source is genuinely ambiguous, instead of forcing a classification. The \"other\" + detail string pair makes classification extensible and captures unforeseen cases. They are two different patterns for two different problems.", "distractor_analysis": [{"key": "A", "type": "Correct", "explanation": "Correct."}, {"key": "B", "type": "Plausible alternative", "explanation": "Nullable fields prevent fabrication, but null does not distinguish an ambiguous scan from a bank statement and discards the detail the business wants to keep."}, {"key": "C", "type": "Conceptual distractor", "explanation": "It loses the enum's constraint; the documentation recommends enums for constrained choices precisely to prevent freeform, inconsistent values."}, {"key": "D", "type": "Confusion distractor", "explanation": "It closely resembles the correct design, but it merges two different situations: an ambiguous document is not a new category. If both go to \"other\", the signal that the document is genuinely doubtful is lost."}], "reference": "4_3 Structured Output with Tool Use (\"Schema Design for Production\"); Quick Reference Domain 4 (\"Use enum for constrained choices\")"}, {"id": "D4-Q20", "domain": "4", "domain_name": "Prompt Engineering & Structured Output", "subdomain_code": "4.3", "subdomain_name": "Structured Output with Tool Use", "difficulty": "Intermediate", "question_type": "Short", "reference_topic": "tool_choice applies per request", "question": "A flow forces tool_choice {\"type\": \"tool\", \"name\": \"extract_metadata\"} on the first request. From then on, the model calls extract_metadata again on every turn and the flow never moves forward. What is the right fix?", "options": [{"key": "A", "text": "Switch to tool_choice \"any\" from the second request onwards, so the model can choose other tools."}, {"key": "B", "text": "Start a new conversation after the first call, because tool_choice is fixed for the whole conversation."}, {"key": "C", "text": "Check that the code returns the extract_metadata tool_result in the next request, because the model repeats the call until it receives its result."}, {"key": "D", "text": "Send the following requests with \"auto\" or omit the parameter, because tool_choice applies per request and the code keeps resending it."}], "correct_answer": "D", "technical_explanation": "tool_choice applies per request. After the forced call returns, the next request must be sent with \"auto\" or without the parameter; if the forced mode is resent, the model has to call the same tool again and you are in a loop.", "distractor_analysis": [{"key": "A", "type": "Confusion distractor", "explanation": "It removes the rigidity of the forced tool, but \"any\" still forces some tool call on every request, so the model can never reply with text to close the flow."}, {"key": "B", "type": "Conceptual distractor", "explanation": "It misunderstands the parameter's scope: tool_choice applies per request, not per conversation."}, {"key": "C", "type": "Plausible alternative", "explanation": "Returning tool_result blocks is necessary in any tool loop, but it does not explain this symptom: as long as the request forces the tool, the model has to call it again."}, {"key": "D", "type": "Correct", "explanation": "Correct."}], "reference": "4_3 Structured Output with Tool Use (\"tool_choice: The Three Modes\")"}, {"id": "D4-Q21", "domain": "4", "domain_name": "Prompt Engineering & Structured Output", "subdomain_code": "4.3", "subdomain_name": "Structured Output with Tool Use", "difficulty": "Difficult", "question_type": "Long", "reference_topic": "Designing tool_choice per step", "question": "A document enrichment pipeline has these requirements: (1) the first step must always extract metadata with extract_metadata, without exception; (2) afterwards, the model must decide, based on the content, which enrichment tools to use (lookup_vendor, classify_expense or neither); (3) the flow ends when the model replies with a text summary. Which tool_choice configuration meets all three requirements?", "options": [{"key": "A", "text": "The first request with \"any\" and all tools available, plus a prompt instruction to start with extract_metadata; the following ones with \"auto\"."}, {"key": "B", "text": "Force every request with {\"type\": \"tool\", \"name\": ...} and let the code decide which tool applies at each step."}, {"key": "C", "text": "\"auto\" on every request, with a system prompt that orders the model to always call extract_metadata first."}, {"key": "D", "text": "The first request with {\"type\": \"tool\", \"name\": \"extract_metadata\"} and the following ones with \"auto\"."}], "correct_answer": "D", "technical_explanation": "Forcing a specific tool ensures a mandatory first step. Because tool_choice applies per request, the following requests are sent with \"auto\": the model keeps the freedom to choose the enrichment (or none) and can finish with text.", "distractor_analysis": [{"key": "A", "type": "Confusion distractor", "explanation": "It guarantees a tool call in the first step, but \"any\" lets the model choose which one: it may start with a different tool and skip the mandatory step. The prompt instruction does not guarantee it."}, {"key": "B", "type": "Plausible alternative", "explanation": "It gives maximum control and would suit a fixed sequence, but it takes the enrichment decision away from the model (requirement 2) and prevents the final text reply (requirement 3)."}, {"key": "C", "type": "Conceptual distractor", "explanation": "It uses \"auto\" where a guarantee is needed: with \"auto\" the model may reply with text or call another tool, so the mandatory step is not ensured."}, {"key": "D", "type": "Correct", "explanation": "Correct."}], "reference": "4_3 Structured Output with Tool Use (\"tool_choice: The Three Modes\")"}, {"id": "D4-Q22", "domain": "4", "domain_name": "Prompt Engineering & Structured Output", "subdomain_code": "4.3", "subdomain_name": "Structured Output with Tool Use", "difficulty": "Difficult", "question_type": "Long", "reference_topic": "Semantic errors with a valid schema", "question": "An accounting firm migrated its invoice extraction to tool_use with a strict schema in which every field is required. Since then, the import into the accounting software has not failed once. However, an audit finds three kinds of error in the entries: invoices whose line items do not sum to the stated total, due dates placed in the reference field (both are strings), and plausible-looking delivery dates on invoices that stated none. The director claims the schema guarantees correctness, so the model must be at fault. Which technical response is correct?", "options": [{"key": "A", "text": "Go back to prompt-based JSON with self-checking instructions for the sums, since the schema prevents the model from reasoning about the totals."}, {"key": "B", "text": "Add more detailed descriptions to each schema property and format normalisation rules to the prompt."}, {"key": "C", "text": "The schema guarantees structure, not correctness: make the fields that may be missing nullable and add semantic validation (sums, field placement) with retries that include the specific error."}, {"key": "D", "text": "Keep every field required, tighten the types (number for amounts, a date format for dates) and rely on strict: true for the API to reject incorrect values before the import."}], "correct_answer": "C", "technical_explanation": "All three errors (sum discrepancies, field placement errors and fabrication) pass the schema because it guarantees structure, not correctness. Fabrication is addressed with optional/nullable fields, and semantic errors require additional validation logic (Task Statement 4.4).", "distractor_analysis": [{"key": "A", "type": "Conceptual distractor", "explanation": "It misunderstands the schema's role: it does not prevent reasoning, it only constrains shape. Returning to prompt-based JSON would reintroduce syntax errors without fixing the semantic ones."}, {"key": "B", "type": "Plausible alternative", "explanation": "These are good practices that guide extraction, but they do not detect sum discrepancies or remove the pressure from required fields to invent values."}, {"key": "C", "type": "Correct", "explanation": "Correct."}, {"key": "D", "type": "Confusion distractor", "explanation": "Tighter types may reduce some placement errors, but they do not catch wrong sums, and keeping fields required perpetuates the fabricated dates. A schema cannot express that two numbers must agree."}], "reference": "4_3 Structured Output with Tool Use (\"What tool_use Does NOT Prevent\", \"Schema Design for Production\"); 4_4 Validation, Retry, and Feedback Loops (\"Schema Syntax Errors vs Semantic Validation Errors\")"}, {"id": "D4-Q23", "domain": "4", "domain_name": "Prompt Engineering & Structured Output", "subdomain_code": "4.3", "subdomain_name": "Structured Output with Tool Use", "difficulty": "Difficult", "question_type": "Medium", "reference_topic": "Format normalisation", "question": "An extraction tool defines dates and amounts as strings. Invoices come from several countries, with dates such as \"05/11/2026\", \"5 Nov 2026\" or \"2026-11-05\" and amounts such as \"1.250,00 €\" or \"€1,250.00\". Only each invoice's context reveals whether \"05/11\" means 5 November or 11 May. How do you get a consistent format in the output?", "options": [{"key": "A", "text": "Put normalisation rules in the prompt alongside the schema: \"dates in ISO 8601\" and \"amounts as decimals without currency symbols\"."}, {"key": "B", "text": "Make the date fields nullable so the model returns null when a date is not in ISO 8601."}, {"key": "C", "text": "Normalise in code after extraction, with a parser that converts every known date and amount format."}, {"key": "D", "text": "Set strict: true on the tool definition, since with a strict schema every date or amount string is always emitted in a single format."}], "correct_answer": "A", "technical_explanation": "The schema enforces structure; the prompt enforces formatting consistency. The documentation recommends putting normalisation rules (ISO 8601, decimal amounts without symbols) in the prompt alongside the schema, so the model normalises using the document's context.", "distractor_analysis": [{"key": "A", "type": "Correct", "explanation": "Correct."}, {"key": "B", "type": "Conceptual distractor", "explanation": "It uses nullable fields for something they are not meant for: they are for absent data, not different formats, and dates the document does contain would be lost."}, {"key": "C", "type": "Plausible alternative", "explanation": "It is common in other contexts, but a later parser cannot resolve ambiguous dates such as \"05/11\" without the document's context, which the model does see during extraction."}, {"key": "D", "type": "Confusion distractor", "explanation": "strict: true guarantees that the input conforms to the schema, but a valid string can have any format; the prompt is what enforces content consistency."}], "reference": "4_3 Structured Output with Tool Use (\"Schema Design for Production\": \"Format normalisation rules\")"}, {"id": "D4-Q24", "domain": "4", "domain_name": "Prompt Engineering & Structured Output", "subdomain_code": "4.4", "subdomain_name": "Validation, Retry, and Feedback Loops", "difficulty": "Easy", "question_type": "Short", "reference_topic": "Elements of retry-with-error-feedback", "question": "An extraction fails validation. What must the retry request include?", "options": [{"key": "A", "text": "The original document and the specific validation error, but not the failed extraction, to avoid anchoring the model to it."}, {"key": "B", "text": "The failed extraction, a generic message such as \"validation failed, please try again\" and a higher max_tokens."}, {"key": "C", "text": "The same original request, since extraction is non-deterministic and another attempt usually gives a different result."}, {"key": "D", "text": "The original document, the failed extraction and the specific validation error."}], "correct_answer": "D", "technical_explanation": "The correct pattern sends three pieces of information: the original document (to re-examine the source), the failed extraction (to see what it produced) and the specific validation error (to know exactly what went wrong). It works far better than a naive retry.", "distractor_analysis": [{"key": "A", "type": "Confusion distractor", "explanation": "It sounds reasonable, but the model needs to see what it produced in order to correct it in a targeted way; the documentation includes all three elements."}, {"key": "B", "type": "Conceptual distractor", "explanation": "It mixes valid elements with a generic message; without the specific error (for example, \"line items sum to £450 but the stated total is £500\"), the model does not know what to fix."}, {"key": "C", "type": "Plausible alternative", "explanation": "This is a naive retry: without the specific error, the model has no guidance and usually repeats the same mistake."}, {"key": "D", "type": "Correct", "explanation": "Correct."}], "reference": "4_4 Validation, Retry, and Feedback Loops (\"Retry-with-Error-Feedback\")"}, {"id": "D4-Q25", "domain": "4", "domain_name": "Prompt Engineering & Structured Output", "subdomain_code": "4.4", "subdomain_name": "Validation, Retry, and Feedback Loops", "difficulty": "Easy", "question_type": "Medium", "reference_topic": "The retry effectiveness boundary", "question": "A pipeline validates two documents. In document A, the model extracted a date as \"next Tuesday\", although the contract gives the exact date in another clause. In document B, a field requires an exchange rate from a bank circular that was not provided to the model. Review staff are scarce and should only receive cases the model cannot fix on its own. Which strategy is correct?", "options": [{"key": "A", "text": "Retry both with their specific error and, for B, tell the model to infer the exchange rate from the document's content."}, {"key": "B", "text": "Retry A with the specific validation error and send B to human review, or return null if the schema allows it."}, {"key": "C", "text": "Retry both with the same request, since extraction is non-deterministic."}, {"key": "D", "text": "Send both to human review to guarantee accuracy."}], "correct_answer": "B", "technical_explanation": "Retries are effective for format mismatches, structural errors, misplaced values and mathematical errors, because the data is in the source. They do not work when information is absent, exists only in an external document that was not provided, or requires knowledge the model does not have; those cases go to human review or return null.", "distractor_analysis": [{"key": "A", "type": "Confusion distractor", "explanation": "It handles A correctly, but B depends on an external document the model does not have; no retry will produce that value, and asking it to infer one invites fabrication."}, {"key": "B", "type": "Correct", "explanation": "Correct."}, {"key": "C", "type": "Conceptual distractor", "explanation": "It is a naive retry: without the specific error, A's failure will probably repeat, and B cannot be fixed at all."}, {"key": "D", "type": "Plausible alternative", "explanation": "It is safe, but it spends review time on A, which is fixable: the data is in the document and the error is one of format."}], "reference": "4_4 Validation, Retry, and Feedback Loops (\"The Retry Effectiveness Boundary\")"}, {"id": "D4-Q26", "domain": "4", "domain_name": "Prompt Engineering & Structured Output", "subdomain_code": "4.4", "subdomain_name": "Validation, Retry, and Feedback Loops", "difficulty": "Intermediate", "question_type": "Medium", "reference_topic": "Contradictory information in the source", "question": "A contract states \"payment within 30 days\" in one clause and \"payment terms: net 60\" in an annex. The pipeline must record the payment terms. How should the extraction handle this situation?", "options": [{"key": "A", "text": "Extract both values, set conflict_detected: true and route the case to review."}, {"key": "B", "text": "Retry with the error \"two payment terms were found; choose the correct one\" so the model resolves the contradiction."}, {"key": "C", "text": "Add a rule to the prompt: in case of conflict, use the value from the most specific or most recent clause."}, {"key": "D", "text": "Make the payment_terms field nullable so the model returns null when it finds contradictory values."}], "correct_answer": "A", "technical_explanation": "conflict_detected booleans flag contradictory information in the source. The model should extract both values and flag the conflict rather than silently picking one; the case goes to review, because neither a retry nor an arbitrary choice resolves it.", "distractor_analysis": [{"key": "A", "type": "Correct", "explanation": "Correct."}, {"key": "B", "type": "Confusion distractor", "explanation": "It uses retry-with-specific-error correctly, but in the wrong case: the discrepancy is in the source itself, and a retry cannot resolve it."}, {"key": "C", "type": "Plausible alternative", "explanation": "A precedence rule may make sense if the business has defined one, but applying it silently means picking a value without evidence of which is correct, and it hides the conflict."}, {"key": "D", "type": "Conceptual distractor", "explanation": "It uses nullable fields outside their purpose: they are for absent information, not contradictory information; both values and the conflict signal would be lost."}], "reference": "4_4 Validation, Retry, and Feedback Loops (\"Self-Correction Flow Design\", \"Exam Traps\")"}, {"id": "D4-Q27", "domain": "4", "domain_name": "Prompt Engineering & Structured Output", "subdomain_code": "4.4", "subdomain_name": "Validation, Retry, and Feedback Loops", "difficulty": "Intermediate", "question_type": "Short", "reference_topic": "calculated_total vs stated_total", "question": "What does including calculated_total and stated_total as separate fields in an invoice extraction schema provide?", "options": [{"key": "A", "text": "It makes the schema require the line items to sum to the total, so the API automatically rejects extractions whose amounts do not add up."}, {"key": "B", "text": "It lets the model automatically adjust stated_total to the calculated value, so the record always reaches the accounting system consistent."}, {"key": "C", "text": "It makes it possible to detect missed line items, but only if a second instance then recalculates the sum independently."}, {"key": "D", "text": "A discrepancy flag without external logic: if the model's sum of the line items differs from the document's total, the case is flagged."}], "correct_answer": "D", "technical_explanation": "Self-correction built into the schema extracts both the model's calculated sum of the line items and the document's stated total. When they differ, you get a discrepancy flag (total_discrepancy) without external logic, which can feed a retry or a review.", "distractor_analysis": [{"key": "A", "type": "Conceptual distractor", "explanation": "It attributes to the schema a capability it does not have: a JSON schema cannot express that two numbers must agree; that requires semantic validation."}, {"key": "B", "type": "Confusion distractor", "explanation": "It uses the right fields but reverses their purpose: altering the document's total hides the discrepancy instead of flagging it."}, {"key": "C", "type": "Plausible alternative", "explanation": "Independent review is useful in other scenarios, but it is not needed here: the schema itself produces the signal by comparing the two totals."}, {"key": "D", "type": "Correct", "explanation": "Correct."}], "reference": "4_4 Validation, Retry, and Feedback Loops (\"Self-Correction Flow Design\")"}, {"id": "D4-Q28", "domain": "4", "domain_name": "Prompt Engineering & Structured Output", "subdomain_code": "4.4", "subdomain_name": "Validation, Retry, and Feedback Loops", "difficulty": "Intermediate", "question_type": "Long", "reference_topic": "detected_pattern and systematic improvement", "question": "In a code review pipeline, developers dismiss about 30% of findings. The platform team wants a systematic process to know which parts of the prompt to refine, and in what order, without losing the categories that work. Today each finding includes a description, severity, file and line. Which change makes that process possible?", "options": [{"key": "A", "text": "Add a detected_pattern field to each finding with the construct that triggered it, log dismissals and prioritise the most-dismissed patterns."}, {"key": "B", "text": "Temporarily disable the categories with the most dismissals until their criteria are rewritten."}, {"key": "C", "text": "Add a confidence score to each finding and automatically hide any below 0.6."}, {"key": "D", "text": "Log the dismissal rate by file and by developer, and refine the prompt prioritising the files and teams with the most dismissals accumulated over the last month."}], "correct_answer": "A", "technical_explanation": "detected_pattern fields record which specific construct triggered each finding. If developers consistently dismiss a pattern (for example, \"variable shadowing in nested scope\"), the prompt needs refining for that pattern. This creates an improvement loop: extract, validate, collect dismissals, refine and repeat.", "distractor_analysis": [{"key": "A", "type": "Correct", "explanation": "Correct."}, {"key": "B", "type": "Plausible alternative", "explanation": "It is the right strategy for restoring trust in categories with many false positives, but it acts on whole categories and does not provide the per-pattern analysis the team is asking for."}, {"key": "C", "type": "Conceptual distractor", "explanation": "It misapplies confidence: uncalibrated, it is unreliable for automated decisions, and hiding findings does not identify which instructions to refine."}, {"key": "D", "type": "Confusion distractor", "explanation": "It collects dismissal data, which is right, but at the wrong granularity: the file or developer does not reveal which construct triggers the dismissed findings, so it does not say which part of the prompt to refine."}], "reference": "4_4 Validation, Retry, and Feedback Loops (\"detected_pattern Fields\")"}, {"id": "D4-Q29", "domain": "4", "domain_name": "Prompt Engineering & Structured Output", "subdomain_code": "4.4", "subdomain_name": "Validation, Retry, and Feedback Loops", "difficulty": "Difficult", "question_type": "Long", "reference_topic": "Pydantic as the validation layer", "question": "A Python pipeline extracts invoices with tool_use and strict: true on the tool definition. An engineer proposes removing the Pydantic models because \"the API already guarantees the schema\". The business requires two rules: line items must sum to the stated total, and the due date cannot be earlier than the issue date. When a rule fails, the pipeline must attempt automatic correction before involving a person. Which design is correct?", "options": [{"key": "A", "text": "Remove Pydantic and express both rules in the JSON schema itself using constraints such as minimum, maximum and date formats, which strict: true will enforce on the server before returning the tool call."}, {"key": "B", "text": "Keep Pydantic validators for both rules; when they fail, turn ValidationError's per-field errors into a retry with the document, the extraction and the errors, and send whatever depends on absent information to human review."}, {"key": "C", "text": "Keep Pydantic, but send any invoice that fails validation straight to human review."}, {"key": "D", "text": "Remove the validators and add \"make sure the line items sum to the total and the dates are in order\" to the system prompt."}], "correct_answer": "B", "technical_explanation": "Pydantic does two jobs: parsing enforces structure and validators enforce the semantics that a schema cannot express. Its machine-readable errors name the field and the broken rule, which is exactly what the retry needs. Neither strict: true nor SDK-level parsing removes the need for semantic validation, and the retry effectiveness boundary still applies.", "distractor_analysis": [{"key": "A", "type": "Confusion distractor", "explanation": "It starts from a true idea (strict: true guarantees schema-conformant inputs), but a JSON schema cannot express cross-field rules such as matching sums or ordered dates."}, {"key": "B", "type": "Correct", "explanation": "Correct."}, {"key": "C", "type": "Plausible alternative", "explanation": "It detects errors correctly, but breaks the automatic correction requirement: many semantic failures can be fixed with retry-with-error-feedback."}, {"key": "D", "type": "Conceptual distractor", "explanation": "It confuses instruction with validation: a prompt instruction checks nothing and produces none of the specific errors the retry needs."}], "reference": "4_4 Validation, Retry, and Feedback Loops (\"Pydantic as the Validation Layer\", \"Current State\", \"Exam Traps\")"}, {"id": "D4-Q30", "domain": "4", "domain_name": "Prompt Engineering & Structured Output", "subdomain_code": "4.4", "subdomain_name": "Validation, Retry, and Feedback Loops", "difficulty": "Difficult", "question_type": "Medium", "reference_topic": "Retry and escalation policy", "question": "A validation loop retries every error up to five times, always with the specific error. Costs have soared, and many document
