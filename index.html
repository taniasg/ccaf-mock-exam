s or source types."}, {"key": "C", "text": "Implement a shared-state mechanism where agents log their current focus area so other agents can dynamically avoid duplication during execution."}, {"key": "D", "text": "Switch to sequential execution where document analysis runs only after web search completes, using web-search results as context to avoid duplication."}], "correct_answer": "B", "technical_explanation": "Having the coordinator explicitly partition the research space before delegating is most effective because it addresses the root cause—unclear task boundaries—before any work begins. It preserves parallelism while preventing duplicated effort and wasted tokens.", "distractor_analysis": [], "reference": "Practice test, Multi-agent Research System scenario"}, {"id": "PT-Q12", "domain": 2, "domain_name": "Tool Design & MCP Integration", "subdomain_code": "2.2", "subdomain_name": "Structured Error Responses", "difficulty": "Intermediate", "question_type": "Medium", "reference_topic": "", "scenario": "Multi-agent Research System", "question": "During research, the web-search subagent queries three source categories with different outcomes: academic databases return 15 relevant papers, industry reports return “0 results,” and patent databases return “Connection timeout.” When designing error propagation to the coordinator, which approach enables the best recovery decisions?\n\nWhich approach enables the best recovery decisions?", "options": [{"key": "A", "text": "Aggregate the results into a single success-percentage metric (e.g., “67% source coverage”) with detailed logs available on demand."}, {"key": "B", "text": "Report both “timeout” and “0 results” as failures requiring coordinator intervention."}, {"key": "C", "text": "Retry transient failures internally and report only persistent errors."}, {"key": "D", "text": "Distinguish access failures (timeout) that require a retry decision from valid empty results (“0 results”) that represent successful queries."}], "correct_answer": "D", "technical_explanation": "A timeout (access failure) and “0 results” (valid empty result) are semantically different outcomes requiring different responses. Distinguishing them allows the coordinator to retry the patent database while accepting the industry reports “0 results” as a valid, informative finding.", "distractor_analysis": [], "reference": "Practice test, Multi-agent Research System scenario"}, {"id": "PT-Q13", "domain": 5, "domain_name": "Context Management & Reliability", "subdomain_code": "5.1", "subdomain_name": "Context Window Management", "difficulty": "Difficult", "question_type": "Medium", "reference_topic": "", "scenario": "Multi-agent Research System", "question": "Production monitoring shows inconsistent synthesis quality. When aggregated results are ~75K tokens, the synthesis agent reliably cites information from the first 15K tokens (web-search headlines/snippets) and the last 10K tokens (document analysis conclusions), but often misses critical findings in the middle 50K tokens—even when they directly answer the research question. How should you restructure the aggregated input?", "options": [{"key": "A", "text": "Summarize all subagent outputs to under 20K tokens before aggregation to keep content within the model’s reliable processing range."}, {"key": "B", "text": "Stream subagent results to the synthesis agent incrementally, processing web-search results first to completion, then adding document analysis results."}, {"key": "C", "text": "Place a key-findings summary at the start of the aggregated input and organize detailed results with explicit section headings for easier navigation."}, {"key": "D", "text": "Implement rotation that alternates which subagent’s results appear first across research tasks to ensure both sources get equal top positioning over time."}], "correct_answer": "C", "technical_explanation": "Putting a key-findings summary at the start leverages primacy effects so critical information sits in the most reliably processed position. Adding explicit section headings throughout helps the model navigate and attend to mid-input content, directly mitigating the “lost in the middle” phenomenon.", "distractor_analysis": [], "reference": "Practice test, Multi-agent Research System scenario"}, {"id": "PT-Q14", "domain": 5, "domain_name": "Context Management & Reliability", "subdomain_code": "5.1", "subdomain_name": "Context Window Management", "difficulty": "Intermediate", "question_type": "Medium", "reference_topic": "", "scenario": "Multi-agent Research System", "question": "In testing, the combined output of the web-search agent (85K tokens including page content) and the document analysis agent (70K tokens including chains of thought) totals 155K tokens, but the synthesis agent performs best with inputs under 50K tokens. Which solution is most effective?", "options": [{"key": "A", "text": "Modify upstream agents to return structured data (key facts, quotes, relevance scores) instead of verbose content and reasoning."}, {"key": "B", "text": "Add an intermediate summarization agent that condenses findings before passing them to synthesis."}, {"key": "C", "text": "Have the synthesis agent process findings in sequential batches, maintaining state between calls."}, {"key": "D", "text": "Store findings in a vector database and give the synthesis agent search tools to query during its work."}], "correct_answer": "A", "technical_explanation": "Modifying upstream agents to return structured data fixes the root cause by reducing token volume at the source while preserving essential information. It avoids passing bulky page content and reasoning traces that inflate tokens without improving the synthesis step.", "distractor_analysis": [], "reference": "Practice test, Multi-agent Research System scenario"}, {"id": "PT-Q15", "domain": 2, "domain_name": "Tool Design & MCP Integration", "subdomain_code": "2.3", "subdomain_name": "Tool Distribution & Tool Choice", "difficulty": "Difficult", "question_type": "Long", "reference_topic": "", "scenario": "Multi-agent Research System", "question": "In testing, you observe that the synthesis agent often needs to verify specific claims while merging results. Currently, when verification is needed, the synthesis agent returns control to the coordinator, which calls the web-search agent and then re-invokes synthesis with the results. This adds 2–3 extra loops per task and increases latency by 40%. Your assessment shows 85% of these verifications are simple fact checks (dates, names, stats) and 15% require deeper research. Which approach most effectively reduces overhead while preserving system reliability?\n\nWhich approach is most effective?", "options": [{"key": "A", "text": "Give the synthesis agent access to all web-search tools so it can handle any verification need directly without coordinator loops."}, {"key": "B", "text": "Have the synthesis agent accumulate all verification needs and return them as a batch to the coordinator at the end, which then sends them all to the web-search agent at once."}, {"key": "C", "text": "Have the web-search agent proactively cache extra context around each source during initial research in anticipation of synthesis needing verification."}, {"key": "D", "text": "Give the synthesis agent a limited-scope `verify_fact` tool for simple checks, while routing complex verifications through the coordinator to the web-search agent."}], "correct_answer": "D", "technical_explanation": "A limited-scope fact-verification tool lets the synthesis agent handle 85% of simple checks directly, eliminating most loops, while preserving the coordinator delegation path for the 15% of complex verifications. This applies least privilege while significantly reducing latency.", "distractor_analysis": [], "reference": "Practice test, Multi-agent Research System scenario"}, {"id": "PT-Q16", "domain": 3, "domain_name": "Claude Code Configuration & Workflows", "subdomain_code": "3.6", "subdomain_name": "CI/CD Integration", "difficulty": "Intermediate", "question_type": "Long", "reference_topic": "", "scenario": "Claude Code for Continuous Integration", "question": "Your CI pipeline runs the Claude Code CLI (in `--print` mode) using CLAUDE.md to provide project context for code review, and developers generally find the reviews substantive. However, they report that integrating findings into the workflow is difficult—Claude outputs narrative paragraphs that must be manually copied into PR comments. The team wants to automatically post each finding as a separate inline PR comment at the relevant place in code, which requires structured data with file path, line number, severity level, and suggested fix. Which approach is most effective?", "options": [{"key": "A", "text": "Add an “Output Format for Review” section to CLAUDE.md with examples of structured findings so Claude learns the expected format from project context."}, {"key": "B", "text": "Use the CLI flags `--output-format json` and `--json-schema` to enforce structured findings, then parse the output to post inline comments via the GitHub API."}, {"key": "C", "text": "Include explicit formatting instructions in the review prompt requiring each finding to follow a parseable template like `[FILE:path] [LINE:n] [SEVERITY:level] ...`."}, {"key": "D", "text": "Keep narrative review format but add a summarization step that uses Claude to generate a structured JSON summary of findings."}], "correct_answer": "B", "technical_explanation": "Using `--output-format json` with `--json-schema` enforces structured output at the CLI level, guaranteeing well-formed JSON with the required fields (file path, line number, severity, suggested fix) that can be reliably parsed and posted as inline PR comments via the GitHub API. It leverages built-in CLI capabilities designed specifically for structured output.", "distractor_analysis": [], "reference": "Practice test, Claude Code for Continuous Integration scenario"}, {"id": "PT-Q17", "domain": 4, "domain_name": "Prompt Engineering & Structured Output", "subdomain_code": "4.6", "subdomain_name": "Multi-Instance and Multi-Pass Review", "difficulty": "Intermediate", "question_type": "Long", "reference_topic": "", "scenario": "Claude Code for Continuous Integration", "question": "Your team uses Claude Code for generating code suggestions, but you notice a pattern: non-obvious issues—performance optimizations that break edge cases, cleanups that unexpectedly change behavior—are only caught when another team member reviews the PR. Claude’s reasoning during generation shows it considered these cases but concluded its approach was correct. Which approach directly addresses the root cause of this self-check limitation?\n\nWhich approach directly addresses the root cause?", "options": [{"key": "A", "text": "Run a second independent instance of Claude Code to review the changes without access to the generator’s reasoning."}, {"key": "B", "text": "Enable extended thinking mode for the generation stage to allow more thorough deliberation before producing suggestions."}, {"key": "C", "text": "Add explicit self-review instructions to the generation prompt asking Claude to critique its own suggestions before finalizing output."}, {"key": "D", "text": "Include full test files and documentation in prompt context so Claude better understands expected behavior during generation."}], "correct_answer": "A", "technical_explanation": "A second independent Claude Code instance without access to the generator’s reasoning directly addresses the root cause by avoiding confirmation bias. This “fresh eyes” perspective mirrors human peer review, where another reviewer catches issues the author rationalized.", "distractor_analysis": [], "reference": "Practice test, Claude Code for Continuous Integration scenario"}, {"id": "PT-Q18", "domain": 4, "domain_name": "Prompt Engineering & Structured Output", "subdomain_code": "4.5", "subdomain_name": "Batch Processing Strategies", "difficulty": "Difficult", "question_type": "Long", "reference_topic": "", "scenario": "Claude Code for Continuous Integration", "question": "Your code review component is iterative: Claude analyzes the changed file, then may request related files (imports, base classes, tests) via tool calls to understand context before providing final feedback. Your application defines a tool that lets Claude request file contents; Claude calls the tool, gets results, and continues analysis. You’re evaluating batch processing to reduce API cost. What is the primary technical limitation when considering batch processing for this workflow?\n\nWhat is the primary technical limitation?", "options": [{"key": "A", "text": "Batch processing does not include correlation IDs to map outputs back to input requests."}, {"key": "B", "text": "The asynchronous model cannot execute tools mid-request and return results for Claude to continue analysis."}, {"key": "C", "text": "The Batch API does not support tool definitions in request parameters."}, {"key": "D", "text": "The batch processing latency of up to 24 hours is too slow for pull request feedback, although the workflow would otherwise function."}], "correct_answer": "B", "technical_explanation": "A “fire-and-forget” asynchronous Batch API model has no mechanism to intercept a tool call during a request, execute the tool, and return results for Claude to continue analysis. This is fundamentally incompatible with iterative tool-calling workflows that require multiple tool request/response rounds within a single logical interaction.", "distractor_analysis": [], "reference": "Practice test, Claude Code for Continuous Integration scenario"}, {"id": "PT-Q19", "domain": 4, "domain_name": "Prompt Engineering & Structured Output", "subdomain_code": "4.5", "subdomain_name": "Batch Processing Strategies", "difficulty": "Intermediate", "question_type": "Long", "reference_topic": "", "scenario": "Claude Code for Continuous Integration", "question": "Your CI/CD system runs three Claude-based analyses: (1) fast style checks on every PR that block merging until completion, (2) comprehensive weekly security audits of the entire codebase, and (3) nightly test-case generation for recently changed modules. The Message Batches API offers 50% savings but processing can take up to 24 hours. You want to optimize API cost while maintaining an acceptable developer experience. Which combination correctly matches each task to an API approach?\n\nWhich combination is correct?", "options": [{"key": "A", "text": "Use the Message Batches API for all three tasks to maximize 50% savings, configuring the pipeline to poll for batch completion."}, {"key": "B", "text": "Use synchronous calls for PR style checks; use the Message Batches API for weekly security audits and nightly test generation."}, {"key": "C", "text": "Use synchronous calls for all three tasks for consistent response times, relying on prompt caching to reduce costs across workloads."}, {"key": "D", "text": "Use synchronous calls for PR style checks and nightly test generation; use the Message Batches API only for weekly security audits."}], "correct_answer": "B", "technical_explanation": "PR style checks block developers and require immediate responses via synchronous calls, while weekly security audits and nightly test generation are scheduled tasks with flexible deadlines that can tolerate up to a 24-hour batch window—capturing 50% savings for both.", "distractor_analysis": [], "reference": "Practice test, Claude Code for Continuous Integration scenario"}, {"id": "PT-Q20", "domain": 4, "domain_name": "Prompt Engineering & Structured Output", "subdomain_code": "4.2", "subdomain_name": "Few-Shot Prompting", "difficulty": "Easy", "question_type": "Long", "reference_topic": "", "scenario": "Claude Code for Continuous Integration", "question": "Your automated reviews find real issues, but developers report the feedback is not actionable. Findings include phrases like “complex ticket routing logic” or “potential null pointer” without specifying what exactly to change. When you add detailed instructions like “always include concrete fix suggestions,” the model still produces inconsistent output—sometimes detailed, sometimes vague. Which prompting technique most reliably produces consistently actionable feedback?\n\nWhich prompting technique is most reliable?", "options": [{"key": "A", "text": "Further refine instructions with more explicit requirements for each part of the feedback format (location, issue, severity, proposed fix)."}, {"key": "B", "text": "Expand the context window to include more surrounding codebase so the model has enough information to propose concrete fixes."}, {"key": "C", "text": "Implement a two-pass approach where one prompt identifies issues and a second generates fixes, allowing specialization."}, {"key": "D", "text": "Add 3–4 few-shot examples showing the exact required format: identified issue, location in code, concrete fix suggestion."}], "correct_answer": "D", "technical_explanation": "Few-shot examples are the most effective technique for achieving consistent output format when instructions alone produce variable results. Providing 3–4 examples that show the exact desired structure (issue, location, concrete fix) gives the model a concrete pattern to follow, which is more reliable than abstract instructions.", "distractor_analysis": [], "reference": "Practice test, Claude Code for Continuous Integration scenario"}, {"id": "PT-Q21", "domain": 4, "domain_name": "Prompt Engineering & Structured Output", "subdomain_code": "4.5", "subdomain_name": "Batch Processing Strategies", "difficulty": "Intermediate", "question_type": "Medium", "reference_topic": "", "scenario": "Claude Code for Continuous Integration", "question": "Your CI pipeline includes two Claude-based code review modes: a pre-merge-commit hook that blocks PR merge until completion, and a “deep analysis” that runs overnight, polls for batch completion, and posts detailed suggestions to the PR. You want to reduce API cost using the Message Batches API, which offers 50% savings but requires polling and can take up to 24 hours. Which mode should use batch processing?", "options": [{"key": "A", "text": "Only the pre-merge-commit hook."}, {"key": "B", "text": "Only the deep analysis."}, {"key": "C", "text": "Both modes."}, {"key": "D", "text": "Neither mode."}], "correct_answer": "B", "technical_explanation": "Deep analysis is an ideal candidate for batch processing because it already runs overnight, tolerates delay, and uses a polling model before publishing results—matching the asynchronous, polling-based architecture of the Message Batches API while capturing 50% savings.", "distractor_analysis": [], "reference": "Practice test, Claude Code for Continuous Integration scenario"}, {"id": "PT-Q22", "domain": 4, "domain_name": "Prompt Engineering & Structured Output", "subdomain_code": "4.1", "subdomain_name": "System Prompts with Explicit Criteria", "difficulty": "Intermediate", "question_type": "Medium", "reference_topic": "", "scenario": "Claude Code for Continuous Integration", "question": "Your automated review analyzes comments and docstrings. The current prompt instructs Claude to “check that comments are accurate and up to date.” Findings often flag acceptable patterns (TODO markers, simple descriptions) while missing comments describing behavior the code no longer implements. What change addresses the root cause of this inconsistent analysis?\n\nWhat change addresses the root cause?", "options": [{"key": "A", "text": "Include `git blame` data so Claude can identify comments that predate recent code changes."}, {"key": "B", "text": "Add few-shot examples of misleading comments to help the model recognize similar patterns in the codebase."}, {"key": "C", "text": "Filter TODO, FIXME, and descriptive comment patterns before analysis to reduce noise."}, {"key": "D", "text": "Specify explicit criteria: flag comments only when the behavior they claim contradicts the code’s actual behavior."}], "correct_answer": "D", "technical_explanation": "Explicit criteria—flagging comments only when claimed behavior contradicts actual code behavior—directly addresses the root cause by replacing a vague instruction with a precise definition of what constitutes a problem. This reduces false positives on acceptable patterns and misses of truly misleading comments.", "distractor_analysis": [], "reference": "Practice test, Claude Code for Continuous Integration scenario"}, {"id": "PT-Q23", "domain": 4, "domain_name": "Prompt Engineering & Structured Output", "subdomain_code": "4.1", "subdomain_name": "System Prompts with Explicit Criteria", "difficulty": "Difficult", "question_type": "Long", "reference_topic": "", "scenario": "Claude Code for Continuous Integration", "question": "Your automated code review system shows inconsistent severity ratings—similar issues like null pointer risks are rated “critical” in some PRs but only “medium” in others. Developer surveys show growing distrust—many start dismissing findings without reading because “half are wrong.” High-false-positive categories erode trust in accurate categories. Which approach best restores developer trust while improving the system?\n\nWhich approach best restores developer trust?", "options": [{"key": "A", "text": "Temporarily disable high-false-positive categories (style, naming, documentation) and keep only high-precision categories while improving prompts."}, {"key": "B", "text": "Keep all categories enabled but display confidence scores with each finding so developers can decide what to investigate."}, {"key": "C", "text": "Keep all categories enabled and add few-shot examples to improve accuracy for each category over the next few weeks."}, {"key": "D", "text": "Apply a uniform strictness reduction across all categories to bring the overall false-positive rate down."}], "correct_answer": "A", "technical_explanation": "Temporarily disabling high-false-positive categories immediately stops trust erosion by removing noisy findings that cause developers to dismiss everything, while preserving value from high-precision categories like security and correctness. It also creates space to improve prompts for problematic categories before re-enabling them.", "distractor_analysis": [], "reference": "Practice test, Claude Code for Continuous Integration scenario"}, {"id": "PT-Q24", "domain": 3, "domain_name": "Claude Code Configuration & Workflows", "subdomain_code": "3.6", "subdomain_name": "CI/CD Integration", "difficulty": "Easy", "question_type": "Medium", "reference_topic": "", "scenario": "Claude Code for Continuous Integration", "question": "Your automated review generates test-case suggestions for each PR. Reviewing a PR that adds course completion tracking, Claude suggests 10 test cases, but developer feedback shows that 6 duplicate scenarios already covered by the existing test suite. What change most effectively reduces duplicate suggestions?\n\nWhat change is most effective?", "options": [{"key": "A", "text": "Include the existing test file in context so Claude can determine what scenarios are already covered."}, {"key": "B", "text": "Reduce the requested number of suggestions from 10 to 5, assuming Claude prioritizes the most valuable cases first."}, {"key": "C", "text": "Add instructions directing Claude to focus exclusively on edge cases and error conditions rather than success paths."}, {"key": "D", "text": "Implement post-processing that filters suggestions whose descriptions match existing test names via keyword overlap."}], "correct_answer": "A", "technical_explanation": "Including the existing test file fixes the root cause of duplication: Claude can only avoid suggesting already-covered scenarios if it knows what tests already exist. This gives Claude the information needed to propose genuinely new, valuable tests.", "distractor_analysis": [], "reference": "Practice test, Claude Code for Continuous Integration scenario"}, {"id": "PT-Q25", "domain": 3, "domain_name": "Claude Code Configuration & Workflows", "subdomain_code": "3.6", "subdomain_name": "CI/CD Integration", "difficulty": "Intermediate", "question_type": "Medium", "reference_topic": "", "scenario": "Claude Code for Continuous Integration", "question": "After an initial automated review identifies 12 findings, a developer pushes new commits to address issues. Re-running review produces 8 findings, but developers report that 5 duplicate previous comments on code that was already fixed in the new commits. What is the most effective way to eliminate this redundant feedback while maintaining thoroughness?\n\nWhat is the most effective way to eliminate redundant feedback?", "options": [{"key": "A", "text": "Run review only when the PR is created and in the final pre-merge state, skipping intermediate commits."}, {"key": "B", "text": "Add a post-processing filter that removes findings that match previous ones by file paths and issue descriptions before posting comments."}, {"key": "C", "text": "Restrict review scope to files changed in the most recent push, excluding files from earlier commits."}, {"key": "D", "text": "Include previous review findings in context and instruct Claude to report only new or still-unresolved issues."}], "correct_answer": "D", "technical_explanation": "Including prior review findings in context lets Claude distinguish new problems from those already addressed in recent commits. This preserves review thoroughness while using Claude’s reasoning to avoid redundant feedback on fixed code.", "distractor_analysis": [], "reference": "Practice test, Claude Code for Continuous Integration scenario"}, {"id": "PT-Q26", "domain": 3, "domain_name": "Claude Code Configuration & Workflows", "subdomain_code": "3.6", "subdomain_name": "CI/CD Integration", "difficulty": "Easy", "question_type": "Medium", "reference_topic": "", "scenario": "Claude Code for Continuous Integration", "question": "Your pipeline script runs `claude \"Analyze this pull request for security issues\"`, but the job hangs indefinitely. Logs show Claude Code is waiting for interactive input. What is the correct approach to run Claude Code in an automated pipeline?\n\nWhat is the correct approach?", "options": [{"key": "A", "text": "Add a `--batch` flag: `claude --batch \"Analyze this pull request for security issues\"`."}, {"key": "B", "text": "Add the `-p` flag: `claude -p \"Analyze this pull request for security issues\"`."}, {"key": "C", "text": "Redirect stdin from `/dev/null`: `claude \"Analyze this pull request for security issues\" < /dev/null`."}, {"key": "D", "text": "Set the environment variable `CLAUDE_HEADLESS=true` before running the command."}], "correct_answer": "B", "technical_explanation": "The `-p` (or `--print`) flag is the documented way to run Claude Code non-interactively. It processes the prompt, prints the result to stdout, and exits without waiting for user input—ideal for CI/CD pipelines.", "distractor_analysis": [], "reference": "Practice test, Claude Code for Continuous Integration scenario"}, {"id": "PT-Q27", "domain": 4, "domain_name": "Prompt Engineering & Structured Output", "subdomain_code": "4.6", "subdomain_name": "Multi-Instance and Multi-Pass Review", "difficulty": "Intermediate", "question_type": "Medium", "reference_topic": "", "scenario": "Claude Code for Continuous Integration", "question": "A pull request changes 14 files in an inventory tracking module. A single-pass review that analyzes all files together produces inconsistent results: detailed feedback on some files but shallow comments on others, missed obvious bugs, and contradictory feedback (a pattern is flagged in one file but identical code is approved in another file in the same PR). How should you restructure the review?", "options": [{"key": "A", "text": "Run three independent full-PR review passes and flag only issues that appear in at least two of the three runs."}, {"key": "B", "text": "Split into focused passes: review each file individually for local issues, then run a separate integration-oriented pass to examine cross-file data flows."}, {"key": "C", "text": "Require developers to split large PRs into smaller submissions of 3–4 files before running automated review."}, {"key": "D", "text": "Switch to a larger model with a bigger context window so it can pay sufficient attention to all 14 files in one pass."}], "correct_answer": "B", "technical_explanation": "Focused per-file passes address the root cause—attention dilution—by ensuring consistent depth and reliable local issue detection. A separate integration-oriented pass then covers cross-file concerns such as dependency and data-flow interactions.", "distractor_analysis": [], "reference": "Practice test, Claude Code for Continuous Integration scenario"}, {"id": "PT-Q28", "domain": 5, "domain_name": "Context Management & Reliability", "subdomain_code": "5.5", "subdomain_name": "Human Review & Confidence Calibration", "difficulty": "Intermediate", "question_type": "Long", "reference_topic": "", "scenario": "Claude Code for Continuous Integration", "question": "Your automated code review averages 15 findings per pull request, and developers report a 40% false-positive rate. The bottleneck is investigation time: developers must click into each finding to read Claude’s rationale before deciding whether to fix or dismiss it. Your CLAUDE.md already contains comprehensive rules for acceptable patterns, and stakeholders rejected any approach that filters findings before developers see them. What change best addresses investigation time?", "options": [{"key": "A", "text": "Require Claude to include its rationale and confidence estimate directly in each finding."}, {"key": "B", "text": "Add a post-processor that analyzes finding patterns and automatically suppresses those that match historical false-positive signatures."}, {"key": "C", "text": "Categorize findings as “blocking issues” vs “suggestions,” with different review requirements by level."}, {"key": "D", "text": "Configure Claude to show only high-confidence findings, filtering uncertain flags before developers see them."}], "correct_answer": "A", "technical_explanation": "Including rationale and confidence directly in each finding reduces investigation time by letting developers quickly triage without opening each finding. It satisfies the “no filtering” constraint because all findings remain visible while accelerating developer decision-making.", "distractor_analysis": [], "reference": "Practice test, Claude Code for Continuous Integration scenario"}, {"id": "PT-Q29", "domain": 4, "domain_name": "Prompt Engineering & Structured Output", "subdomain_code": "4.1", "subdomain_name": "System Prompts with Explicit Criteria", "difficulty": "Intermediate", "question_type": "Long", "reference_topic": "", "scenario": "Claude Code for Continuous Integration", "question": "Analysis of your automated code review shows large differences in false-positive rates by finding category: security/correctness findings have 8% false positives, performance findings 18%, style/naming findings 52%, and documentation findings 48%. Developer surveys show growing distrust—many start dismissing findings without reading because “half are wrong.” High-false-positive categories erode trust in accurate categories. Which approach best restores developer trust while improving the system?\n\nWhich approach best restores developer trust?", "options": [{"key": "A", "text": "Temporarily disable high-false-positive categories (style, naming, documentation) and keep only high-precision categories while improving prompts."}, {"key": "B", "text": "Keep all categories enabled but display confidence scores with each finding so developers can decide what to investigate."}, {"key": "C", "text": "Keep all categories enabled and add few-shot examples to improve accuracy for each category over the next few weeks."}, {"key": "D", "text": "Apply a uniform strictness reduction across all categories to bring the overall false-positive rate down."}], "correct_answer": "A", "technical_explanation": "Temporarily disabling high-false-positive categories immediately stops trust erosion by removing noisy findings that cause developers to dismiss everything, while preserving value from high-precision categories like security and correctness. It also creates space to improve prompts for problematic categories before re-enabling them.", "distractor_analysis": [], "reference": "Practice test, Claude Code for Continuous Integration scenario"}, {"id": "PT-Q30", "domain": 4, "domain_name": "Prompt Engineering & Structured Output", "subdomain_code": "4.5", "subdomain_name": "Batch Processing Strategies", "difficulty": "Easy", "question_type": "Medium", "reference_topic": "", "scenario": "Claude Code for Continuous Integration", "question": "Your team wants to reduce API costs for automated analysis. Currently, synchronous Claude calls support two workflows: (1) a blocking pre-merge check that must complete before developers can merge, and (2) a technical debt report generated overnight for review the next morning. Your manager proposes moving both to the Message Batches API to save 50%. How should you evaluate this proposal?", "options": [{"key": "A", "text": "Move both to batch processing with fallback to synchronous calls if batches take too long."}, {"key": "B", "text": "Move both workflows to batch processing with status polling to verify completion."}, {"key": "C", "text": "Use batch processing only for technical debt reports; keep synchronous calls for pre-merge checks."}, {"key": "D", "text": "Keep synchronous calls for both workflows to avoid issues with batch result ordering."}], "correct_answer": "C", "technical_explanation": "Message Batches API processing can take up to 24 hours with no latency SLA, which is acceptable for overnight technical debt reports but unacceptable for blocking pre-merge checks where developers wait. This matches each workflow to the right API based on latency requirements.", "distractor_analysis": [], "reference": "Practice test, Claude Code for Continuous Integration scenario"}, {"id": "PT-Q31", "domain": 3, "domain_name": "Claude Code Configuration & Workflows", "subdomain_code": "3.5", "subdomain_name": "Iterative Refinement Techniques", "difficulty": "Easy", "question_type": "Medium", "reference_topic": "", "scenario": "Code Generation with Claude Code", "question": "You asked Claude Code to implement a function that transforms API responses into an internal normalized format. After two iterations, the output structure still doesn’t match expectations—some fields are nested differently and timestamps are formatted incorrectly. You described requirements in prose, but Claude interprets them differently each time.\n\nWhich approach is most effective for the next iteration?", "options": [{"key": "A", "text": "Write a JSON schema describing the expected output structure and validate Claude’s output against it after each iteration."}, {"key": "B", "text": "Provide 2–3 concrete input-output examples showing the expected transformation for representative API responses."}, {"key": "C", "text": "Rewrite requirements with more technical precision, specifying exact field mappings, nesting rules, and timestamp format strings."}, {"key": "D", "text": "Ask Claude to explain its current understanding of the requirements to identify where interpretations diverge."}], "correct_answer": "B", "technical_explanation": "Concrete input-output examples remove ambiguity inherent in prose descriptions by showing Claude the exact expected transformation results. This directly addresses the root cause—misinterpretation of textual requirements—by providing unambiguous patterns for field nesting and timestamp formatting.", "distractor_analysis": [], "reference": "Practice test, Code Generation with Claude Code scenario"}, {"id": "PT-Q32", "domain": 3, "domain_name": "Claude Code Configuration & Workflows", "subdomain_code": "3.4", "subdomain_name": "Plan Mode vs Direct Execution", "difficulty": "Intermediate", "question_type": "Long", "reference_topic": "", "scenario": "Code Generation with Claude Code", "question": "You need to add Slack as a new notification channel. The existing codebase has clear, established patterns for email, SMS, and push channels. However, Slack’s API offers fundamentally different integration approaches—incoming webhooks (simple, one-way), bot tokens (support delivery confirmation and programmatic control), or Slack Apps (two-way events, requires workspace approval). Your task says “add Slack support” without specifying integration method or requiring advanced features like delivery tracking.\n\nHow should you approach this task?", "options": [{"key": "A", "text": "Start in direct execution mode using incoming webhooks to match the existing one-way notification pattern."}, {"key": "B", "text": "Switch to planning mode to explore integration options and architectural implications, then present a recommendation before implementation."}, {"key": "C", "text": "Start in direct execution mode by scaffolding a Slack channel class using existing patterns, deferring the integration method decision."}, {"key": "D", "text": "Start in direct execution mode using a bot-token approach to ensure delivery confirmation is possible."}], "correct_answer": "B", "technical_explanation": "Slack integration has multiple valid approaches with significantly different architectural implications, and requirements are ambiguous. Planning mode lets you evaluate trade-offs among webhooks, bot tokens, and Slack Apps and align on an approach before implementation.", "distractor_analysis": [], "reference": "Practice test, Code Generation with Claude Code scenario"}, {"id": "PT-Q33", "domain": 3, "domain_name": "Claude Code Configuration & Workflows", "subdomain_code": "3.1", "subdomain_name": "CLAUDE.md Hierarchy, Scoping, and Modular Organisation", "difficulty": "Intermediate", "question_type": "Medium", "reference_topic": "", "scenario": "Code Generation with Claude Code", "question": "Your CLAUDE.md file has grown to 400+ lines containing coding standards, testing conventions, a detailed PR review checklist, deployment instructions, and database migration procedures. You want Claude to always follow coding standards and testing conventions, but apply PR review, deploy, and migration guidance only when doing those tasks.\n\nWhich restructuring approach is most effective?", "options": [{"key": "A", "text": "Move all guidance into separate Skills files organized by workflow type, leaving only a brief project description in CLAUDE.md."}, {"key": "B", "text": "Keep everything in CLAUDE.md but use `@import` syntax to organize into separately maintained files by category."}, {"key": "C", "text": "Split CLAUDE.md into files under `.claude/rules/` with path-bound glob patterns so each rule loads only for the relevant file types."}, {"key": "D", "text": "Keep universal standards in CLAUDE.md and create Skills for workflow-specific guidance (PR review, deploy, migrations) with trigger keywords."}], "correct_answer": "D", "technical_explanation": "CLAUDE.md content loads in every session, ensuring coding standards and testing conventions always apply, while Skills are invoked on demand when Claude detects trigger keywords—ideal for workflow-specific guidance like PR review, deployment, and migrations.", "distractor_analysis": [], "reference": "Practice test, Code Generation with Claude Code scenario"}, {"id": "PT-Q34", "domain": 3, "domain_name": "Claude Code Configuration & Workflows", "subdomain_code": "3.4", "subdomain_name": "Plan Mode vs Direct Execution", "difficulty": "Easy", "question_type": "Short", "reference_topic": "", "scenario": "Code Generation with Claude Code", "question": "You’re tasked with restructuring your team’s monolithic application into microservices. This impacts changes across dozens of files and requires decisions about service boundaries and module dependencies.\n\nWhich approach should you choose?", "options": [{"key": "A", "text": "Switch to planning mode to explore the codebase, understand dependencies, and design the implementation approach before making changes."}, {"key": "B", "text": "Start in direct execution mode and switch to planning only after encountering unexpected complexity during implementation."}, {"key": "C", "text": "Start in direct execution mode and make incremental changes, letting implementation reveal natural service boundaries."}, {"key": "D", "text": "Use direct execution with detailed upfront instructions that specify each service structure."}], "correct_answer": "A", "technical_explanation": "Planning mode is the right strategy for complex architectural restructuring like splitting a monolith: it allows safe exploration and informed decisions about boundaries before committing to potentially expensive changes across many files.", "distractor_analysis": [], "reference": "Practice test, Code Generation with Claude Code scenario"}, {"id": "PT-Q35", "domain": 3, "domain_name": "Claude Code Configuration & Workflows", "subdomain_code": "3.2", "subdomain_name": "Custom Slash Commands and Skills", "difficulty": "Intermediate", "question_type": "Medium", "reference_topic": "", "scenario": "Code Generation with Claude Code", "question": "Your team created a `/analyze-codebase` skill that performs deep code analysis—dependency scanning, test coverage counts, and code quality metrics. After running the command, team members report Claude becomes less responsive in the session and loses the context of the original task.\n\nHow do you most effectively fix this while keeping full analysis capabilities?", "options": [{"key": "A", "text": "Add `context: fork` in the skill frontmatter to run the analysis in an isolated subagent context."}, {"key": "B", "text": "Add `model: haiku` in frontmatter to use a faster, cheaper model for analysis."}, {"key": "C", "text": "Split the skill into three smaller skills, each producing less output."}, {"key": "D", "text": "Add instructions to the skill to compress all results into a short summary before displaying them."}], "correct_answer": "A", "technical_explanation": "`context: fork` runs the analysis in an isolated subagent context so the large output does not pollute the main session’s context window and Claude does not lose track of the original task. It preserves full analysis capability while keeping the main session responsive.", "distractor_analysis": [], "reference": "Practice test, Code Generation with Claude Code scenario"}, {"id": "PT-Q36", "domain": 3, "domain_name": "Claude Code Configuration & Workflows", "subdomain_code": "3.2", "subdomain_name": "Custom Slash Commands and Skills", "difficulty": "Easy", "question_type": "Short", "reference_topic": "", "scenario": "Code Generation with Claude Code", "question": "Your team uses a `/commit` skill in `.claude/skills/commit/SKILL.md`. A developer wants to customize it for their personal workflow (different commit message format, extra checks) without affecting teammates.\n\nWhat do you recommend?", "options": [{"key": "A", "text": "Create a personal version under `~/.claude/skills/` with a different name, e.g., `/my-commit`."}, {"key": "B", "text": "Add conditional logic based on username in the project skill frontmatter."}, {"key": "C", "text": "Create a personal version at `~/.claude/skills/commit/SKILL.md` with the same name."}, {"key": "D", "text": "Set `override: true` in the personal skill frontmatter to prioritize it over the project version."}], "correct_answer": "C", "technical_explanation": "Skill resolution is positional: enterprise overrides personal, and personal overrides project. A personal skill at `~/.claude/skills/commit/SKILL.md` therefore shadows the team's `.claude/skills/commit/SKILL.md` for that developer alone — nothing in the repository changes, so teammates keep running the project version and `/commit` behaves the same for everyone else. A works mechanically but is the weaker recommendation: the project `/commit` stays active alongside `/my-commit`, and two skills with near-identical `description` fields make Claude's automatic skill selection unpredictable, while breaking the muscle memory and team docs that say to run `/commit`. B fails because skill frontmatter has no conditional or username facility, and it would require editing the shared project file the scenario rules out. D fails because there is no `override` field — precedence comes from location, not from a declaration.", "distractor_analysis": [], "reference": "Practice test, Code Generation with Claude Code scenario"}, {"id": "PT-Q37", "domain": 3, "domain_name": "Claude Code Configuration & Workflows", "subdomain_code": "3.1", "subdomain_name": "CLAUDE.md Hierarchy, Scoping, and Modular Organisation", "difficulty": "Easy", "question_type": "Medium", "reference_topic": "", "scenario": "Code Generation with Claude Code", "question": "Your team has used Claude Code for months. Recently, three developers report Claude follows the guidance “always include comprehensive error handling,” but a fourth developer who just joined says Claude does not follow it. All four work in the same repo and have up-to-date code.\n\nWhat is the most likely cause and fix?", "options": [{"key": "A", "text": "The guidance lives in the original developers’ user-level `~/.claude/CLAUDE.md` files, not in the project `.claude/CLAUDE.md`. Move the instruction to the project-level file so all team members receive it."}, {"key": "B", "text": "The new developer’s `~/.claude/CLAUDE.md` contains conflicting instructions overriding project settings; they should delete the conflicting section."}, {"key": "C", "text": "Claude Code learns per-user preferences over time; the new developer must repeat the requirement until Claude “remembers” it."}, {"key": "D", "text": "Claude Code caches CLAUDE.md after first read; original developers use cached versions. Everyone should clear the Claude Code cache."}], "correct_answer": "A", "technical_explanation": "If the guidance was added only to the original developers’ user-level configs and not to the project-level `.claude/CLAUDE.md`, new team members won’t receive it. Moving it to the project-level configuration ensures all current and future team members automatically get the guidance.", "distractor_analysis": [], "reference": "Practice test, Code Generation with Claude Code scenario"}, {"id": "PT-Q38", "domain": 3, "domain_name": "Claude Code Configuration & Workflows", "subdomain_code": "3.2", "subdomain_name": "Custom Slash Commands and Skills", "difficulty": "Intermediate", "question_type": "Medium", "reference_topic": "", "scenario": "Code Generation with Claude Code", "question": "You find that including 2–3 full endpoint implementation examples as context significantly improves consistency when generating new API endpoints. However, this context is useful only when creating new endpoints—not when debugging, reviewing code, or other work in the API directory.\n\nWhich configuration approach is most effective?", "options": [{"key": "A", "text": "Add endpoint examples and pattern documentation to the project CLAUDE.md so they are always available."}, {"key": "B", "text": "Manually reference endpoint examples in every generation request by copying code into the prompt."}, {"key": "C", "text": "Configure path-specific rules in `.claude/rules/api/` that include endpoint examples and activate when working in the API directory."}, {"key": "D", "text": "Create a skill that references the endpoint examples and contains pattern-following instructions, invoked on demand via a slash command."}], "correct_answer": "D", "technical_explanation": "A skill invoked on demand loads the example context only when generating new endpoints, not during unrelated tasks like debugging or review. This keeps the main context clean while preserving high-quality generation when needed.", "distractor_analysis": [], "reference": "Practice test, Code Generation with Claude Code scenario"}, {"id": "PT-Q39", "domain": 3, "domain_name": "Claude Code Configuration & Workflows", "subdomain_code": "3.2", "subdomain_name": "Custom Slash Commands and Skills", "difficulty": "Difficult", "question_type": "Long", "reference_topic": "", "scenario": "Code Generation with Claude Code", "question": "Your team created a `/migration` skill that generates database migration files. It takes the migration name via `$ARGUMENTS`. In production you observe three issues: (1) developers often run the skill without arguments, causing poorly named files, (2) the skill sometimes uses database schema details from unrelated prior conversations, and (3) a developer accidentally ran destructive test cleanup when the skill had broad tool access.\n\nWhich configuration approach fixes all three problems?", "options": [{"key": "A", "text": "Use positional parameters `$1` and `$2` instead of `$ARGUMENTS` to enforce specific inputs, include explicit schema file references via `@` syntax for context control, and add a frontmatter description warning about destructive operations."}, {"key": "B", "text": "Add `argument-hint` in frontmatter to request required parameters, use `context: fork` to isolate execution, and restrict `allowed-tools` to file-write operations."}, {"key": "C", "text": "Split into `/migration-create` and `/migration-apply` skills, add validation instructions to request migration name if missing, and use different `allowed-tools` scopes for each."}, {"key": "D", "text": "Add validation instructions in the skill SKILL.md to ensure `$ARGUMENTS` is a valid name, add prompts to ignore prior conversation context, and list prohibited operations to avoid."}], "correct_answer": "B", "technical_explanation": "This uses three separate configuration features to address each problem: `argument-hint` improves argument entry and reduces missing arguments, `context: fork` prevents context leakage from prior conversations, and `allowed-tools` constrains the skill to safe file-writing operations, preventing destructive actions.", "distractor_analysis": [], "reference": "Practice test, Code Generation with Claude Code scenario"}, {"id": "PT-Q40", "domain": 3, "domain_name": "Claude Code Configuration & Workflows", "subdomain_code": "3.3", "subdomain_name": "Path-Specific Rules for Conditional Convention Loading", "difficulty": "Intermediate", "question_type": "Long", "reference_topic": "", "scenario": "Code Generation with Claude Code", "question": "Your codebase contains areas with different coding conventions: React components use functional style with hooks, API handlers use async/await with specific error handling, and database models follow the repository pattern. Test files are distributed across the codebase next to the code under test (e.g., `Button.test.tsx` next to `Button.tsx`), and you want all tests to follow the same conventions regardless of location.\n\nWhat is the most supported way to ensure Claude automatically applies the correct conventions when generating code?", "options": [{"key": "A", "text": "Put all conventions in the root CLAUDE.md under headings for each area and rely on Claude to infer which section applies."}, {"key": "B", "text": "Create skills in `.claude/skills/` for each code type, embedding conventions in each SKILL.md."}, {"key": "C", "text": "Place a separate CLAUDE.md file in each subdirectory containing conventions for that area."}, {"key": "D", "text": "Create rule files under `.claude/rules/` with YAML frontmatter specifying glob patterns to conditionally apply conventions based on file paths."}], "correct_answer": "D", "technical_explanation": "`.claude/rules/` files with YAML frontmatter and glob patterns (e.g., `**/*.test.tsx`, `src/api/**/*.ts`) enable deterministic, path-based convention application regardless of directory structure. This is the most supported approach for cross-cutting patterns like distributed test files.", "distractor_analysis": [], "reference": "Practice test, Code Generation with Claude Code scenario"}, {"id": "PT-Q41", "domain": 3, "domain_name": "Claude Code Configuration & Workflows", "subdomain_code": "3.2", "subdomain_name": "Custom Slash Commands and Skills", "difficulty": "Easy", "question_type": "Short", "reference_topic": "", "scenario": "Code Generation with Claude Code", "question": "You want to create a custom slash command `/review` that runs your team’s standard code review checklist. It should be available to every developer when they clone or update the repository.\n\nWhere should you create the command file?", "options": [{"key": "A", "text": "In `~/.claude/commands/` in each developer’s home directory."}, {"key": "B", "text": "In the project repository under `.claude/commands/`."}, {"key": "C", "text": "In `.claude/config.json` as an array of commands."}, {"key": "D", "text": "In the root project CLAUDE.md."}], "correct_answer": "B", "technical_explanation": "Putting custom slash commands under `.claude/commands/` inside the project repository ensures they are version-controlled and automatically available to every developer who clones or updates the repo. This is the intended location for project-level custom commands in Claude Code.", "distractor_analysis": [], "reference": "Practice test, Code Generation with Claude Code scenario"}, {"id": "PT-Q42", "domain": 3, "domain_name": "Claude Code Configuration & Workflows", "subdomain_code": "3.1", "subdomain_name": "CLAUDE.md Hierarchy, Scoping, and Modular Organisation", "difficulty": "Easy", "question_type": "Medium", "reference_topic": "", "scenario": "Code Generation with Claude Code", "question": "Your team’s CLAUDE.md grew beyond 500 lines mixing TypeScript conventions, testing guidance, API patterns, and deployment procedures. Developers find it hard to locate and update the right sections.\n\nWhat approach does Claude Code support to organize project-level instructions into focused topical modules?", "options": [{"key": "A", "text": "Define a `.claude/config.yaml` mapping file patterns to specific sections inside CLAUDE.md."}, {"key": "B", "text": "Create separate Markdown files in `.claude/rules/`, each covering one topic (e.g., `testing.md`, `api-conventions.md`)."}, {"key": "C", "text": "Split instructions into README.md files in relevant subdirectories that Claude automatically loads as instructions."}, {"key": "D", "text": "Create multiple files named CLAUDE.md at different levels of the directory tree, each overriding parent instructions."}], "correct_answer": "B", "technical_explanation": "Claude Code supports a `.claude/rules/` directory where you can create separate Markdown files for topical guidance (e.g., `testing.md`, `api-conventions.md`), allowing teams to organize large instruction sets into focused, maintainable modules.", "distractor_analysis": [], "reference": "Practice test, Code Generation with Claude Code scenario"}, {"id": "PT-Q43", "domain": 3, "domain_name": "Claude Code Configuration & Workflows", "subdomain_code": "3.2", "subdomain_name": "Custom Slash Commands and Skills", "difficulty": "Easy", "question_type": "Medium", "reference_topic": "", "scenario": "Code Generation with Claude Code", "question": "You create a custom skill `/explore-alternatives` that your team uses to brainstorm and evaluate implementation approaches before choosing one. Developers report that after running the skill, subsequent Claude responses are influenced by the alternatives discussion—sometimes referencing rejected approaches or retaining exploration context that interferes with actual implementation.\n\nHow should you most effectively configure this skill?", "options": [{"key": "A", "text": "Use the `!` prefix in the skill to run exploration logic as a bash subprocess."}, {"key": "B", "text": "Add `context: fork` in the skill frontmatter."}, {"key": "C", "text": "Split into two skills—`/explore-start` and `/explore-end`—to mark boundaries when exploration context should be discarded."}, {"key": "D", "text": "Create the skill in `~/.claude/skills/` instead of `.claude/skills/`."}], "correct_answer": "B", "technical_explanation": "`context: fork` runs the skill in an isolated subagent context so exploration discussions do not pollute the main conversation history. This prevents rejected approaches and brainstorming context from influencing subsequent implementation work.", "distractor_analysis": [], "reference": "Practice test, Code Generation with Claude Code scenario"}, {"id": "PT-Q44", "domain": 2, "domain_name": "Tool Design & MCP Integration", "subdomain_code": "2.4", "subdomain_name": "MCP Server Integration", "difficulty": "Intermediate", "question_type": "Medium", "reference_topic": "", "scenario": "Code Generation with Claude Code", "question": "Your team wants to add a GitHub MCP server for searching PRs and checking CI status via Claude Code. Each of six developers has their own personal GitHub access token. You want consistent tooling across the team without committing credentials to version control.\n\nWhich configuration approach is most effective?", "options": [{"key": "A", "text": "Have each developer add the server in user scope via `claude mcp add --scope user`."}, {"key": "B", "text": "Create an MCP server wrapper that reads tokens from a `.env` file and proxies GitHub API calls, then add the wrapper to the project `.mcp.json`."}, {"key": "C", "text": "Add the server to the project `.mcp.json` using environment variable substitution (`${GITHUB_TOKEN}`) for auth and document the required environment variable in the project README."}, {"key": "D", "text": "Configure the server in project scope with a placeholder token, then tell developers to override it in their local config."}], "correct_answer": "C", "technical_explanation": "A project `.mcp.json` with environment variable substitution is idiomatic: it provides a single version-controlled source of truth for MCP configuration while letting each developer supply credentials via environment variables. Documenting the variable makes onboarding easy without committing secrets.", "distractor_analysis": [], "reference": "Practice test, Code Generation with Claude Code scenario"}, {"id": "PT-Q45", "domain": 5, "domain_name": "Context Management & Reliability", "subdomain_code": "5.4", "subdomain_name": "Codebase Exploration & Context Degradation", "difficulty": "Difficult", "question_type": "Long", "reference_topic": "", "scenario": "Code Generation with Claude Code", "question": "You’re adding error-handling wrappers around external API calls across a 120-file codebase. The work has three phases: (1) discover all call sites and patterns, (2) collaboratively design the error-handling approach, and (3) implement wrappers consistently. In Phase 1, Claude generates large output listing hundreds of call sites with context, quickly filling the context window before discovery finishes.\n\nWhich approach is most effective to complete the task while maintaining implementation consistency?", "options": [{"key": "A", "text": "Use an Explore subagent for Phase 1 to isolate verbose discovery output and return a summary, then continue Phases 2–3 in the main conversation."}, {"key": "B", "text": "Do all phases in the main conversation, periodically using `/compact` to reduce context usage while moving through files."}, {"key": "C", "text": "Switch to headless mode with `--continue`, passing explicit context summaries between batch calls to maintain continuity."}, {"key": "D", "text": "Define the error-handling pattern in CLAUDE.md, then process files in batches across multiple sessions relying on the shared memory file for consistency."}], "correct_answer": "A", "technical_explanation": "An Explore subagent isolates the verbose discovery output in a separate context and returns only a concise summary to the main conversation. This preserves the main context window for the collaborative design and consistent implementation phases where retained context is most valuable.", "distractor_analysis": [], "reference": "Practice test, Code Generation with Claude Code scenario"}, {"id": "PT-Q46", "domain": 2, "domain_name": "Tool Design & MCP Integration", "subdomain_code": "2.1", "subdomain_name": "Tool Interface Design", "difficulty": "Easy", "question_type": "Short", "reference_topic": "", "scenario": "Customer Support Agent", "question": "While testing, you notice the agent often calls `get_customer` when users ask about order status, even though `lookup_order` would be more appropriate. What should you check first to address this problem?\n\nWhat should you check first?", "options": [{"key": "A", "text": "Implement a preprocessing classifier to detect order-related requests and route them directly to `lookup_order`."}, {"key": "B", "text": "Reduce the number of tools available to the agent to simplify choice."}, {"key": "C", "text": "Add few-shot examples to the system prompt covering all possible order request patterns to improve tool selection."}, {"key": "D", "text": "Check the tool descriptions to ensure they clearly differentiate each tool’s purpose."}], "correct_answer": "D", "technical_explanation": "Tool descriptions are the primary input the model uses to decide which tool to call. When an agent consistently picks the wrong tool, the first diagnostic step is to verify that tool descriptions clearly separate each tool’s purpose and usage boundaries.", "distractor_analysis": [], "reference": "Practice test, Customer Support Agent scenario"}, {"id": "PT-Q47", "domain": 4, "domain_name": "Prompt Engineering & Structured Output", "subdomain_code": "4.2", "subdomain_name": "Few-Shot Prompting", "difficulty": "Intermediate", "question_type": "Long", "reference_topic": "", "scenario": "Customer Support Agent", "question": "Your agent handles single-issue requests with 94% accuracy (e.g., “I need a refund for order #1234”). But when customers include multiple issues in one message (e.g., “I need a refund for order #1234 and also want to update the shipping address for order #5678”), tool selection accuracy drops to 58%. The agent usually solves only one issue or mixes parameters across requests. What approach most effectively improves reliability for multi-issue requests?\n\nWhat approach is most effective?", "options": [{"key": "A", "text": "Implement a preprocessing layer that uses a separate model call to decompose multi-issue messages into separate requests, handle each independently, and merge results."}, {"key": "B", "text": "Combine related tools into fewer universal tools."}, {"key": "C", "text": "Add few-shot examples to the prompt demonstrating correct reasoning and tool sequencing for multi-issue requests."}, {"key": "D", "text": "Implement response validation that detects incomplete answers and automatically reprompts the agent to resolve missed issues."}], "correct_answer": "C", "technical_explanation": "Few-shot examples that demonstrate correct reasoning and tool sequencing for multi-issue requests are most effective because the agent already performs well on single issues—what it needs is guidance on the pattern for decomposing and routing multiple issues and keeping parameters separated.", "distractor_analysis": [], "reference": "Practice test, Customer Support Agent scenario"}, {"id": "PT-Q48", "domain": 1, "domain_name": "Agentic Architecture & Orchestration", "subdomain_code": "1.6", "subdomain_name": "Task Decomposition Strategies", "difficulty": "Intermediate", "question_type": "Long", "reference_topic": "", "scenario": "Customer Support Agent", "question": "Production logs show that for simple requests like “refund for order #1234,” your agent resolves the issue in 3–4 tool calls with 91% success. But for complex requests like “I was billed twice, my discount didn’t apply, and I want to cancel,” the agent averages 12+ tool calls with only 54% success—often investigating issues sequentially and fetching redundant customer data for each. What change most effectively improves handling of complex requests?\n\nWhat change is most effective?", "options": [{"key": "A", "text": "Add explicit verification checkpoints between stages, requiring the agent to record progress after resolving each issue before moving to the next."}, {"key": "B", "text": "Reduce the number of tools by combining `get_customer`, `lookup_order`, and billing-related tools into a single `investigate_issue` tool."}, {"key": "C", "text": "Decompose the request into separate issues, then investigate each in parallel using shared customer context before synthesizing a final resolution."}, {"key": "D", "text": "Add few-shot examples to the system prompt demonstrating ideal tool-call sequences for various multi-faceted billing scenarios."}], "correct_answer": "C", "technical_explanation": "Decomposing into separate issues and investigating in parallel with shared customer context fixes both key problems: it eliminates redundant data retrieval by reusing shared context across issues and reduces total tool-call loops by parallelizing investigation before synthesizing a single resolution.", "distractor_analysis": [], "reference": "Practice test, Customer Support Agent scenario"}, {"id": "PT-Q49", "domain": 5, "domain_name": "Context Management & Reliability", "subdomain_code": "5.2", "subdomain_name": "Escalation & Ambiguity Resolution", "difficulty": "Intermediate", "question_type": "Medium", "reference_topic": "", "scenario": "Customer Support Agent", "question": "Your agent achieves 55% first-contact resolution, well below the 80% target. Logs show it escalates simple cases (standard replacements for damaged goods with photo proof) while trying to handle complex situations requiring policy exceptions autonomously. What is the most effective way to improve escalation calibration?", "options": [{"key": "A", "text": "Require the agent to self-rate confidence on a 1–10 scale before each response and automatically route to humans when confidence drops below a threshold."}, {"key": "B", "text": "Deploy a separate classifier model trained on historical tickets to predict which requests need escalation before the main agent starts processing."}, {"key": "C", "text": "Add explicit escalation criteria to the system prompt with few-shot examples showing when to escalate versus resolve autonomously."}, {"key": "D", "text": "Implement sentiment analysis to determine customer frustration level and automatically escalate past a negative sentiment threshold."}], "correct_answer": "C", "technical_explanation": "Explicit escalation criteria with few-shot examples directly address the root cause—unclear decision boundaries between simple and complex cases. It’s the most proportional, effective first intervention that teaches the agent when to escalate and when to resolve autonomously without extra infrastructure.", "distractor_analysis": [], "reference": "Practice test, Customer Support Agent scenario"}, {"id": "PT-Q50", "domain": 5, "domain_name": "Context Management & Reliability", "subdomain_code": "5.2", "subdomain_name": "Escalation & Ambiguity Resolution", "difficulty": "Difficult", "question_type": "Short", "reference_topic": "", "scenario": "Customer Support Agent", "question": "After calling `get_customer` and `lookup_order`, the agent has all available system data but still faces uncertainty. Which situation is the most justified trigger for calling `escalate_to_human`?\n\nWhich situation is most justified for escalation?", "options": [{"key": "A", "text": "A customer wants to cancel an order shipped yesterday and arriving tomorrow. The agent should escalate because the customer might change their mind after receiving the package."}, {"key": "B", "text": "A customer claims they didn’t receive an order, but tracking shows it was delivered and signed for at their address three days ago. The agent should escalate because presenting contradictory evidence could harm the customer relationship."}, {"key": "C", "text": "A customer requests competitor price matching. Your policies allow price adjustments for price drops on your own site within 14 days, but say nothing about competitor prices. The agent should escalate for policy interpretation."}, {"key": "D", "text": "A customer message contains both a billing question and a product return. The agent should escalate so a human can coordinate both issues in one interaction."}], "correct_answer": "C", "technical_explanation": "This is a genuine policy gap: company rules cover price drops on your own site but do not address competitor price matching. The agent must not invent policy and should escalate for human judgment on how to interpret or extend existing rules.", "distractor_analysis": [], "reference": "Practice test, Customer Support Agent scenario"}, {"id": "PT-Q51", "domain": 1, "domain_name": "Agentic Architecture & Orchestration", "subdomain_code": "1.4", "subdomain_name": "Workflow Enforcement and Handoff", "difficulty": "Intermediate", "question_type": "Medium", "reference_topic": "", "scenario": "Customer Support Agent", "question": "Production logs show that in 12% of cases your agent skips `get_customer` and calls `lookup_order` directly using only the customer-provided name, sometimes leading to misidentified accounts and incorrect refunds. What change most effectively fixes this reliability problem?\n\nWhat change is most effective?", "options": [{"key": "A", "text": "Add few-shot examples showing that the agent always calls `get_customer` first, even when customers voluntarily provide order details."}, {"key": "B", "text": "Implement a routing classifier that analyzes each request and enables only a subset of tools appropriate for that request type."}, {"key": "C", "text": "Add a programmatic precondition that blocks `lookup_order` and `process_refund` until `get_customer` returns a verified customer identifier."}, {"key": "D", "text": "Strengthen the system prompt stating that customer verification via `get_customer` is mandatory before any order operations."}], "correct_answer": "C", "technical_explanation": "A programmatic precondition provides a deterministic guarantee that required sequencing is followed. It’s the most effective approach because it eliminates the possibility of skipping verification, regardless of LLM behavior.", "distractor_analysis": [], "reference": "Practice test, Customer Support Agent scenario"}, {"id": "PT-Q52", "domain": 4, "domain_name": "Prompt Engineering & Structured Output", "subdomain_code": "4.6", "subdomain_name": "Multi-Instance and Multi-Pass Review", "difficulty": "Intermediate", "question_type": "Long", "reference_topic": "", "scenario": "Customer Support Agent", "question": "Production metrics show that when resolving complex billing disputes or multi-order returns, customer satisfaction scores are 15% lower than for simple cases—even when the resolution is technically correct. Root-cause analysis shows the agent provides accurate solutions but inconsistently explains rationale: sometimes omitting relevant policy details, sometimes missing timeline info or next steps. The specific context gaps vary case by case. You want to improve solution quality without adding human oversight. What approach is most effective?", "options": [{"key": "A", "text": "Add a self-critique stage where the agent evaluates a draft response for completeness—ensuring it resolves the customer’s issue, includes relevant context, and anticipates follow-up questions."}, {"key": "B", "text": "Add a confirmation stage where the agent asks “Does this fully resolve your issue?” before closing, allowing customers to request additional information if needed."}, {"key": "C", "text": "Upgrade the model from Haiku to Sonnet for complex cases, routing based on a defined complexity metric."}, {"key": "D", "text": "Implement few-shot examples in the system prompt showing complete explanations for five common complex case types, demonstrating how to include policy context, timelines, and next steps."}], "correct_answer": "A", "technical_explanation": "A self-critique stage (the evaluator-optimizer pattern) directly addresses inconsistent explanation completeness by forcing the agent to assess its own draft against concrete criteria—such as policy context, timelines, and next steps—before presenting it. This catches case-specific gaps without human oversight.", "distractor_analysis": [], "reference": "Practice test, Customer Support Agent scenario"}, {"id": "PT-Q53", "domain": 1, "domain_name": "Agentic Architecture & Orchestration", "subdomain_code": "1.1", "subdomain_name": "Agentic Loops", "difficulty": "Intermediate", "question_type": "Medium", "reference_topic": "", "scenario": "Customer Support Agent", "question": "Production metrics show your agent averages 4+ API loops per resolution. Analysis reveals Claude often requests `get_customer` and `lookup_order` in separate sequential turns even when both are needed initially. What is the most effective way to reduce the number of loops?\n\nWhat is the most effective way to reduce loops?", "options": [{"key": "A", "text": "Implement speculative execution that automatically calls likely-needed tools in parallel with any requested tool and returns all results regardless of what was requested."}, {"key": "B", "text": "Increase `max_tokens` to give Claude more room to plan and naturally combine tool requests."}, {"key": "C", "text": "Create composite tools like `get_customer_with_orders` that bundle common lookup combinations into single calls."}, {"key": "D", "text": "Instruct Claude in the prompt to bundle tool requests into one turn and return all results together before the next API call."}], "correct_answer": "D", "technical_explanation": "Prompting Claude to bundle related tool requests into a single turn leverages its native ability to request multiple tools at onc <script>
/* Bank loader: reads every data-bank block and normalizes it. */
const DIFFICULTY_MAP = { 'fácil': 'easy', 'facil': 'easy', 'easy': 'easy', 'intermedia': 'intermediate', 'intermedio': 'intermediate', 'intermediate': 'intermediate', 'difícil': 'difficult', 'dificil': 'difficult', 'difficult': 'difficult' };
const LENGTH_MAP = { corta: 'short', media: 'medium', larga: 'long', short: 'short', medium: 'medium', long: 'long' };
const OPTION_TYPE_LABELS = { 'correcta': 'Correct', 'alternativa plausible': 'Plausible alternative', 'distractor conceptual': 'Conceptual distractor', 'distractor de confusión': 'Confusion distractor' };
const QUESTION_BANK = [], BANK_META = {}, BANK_ERRORS = [];

// Lines starting with "- ", "1.", "(1)" or "a)" become lists; indented lines become code.
const LIST_RE = /^(?:[-•*]\s+|\(?\d+[.)]\s+|\([a-z]\)\s+|[a-z][.)]\s+)/i;
function textToBlocks(text) {
  const blocks = [];
  String(text || '').replace(/\r\n?/g, '\n').split(/```[a-zA-Z0-9_-]*\n?/).forEach((chunk, i) => {
    if (i % 2 === 1) { if (chunk.trim()) blocks.push({ type: 'code', text: chunk.replace(/\n$/, '') }); return; }
    chunk.split(/\n\s*\n/).forEach(para => {
      if (!para.trim()) return;
      const lines = para.replace(/^\n+|\n+$/g, '').split('\n');
      if (lines.length > 1 && lines.some(l => /^(\t| {2,})\S/.test(l))) { blocks.push({ type: 'code', text: lines.join('\n') }); return; }
      let buf = [], list = null;
      const flushP = () => { if (buf.length) blocks.push({ type: 'p', text: buf.join('\n') }); buf = []; };
      const flushL = () => { if (list) blocks.push(list); list = null; };
      lines.forEach(l => {
        const t = l.trim(); if (!t) return;
        const m = t.match(LIST_RE);
        if (m) {
          flushP();
          const dash = /^[-•*]/.test(t);
          if (!list || list.plain === dash) { flushL(); list = { type: 'list', plain: !dash, items: [] }; }
          list.items.push(dash ? t.slice(m[0].length) : t);
        } else { flushL(); buf.push(t); }
      });
      flushP(); flushL();
    });
  });
  return blocks;
}

function normalizeQuestion(raw, lang, source) {
  const where = `${source}, question ${raw && raw.id ? raw.id : '(no id)'}`;
  const opts = Array.isArray(raw.options) ? raw.options
    : ['a', 'b', 'c', 'd'].filter(k => raw['option_' + k] != null).map(k => ({ key: k.toUpperCase(), text: raw['option_' + k] }));
  if (opts.length !== 4) throw new Error(`${where}: needs exactly 4 options.`);
  const keys = opts.map(o => String(o.key).trim().toUpperCase());
  const correct = keys.indexOf(String(raw.correct_answer || '').trim().toUpperCase());
  if (correct < 0) throw new Error(`${where}: correct_answer doesn’t match any option key.`);
  const difficulty = DIFFICULTY_MAP[String(raw.difficulty || '').trim().toLowerCase()];
  if (!difficulty) throw new Error(`${where}: unknown difficulty “${raw.difficulty}”.`);
  const domain = Number(raw.domain);
  if (!domain) throw new Error(`${where}: missing domain number.`);
  const analysisList = Array.isArray(raw.distractor_analysis) ? raw.distractor_analysis
    : keys.map(k => ({ key: k, type: raw['type_' + k.toLowerCase()], explanation: raw['analysis_' + k.toLowerCase()] }));
  const analysis = {};
  analysisList.forEach(a => {
    const idx = keys.indexOf(String(a.key || '').trim().toUpperCase());
    if (idx >= 0 && idx !== correct) {
      const type = String(a.type || '').trim();
      analysis[idx] = { type, typeLabel: OPTION_TYPE_LABELS[type.toLowerCase()] || type, text: a.explanation || '' };
    }
  });
  const code = raw.subdomain_code != null ? String(raw.subdomain_code) : '';
  return {
    id: String(raw.id), domain, domainName: raw.domain_name || '',
    subdomainCode: code, subdomain: [code, raw.subdomain_name].filter(Boolean).join(' '),
    difficulty, length: LENGTH_MAP[String(raw.question_type || '').trim().toLowerCase()] || '',
    topic: raw.reference_topic || '', body: textToBlocks(raw.question),
    options: opts.map(o => String(o.text)), correct,
    explanation: raw.technical_explanation || '', analysis, reference: raw.reference || '', lang,
    scenario: raw.scenario || ''
  };
}

(function loadBanks() {
  const ids = new Set();
  document.querySelectorAll('script[type="application/json"][data-bank]').forEach(el => {
    const source = el.dataset.bank;
    let data;
    try { data = JSON.parse(el.textContent); } catch (err) { BANK_ERRORS.push(`${source} couldn’t be read: ${err.message}`); return; }
    const list = Array.isArray(data) ? data : (data && data.questions) || [];
    const lang = (data && data.metadata && data.metadata.language) || 'es';
    list.forEach(raw => {
      try {
        const q = normalizeQuestion(raw, lang, source);
        if (ids.has(q.id)) throw new Error(`${source}: question id ${q.id} appears more than once.`);
        ids.add(q.id);
        QUESTION_BANK.push(q);
        const m = BANK_META[q.domain] || (BANK_META[q.domain] = { count: 0, domainName: q.domainName, source });
        m.count++;
      } catch (err) { BANK_ERRORS.push(err.message); }
    });
  });
})();
</script>
