ern as the documented 8% case. The programmatic gate eliminates that failure.", "distractor_analysis": [{"key": "A", "type": "Plausible alternative", "explanation": "Few-shot examples improve the probability, but do not guarantee compliance."}, {"key": "B", "type": "Correct", "explanation": "Correct."}, {"key": "C", "type": "Conceptual distractor", "explanation": "Routing decides which agent handles the request, not how that agent then behaves."}, {"key": "D", "type": "Confusion distractor", "explanation": "The audit detects cases after they happen; it does not prevent them."}], "reference": "1_4 (traps); Glossary (\"Prerequisite Gate\", \"Routing Pattern\")"}, {"id": "D1-Q24", "domain": "1", "domain_name": "Agentic Architecture & Orchestration", "subdomain_code": "1.4", "subdomain_name": "Workflow Enforcement and Handoff", "difficulty": "Intermediate", "question_type": "Medium", "reference_topic": "Multi-concern requests", "question": "A telecom customer writes: \"I want to switch to the 100 GB plan, dispute a roaming charge from last month, and update my billing address\". How should the agent handle this?", "options": [{"key": "A", "text": "Resolve the first concern, the plan change, and ask the customer to open new conversations for the other two, so each case stays separate."}, {"key": "B", "text": "Handle the concerns one at a time in successive replies, waiting for the customer's confirmation on each before moving to the next."}, {"key": "C", "text": "Decompose the request into three concerns, investigate them in parallel using the shared account context, and send a unified resolution in a single reply."}, {"key": "D", "text": "Pass the request through a routing classifier that picks the best agent for the main concern, which will handle the rest as secondary."}], "correct_answer": "C", "technical_explanation": "The documented pattern for multi-concern requests is: decompose, investigate in parallel with shared context, and give a unified resolution.", "distractor_analysis": [{"key": "A", "type": "Plausible alternative", "explanation": "It keeps cases separate, but forces the customer to open several conversations, an alternative the documentation advises against."}, {"key": "B", "type": "Confusion distractor", "explanation": "It addresses all three concerns, but sequentially, which the documentation marks as wrong."}, {"key": "C", "type": "Correct", "explanation": "Correct."}, {"key": "D", "type": "Conceptual distractor", "explanation": "Routing does not handle decomposition of the request."}], "reference": "1_4 (\"Multi-Concern Request Handling\")"}, {"id": "D1-Q25", "domain": "1", "domain_name": "Agentic Architecture & Orchestration", "subdomain_code": "1.4", "subdomain_name": "Workflow Enforcement and Handoff", "difficulty": "Difficult", "question_type": "Long", "reference_topic": "Self-contained handoff with several concerns", "question": "A customer asked for two things:\n1. Update their address. The agent resolved it.\n2. Dispute a duplicate charge of €312.40. A programmatic gate blocked the refund for exceeding the limit the agent can approve.\n\nThe agent must escalate the case. The human agent who receives it cannot see the conversation. The summary the system currently generates is: \"Customer upset about a charge. See the conversation for details. Review recommended\". Which handoff redesign is correct?", "options": [{"key": "A", "text": "Add the customer ID and a link to the full transcript to the current summary, so the human can check the timeline, amount and what the agent tried there."}, {"key": "B", "text": "Generate a summary with customer ID, conversation summary, root cause and recommended action, and express the amount as \"about €300\", since the human will verify the exact figure in the billing system."}, {"key": "C", "text": "Generate a self-contained summary with: customer ID; what they asked for (address, already resolved, and the charge dispute) and what the agent tried; root cause (duplicate charge); exact amount of €312.40; recommended action (approve the refund of the duplicate)."}, {"key": "D", "text": "Keep the summary brief and have the human agent contact the customer to gather the details, since a person is better placed to diagnose billing disputes."}], "correct_answer": "C", "technical_explanation": "The summary must be self-contained and cover what was asked and attempted (including the concern already resolved), the root cause, the exact amount and the recommended action.", "distractor_analysis": [{"key": "A", "type": "Conceptual distractor", "explanation": "It assumes the human has access to the transcript."}, {"key": "B", "type": "Confusion distractor", "explanation": "It has the right structure, but a vague amount breaks the requirement for a specific figure."}, {"key": "C", "type": "Correct", "explanation": "Correct."}, {"key": "D", "type": "Plausible alternative", "explanation": "The documentation says making the customer repeat everything is a poor experience."}], "reference": "1_4 (\"Structured Handoff Protocols\")"}, {"id": "D1-Q26", "domain": "1", "domain_name": "Agentic Architecture & Orchestration", "subdomain_code": "1.4", "subdomain_name": "Workflow Enforcement and Handoff", "difficulty": "Difficult", "question_type": "Long", "reference_topic": "Where to enforce compliance in multi-agent systems", "question": "An insurance system has three parts:\n- An intake classifier that routes each request to the right subagent. It is 99.5% accurate.\n- A billing subagent with the tools fraud_check and issue_payout.\n- A technical subagent.\n\nAn audit finds that, in a small percentage of cases, the billing subagent runs issue_payout without first running fraud_check. All of those cases were routed correctly.\n\nThe team puts forward four options. Which one is correct?", "options": [{"key": "A", "text": "Add a programmatic gate in the billing subagent's execution that blocks issue_payout until fraud_check has returned a passing result in the session, and returns an error naming the pending step."}, {"key": "B", "text": "Improve the intake classifier so it identifies fraud-risk cases and sends them to a billing subagent with stricter controls."}, {"key": "C", "text": "Configure a SubagentStart hook that prevents the billing subagent from being spawned when the request has not passed fraud_check, so it can never run issue_payout."}, {"key": "D", "text": "Strengthen the billing subagent's system prompt with explicit instructions and few-shot examples of the fraud_check → issue_payout flow, including the cases found in the audit."}], "correct_answer": "A", "technical_explanation": "The failure happens inside the subagent's execution, so the fix is a prerequisite gate at that point.", "distractor_analysis": [{"key": "A", "type": "Correct", "explanation": "Correct."}, {"key": "B", "type": "Conceptual distractor", "explanation": "Routing already works, and the glossary identifies it as the wrong answer for failures that occur during an agent's execution."}, {"key": "C", "type": "Confusion distractor", "explanation": "It uses a real hook, but SubagentStart cannot block the spawn; it can only add context. Controlling the spawn would require a PreToolUse hook on the Agent tool, and even that would not control the internal order of tools."}, {"key": "D", "type": "Plausible alternative", "explanation": "Prompts and few-shot examples are probabilistic."}], "reference": "1_4 (trap \"Routing classifiers\"; SubagentStart/SubagentStop table, background content not tested on the exam)"}, {"id": "D1-Q27", "domain": "1", "domain_name": "Agentic Architecture & Orchestration", "subdomain_code": "1.5", "subdomain_name": "Agent SDK Hooks", "difficulty": "Easy", "question_type": "Short", "reference_topic": "When PostToolUse runs", "question": "When does a PostToolUse hook run?", "options": [{"key": "A", "text": "Before the tool runs, to validate its input parameters."}, {"key": "B", "text": "After the tool runs and before the model processes the result."}, {"key": "C", "text": "After the model has processed the result, to audit the response it generated."}, {"key": "D", "text": "When the agent finishes with end_turn, to review all of the session's results."}], "correct_answer": "B", "technical_explanation": "PostToolUse runs after the tool and before the model processes the result, so it can transform that result.", "distractor_analysis": [{"key": "A", "type": "Conceptual distractor", "explanation": "It describes PreToolUse."}, {"key": "B", "type": "Correct", "explanation": "Correct."}, {"key": "C", "type": "Confusion distractor", "explanation": "It places the hook too late: by then the model would already have seen the untransformed result."}, {"key": "D", "type": "Plausible alternative", "explanation": "It does not match when any tool hook runs."}], "reference": "1_5 (\"Two Types of Hooks\")"}, {"id": "D1-Q28", "domain": "1", "domain_name": "Agentic Architecture & Orchestration", "subdomain_code": "1.5", "subdomain_name": "Agent SDK Hooks", "difficulty": "Easy", "question_type": "Short", "reference_topic": "Enforcing a threshold", "question": "A requirement states that no refund over $500 may be processed without human involvement. Which mechanism guarantees this?", "options": [{"key": "A", "text": "A system prompt instruction to escalate refunds over $500 to a human."}, {"key": "B", "text": "A PostToolUse hook on process_refund that detects amounts over $500 and alerts the human team."}, {"key": "C", "text": "A routing classifier that sends large refund requests to a specific agent."}, {"key": "D", "text": "A PreToolUse hook on process_refund that denies amounts over $500 and redirects to a human escalation workflow."}], "correct_answer": "D", "technical_explanation": "A PreToolUse hook on process_refund denies the call and redirects the case to a human, so the tool never runs.", "distractor_analysis": [{"key": "A", "type": "Plausible alternative", "explanation": "A prompt instruction is probabilistic."}, {"key": "B", "type": "Confusion distractor", "explanation": "It uses the wrong hook: by the time it runs, the money has already left."}, {"key": "C", "type": "Conceptual distractor", "explanation": "Routing does not apply thresholds to tool calls."}, {"key": "D", "type": "Correct", "explanation": "Correct."}], "reference": "1_5 (\"PreToolUse Hooks: Policy Enforcement\")"}, {"id": "D1-Q29", "domain": "1", "domain_name": "Agentic Architecture & Orchestration", "subdomain_code": "1.5", "subdomain_name": "Agent SDK Hooks", "difficulty": "Intermediate", "question_type": "Medium", "reference_topic": "Normalizing heterogeneous data", "question": "A furniture store's agent uses three MCP tools:\n- get_customer: dates as Unix timestamps and statuses as numeric codes.\n- lookup_order: dates as ISO 8601 and statuses as English strings.\n- check_shipping: dates as DD/MM/YYYY and statuses as letters (\"S\", \"P\").\n\nThe agent sometimes swaps day and month, or reads \"P\" as \"processed\". What is the right solution?", "options": [{"key": "A", "text": "Extend the system prompt with a detailed explanation of each date format and each status code, with conversion examples."}, {"key": "B", "text": "Add a PreToolUse hook that converts each tool's dates and statuses to a common format."}, {"key": "C", "text": "Add a PostToolUse hook that logs the formats detected in each result, so the model's interpretations can be audited later."}, {"key": "D", "text": "Add a PostToolUse hook that transforms each result (dates to ISO 8601, statuses to readable text) before the model processes it, returning it through updatedToolOutput."}], "correct_answer": "D", "technical_explanation": "Normalization is done in PostToolUse with updatedToolOutput, so the model always receives consistent data.", "distractor_analysis": [{"key": "A", "type": "Plausible alternative", "explanation": "Leaving the model to normalize formats is a documented trap, because it introduces inconsistency."}, {"key": "B", "type": "Conceptual distractor", "explanation": "PreToolUse does not see the tool's result."}, {"key": "C", "type": "Confusion distractor", "explanation": "It is the right hook, but it only logs; it does not transform the result."}, {"key": "D", "type": "Correct", "explanation": "Correct."}], "reference": "1_5 (\"PostToolUse Hooks: Data Normalisation\", traps)"}, {"id": "D1-Q30", "domain": "1", "domain_name": "Agentic Architecture & Orchestration", "subdomain_code": "1.5", "subdomain_name": "Agent SDK Hooks", "difficulty": "Intermediate", "question_type": "Medium", "reference_topic": "Rewriting arguments with PreToolUse", "question": "On a multi-tenant platform, audit requires that the search_orders tool never runs without the current customer's tenant_id filter. The model sometimes calls it without that filter. Which mechanism meets the requirement?", "options": [{"key": "A", "text": "A PostToolUse hook on search_orders that removes other customers' orders from the result before the model processes it."}, {"key": "B", "text": "A PreToolUse hook on search_orders that rewrites the arguments with updatedInput to add the correct tenant_id, or denies the call if it cannot determine it."}, {"key": "C", "text": "An explicit system prompt instruction to always include tenant_id, along with examples of correct calls."}, {"key": "D", "text": "A PostToolUse hook that checks whether the call included tenant_id and, if it was missing, blocks the loop so the agent does not continue."}], "correct_answer": "B", "technical_explanation": "PreToolUse can rewrite arguments with updatedInput, or deny the call, before the tool runs.", "distractor_analysis": [{"key": "A", "type": "Confusion distractor", "explanation": "The model would not see other tenants' data, but the unfiltered query would already have run, which breaks the requirement."}, {"key": "B", "type": "Correct", "explanation": "Correct."}, {"key": "C", "type": "Plausible alternative", "explanation": "A prompt instruction is probabilistic."}, {"key": "D", "type": "Conceptual distractor", "explanation": "Blocking in PostToolUse stops the loop, but does not undo the query that already ran."}], "reference": "1_5 (\"Two Types of Hooks\", permissionDecision and updatedInput)"}, {"id": "D1-Q31", "domain": "1", "domain_name": "Agentic Architecture & Orchestration", "subdomain_code": "1.5", "subdomain_name": "Agent SDK Hooks", "difficulty": "Difficult", "question_type": "Long", "reference_topic": "Choosing the mechanism for each requirement", "question": "A payments agent has three requirements:\n- R1. No international transfer (transfer_funds) may run unless aml_check has returned \"pass\" in the session. The requirement is regulatory and must hold 100% of the time.\n- R2. The tools return amounts in different formats (\"1.234,50\", 1234.5, \"EUR 1234.50\"), and the model sometimes misreads them.\n- R3. The company prefers markdown responses with headings. An occasional plain-text reply poses no risk.\n\nWhich design is the most appropriate?", "options": [{"key": "A", "text": "A PreToolUse hook on transfer_funds that denies the call while session state does not record an AML \"pass\", and a PostToolUse hook on aml_check that sets that state. For R2, a PostToolUse hook that normalizes amounts to decimal format with a currency code. For R3, a prompt instruction."}, {"key": "B", "text": "A PreToolUse hook for R1, a normalizing PostToolUse hook for R2 and, for R3, an extra hook that blocks and regenerates any response without markdown, so all three requirements are guaranteed deterministically."}, {"key": "C", "text": "A PostToolUse hook on transfer_funds that detects transfers made without AML and flags them for reversal. For R2, a normalizing PostToolUse hook. For R3, a prompt instruction."}, {"key": "D", "text": "For R1, detailed system prompt instructions with examples of each transfer type. For R2, a normalizing PostToolUse hook. For R3, a prompt instruction."}], "correct_answer": "A", "technical_explanation": "Each requirement gets its mechanism: PreToolUse with session state for AML, PostToolUse for normalization, and a prompt instruction for the formatting preference.", "distractor_analysis": [{"key": "A", "type": "Correct", "explanation": "Correct."}, {"key": "B", "type": "Plausible alternative", "explanation": "The documentation says a hook for formatting is unnecessary overhead."}, {"key": "C", "type": "Confusion distractor", "explanation": "It uses the wrong hook for AML, because the transfer would already have run."}, {"key": "D", "type": "Conceptual distractor", "explanation": "It applies a probabilistic mechanism to a 100% regulatory requirement."}], "reference": "1_5 (\"The Decision Framework\", build exercise steps 5 and 6)"}, {"id": "D1-Q32", "domain": "1", "domain_name": "Agentic Architecture & Orchestration", "subdomain_code": "1.5", "subdomain_name": "Agent SDK Hooks", "difficulty": "Difficult", "question_type": "Long", "reference_topic": "Manager approval", "question": "In an online store, approve_discount applies discounts to the customer's order immediately. Policy says discounts above 20% must wait for a manager's approval before being applied. Discounts of up to 20% are applied without intervention. The team proposes four implementations. Which one meets the policy?", "options": [{"key": "A", "text": "A PostToolUse hook on approve_discount that, when the discount exceeds 20%, sends the case to the manager's approval queue for review."}, {"key": "B", "text": "A system prompt instruction requiring the agent to consult the manager before approving any discount above 20%, with examples of how to request that approval."}, {"key": "C", "text": "A PreToolUse hook on approve_discount that, for discounts above 20%, halts execution and routes the request to the manager's approval queue. The tool runs only after approval."}, {"key": "D", "text": "A PreToolUse hook on approve_discount that uses updatedInput to reduce any larger discount to exactly 20%, so no call needs manager approval."}], "correct_answer": "C", "technical_explanation": "This is the documented manager-approval pattern: PreToolUse halts execution and routes to the queue, and the tool runs only after approval.", "distractor_analysis": [{"key": "A", "type": "Confusion distractor", "explanation": "The discount would already have been applied by the time the hook runs."}, {"key": "B", "type": "Plausible alternative", "explanation": "A prompt instruction is probabilistic."}, {"key": "C", "type": "Correct", "explanation": "Correct."}, {"key": "D", "type": "Conceptual distractor", "explanation": "updatedInput exists, but using it to cut the discount changes the business intent and sidesteps the approval the policy requires."}], "reference": "1_5 (\"Manager approval\")"}, {"id": "D1-Q33", "domain": "1", "domain_name": "Agentic Architecture & Orchestration", "subdomain_code": "1.5", "subdomain_name": "Agent SDK Hooks", "difficulty": "Difficult", "question_type": "Medium", "reference_topic": "Session event hooks (PreCompact)", "question": "A regulated team works with long Claude Code sessions that compact automatically when they reach the auto-compact window, and sometimes manually with /compact. Compliance requires archiving the full transcript before the summary discards detail. Which mechanism is right?", "options": [{"key": "A", "text": "A PostCompact hook that archives the transcript as soon as the compaction summary is generated."}, {"key": "B", "text": "A PreCompact hook, with auto and manual matchers, that receives the transcript path and archives it before compaction happens."}, {"key": "C", "text": "A PostToolUse hook on every tool that archives each tool result to a log as it is produced."}, {"key": "D", "text": "A PreToolUse hook that blocks tool calls when the context approaches the limit, so it never gets compacted."}], "correct_answer": "B", "technical_explanation": "PreCompact runs before compaction (manual and auto matchers), receives the transcript path and lets you archive it before detail is lost.", "distractor_analysis": [{"key": "A", "type": "Confusion distractor", "explanation": "PostCompact only observes what has already happened and carries the generated summary."}, {"key": "B", "type": "Correct", "explanation": "Correct."}, {"key": "C", "type": "Plausible alternative", "explanation": "It archives tool results, but not the full transcript."}, {"key": "D", "type": "Conceptual distractor", "explanation": "It uses a tool hook for a session event."}], "reference": "1_5 (\"Beyond PreToolUse and PostToolUse\", content beyond the exam guide)"}, {"id": "D1-Q34", "domain": "1", "domain_name": "Agentic Architecture & Orchestration", "subdomain_code": "1.6", "subdomain_name": "Task Decomposition Strategies", "difficulty": "Easy", "question_type": "Short", "reference_topic": "When to use a fixed pipeline", "question": "Which task best suits a fixed sequential pipeline (prompt chaining)?", "options": [{"key": "A", "text": "Debugging an intermittent failure in a system the team does not know."}, {"key": "B", "text": "Auditing the security of an undocumented legacy system."}, {"key": "C", "text": "Investigating why two inventories differ, with no known cause."}, {"key": "D", "text": "Extracting predefined fields from invoices with a known format."}], "correct_answer": "D", "technical_explanation": "Document extraction has predetermined fields and format, so it fits a fixed pipeline. The other tasks are open-ended investigations that call for dynamic decomposition.", "distractor_analysis": [{"key": "A", "type": "Confusion distractor", "explanation": "Debugging looks procedural, but the root cause is unknown."}, {"key": "B", "type": "Plausible alternative", "explanation": "An audit looks structured, but its scope is unknown."}, {"key": "C", "type": "Conceptual distractor", "explanation": "The scope is unknown."}, {"key": "D", "type": "Correct", "explanation": "Correct."}], "reference": "1_6 (\"Choosing a Pattern\")"}, {"id": "D1-Q35", "domain": "1", "domain_name": "Agentic Architecture & Orchestration", "subdomain_code": "1.6", "subdomain_name": "Task Decomposition Strategies", "difficulty": "Easy", "question_type": "Short", "reference_topic": "Symptoms of attention dilution", "question": "Which symptom indicates attention dilution in a single-pass review?", "options": [{"key": "A", "text": "Detailed analysis of the first items and shallow analysis of the last ones, and the same pattern flagged in one item but approved in an identical one."}, {"key": "B", "text": "A context-window-exceeded error midway through the review, forcing it to be repeated."}, {"key": "C", "text": "The loop stops early because the response begins with a text block."}, {"key": "D", "text": "The agent recommends fixing problems that were already fixed in files modified after the session."}], "correct_answer": "A", "technical_explanation": "The documented symptoms of attention dilution are decreasing depth and inconsistent evaluation of identical patterns.", "distractor_analysis": [{"key": "A", "type": "Correct", "explanation": "Correct."}, {"key": "B", "type": "Conceptual distractor", "explanation": "Dilution is not a window-capacity problem."}, {"key": "C", "type": "Plausible alternative", "explanation": "It is an agentic loop failure (1.1), not dilution."}, {"key": "D", "type": "Confusion distractor", "explanation": "It is the symptom of stale context (1.7)."}], "reference": "1_6 (\"The Attention Dilution Problem\")"}, {"id": "D1-Q36", "domain": "1", "domain_name": "Agentic Architecture & Orchestration", "subdomain_code": "1.6", "subdomain_name": "Task Decomposition Strategies", "difficulty": "Intermediate", "question_type": "Medium", "reference_topic": "Fixing attention dilution", "question": "An agent reviews 25 supplier contracts in a single pass. The first eight get a thorough analysis. In the last ones, obvious penalty clauses are missed. In addition, an auto-renewal clause is flagged as a risk in contract 4 and approved without comment in contract 21, with identical wording. What is the right solution?", "options": [{"key": "A", "text": "Use a more capable model with a larger context window, so all 25 contracts fit comfortably in a single pass."}, {"key": "B", "text": "Process the contracts in batches of five, each in its own pass, and then merge the five resulting reports."}, {"key": "C", "text": "Run a local analysis pass for each contract and then a cross-contract integration pass that reviews inconsistencies and relationships between them."}, {"key": "D", "text": "Use dynamic adaptive decomposition, so the model decides at runtime in what order to review the contracts."}], "correct_answer": "C", "technical_explanation": "The fix is structural: local passes per item plus a cross-item integration pass.", "distractor_analysis": [{"key": "A", "type": "Plausible alternative", "explanation": "The documentation says a better model or a larger window still leaves every item in one pass."}, {"key": "B", "type": "Confusion distractor", "explanation": "It reduces dilution, but without an integration pass it does not catch cross-batch issues, such as clause 4 versus clause 21."}, {"key": "C", "type": "Correct", "explanation": "Correct."}, {"key": "D", "type": "Conceptual distractor", "explanation": "It applies a pattern that does not fit this task."}], "reference": "1_6 (\"The Fix: Multi-Pass Architecture\", traps)"}, {"id": "D1-Q37", "domain": "1", "domain_name": "Agentic Architecture & Orchestration", "subdomain_code": "1.6", "subdomain_name": "Task Decomposition Strategies", "difficulty": "Intermediate", "question_type": "Medium", "reference_topic": "Dynamic decomposition in legacy code", "question": "A team must add tests to a legacy codebase that nobody fully understands. Undocumented dependencies between modules are likely to surface while writing tests. Which approach is right?", "options": [{"key": "A", "text": "A fixed pipeline that writes tests module by module, in alphabetical order, so execution is predictable and easy to monitor."}, {"key": "B", "text": "A single pass in which the agent analyzes all modules at once and generates all the tests together."}, {"key": "C", "text": "A fixed pipeline with a test plan prioritized at the start, which is not changed afterwards to keep consistency and make debugging easier."}, {"key": "D", "text": "Dynamic adaptive decomposition: map the structure, identify high-impact areas, create a prioritized plan, and re-prioritize it as dependencies are discovered (for example, test module B first if A depends on it)."}], "correct_answer": "D", "technical_explanation": "This is the documented example of dynamic decomposition: re-prioritizing as dependencies emerge.", "distractor_analysis": [{"key": "A", "type": "Plausible alternative", "explanation": "Predictable, but it does not adapt to what is discovered."}, {"key": "B", "type": "Conceptual distractor", "explanation": "A single pass over all modules causes attention dilution."}, {"key": "C", "type": "Confusion distractor", "explanation": "It includes a reasonable initial prioritization, but does not adapt to discoveries."}, {"key": "D", "type": "Correct", "explanation": "Correct."}], "reference": "1_6 (\"Dynamic Adaptive Decomposition\")"}, {"id": "D1-Q38", "domain": "1", "domain_name": "Agentic Architecture & Orchestration", "subdomain_code": "1.6", "subdomain_name": "Task Decomposition Strategies", "difficulty": "Difficult", "question_type": "Long", "reference_topic": "Choosing a pattern under operational requirements", "question": "A compliance department processes batches of 30 regulatory filings. All have a standard format and known fields. There are three requirements:\n1. Predictable runtime.\n2. Easy debugging of which step produced each result.\n3. Consistency across filings: detect whether the same entity appears with contradictory data in different documents.\n\nAn architect proposes dynamic adaptive decomposition \"because it is more sophisticated and flexible\". Which design is the most appropriate?", "options": [{"key": "A", "text": "Dynamic adaptive decomposition, which lets the agent decide in each batch which steps to run based on what it finds in the filings."}, {"key": "B", "text": "A fixed pipeline (prompt chaining) in three steps: an extraction pass per filing, a cross-filing integration pass to detect contradictions, and report compilation. The output of each step is logged."}, {"key": "C", "text": "A fixed pipeline with a single extraction pass that processes all 30 filings together, so the model sees every entity at once, followed by report compilation."}, {"key": "D", "text": "Dynamic adaptive decomposition with a fixed iteration cap per batch, so runtime is predictable without giving up flexibility."}], "correct_answer": "B", "technical_explanation": "With known steps and requirements for predictability and debuggability, a fixed pipeline is the right fit. Per-document passes plus an integration pass avoid dilution and detect contradictions across filings.", "distractor_analysis": [{"key": "A", "type": "Plausible alternative", "explanation": "It is the trap of picking what \"sounds more sophisticated\"."}, {"key": "B", "type": "Correct", "explanation": "Correct."}, {"key": "C", "type": "Confusion distractor", "explanation": "The pattern is right, but a single pass over 30 documents causes attention dilution."}, {"key": "D", "type": "Conceptual distractor", "explanation": "An iteration cap does not make the process predictable or easy to debug."}], "reference": "1_6 (traps; \"Fixed Sequential Pipelines\")"}, {"id": "D1-Q39", "domain": "1", "domain_name": "Agentic Architecture & Orchestration", "subdomain_code": "1.6", "subdomain_name": "Task Decomposition Strategies", "difficulty": "Difficult", "question_type": "Long", "reference_topic": "Batches without an integration pass", "question": "To avoid attention dilution, a team split the review of 60 files in a microservices system into six batches of 10. Each batch is reviewed in its own pass. Analysis depth is now uniform. However, an integration failure nobody caught occurred in production:\n- The orders service (batch 1) sends the field customer_ref.\n- The billing service (batch 5) expects customerId.\n\nIn addition, a retry pattern was approved in batch 2 and flagged as problematic in batch 6. Which change solves these problems?", "options": [{"key": "A", "text": "Increase the batch size to 20 files, so more related services are reviewed together in the same pass."}, {"key": "B", "text": "Run the six batches in parallel with subagents, to reduce latency and allow the review to be repeated more often."}, {"key": "C", "text": "Keep the local passes and add a dedicated integration pass that reviews data flow, API consistency and pattern usage across all files."}, {"key": "D", "text": "Repeat each batch's review with a prompt that explicitly asks it to consider how its files interact with the services in the other batches."}], "correct_answer": "C", "technical_explanation": "This is the documented trap of batching without an integration pass: cross-batch issues go undetected.", "distractor_analysis": [{"key": "A", "type": "Plausible alternative", "explanation": "It reduces the problem but does not eliminate it, and increases dilution within each batch."}, {"key": "B", "type": "Conceptual distractor", "explanation": "Latency is not the problem."}, {"key": "C", "type": "Correct", "explanation": "Correct."}, {"key": "D", "type": "Confusion distractor", "explanation": "Each batch cannot see the contents of the others, so it cannot evaluate their interactions."}], "reference": "1_6 (trap \"Batching files into groups…\")"}, {"id": "D1-Q40", "domain": "1", "domain_name": "Agentic Architecture & Orchestration", "subdomain_code": "1.7", "subdomain_name": "Session State and Resumption", "difficulty": "Easy", "question_type": "Short", "reference_topic": "Continuing with no changes", "question": "Yesterday a developer analyzed a module in a Claude Code session named payments-audit. Since then, nobody has changed any file. They want to continue exactly where they left off. What should they use?", "options": [{"key": "A", "text": "--resume payments-audit."}, {"key": "B", "text": "fork_session from yesterday's session."}, {"key": "C", "text": "A new session with an injected structured summary of yesterday's findings."}, {"key": "D", "text": "A new session started with --name payments-audit, to recover the history associated with that name."}], "correct_answer": "A", "technical_explanation": "If nothing has changed and the context is still valid, --resume continues the session with its full history.", "distractor_analysis": [{"key": "A", "type": "Correct", "explanation": "Correct."}, {"key": "B", "type": "Conceptual distractor", "explanation": "fork_session is for divergence, not continuation."}, {"key": "C", "type": "Plausible alternative", "explanation": "It would work, but the documentation says resume is more efficient when the context is still valid."}, {"key": "D", "type": "Confusion distractor", "explanation": "--name names a new session; only --resume recovers an existing one."}], "reference": "1_7 (\"Option 1\", note on session names)"}, {"id": "D1-Q41", "domain": "1", "domain_name": "Agentic Architecture & Orchestration", "subdomain_code": "1.7", "subdomain_name": "Session State and Resumption", "difficulty": "Easy", "question_type": "Medium", "reference_topic": "Defining the stale context problem", "question": "A developer resumes a session after editing several files overnight. The agent recommends changes that are already applied and refers to code that no longer exists. What best describes this problem?", "options": [{"key": "A", "text": "The agent is reasoning from tool results stored in the history that no longer reflect the current state of the modified files."}, {"key": "B", "text": "Part of the history was lost when the session was resumed, so the agent is rebuilding the analysis from incomplete information."}, {"key": "C", "text": "The agent does not inherit the previous session's context, because each resumed session is treated as an isolated subagent."}, {"key": "D", "text": "The context window filled up with too many tool calls, causing truncation due to max_tokens."}], "correct_answer": "A", "technical_explanation": "This is the documented definition of the stale context problem: the agent reasons from stored tool results that no longer match the current files.", "distractor_analysis": [{"key": "A", "type": "Correct", "explanation": "Correct."}, {"key": "B", "type": "Conceptual distractor", "explanation": "resume restores the full history; the problem is precisely that it restores it."}, {"key": "C", "type": "Plausible alternative", "explanation": "It confuses sessions with subagent isolation."}, {"key": "D", "type": "Confusion distractor", "explanation": "It describes truncation, not stale data."}], "reference": "1_7 (\"The Stale Context Problem\")"}, {"id": "D1-Q42", "domain": "1", "domain_name": "Agentic Architecture & Orchestration", "subdomain_code": "1.7", "subdomain_name": "Session State and Resumption", "difficulty": "Intermediate", "question_type": "Medium", "reference_topic": "Stale context and targeted re-analysis", "question": "A developer modified 4 core files in a 60-file codebase. Most of the previous session's reasoning relied on those 4 files. The other 56 have not changed, and there is no time to analyze them again. A colleague suggests: \"Resume the session and ask it to re-read the 4 files\". What is the best approach?", "options": [{"key": "A", "text": "Resume the session and ask it to re-read the 4 modified files, since the new reads will replace the old ones in the history."}, {"key": "B", "text": "Use fork_session from the previous session and re-read the 4 files in the new branch, leaving the original intact as a reference."}, {"key": "C", "text": "Start a new session with a structured summary of the findings that still hold, listing the 4 modified files for targeted re-analysis."}, {"key": "D", "text": "Start a new session and re-analyze all 60 files from scratch, so no stale data remains in the context."}], "correct_answer": "C", "technical_explanation": "The documented answer is a new session with a structured summary and targeted re-analysis of the modified files.", "distractor_analysis": [{"key": "A", "type": "Confusion distractor", "explanation": "It is better than nothing, but the stale results remain in the history and can still influence reasoning."}, {"key": "B", "type": "Conceptual distractor", "explanation": "The branch inherits the stale context."}, {"key": "C", "type": "Correct", "explanation": "Correct."}, {"key": "D", "type": "Plausible alternative", "explanation": "No stale data, but it is wasteful and does not fit the available time."}], "reference": "1_7 (\"Targeted Re-Analysis\", traps)"}, {"id": "D1-Q43", "domain": "1", "domain_name": "Agentic Architecture & Orchestration", "subdomain_code": "1.7", "subdomain_name": "Session State and Resumption", "difficulty": "Intermediate", "question_type": "Medium", "reference_topic": "Degraded context with no file changes", "question": "After a multi-day research session, the history is full of tool results that are no longer relevant. The agent starts repeating itself, contradicts what it said earlier, and ignores recent results. No file has been modified. What is the most appropriate step?", "options": [{"key": "A", "text": "Stay in the same session and provide more context, adding new results and reminders of the important conclusions."}, {"key": "B", "text": "Use fork_session to get a clean branch from which to continue the research."}, {"key": "C", "text": "Close the CLI and resume the session with --resume to refresh the agent's state."}, {"key": "D", "text": "Start a new session with a curated summary of the facts and conclusions that are still relevant."}], "correct_answer": "D", "technical_explanation": "Degraded context is resolved with a new session and a curated summary, not by adding more context.", "distractor_analysis": [{"key": "A", "type": "Conceptual distractor", "explanation": "The documentation says the fix is not more context."}, {"key": "B", "type": "Confusion distractor", "explanation": "The branch inherits the cluttered history."}, {"key": "C", "type": "Plausible alternative", "explanation": "Resuming restores the same degraded history."}, {"key": "D", "type": "Correct", "explanation": "Correct."}], "reference": "1_7 (\"Option 3\"); Quick Reference (\"Stale context signals\")"}, {"id": "D1-Q44", "domain": "1", "domain_name": "Agentic Architecture & Orchestration", "subdomain_code": "1.7", "subdomain_name": "Session State and Resumption", "difficulty": "Difficult", "question_type": "Long", "reference_topic": "Session decision matrix", "question": "An architect is handling three situations this week:\n1. After an analysis session, the team updated several project dependencies. This may have indirectly changed the behavior of many files.\n2. With a session's analysis complete, she wants to compare a testing strategy against a documentation strategy, without either influencing the other.\n3. She wants to continue yesterday's work in another session, in which no file has changed.\n\nWhich combination is correct?", "options": [{"key": "A", "text": "(1) --resume and tell the agent which dependency files changed; (2) fork_session; (3) --resume."}, {"key": "B", "text": "(1) New session with an injected structured summary; (2) fork_session; (3) --resume."}, {"key": "C", "text": "(1) fork_session, to isolate the effects of the dependencies in a branch; (2) two parallel subagents that inherit the session's analysis; (3) --resume."}, {"key": "D", "text": "(1) New session with full re-exploration of the entire codebase; (2) fork_session; (3) new session with an injected structured summary."}], "correct_answer": "B", "technical_explanation": "It applies the documented decision matrix: (1) updated dependencies → new session with summary, because many files may have changed indirectly; (2) two approaches from the same analysis → fork_session; (3) no changes → --resume.", "distractor_analysis": [{"key": "A", "type": "Confusion distractor", "explanation": "Item 1 fails, because most of the context may no longer be valid."}, {"key": "B", "type": "Correct", "explanation": "Correct."}, {"key": "C", "type": "Conceptual distractor", "explanation": "The branch inherits the stale data, and subagents do not inherit context."}, {"key": "D", "type": "Plausible alternative", "explanation": "Re-exploring everything is wasteful, and in case 3 resume is more efficient."}], "reference": "1_7 (\"Decision Matrix\")"}, {"id": "D1-Q45", "domain": "1", "domain_name": "Agentic Architecture & Orchestration", "subdomain_code": "1.7", "subdomain_name": "Session State and Resumption", "difficulty": "Difficult", "question_type": "Medium", "reference_topic": "Resuming when nearly all context is still valid", "question": "A team is working in a session that analyzed 80 files. The team places high value on keeping the full reasoning history. Overnight, a colleague changed two peripheral configuration files that played almost no part in the analysis. Nearly all the context is still valid. What is the most efficient and reliable step?", "options": [{"key": "A", "text": "Start a new session with a structured summary of the findings and list the two configuration files for targeted re-analysis."}, {"key": "B", "text": "Use fork_session from the session, so the configuration changes are analyzed in a branch isolated from the main history."}, {"key": "C", "text": "Resume the session with --resume and explicitly tell the agent which two files changed, so it re-reads them."}, {"key": "D", "text": "Resume the session with --resume without mentioning the changes, since the agent will detect them when it re-reads those files."}], "correct_answer": "C", "technical_explanation": "The documentation says that if most of the context is still valid, resume and tell the agent which files changed.", "distractor_analysis": [{"key": "A", "type": "Plausible alternative", "explanation": "It is reliable, but less efficient, and discards the history the team wants to keep."}, {"key": "B", "type": "Conceptual distractor", "explanation": "fork_session is for divergence, not for handling changes."}, {"key": "C", "type": "Correct", "explanation": "Correct."}, {"key": "D", "type": "Confusion distractor", "explanation": "Resuming is right, but without a heads-up the agent may keep using the old data."}], "reference": "1_7 (trap \"Resuming a session when most…\", \"Option 1\")"}]}

{"metadata": {"title": "Question Bank – Domain 2: Tool Design & MCP Integration", "certification": "Claude Certified Architect – Foundations", "language": "en", "version": "1.0", "total_questions": 45, "difficulty_levels": ["Easy", "Intermediate", "Difficult"], "question_types": ["Short", "Medium", "Long"], "distractor_types": ["Correct", "Plausible alternative", "Conceptual distractor", "Confusion distractor"], "subdomains": [{"code": "2.1", "name": "Tool Interface Design"}, {"code": "2.2", "name": "Structured Error Responses"}, {"code": "2.3", "name": "Tool Distribution & Tool Choice"}, {"code": "2.4", "name": "MCP Server Integration"}, {"code": "2.5", "name": "Built-in Tools"}], "sources": ["2_1 Tool Interface Design", "2_2 Structured Error Responses", "2_3 Tool Distribution & Tool Choice", "2_4 MCP Server Integration", "2_5 Built-in Tools", "Glossary Domain 2", "Quick Reference Domain 2"]}, "questions": [{"id": "D2-Q01", "domain": "2", "domain_name": "Tool Design & MCP Integration", "subdomain_code": "2.1", "subdomain_name": "Tool Interface Design", "difficulty": "Easy", "question_type": "Short", "reference_topic": "Primary tool selection mechanism", "question": "When an agent has several tools available, what does the model use as its primary mechanism for deciding which one to call?", "options": [{"key": "A", "text": "The tool name, because it is the identifier that appears in the tool_use block."}, {"key": "B", "text": "The tool description, which the model reads to distinguish the tool's purpose, inputs and boundaries."}, {"key": "C", "text": "The input_schema: the model compares each tool's parameters with the data in the request and picks the one that fits best."}, {"key": "D", "text": "The few-shot tool selection examples included in the system prompt."}], "correct_answer": "B", "technical_explanation": "The documentation states that tool descriptions are the primary mechanism the LLM uses to select tools; they are not supplementary metadata. The Quick Reference adds that they matter more than tool names.", "distractor_analysis": [{"key": "A", "type": "Confusion distractor", "explanation": "This is the trap listed in the Quick Reference (\"Tool name is the primary selection signal\"). The name helps, but the primary signal is the description."}, {"key": "B", "type": "Correct", "explanation": "Correct."}, {"key": "C", "type": "Conceptual distractor", "explanation": "The input_schema defines how to build a valid call; it is not what the model mainly uses to decide which tool matches the request."}, {"key": "D", "type": "Plausible alternative", "explanation": "Few-shot examples can influence behaviour, but the documentation says they are not a sanctioned remedy for misselection and that they add tokens without addressing the cause."}], "reference": "2_1 Tool Interface Design (\"What You Need to Know\"); Quick Reference Domain 2 (\"Tool Description Design\", \"Common Exam Traps\")"}, {"id": "D2-Q02", "domain": "2", "domain_name": "Tool Design & MCP Integration", "subdomain_code": "2.1", "subdomain_name": "Tool Interface Design", "difficulty": "Easy", "question_type": "Short", "reference_topic": "Explicit boundaries between tools", "question": "Two tools held by the same agent cover closely related domains, and the model confuses them. Which element of a production-grade description explicitly tells the model when to use one instead of the other?", "options": [{"key": "A", "text": "The example queries the tool handles well."}, {"key": "B", "text": "The list of required fields in the input_schema."}, {"key": "C", "text": "Edge cases and limitations: what happens when inputs are outside the expected range and what the tool does not do."}, {"key": "D", "text": "Explicit boundaries, for example: \"Do NOT use for order-specific queries — use lookup_order for those\"."}], "correct_answer": "D", "technical_explanation": "Of the five elements of a production-grade description (purpose, inputs, example queries, edge cases and explicit boundaries), the fifth is the one that states when to use this tool versus similar tools in the same toolkit.", "distractor_analysis": [{"key": "A", "type": "Plausible alternative", "explanation": "Example queries help the model understand what the tool is for, but they do not state the boundary with the similar tool."}, {"key": "B", "type": "Conceptual distractor", "explanation": "Required fields describe the inputs, not the decision of when to prefer one tool over another."}, {"key": "C", "type": "Confusion distractor", "explanation": "This is element 4, very close to element 5, but it covers behaviour with out-of-range inputs and what the tool does not do, not the boundary with a specific other tool."}, {"key": "D", "type": "Correct", "explanation": "Correct."}], "reference": "2_1 Tool Interface Design (\"What Makes a Good Tool Description\")"}, {"id": "D2-Q03", "domain": "2", "domain_name": "Tool Design & MCP Integration", "subdomain_code": "2.1", "subdomain_name": "Tool Interface Design", "difficulty": "Easy", "question_type": "Medium", "reference_topic": "Splitting generic tools", "question": "A document analysis agent has a single tool, analyze_document, described as \"Analyses a document and returns results\". Users ask it for three very different things: extracting dates and amounts, summarising the main arguments, and checking whether a specific claim is supported by the document. The answers often do not match what was asked. What design change does the documentation recommend?", "options": [{"key": "A", "text": "Split it into purpose-specific tools such as extract_data_points, summarize_content and verify_claim_against_source, each with defined input and output contracts."}, {"key": "B", "text": "Keep analyze_document and add detailed instructions to the system prompt explaining how to interpret each of the three request types and what to return in each case."}, {"key": "C", "text": "Configure tool_choice to force a call to analyze_document on every turn, so the agent never answers without analysing."}, {"key": "D", "text": "Rename analyze_document to process_document_request, keeping a single tool with the same broad responsibility."}], "correct_answer": "A", "technical_explanation": "Generic tools with broad responsibilities create ambiguity, because a broad description fits many requests. The documentation recommends splitting them into purpose-specific tools with defined input and output contracts, each doing one narrow, clearly described job.", "distractor_analysis": [{"key": "A", "type": "Correct", "explanation": "Correct."}, {"key": "B", "type": "Plausible alternative", "explanation": "Prompt instructions may help a little, but they leave the cause untouched: an interface that is too broad. The documentation also warns that system prompt instructions can create unintended associations."}, {"key": "C", "type": "Conceptual distractor", "explanation": "Forcing the tool guarantees it is called, but does not solve which kind of analysis is needed. It is a misuse of tool_choice."}, {"key": "D", "type": "Confusion distractor", "explanation": "Renaming is a documented fix when two tools have similar names, but here the problem is the broad responsibility of a single tool, which stays the same."}], "reference": "2_1 Tool Interface Design (\"Tool Splitting\", \"Tool Renaming for Clarity\")"}, {"id": "D2-Q04", "domain": "2", "domain_name": "Tool Design & MCP Integration", "subdomain_code": "2.1", "subdomain_name": "Tool Interface Design", "difficulty": "Intermediate", "question_type": "Medium", "reference_topic": "First step against misrouting", "question": "A clinic assistant has two tools: get_patient (\"Retrieves patient information\") and lookup_appointment (\"Retrieves appointment details\"). Both accept identifiers in similar formats. The logs show that questions such as \"what time is my appointment C-4471?\" are frequently sent to get_patient. What is the most effective first step?", "options": [{"key": "A", "text": "Add six few-shot examples to the system prompt showing, for different phrasings of appointment queries, which tool the model should choose."}, {"key": "B", "text": "Implement a pre-processing layer that parses the user input and pre-selects the tool based on detected keywords."}, {"key": "C", "text": "Expand the descriptions with input formats, example queries, edge cases and when to use each one versus the other."}, {"key": "D", "text": "Consolidate both tools into a single lookup_record tool that accepts any identifier and internally decides which backend to query."}], "correct_answer": "C", "technical_explanation": "With a small toolkit and minimal descriptions, the root cause is that the descriptions do not differentiate the tools. Expanding them is the lowest-effort, highest-impact fix, and it addresses the cause directly.", "distractor_analysis": [{"key": "A", "type": "Confusion distractor", "explanation": "It looks like it corrects the model's behaviour, but it adds tokens and treats the effects without removing the cause: the descriptions still do not differentiate the tools."}, {"key": "B", "type": "Conceptual distractor", "explanation": "A routing classifier is over-engineered as a first step: it bypasses the LLM's natural language understanding and adds infrastructure."}, {"key": "C", "type": "Correct", "explanation": "Correct."}, {"key": "D", "type": "Plausible alternative", "explanation": "Consolidation is a valid long-term architectural choice, but it costs far more effort than expanding the descriptions. The exam favours proportionate first steps."}], "reference": "2_1 Tool Interface Design (\"In the exam\", \"Exam Traps\", \"Practice Scenario\")"}, {"id": "D2-Q05", "domain": "2", "domain_name": "Tool Design & MCP Integration", "subdomain_code": "2.1", "subdomain_name": "Tool Interface Design", "difficulty": "Intermediate", "question_type": "Medium", "reference_topic": "Conflicts with the system prompt", "question": "A team rewrote the descriptions of get_patient and lookup_appointment with the five recommended elements. Accuracy improved, but appointment questions that mention the patient (\"when is my daughter's appointment?\") still go to get_patient. The system prompt contains: \"Always check the patient's details first before proceeding\". What should the team do?", "options": [{"key": "A", "text": "Review and rephrase that system prompt instruction, because its wording creates an association with get_patient that overrides the descriptions."}, {"key": "B", "text": "Expand the description of lookup_appointment even further, adding new example queries that mention the patient's relatives."}, {"key": "C", "text": "Configure forced tool_choice with lookup_appointment, so the model cannot choose get_patient in these conversations."}, {"key": "D", "text": "Move the sentence \"Always check the patient's details first\" into the description of get_patient, so the rule is tied to the tool rather than the prompt."}], "correct_answer": "A", "technical_explanation": "Keyword-sensitive system prompt instructions can create unintended associations that override well-written descriptions. After updating descriptions, reread the system prompt and rephrase wording that matches a tool.", "distractor_analysis": [{"key": "A", "type": "Correct", "explanation": "Correct."}, {"key": "B", "type": "Plausible alternative", "explanation": "More examples in the description may help somewhat, but the cause of the remaining failure is the prompt instruction, which keeps pushing towards get_patient."}, {"key": "C", "type": "Conceptual distractor", "explanation": "Forced selection is for enforcing a specific mandatory step. Forcing lookup_appointment would break every query that genuinely needs get_patient."}, {"key": "D", "type": "Confusion distractor", "explanation": "It seems to remove the prompt conflict, but it keeps the same keyword association, now inside the description, and invites calling get_patient first in every case."}], "reference": "2_1 Tool Interface Design (\"System Prompt Interactions\", trap \"Ignoring system prompt wording…\")"}, {"id": "D2-Q06", "domain": "2", "domain_name": "Tool Design & MCP Integration", "subdomain_code": "2.1", "subdomain_name": "Tool Interface Design", "difficulty": "Intermediate", "question_type": "Short", "reference_topic": "Renaming tools to clarify their purpose", "question": "An agent has analyze_content and analyze_document, with almost identical names. analyze_content only processes web search results. You want to remove the confusion without touching the implementation. What do you do?", "options": [{"key": "A", "text": "Implement a classifier that, before each turn, decides which of the two tools is exposed to the model."}, {"key": "B", "text": "Merge the two tools into a single analyze tool with a source parameter."}, {"key": "C", "text": "Rename analyze_content to web_content and keep its generic description \"Analyses content\"."}, {"key": "D", "text": "Rename analyze_content to extract_web_results and give it a web-specific description."}], "correct_answer": "D", "technical_explanation": "When two tools have confusingly similar names, renaming fixes the overlap at the interface level. The documentation uses this exact example: analyze_content becomes extract_web_results with a web-specific description, and its purpose becomes clear without changing the implementation.", "distractor_analysis": [{"key": "A", "type": "Conceptual distractor", "explanation": "A pre-processing classifier adds infrastructure and bypasses the model's reasoning. It is over-engineering for an interface problem."}, {"key": "B", "type": "Plausible alternative", "explanation": "Merging can be valid in other contexts, but it requires changing the implementation, which contradicts the requirement."}, {"key": "C", "type": "Confusion distractor", "explanation": "The renaming goes in the right direction, but the generic description still does not differentiate the tools. The documentation pairs the new name with a specific description."}, {"key": "D", "type": "Correct", "explanation": "Correct."}], "reference": "2_1 Tool Interface Design (\"Tool Renaming for Clarity\")"}, {"id": "D2-Q07", "domain": "2", "domain_name": "Tool Design & MCP Integration", "subdomain_code": "2.1", "subdomain_name": "Tool Interface Design", "difficulty": "Difficult", "question_type": "Long", "reference_topic": "Diagnosing whether the cause is the description or the toolkit size", "question": "A team is reviewing two agents with tool selection problems:\n- Agent X: 4 tools. It systematically confuses find_client and find_alteration, which have one-line descriptions. The other two tools are selected correctly.\n- Agent Y: 20 tools of different kinds (queries, transformations and exports), all with detailed descriptions that already include the five elements. Its selection errors are spread across many tools.\n\nWhich remediation plan is most appropriate?", "options": [{"key": "A", "text": "Rewrite the descriptions of both agents with the five elements and explicit boundaries, because descriptions are the primary selection mechanism."}, {"key": "B", "text": "In X, expand the descriptions of the two tools being confused. In Y, redistribute the tools into agents with a defined role and a small set each."}, {"key": "C", "text": "Implement in both agents a routing classifier that pre-selects the tool based on keywords, since both show the same symptom."}, {"key": "D", "text": "In X, consolidate the two confused tools into one. In Y, expand the descriptions further with additional example queries."}], "correct_answer": "B", "technical_explanation": "Diagnose before you fix. A workable toolkit with two lookalike tools is a description problem (TS 2.1). A large toolkit of tools doing different jobs is a distribution problem: selection degrades through decision complexity alone, and no improvement in descriptions fixes it. Split by role into small sets.", "distractor_analysis": [{"key": "A", "type": "Confusion distractor", "explanation": "It applies the right rule to X, but also to Y, where descriptions are already good and the problem is the decision complexity of 20 tools."}, {"key": "B", "type": "Correct", "explanation": "Correct."}, {"key": "C", "type": "Conceptual distractor", "explanation": "The glossary says choosing a routing layer for a large toolkit is marked wrong, and for the small case it is over-engineering."}, {"key": "D", "type": "Plausible alternative", "explanation": "It swaps the remedies: consolidating is an expensive change as a first step in X, and in Y better descriptions do not reduce decision complexity."}], "reference": "2_1 Tool Interface Design (\"KEY CONCEPT\" and the note on 18 versus 4-5); Quick Reference Domain 2 (\"Count the tools before you pick the remedy\")"}, {"id": "D2-Q08", "domain": "2", "domain_name": "Tool Design & MCP Integration", "subdomain_code": "2.1", "subdomain_name": "Tool Interface Design", "difficulty": "Difficult", "question_type": "Long", "reference_topic": "Production-grade description", "question": "A courier company has an agent with two tools: track_package and get_account. The agent often sends account questions to track_package. Which of these descriptions for track_package is most suitable for production?", "options": [{"key": "A", "text": "\"Tracks packages. Always use it whenever the user mentions a shipment, a customer or a delivery; it is the agent's main tool.\""}, {"key": "B", "text": "\"Returns the status of a package from its tracking number (format TRK-NNNNNNNN). Examples: 'where is my package TRK-12345678?', 'when will my shipment arrive?'. If the number does not exist, it returns an empty result.\""}, {"key": "C", "text": "\"Returns the status, location and estimated delivery date of a package from its tracking number (format TRK-NNNNNNNN). Use it when the user asks about a specific shipment, e.g. 'where is my package TRK-12345678?'. It does not modify shipments. Do not use it for account, billing or saved-address data: use get_account.\""}, {"key": "D", "text": "\"Queries the logistics system's /v2/shipments endpoint with a GET and returns the raw JSON. Supports automatic retries and a five-minute cache.\""}], "correct_answer": "C", "technical_explanation": "Option C includes all five elements: what it does and returns, the input format, an example query, limitations (it does not modify shipments) and, above all, the explicit boundary against get_account, which is what fixes this misrouting.", "distractor_analysis": [{"key": "A", "type": "Conceptual distractor", "explanation": "It uses broad, keyword-sensitive wording (\"customer\") that creates exactly the association causing the problem, instead of delimiting the tool."}, {"key": "B", "type": "Confusion distractor", "explanation": "It is very close: it has purpose, format, examples and an edge case. But it lacks the explicit boundary against get_account, which is what causes the confusion in the scenario."}, {"key": "C", "type": "Correct", "explanation": "Correct."}, {"key": "D", "type": "Plausible alternative", "explanation": "It is technically detailed, but it describes the implementation instead of when to use the tool, what inputs it expects and where its responsibility ends."}], "reference": "2_1 Tool Interface Design (\"What Makes a Good Tool Description\", \"Production-grade\" example)"}, {"id": "D2-Q09", "domain": "2", "domain_name": "Tool Design & MCP Integration", "subdomain_code": "2.1", "subdomain_name": "Tool Interface Design", "difficulty": "Difficult", "question_type": "Long", "reference_topic": "Why few-shot examples do not fix misrouting", "question": "To fix misrouting between two tools with minimal descriptions, a team added eight few-shot examples to the system prompt. After two weeks it observes the following:\n- Queries similar to the examples are routed correctly.\n- Queries with new phrasings still go to the wrong tool.\n- Token consumption per request has risen noticeably.\n\nThe team must decide the next step. What is the diagnosis and the most appropriate action?", "options": [{"key": "A", "text": "The examples treat the symptoms, and the root cause remains: the descriptions do not differentiate the tools. Expand them with inputs, examples, edge cases and explicit boundaries."}, {"key": "B", "text": "Example coverage is insufficient. Add more few-shot examples covering the new phrasings detected in the logs over the last two weeks."}, {"key": "C", "text": "The model sometimes answers without the right tool. Configure tool_choice \"any\" so it always calls a tool."}, {"key": "D", "text": "The ambiguity is structural. Merge both tools into a single lookup_entity tool that internally decides which backend to query."}], "correct_answer": "A", "technical_explanation": "The documentation states that few-shot examples add token overhead without fixing why the model is confused: they address the effects and leave the cause. With two tools and minimal descriptions, the first step is to expand the descriptions.", "distractor_analysis": [{"key": "A", "type": "Correct", "explanation": "Correct."}, {"key": "B", "type": "Confusion distractor", "explanation": "It extends the same approach that is already failing: more tokens and the same root cause. It will never cover every possible phrasing."}, {"key": "C", "type": "Conceptual distractor", "explanation": "\"any\" guarantees that some tool is called, not the right one. The problem is not a missing call but a wrong choice."}, {"key": "D", "type": "Plausible alternative", "explanation": "It is a valid long-term architectural choice, but it requires much more effort than expanding the descriptions, which is the proportionate first step."}], "reference": "2_1 Tool Interface Design (trap \"Choosing few-shot examples…\", \"In the exam\"); Quick Reference Domain 2"}, {"id": "D2-Q10", "domain": "2", "domain_name": "Tool Design & MCP Integration", "subdomain_code": "2.2", "subdomain_name": "Structured Error Responses", "difficulty": "Easy", "question_type": "Short", "reference_topic": "Which category is retryable", "question": "In the structured error convention, in which category or categories should isRetryable: true be set?", "options": [{"key": "A", "text": "Only in validation, because the agent can correct the input and recover on its own."}, {"key": "B", "text": "In transient and permission, because in both cases the input does not need to change."}, {"key": "C", "text": "Only in transient."}, {"key": "D", "text": "It depends on the attempts already made: true during the first attempts of any category and false after a certain number."}], "correct_answer": "C", "technical_explanation": "isRetryable answers one narrow question: will resending this exact request work? Only transient errors get true, because the call was valid and the system was briefly unavailable. In the other categories something has to change first: the input, the request or the caller.", "distractor_analysis": [{"key": "A", "type": "Conceptual distractor", "explanation": "It confuses \"the agent can recover\" with \"resending the same call works\". A malformed ID fails the same way every time, so validation is false."}, {"key": "B", "type": "Confusion distractor", "explanation": "It is true that the input does not change in a permission error, but the calling principal has to change. Resending the same call with the same credentials fails again."}, {"key": "C", "type": "Correct", "explanation": "Correct."}, {"key": "D", "type": "Plausible alternative", "explanation": "Retry budgets are a reasonable policy in the agent, but isRetryable is a property of the error category, not of the number of attempts."}], "reference": "2_2 Structured Error Responses (\"What isRetryable Signals\")"}, {"id": "D2-Q11", "domain": "2", "domain_name": "Tool Design & MCP Integration", "subdomain_code": "2.2", "subdomain_name": "Structured Error Responses", "difficulty": "Easy", "question_type": "Short", "reference_topic": "Protocol errors versus execution errors", "question": "An agent calls an MCP tool with a name that does not exist on the server. How is this failure reported?", "options": [{"key": "A", "text": "As a JSON-RPC protocol error, with code and message and no result object, handled by the host application."}, {"key": "B", "text": "As a protocol error, but the model receives it as a tool_result and reasons about recovery just as with an execution error."}, {"key": "C", "text": "As a valid empty result, with isError: false and no content."}, {"key": "D", "text": "As a tool execution error, with isError: true and errorCategory \"validation\", since the call reached the server."}], "correct_answer": "A", "technical_explanation": "When the request is malformed (non-existent tool name, arguments that fail the input schema, or an internal server fault), the server sends a standard JSON-RPC protocol error with no result. The host application handles it, and the model never sees a tool result, because no tool ran.", "distractor_analysis": [{"key": "A", "type": "Correct", "explanation": "Correct."}, {"key": "B", "type": "Confusion distractor", "explanation": "It gets the layer right, but assumes the model receives the error as a result. With protocol errors no tool ran and the model sees no result."}, {"key": "C", "type": "Conceptual distractor", "explanation": "A valid empty result means the query ran and found no matches. Here nothing ran."}, {"key": "D", "type": "Plausible alternative", "explanation": "Execution errors exist, but they apply to tools that were found and ran. A non-existent name belongs to the protocol layer."}], "reference": "2_2 Structured Error Responses (\"Two Error Layers\")"}, {"id": "D2-Q12", "domain": "2", "domain_name": "Tool Design & MCP Integration", "subdomain_code": "2.2", "subdomain_name": "Structured Error Responses", "difficulty": "Easy", "question_type": "Medium", "reference_topic": "Business error and recovery", "question": "An online store has a process_refund tool. A customer requests a €1,200 refund, and the policy allows automatic refunds of up to €1,000. The request is technically correct. How should the tool respond and what should the agent do?", "options": [{"key": "A", "text": "errorCategory \"transient\" with isRetryable: true. The agent retries with an increasing delay until the system accepts the refund."}, {"key": "B", "text": "errorCategory \"validation\" with isRetryable: false. The agent corrects the input by splitting the refund into two €600 requests that do not exceed the limit."}, {"key": "C", "text": "errorCategory \"permission\" with isRetryable: false. The agent requests credentials from a supervisor with higher privileges and repeats the operation with them to authorise the amount."}, {"key": "D", "text": "errorCategory \"business\" with isRetryable: false and a customer-friendly description. The agent takes an alternative path, usually escalating to a person."}], "correct_answer": "D", "technical_explanation": "This is a business error: the request is valid but breaks a business rule. A retry never resolves it, because the same policy violation applies every time. The agent needs an alternative path, usually escalation, and a customer-friendly description lets it explain the reason to the customer.", "distractor_analysis": [{"key": "A", "type": "Conceptual distractor", "explanation": "It applies transient-error recovery to a business rule that does not change over time. The retries only waste calls."}, {"key": "B", "type": "Plausible alternative", "explanation": "It looks for an alternative path, but misclassifies the error, and the chosen path circumvents the policy instead of respecting it."}, {"key": "C", "type": "Confusion distractor", "explanation": "It looks similar because it is also false and requires a change, but the problem is not who is calling: the policy limit applies regardless of the account."}, {"key": "D", "type": "Correct", "explanation": "Correct."}], "reference": "2_2 Structured Error Responses (\"3. Business Errors\", trap \"Treating business errors as retryable\")"}, {"id": "D2-Q13", "domain": "2", "domain_name": "Tool Design & MCP Integration", "subdomain_code": "2.2", "subdomain_name": "Structured Error Responses", "difficulty": "Intermediate", "question_type": "Medium", "reference_topic": "Access failure versus valid empty result", "question": "An inventory tool returns an empty array when a product code is searched. The agent retries three times and then escalates to a person. Later analysis shows that the product simply does not exist in the catalogue and that the service worked throughout. What fixes the root cause?", "options": [{"key": "A", "text": "Add exponential backoff between retries so the inventory service is not overloaded."}, {"key": "B", "text": "Make the tool distinguish the two cases: a valid empty result with isError: false and resultCount: 0, versus an access failure with isError: true, errorCategory \"transient\" and isRetryable: true."}, {"key": "C", "text": "Instruct the agent in the system prompt never to retry inventory searches."}, {"key": "D", "text": "Return the empty result with isError: true, errorCategory \"validation\" and isRetryable: false, so the agent understands that resending the query is pointless and stops retrying."}], "correct_answer": "B", "technical_explanation": "The root cause is that the tool does not separate \"I could not query\" from \"I queried and found nothing\". A valid empty result is a successful query with no matches: it is not retried, and the answer is \"no results\". Responses must be structured so the two cases are clearly different.", "distractor_analysis": [{"key": "A", "type": "Conceptual distractor", "explanation": "It tunes the retry policy, but the problem is that something that is not a failure is being retried."}, {"key": "B", "type": "Correct", "explanation": "Correct."}, {"key": "C", "type": "Plausible alternative", "explanation": "It avoids useless retries, but it would also suppress legitimate retries when the service has a real transient failure."}, {"key": "D", "type": "Confusion distractor", "explanation": "It stops the retries, but labels a successful query as an error. The Quick Reference stresses that \"not found\" is not an error."}], "reference": "2_2 Structured Error Responses (\"Access Failure vs Valid Empty Result\"); Quick Reference Domain 2 (\"Critical distinction\")"}, {"id": "D2-Q14", "domain": "2", "domain_name": "Tool Design & MCP Integration", "subdomain_code": "2.2", "subdomain_name": "Structured Error Responses", "difficulty": "Intermediate", "question_type": "Medium", "reference_topic": "isRetryable: false does not mean give up", "question": "A tool returns isError: true with errorCategory \"validation\", isRetryable: false and the description \"Order ID must be in format #NNNNN (e.g. #12345). Received: 'order-778'\". The agent tells the user it cannot help and ends the task. What is wrong?", "options": [{"key": "A", "text": "The tool should have set isRetryable: true, because the agent can recover from a validation error."}, {"key": "B", "text": "Nothing in the tool. The agent should have escalated to a person, because the error is not retryable."}, {"key": "C", "text": "The agent reads false as \"give up\". It should correct the input following the description and make a new call."}, {"key": "D", "text": "The agent should resend the same call after a wait, because validation errors are often intermittent."}], "correct_answer": "C", "technical_explanation": "For validation, isRetryable: false means that resending this same call is pointless, not that the agent should give up. The agent recovers on its own by correcting the input, and the description tells it how. The boolean says whether to resend; errorCategory says what to do instead.", "distractor_analysis": [{"key": "A", "type": "Confusion distractor", "explanation": "This is the documented trap: it confuses \"the agent can recover\" with \"resending the same call works\". 'order-778' fails the same check every time."}, {"key": "B", "type": "Plausible alternative", "explanation": "Escalating is appropriate for business or permission errors, but with a validation error the agent can recover on its own."}, {"key": "C", "type": "Correct", "explanation": "Correct."}, {"key": "D", "type": "Conceptual distractor", "explanation": "It applies transient-error recovery. A wrong format is not intermittent and will fail the same way."}], "reference": "2_2 Structured Error Responses (\"2. Validation Errors\", traps \"Marking a validation error…\" and \"Reading isRetryable: false…\")"}, {"id": "D2-Q15", "domain": "2", "domain_name": "Tool Design & MCP Integration", "subdomain_code": "2.2", "subdomain_name": "Structured Error Responses", "difficulty": "Intermediate", "question_type": "Short", "reference_topic": "Where error metadata goes", "question": "According to the documentation, where should the errorCategory, isRetryable and description fields be placed in an MCP tool's response?", "options": [{"key": "A", "text": "In the CallToolResult's structuredContent, alongside isError: true. They are an application convention, not protocol fields."}, {"key": "B", "text": "As top-level fields of the CallToolResult, at the same level as isError, because the MCP protocol defines them."}, {"key": "C", "text": "In the error object of a JSON-RPC response, together with code and message."}, {"key": "D", "text": "Concatenated into the content text, for example \"transient | retryable | database timeout\", so the model reads them along with the message."}], "correct_answer": "A", "technical_explanation": "The errorCategory, isRetryable and description fields are an application convention, not part of the MCP envelope. The protocol's CallToolResult defines only content, structuredContent and isError, and structured data belongs in structuredContent.", "distractor_analysis": [{"key": "A", "type": "Correct", "explanation": "Correct."}, {"key": "B", "type": "Confusion distractor", "explanation": "The location seems natural, but the protocol does not define these fields in the envelope. It defines only content, structuredContent and isError."}, {"key": "C", "type": "Conceptual distractor", "explanation": "The error object belongs to JSON-RPC protocol errors, where no tool ran. Recovery metadata describes execution errors."}, {"key": "D", "type": "Plausible alternative", "explanation": "The model can read text, but this loses the structure. The documentation places this metadata in structuredContent."}], "reference": "2_2 Structured Error Responses (\"The Four Error Categories\"); Quick Reference Domain 2 (\"Tool Error Handling\")"}, {"id": "D2-Q16", "domain": "2", "domain_name": "Tool Design & MCP Integration", "subdomain_code": "2.2", "subdomain_name": "Structured Error Responses", "difficulty": "Difficult", "question_type": "Long", "reference_topic": "Error propagation in multi-agent systems", "question": "A coordinator asks a subagent to compare prices from six suppliers. The subagent gets responses from four. Suppliers 5 and 6 time out on the first attempt. The coordinator must then decide whether to widen the search or report to the user with what is available. How should the subagent behave?", "options": [{"key": "A", "text": "Return the prices of the four suppliers as a successful result, without mentioning the timeouts, so as not to interrupt the coordinator's flow with incomplete information or noise."}, {"key": "B", "text": "Abort as soon as the first timeout occurs and propagate the error to the coordinator, because a partial result could lead to a wrong decision."}, {"key": "C", "text": "Propagate each timeout to the coordinator as soon as it occurs, so the retry policy is managed centrally."}, {"key": "D", "text": "Retry the timeouts locally. If they still fail, report to the coordinator with the partial results from the fo
