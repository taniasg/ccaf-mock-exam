rence": "5_3 Error Propagation in Multi-Agent Systems (\"Access Failure vs Valid Empty Result\"); Quick Reference (\"Valid Empty Results vs Access Failures\")"}, {"id": "D5-Q19", "domain": "5", "domain_name": "Context Management & Reliability", "subdomain_code": "5.3", "subdomain_name": "Error Propagation in Multi-Agent Systems", "difficulty": "Intermediate", "question_type": "Medium", "reference_topic": "Silent error suppression", "question": "In a system that prepares renovation quotes, the materials pricing subagent catches a timeout and returns { \"results\": [], \"status\": \"success\" }. What is the most serious consequence of this design?", "options": [{"key": "A", "text": "The coordinator will interpret the empty list as an error and retry indefinitely, blocking the rest of the workflow."}, {"key": "B", "text": "The main risk is latency, because the coordinator waits for the full timeout before continuing."}, {"key": "C", "text": "The coordinator takes the search as successful and empty, makes no recovery attempt, and the quote goes out without materials costs."}, {"key": "D", "text": "None: an empty result marked as success is a valid empty result and the coordinator should accept it."}], "correct_answer": "C", "technical_explanation": "Silent suppression is the worst anti-pattern: by marking the failure as success, the coordinator has no reason to recover and the synthesis omits an entire area. It is especially dangerous because nobody can detect the gap.", "distractor_analysis": [{"key": "A", "type": "Confusion distractor", "explanation": "Inverts the effect: since the status says \"success\", the coordinator does not retry. The danger is not blocking but the invisibility of the failure."}, {"key": "B", "type": "Plausible alternative", "explanation": "Latency is a real cost, but a minor one. The critical problem is that the failure stays hidden and the final result is wrong."}, {"key": "C", "type": "Correct", "explanation": "Correct."}, {"key": "D", "type": "Conceptual distractor", "explanation": "Misapplies the valid-empty-result concept: it only applies if the query executed. Here the search never ran."}], "reference": "5_3 Error Propagation in Multi-Agent Systems (\"The Two Anti-Patterns\"; Exam Traps)"}, {"id": "D5-Q20", "domain": "5", "domain_name": "Context Management & Reliability", "subdomain_code": "5.3", "subdomain_name": "Error Propagation in Multi-Agent Systems", "difficulty": "Intermediate", "question_type": "Medium", "reference_topic": "Workflow termination", "question": "A research pipeline launches five subagents in parallel. Four finish successfully; the fifth hits a timeout it could not resolve locally and returns structured error context. Today, any exception makes the top-level handler abort the whole pipeline. How should the coordinator act?", "options": [{"key": "A", "text": "Assess the impact, continue with the four results, apply targeted recovery to the fifth, and annotate the limited coverage."}, {"key": "B", "text": "Force every subagent to retry in a loop until it succeeds, so no error ever reaches the coordinator."}, {"key": "C", "text": "Continue with the four results and leave the fifth subagent's area out of the report, to avoid presenting incomplete information."}, {"key": "D", "text": "Automatically relaunch the entire pipeline until all five subagents finish successfully."}], "correct_answer": "A", "technical_explanation": "Aborting everything over one failure is an anti-pattern that wastes completed work. The coordinator assesses the impact, continues with partial results or applies targeted recovery, and the synthesis annotates which areas have gaps.", "distractor_analysis": [{"key": "A", "type": "Correct", "explanation": "Correct."}, {"key": "B", "type": "Conceptual distractor", "explanation": "Misapplies local recovery: it is meant for transient failures, and persistent ones must be propagated with their context. Retrying endlessly only blocks the workflow."}, {"key": "C", "type": "Confusion distractor", "explanation": "It avoids termination, but falls into silent omission: without a coverage annotation, the gap looks like an irrelevant topic rather than an unavailable source."}, {"key": "D", "type": "Plausible alternative", "explanation": "It might eventually produce a complete result, but it discards four already valid results and repeats work disproportionately."}], "reference": "5_3 Error Propagation in Multi-Agent Systems (\"The Two Anti-Patterns\", \"Coverage Annotations\")"}, {"id": "D5-Q21", "domain": "5", "domain_name": "Context Management & Reliability", "subdomain_code": "5.3", "subdomain_name": "Error Propagation in Multi-Agent Systems", "difficulty": "Intermediate", "question_type": "Short", "reference_topic": "Local recovery from transient failures", "question": "Where should a subagent's transient failures (timeouts, rate limits) be handled in a multi-agent system?", "options": [{"key": "A", "text": "In the subagent itself, with retries and backoff, returning a generic \"search unavailable\" status once they are exhausted."}, {"key": "B", "text": "In the coordinator, which centralises retry logic for all subagents and applies a uniform policy."}, {"key": "C", "text": "In the subagent itself, which propagates only what it cannot resolve, with what it attempted and its partial results."}, {"key": "D", "text": "Nowhere: since transient failures resolve themselves, the subagent should return empty results and carry on."}], "correct_answer": "C", "technical_explanation": "Subagents should recover locally from transient failures (retries, fallback sources) and propagate only those they cannot resolve, always with what was attempted and the partial results. This reduces coordinator complexity.", "distractor_analysis": [{"key": "A", "type": "Confusion distractor", "explanation": "Local recovery is correct, but the generic status after exhausting retries hides the query, partial results and alternatives: another documented trap."}, {"key": "B", "type": "Plausible alternative", "explanation": "It can work, but forces the coordinator to manage every subagent's retries, exactly the complexity local recovery avoids."}, {"key": "C", "type": "Correct", "explanation": "Correct."}, {"key": "D", "type": "Conceptual distractor", "explanation": "Misapplies the notion of a transient failure: \"may succeed on retry\" does not mean it resolves itself. Returning empty is silent suppression."}], "reference": "5_3 Error Propagation in Multi-Agent Systems (\"Local Recovery for Transient Failures\"; Exam Traps)"}, {"id": "D5-Q22", "domain": "5", "domain_name": "Context Management & Reliability", "subdomain_code": "5.3", "subdomain_name": "Error Propagation in Multi-Agent Systems", "difficulty": "Difficult", "question_type": "Long", "reference_topic": "Access failure versus empty result in support", "question": "An online store's support agent uses lookup_orders. During an outage of the orders service, the tool catches the exception and returns the same thing as when a customer has no orders: {\"orders\": []}. The agent tells several customers that \"there are no orders on your account\", and some believe their account has been deleted. At the same time, the team wants to avoid pointless retries when the customer genuinely has no orders. Which design meets both goals?", "options": [{"key": "A", "text": "Escalate every query that returns an empty list to a human, since the agent cannot know whether it is a failure."}, {"key": "B", "text": "Return status \"success\" and an empty list in both cases, adding \"service unavailable\" in the message field during an outage, so the model reads it."}, {"key": "C", "text": "Distinguish the cases: during the outage, status \"error\" with a transient failureType and shouldRetry: true; with no orders, status \"success\" with an empty list and shouldRetry: false. The agent retries or reports the outage only in the first case."}, {"key": "D", "text": "Retry any empty response three times before reporting it to the customer, to cover possible outages."}], "correct_answer": "C", "technical_explanation": "Confusing access failures with valid empty results causes two problems: not retrying when you should and retrying queries that will always return nothing. A distinct structured signal for each case solves both.", "distractor_analysis": [{"key": "A", "type": "Conceptual distractor", "explanation": "Misapplies escalation: the agent can know if the tool reports properly. Escalating every empty list is disproportionate and does not fix the cause."}, {"key": "B", "type": "Confusion distractor", "explanation": "It seems to distinguish the cases, but the status still says success and the signal is left in free text, with no failureType or shouldRetry: the failure is still disguised as a result."}, {"key": "C", "type": "Correct", "explanation": "Correct."}, {"key": "D", "type": "Plausible alternative", "explanation": "It covers some outages, but retries valid empty results (against the second goal) and, once the retries are exhausted, still does not distinguish one case from the other."}], "reference": "5_3 Error Propagation in Multi-Agent Systems (\"Access Failure vs Valid Empty Result\", \"The Two Anti-Patterns\")"}, {"id": "D5-Q23", "domain": "5", "domain_name": "Context Management & Reliability", "subdomain_code": "5.3", "subdomain_name": "Error Propagation in Multi-Agent Systems", "difficulty": "Difficult", "question_type": "Long", "reference_topic": "Failure types and recovery strategy", "question": "A quoting system's coordinator receives four structured errors in the same run: (1) a timeout from a supplier's catalogue; (2) a query rejected for an invalid date format; (3) a quote that exceeds the customer's credit limit under a business rule; (4) access denied to the accounting history. Which mapping of strategies is correct?", "options": [{"key": "A", "text": "Apply the same exponential-backoff retry to all four, because a uniform strategy simplifies the coordinator."}, {"key": "B", "text": "Escalate all four to a human, since any failure in a quote has financial impact."}, {"key": "C", "text": "(1) retry; (2) correct the query; (3) escalate or find an alternative; (4) retry with exponential backoff, since permissions often take time to propagate."}, {"key": "D", "text": "(1) retry; (2) correct the query and rerun it; (3) escalate or find an alternative; (4) do not retry without an authorisation change."}], "correct_answer": "D", "technical_explanation": "Each failure type implies a different recovery: transient failures may succeed on retry; validation failures need a corrected query; business failures require escalation or an alternative; and permission failures cannot be retried without changing authorisation.", "distractor_analysis": [{"key": "A", "type": "Conceptual distractor", "explanation": "Uses a technique valid for transient failures across the board: retrying does not fix a malformed date, a business rule or a denied permission."}, {"key": "B", "type": "Plausible alternative", "explanation": "It is a safe option, but disproportionate: the transient and validation failures can be recovered without human intervention."}, {"key": "C", "type": "Confusion distractor", "explanation": "Gets three cases right, but treats the denied permission as transient. Permission failures are not retried without an authorisation change."}, {"key": "D", "type": "Correct", "explanation": "Correct."}], "reference": "5_3 Error Propagation in Multi-Agent Systems (\"Structured Error Context\" — 1. Failure type)"}, {"id": "D5-Q24", "domain": "5", "domain_name": "Context Management & Reliability", "subdomain_code": "5.3", "subdomain_name": "Error Propagation in Multi-Agent Systems", "difficulty": "Difficult", "question_type": "Medium", "reference_topic": "Partial results and coverage annotations", "question": "A research subagent retrieves three of the five regulatory sources it needs before the database stops responding; its retries and the fallback source also fail. The final report will be delivered on schedule regardless. Which combination of subagent and synthesis behaviour is appropriate?", "options": [{"key": "A", "text": "The subagent returns the structured error with the three sources as partial results; the synthesis uses them and notes that the regulatory section has limited coverage because the database was unavailable."}, {"key": "B", "text": "The subagent discards the three sources because the operation failed, and the synthesis waits for the database to return to include the complete section."}, {"key": "C", "text": "The subagent fills in the two missing sources with the model's general knowledge and marks the section as verified."}, {"key": "D", "text": "The subagent returns the structured error with the three sources; the synthesis uses them and presents the regulatory section as complete, because three sources are a sufficient sample."}], "correct_answer": "A", "technical_explanation": "Partial results are still useful and discarding them is wasteful. The synthesis must include coverage annotations stating which areas are well supported and which have gaps due to unavailable sources.", "distractor_analysis": [{"key": "A", "type": "Correct", "explanation": "Correct."}, {"key": "B", "type": "Plausible alternative", "explanation": "It aims for a complete result, but discarding partial results is wasteful and delaying the section conflicts with on-schedule delivery."}, {"key": "C", "type": "Conceptual distractor", "explanation": "Misapplies the idea of \"alternative approaches\": it refers to other sources or cached results, not to filling gaps with untraceable content presented as verified."}, {"key": "D", "type": "Confusion distractor", "explanation": "Propagation is correct, but the synthesis omits the coverage annotation: the reader does not know that two sources are missing or why."}], "reference": "5_3 Error Propagation in Multi-Agent Systems (\"Structured Error Context\" — partial results, \"Coverage Annotations\")"}, {"id": "D5-Q25", "domain": "5", "domain_name": "Context Management & Reliability", "subdomain_code": "5.4", "subdomain_name": "Codebase Exploration & Context Degradation", "difficulty": "Easy", "question_type": "Short", "reference_topic": "Symptom of context degradation", "question": "After several hours exploring a repository, which symptom indicates context degradation?", "options": [{"key": "A", "text": "The agent's responses take longer and longer to generate as the conversation grows."}, {"key": "B", "text": "It stops citing the specific classes and dependencies it found and talks about \"typical patterns\"."}, {"key": "C", "text": "The agent refuses to read new files because it considers it already knows the architecture."}, {"key": "D", "text": "The API returns an error because the request exceeds the maximum number of tokens in the context window."}], "correct_answer": "B", "technical_explanation": "Context degradation shows when the model stops using its earlier specific findings and falls back on generalities. It happens because recent verbose output dominates the context, and is unrelated to exhausting the available tokens.", "distractor_analysis": [{"key": "A", "type": "Plausible alternative", "explanation": "Latency may increase with a larger context, but it is not the documented symptom: degradation shows up as a loss of specific references."}, {"key": "B", "type": "Correct", "explanation": "Correct."}, {"key": "C", "type": "Conceptual distractor", "explanation": "Describes a behaviour the documentation does not associate with degradation: the model keeps exploring; what it loses is precision about what it already discovered."}, {"key": "D", "type": "Confusion distractor", "explanation": "Confuses degradation with exhausting the window. Degradation appears much earlier, with space still available: the model stops using earlier details."}], "reference": "5_4 Codebase Exploration & Context Degradation (\"Context Degradation\"); Glossary (\"Context Degradation\")"}, {"id": "D5-Q26", "domain": "5", "domain_name": "Context Management & Reliability", "subdomain_code": "5.4", "subdomain_name": "Codebase Exploration & Context Degradation", "difficulty": "Easy", "question_type": "Short", "reference_topic": "Why scratchpad files work", "question": "Why does a scratchpad file protect the findings of a long exploration against context degradation?", "options": [{"key": "A", "text": "Because it compresses the conversation history and frees tokens, just as /compact does."}, {"key": "B", "text": "Because its contents are automatically merged into every turn's system prompt, where they receive priority attention."}, {"key": "C", "text": "Because it sits outside the conversation context: degradation does not affect its contents and the agent rereads it when it needs those findings."}, {"key": "D", "text": "Because it should be opened once answers start getting vague, as an emergency measure to recover lost details."}], "correct_answer": "C", "technical_explanation": "The scratchpad is external persistence: the agent writes important findings to it and rereads it for later questions. Because it is outside the context, its contents do not degrade even when the conversation fills with verbose output.", "distractor_analysis": [{"key": "A", "type": "Conceptual distractor", "explanation": "Mixes up two distinct mechanisms: /compact summarises the conversation; the scratchpad compresses nothing, it stores findings outside it."}, {"key": "B", "type": "Confusion distractor", "explanation": "Invents an undocumented automatic injection mechanism. The protection comes from the file being outside the context and the agent rereading it."}, {"key": "C", "type": "Correct", "explanation": "Correct."}, {"key": "D", "type": "Plausible alternative", "explanation": "Confuses when to use it: the guide says to keep it from the start of any extended exploration as a deliberate strategy, not as an emergency patch."}], "reference": "5_4 Codebase Exploration & Context Degradation (\"Scratchpad Files\"); Quick Reference (\"Scratchpad Files\")"}, {"id": "D5-Q27", "domain": "5", "domain_name": "Context Management & Reliability", "subdomain_code": "5.4", "subdomain_name": "Codebase Exploration & Context Degradation", "difficulty": "Easy", "question_type": "Medium", "reference_topic": "Main value of subagents in exploration", "question": "A developer uses Claude Code to understand a legacy payroll system. The coordinator reads every file and runs every search itself. A colleague proposes delegating specific investigations (for example, \"trace the tax-withholding calculation from the endpoint to the database\") to subagents. What is the main benefit of this delegation?", "options": [{"key": "A", "text": "They run the investigations in parallel and reduce the total exploration time; that is their main value."}, {"key": "B", "text": "They allow a cheaper model to be used for exploration, reducing the cost per token."}, {"key": "C", "text": "Isolating verbose exploration in separate contexts and returning only structured summaries to the coordinator."}, {"key": "D", "text": "Subagents inherit the coordinator's history, so they know earlier findings without having them passed in."}], "correct_answer": "C", "technical_explanation": "The obvious interpretation is that subagents are for parallelisation, but their main value is context isolation: the verbose output stays in the subagent and the coordinator receives only the key findings.", "distractor_analysis": [{"key": "A", "type": "Confusion distractor", "explanation": "Parallelisation is real, but the documentation warns that it is the obvious interpretation and not the main benefit, which is context isolation."}, {"key": "B", "type": "Plausible alternative", "explanation": "It may be a secondary advantage in some deployments, but it is not the benefit the documentation highlights for limiting degradation."}, {"key": "C", "type": "Correct", "explanation": "Correct."}, {"key": "D", "type": "Conceptual distractor", "explanation": "Misunderstands how they work: a subagent starts with its own isolated context and does not see the parent's history."}], "reference": "5_4 Codebase Exploration & Context Degradation (\"Subagent Delegation\")"}, {"id": "D5-Q28", "domain": "5", "domain_name": "Context Management & Reliability", "subdomain_code": "5.4", "subdomain_name": "Codebase Exploration & Context Degradation", "difficulty": "Intermediate", "question_type": "Medium", "reference_topic": "Summary injection between phases", "question": "In phase 1, a coordinator builds a view of a monolith's architecture (layers, payment flow, main risks). When it launches the phase 2 subagents to investigate specific components, they reread the same modules and rediscover the architecture from scratch. What is the fix?", "options": [{"key": "A", "text": "Configure the phase 2 subagents to read the coordinator's conversation history when they start."}, {"key": "B", "text": "Summarise the key phase 1 findings and inject that summary into the initial context of each phase 2 subagent."}, {"key": "C", "text": "Run phase 2 in the coordinator itself, which already knows the architecture, instead of delegating it."}, {"key": "D", "text": "Copy the full phase 1 transcript into each phase 2 subagent's prompt, so no detail is lost."}], "correct_answer": "B", "technical_explanation": "This is the cold-start problem: phase 2 subagents do not receive the phase 1 findings and duplicate them. Injecting a phase 1 summary avoids the duplication and gives them the architectural context to ask the right questions.", "distractor_analysis": [{"key": "A", "type": "Conceptual distractor", "explanation": "Rests on a wrong assumption: subagents start with an isolated context and do not inherit the parent's history; expecting them to is a documented trap."}, {"key": "B", "type": "Correct", "explanation": "Correct."}, {"key": "C", "type": "Plausible alternative", "explanation": "It avoids the cold start, but gives up context isolation: all of phase 2's verbose output would accumulate in the coordinator."}, {"key": "D", "type": "Confusion distractor", "explanation": "It solves the cold start, but a full transcript can exceed the subagent's budget and fills it with verbose output. The right input is a summary of the key findings."}], "reference": "5_4 Codebase Exploration & Context Degradation (\"Summary Injection Between Phases\"; Exam Traps)"}, {"id": "D5-Q29", "domain": "5", "domain_name": "Context Management & Reliability", "subdomain_code": "5.4", "subdomain_name": "Codebase Exploration & Context Degradation", "difficulty": "Intermediate", "question_type": "Short", "reference_topic": "Proactive use of /compact", "question": "When should Claude Code's /compact command be used during an extended exploration session?", "options": [{"key": "A", "text": "Never: it is better to open a new session whenever the conversation grows too large."}, {"key": "B", "text": "At the start of the session, to load a precomputed summary of the repository into the context."}, {"key": "C", "text": "Only when the session nears the context limit, as a last resort to free space."}, {"key": "D", "text": "Proactively during the session, to maintain the quality of the context."}], "correct_answer": "D", "technical_explanation": "/compact summarises the conversation to free space while keeping the important information. The guide says to use it proactively, because it protects context quality and not just quantity.", "distractor_analysis": [{"key": "A", "type": "Plausible alternative", "explanation": "Restarting without saving state is a documented trap: all accumulated knowledge is lost."}, {"key": "B", "type": "Conceptual distractor", "explanation": "Misunderstands what /compact does: it does not load content; it summarises the existing conversation to reduce its context usage."}, {"key": "C", "type": "Confusion distractor", "explanation": "This is the documented trap: using it only at the limit ignores that degradation appears earlier, with free space still available."}, {"key": "D", "type": "Correct", "explanation": "Correct."}], "reference": "5_4 Codebase Exploration & Context Degradation (\"The /compact Command\"; Exam Traps)"}, {"id": "D5-Q30", "domain": "5", "domain_name": "Context Management & Reliability", "subdomain_code": "5.4", "subdomain_name": "Codebase Exploration & Context Degradation", "difficulty": "Difficult", "question_type": "Long", "reference_topic": "Crash recovery with state manifests", "question": "A coordinator directs three subagents that have spent four hours analysing an ERP's invoicing module. Midway through phase 2, a network outage kills the session. On resuming, the agents reread files they had already analysed and repeat searches. You must design the recovery mechanism as the exam guide presents it. Which design is correct?", "options": [{"key": "A", "text": "Enlarge the agents' context window so the session does not run out, thereby reducing the risk of a crash."}, {"key": "B", "text": "Each agent exports the list of files read and searches performed to a known location; on resume, the coordinator injects it so they do not repeat those reads."}, {"key": "C", "text": "Rely on resuming the same Claude Code session, since a resumed subagent keeps its full history."}, {"key": "D", "text": "Each agent exports its state to a manifest at a known location (explored paths, findings, current phase, next steps and pending questions); on resume, the coordinator loads it and injects it into the agents' prompts."}], "correct_answer": "D", "technical_explanation": "Guide v1.0 teaches structured state persistence: each agent exports a manifest with what it explored, its findings, the phase, next steps and pending items. The coordinator loads it on resume and injects it, so work continues from where it stopped.", "distractor_analysis": [{"key": "A", "type": "Conceptual distractor", "explanation": "Applies a capacity measure to a persistence problem: a network outage does not depend on window size, and without saved state the progress is lost anyway."}, {"key": "B", "type": "Confusion distractor", "explanation": "It avoids repeated reads, but the manifest omits findings, phase, next steps and pending questions: the agents would know where they had been, not what they found or what comes next."}, {"key": "C", "type": "Plausible alternative", "explanation": "Current documentation allows this in Claude Code, but the exam guide teaches the manifest and the lesson says to answer with it; it also does not cover cases where the session cannot be resumed."}, {"key": "D", "type": "Correct", "explanation": "Correct."}], "reference": "5_4 Codebase Exploration & Context Degradation (\"Crash Recovery via Structured State Manifests\", \"Current State\")"}, {"id": "D5-Q31", "domain": "5", "domain_name": "Context Management & Reliability", "subdomain_code": "5.4", "subdomain_name": "Codebase Exploration & Context Degradation", "difficulty": "Difficult", "question_type": "Long", "reference_topic": "Overall strategy for extended exploration", "question": "A chain of veterinary clinics is going to change the logic of its appointment system, legacy code that nobody on the current team knows. A developer plans a full-day exploration with a Claude Code agent. In a pilot, after two hours the agent was already giving generic answers and contradicting earlier findings, although it still had plenty of context space. Which plan is most appropriate?", "options": [{"key": "A", "text": "Keep a scratchpad from the start, delegate verbose investigations to subagents that return structured summaries, inject each phase's summary into the next, and use /compact proactively."}, {"key": "B", "text": "Preload the full repository structure and work with the largest window model available, so everything fits in the session."}, {"key": "C", "text": "Delegate to subagents with structured summaries, inject summaries between phases, and open a scratchpad as soon as answers become generic, using /compact when nearing the limit."}, {"key": "D", "text": "Have the coordinator do all the exploration itself, to keep every finding in a single coherent context."}], "correct_answer": "A", "technical_explanation": "It combines the four documented mitigations, each applied as recommended: the scratchpad as a deliberate strategy from the start, subagents to isolate verbose output, summaries between phases against cold starts, and proactive /compact to protect context quality.", "distractor_analysis": [{"key": "A", "type": "Correct", "explanation": "Correct."}, {"key": "B", "type": "Plausible alternative", "explanation": "Treats degradation as a token problem, when the pilot shows there was space to spare. Preloading the repository adds even more verbose output."}, {"key": "C", "type": "Confusion distractor", "explanation": "It has the right pieces, but uses the scratchpad as an emergency patch and /compact as a last resort; the guide says the opposite in both cases."}, {"key": "D", "type": "Conceptual distractor", "explanation": "Misunderstands the cause: concentrating all verbose output in one context is exactly what produces degradation."}], "reference": "5_4 Codebase Exploration & Context Degradation (all sections); Glossary (\"Context Degradation\")"}, {"id": "D5-Q32", "domain": "5", "domain_name": "Context Management & Reliability", "subdomain_code": "5.5", "subdomain_name": "Human Review & Confidence Calibration", "difficulty": "Easy", "question_type": "Short", "reference_topic": "Uncalibrated confidence scores", "question": "An extraction model returns a confidence of 0.95 for both a date field and an amount field. Which conclusion is correct?", "options": [{"key": "A", "text": "The model should be asked to justify its confidence in its reasoning, which turns the score into a calibrated measure."}, {"key": "B", "text": "Raising the automation threshold to 0.99 on every field is enough to use the scores for routing."}, {"key": "C", "text": "Both fields are correct about 95% of the time, although this should be confirmed against the system's aggregate accuracy."}, {"key": "D", "text": "They are not calibrated: the same 0.95 can imply different real accuracy depending on the field."}], "correct_answer": "D", "technical_explanation": "Raw confidence is relative, not absolute: a 0.95 can be right 88% of the time on one field type and 99% on another. To use it for routing it must be calibrated against a labelled validation set by building calibration curves.", "distractor_analysis": [{"key": "A", "type": "Conceptual distractor", "explanation": "Misapplies calibration: it is an external process against data with known answers, not a self-explanation by the model."}, {"key": "B", "type": "Plausible alternative", "explanation": "A higher threshold seems safer, but still relies on uncalibrated scores: nobody knows what real accuracy 0.99 corresponds to on each field."}, {"key": "C", "type": "Confusion distractor", "explanation": "Treats the score as an absolute probability and proposes validating it against the aggregate, which hides differences by field and document type."}, {"key": "D", "type": "Correct", "explanation": "Correct."}], "reference": "5_5 Human Review & Confidence Calibration (\"Field-Level Confidence Calibration\"); Glossary (\"Confidence Calibration\")"}, {"id": "D5-Q33", "domain": "5", "domain_name": "Context Management & Reliability", "subdomain_code": "5.5", "subdomain_name": "Human Review & Confidence Calibration", "difficulty": "Easy", "question_type": "Medium", "reference_topic": "Stratified random sampling", "question": "An accounting firm automates high-confidence payslip extractions and sends low-confidence ones to human review. The manager asks why the plan also includes periodically reviewing a random sample of high-confidence extractions. What is the correct justification?", "options": [{"key": "A", "text": "It is the only way to detect new errors in automated output and confirm each segment's accuracy."}, {"key": "B", "text": "To calculate the system's aggregate accuracy and check that it stays above the approved level."}, {"key": "C", "text": "It is not needed: thoroughly sampling the low-confidence ones, where errors concentrate, is enough."}, {"key": "D", "text": "To retrain the model on those samples so that its confidence becomes calibrated over time."}], "correct_answer": "A", "technical_explanation": "Stratified sampling has two purposes: measuring each segment's accuracy at regular intervals and detecting novel error patterns. Low-confidence extractions are already reviewed; high-confidence ones are not, so only sampling can uncover a systematic error in them.", "distractor_analysis": [{"key": "A", "type": "Correct", "explanation": "Correct."}, {"key": "B", "type": "Confusion distractor", "explanation": "It sounds like quality control, but the aggregate can stay stable while a segment fails. Sampling is analysed per stratum, not as a whole."}, {"key": "C", "type": "Plausible alternative", "explanation": "This is the trap of sampling only low confidence: those extractions are already reviewed, and a new high-confidence error would go unnoticed."}, {"key": "D", "type": "Conceptual distractor", "explanation": "Confuses the purpose of sampling (ongoing verification) with a model-improvement mechanism the documentation does not describe; calibration uses labelled validation sets."}], "reference": "5_5 Human Review & Confidence Calibration (\"Stratified Random Sampling\"); Glossary (\"Stratified Sampling\")"}, {"id": "D5-Q34", "domain": "5", "domain_name": "Context Management & Reliability", "subdomain_code": "5.5", "subdomain_name": "Human Review & Confidence Calibration", "difficulty": "Intermediate", "question_type": "Medium", "reference_topic": "Prioritising reviewer capacity", "question": "An insurer has two reviewers for about 1,500 daily claim-report extractions, and documents arrive throughout the day. How should their work queue be organised?", "options": [{"key": "A", "text": "In a queue ordered by uncertainty computed once at the start of the day; documents arriving later are added to the end."}, {"key": "B", "text": "In chronological order of arrival, so no document waits longer than another."}, {"key": "C", "text": "Splitting the same review percentage across all document types and confidence bands."}, {"key": "D", "text": "In a queue that is reordered by uncertainty as documents arrive."}], "correct_answer": "D", "technical_explanation": "Review capacity is limited and expensive, so it goes first to the most uncertain items: low confidence, ambiguous or contradictory documents and types with a history of poor accuracy. The order must be dynamic and update as documents arrive.", "distractor_analysis": [{"key": "A", "type": "Confusion distractor", "explanation": "It prioritises by the right criterion, but statically: a highly uncertain document arriving mid-morning ends up behind safer ones."}, {"key": "B", "type": "Plausible alternative", "explanation": "It is a fair and simple criterion, but spends capacity on clean extractions while the uncertain ones wait."}, {"key": "C", "type": "Conceptual distractor", "explanation": "Misapplies the idea of coverage: an even split is the documented trap, because it wastes time on what the model already handles well."}, {"key": "D", "type": "Correct", "explanation": "Correct."}], "reference": "5_5 Human Review & Confidence Calibration (\"Reviewer Capacity Prioritisation\")"}, {"id": "D5-Q35", "domain": "5", "domain_name": "Context Management & Reliability", "subdomain_code": "5.5", "subdomain_name": "Human Review & Confidence Calibration", "difficulty": "Intermediate", "question_type": "Long", "reference_topic": "The aggregate metrics trap", "question": "A plumbing-supplies distributor processes its documents with an extraction system that reports 96.6% overall accuracy on the amount field. Management proposes automating every extraction with confidence above 0.9. The breakdown by document type is: standard delivery notes 98.9% (94% of volume), handwritten receipts 58.2%, old scanned invoices 70.5% and foreign supplier invoices 49.7%. Which decision is most appropriate?", "options": [{"key": "A", "text": "Reduce review only on standard delivery notes, using the raw 0.9 confidence as the threshold and no sampling, since that segment is already validated."}, {"key": "B", "text": "Approve the proposal, since at 96.6% overall the high-confidence extractions are reliable across all types."}, {"key": "C", "text": "Do not decide on the overall figure: calibrate thresholds with a labelled set, reduce review only on standard delivery notes, with ongoing stratified sampling, and keep human review on the other types."}, {"key": "D", "text": "Keep human review on 100% of extractions, because no level of accuracy justifies removing it."}], "correct_answer": "C", "technical_explanation": "The volume-weighted average approaches the delivery-note figure and hides three segments with unacceptable accuracy. You must validate by type and field, calibrate thresholds, put sampling in place and only then reduce review on segments with validated accuracy.", "distractor_analysis": [{"key": "A", "type": "Confusion distractor", "explanation": "It picks the right segment, but uses an uncalibrated confidence and drops stratified sampling, which is what would detect a new error in that segment."}, {"key": "B", "type": "Conceptual distractor", "explanation": "This is the aggregate metrics trap: the overall figure says nothing about each segment, and here it hides error rates of up to 50%."}, {"key": "C", "type": "Correct", "explanation": "Correct."}, {"key": "D", "type": "Plausible alternative", "explanation": "It is the safest option, but wastes review capacity on an already validated segment; the guide allows reducing review where accuracy is demonstrated."}], "reference": "5_5 Human Review & Confidence Calibration (\"The Aggregate Metrics Trap\", \"Validation Before Automation\")"}, {"id": "D5-Q36", "domain": "5", "domain_name": "Context Management & Reliability", "subdomain_code": "5.5", "subdomain_name": "Human Review & Confidence Calibration", "difficulty": "Difficult", "question_type": "Medium", "reference_topic": "Validation order before automation", "question": "A team wants to reduce human review in a contract extraction system. Which sequence follows the recommended order?", "options": [{"key": "A", "text": "Calibrate confidence with a labelled set → set thresholds → measure accuracy by segment → reduce review → implement stratified sampling."}, {"key": "B", "text": "Reduce review on high-confidence extractions → measure the resulting aggregate accuracy → recalibrate if it drops → sample only the low-confidence ones."}, {"key": "C", "text": "Measure accuracy by type and field → calibrate confidence with a labelled set → set calibrated thresholds → reduce review on validated segments → implement stratified sampling."}, {"key": "D", "text": "Measure accuracy by type and field → calibrate confidence with a labelled set → set calibrated thresholds → implement stratified sampling → reduce review on validated segments."}], "correct_answer": "D", "technical_explanation": "The order matters because each step prevents a specific failure: measuring by segment avoids the aggregate trap; calibrating avoids using raw confidence; thresholds drive routing; sampling monitors what is automated; and only then is review reduced where accuracy is consistent.", "distractor_analysis": [{"key": "A", "type": "Plausible alternative", "explanation": "It contains every step, but sets thresholds before knowing which segments have unacceptable accuracy, and reduces review before ongoing verification exists."}, {"key": "B", "type": "Conceptual distractor", "explanation": "Starts with the final step based on the aggregate, and also samples only the low-confidence band: it combines several documented traps."}, {"key": "C", "type": "Confusion distractor", "explanation": "It only swaps the last two steps, but that matters: for a while there are automated extractions with no verification capable of detecting new errors."}, {"key": "D", "type": "Correct", "explanation": "Correct."}], "reference": "5_5 Human Review & Confidence Calibration (\"Validation Before Automation\")"}, {"id": "D5-Q37", "domain": "5", "domain_name": "Context Management & Reliability", "subdomain_code": "5.5", "subdomain_name": "Human Review & Confidence Calibration", "difficulty": "Difficult", "question_type": "Long", "reference_topic": "Detecting novel error patterns", "question": "Four months ago, a restaurant chain automated the extraction of supplier invoices with calibrated confidence above 0.95, after validating accuracy by document type. It only manually reviews low-confidence ones, ordered by uncertainty. A meat supplier changed its invoice layout and, since then, the system extracts its total with 0.99 confidence but picks up the pre-tax subtotal. The error was discovered at the quarterly accounting close. Which element of the process would have detected the problem earlier?", "options": [{"key": "A", "text": "Monitor the system's aggregate accuracy weekly and alert when it falls below 95%."}, {"key": "B", "text": "Raise the automation threshold from 0.95 to 0.98, so fewer extractions go unreviewed."}, {"key": "C", "text": "Ongoing stratified random sampling that includes the high-confidence band, by document type and field, verified by humans."}, {"key": "D", "text": "Stratified random sampling by document type and field, limited to the low-confidence band, where errors concentrate."}], "correct_answer": "C", "technical_explanation": "High-confidence extractions are automated and nobody sees them. If a novel error pattern appears, such as a supplier layout change, only stratified sampling of that band detects it before downstream processes fail.", "distractor_analysis": [{"key": "A", "type": "Conceptual distractor", "explanation": "Misapplies monitoring: one supplier's error barely moves the aggregate. The guide asks for monitoring by segment, not the average."}, {"key": "B", "type": "Plausible alternative", "explanation": "It reduces the automated volume, but the error occurs at 0.99 confidence: it would still be automated and unreviewed."}, {"key": "C", "type": "Correct", "explanation": "Correct."}, {"key": "D", "type": "Confusion distractor", "explanation": "It stratifies correctly, but excludes the band where the error appears. Low-confidence extractions are already reviewed; the blind spot is high confidence."}], "reference": "5_5 Human Review & Confidence Calibration (\"Stratified Random Sampling\"); Quick Reference (\"Decision Rules for the Exam\")"}, {"id": "D5-Q38", "domain": "5", "domain_name": "Context Management & Reliability", "subdomain_code": "5.5", "subdomain_name": "Human Review & Confidence Calibration", "difficulty": "Difficult", "question_type": "Long", "reference_topic": "Calibrated per-field thresholds", "question": "Using a validation set of 2,000 labelled invoices, a team builds calibration curves. At 0.90 confidence, date fields are correct 94% of the time and amount fields 82%; amounts only reach 94% from 0.97 upwards. The business requires at least 93% real accuracy to automate a field and wants to make the most of its few reviewers. How should routing work?", "options": [{"key": "A", "text": "A single 0.97 threshold for all fields, which guarantees at least 93% on both, with stratified sampling and human review below it."}, {"key": "B", "text": "Dates automated from 0.90 and amounts from 0.97, both with stratified sampling; below that, human review, prioritising the ambiguous zone near the threshold."}, {"key": "C", "text": "Dates automated from 0.90 and amounts from 0.97, with no additional sampling, because the thresholds are already calibrated on labelled data."}, {"key": "D", "text": "A 0.90 threshold on both fields plus a prompt instruction for the model to score amounts more conservatively."}], "correct_answer": "B", "technical_explanation": "The curves show that the same score means different accuracy depending on the field, so thresholds must be per field. What exceeds its calibrated threshold is automated with stratified sampling, what falls below goes to review, and the ambiguous zone gets priority review.", "distractor_analysis": [{"key": "A", "type": "Plausible alternative", "explanation": "It meets the accuracy requirement, but sends to review dates between 0.90 and 0.97 that already exceed 93%, wasting the reviewers' limited capacity."}, {"key": "B", "type": "Correct", "explanation": "Correct."}, {"key": "C", "type": "Confusion distractor", "explanation": "The thresholds are right, but dropping stratified sampling leaves automated output unmonitored: the initial calibration does not detect novel error patterns."}, {"key": "D", "type": "Conceptual distractor", "explanation": "Misapplies calibration: asking the model to self-assess differently is not calibrating against labelled data, and at 0.90 amounts are only 82% accurate."}], "reference": "5_5 Human Review & Confidence Calibration (\"Field-Level Confidence Calibration\", \"Stratified Random Sampling\")"}, {"id": "D5-Q39", "domain": "5", "domain_name": "Context Management & Reliability", "subdomain_code": "5.6", "subdomain_name": "Information Provenance & Multi-Source Synthesis", "difficulty": "Easy", "question_type": "Short", "reference_topic": "Fields of a claim-source mapping", "question": "According to the claim-source mapping pattern, what must each subagent finding include to preserve its provenance?", "options": [{"key": "A", "text": "Claim, the subagent's self-reported confidence level and the list of searches performed."}, {"key": "B", "text": "Claim, source URL, document name, relevant excerpt and publication date."}, {"key": "C", "text": "The claim with an inline link to the source within the prose."}, {"key": "D", "text": "Claim, source URL, relevance score, relevant excerpt and publication date."}], "correct_answer": "B", "technical_explanation": "Each finding must carry its provenance in a structure with five elements: the claim, the URL, the document title, the supporting passage and the publication or data collection date.", "distractor_analysis": [{"key": "A", "type": "Conceptual distractor", "explanation": "Mixes process traceability with provenance: it does not identify the claim's source, passage or date."}, {"key": "B", "type": "Correct", "explanation": "Correct."}, {"key": "C", "type": "Plausible alternative", "explanation": "Common in prototypes, but inline links are lost during summarisation; the guide reserves that approach for quick prototyping."}, {"key": "D", "type": "Confusion distractor", "explanation": "Very close, but replaces the document name with a relevance score. Relevance is useful metadata, but it does not identify the source."}], "reference": "5_6 Information Provenance & Multi-Source Synthesis (\"Structured Claim-Source Mappings\")"}, {"id": "D5-Q40", "domain": "5", "domain_name": "Context Management & Reliability", "subdomain_code": "5.6", "subdomain_name": "Information Provenance & Multi-Source Synthesis", "difficulty": "Easy", "question_type": "Medium", "reference_topic": "Conflicting credible sources", "question": "For a report on the furniture sector, two credible sources give different sales growth figures for the same year: an industry association reports 6% and a statistics institute 9%. The synthesis agent must write that section. What should it do?", "options": [{"key": "A", "text": "Include both values, each with its source, date and methodological context, annotating the conflict so the reader decides."}, {"key": "B", "text": "Include only the statistics institute's figure, as the more authoritative publisher, and cite the association in a footnote."}, {"key": "C", "text": "Publish the average (7.5%), noting that the sources differ."}, {"key": "D", "text": "Use the figure from the most recently published source, since date differences explain changes."}], "correct_answer": "A", "technical_explanation": "Arbitrarily choosing one value (the most recent, the average or the most authoritative publisher) destroys information and presents false certainty. The right approach is to annotate the conflict with both values and full attribution.", "distractor_analysis": [{"key": "A", "type": "Correct", "explanation": "Correct."}, {"key": "B", "type": "Confusion distractor", "explanation": "It keeps both sources visible, but still chooses one value as the result; choosing by authority is one of the documented arbitrary options."}, {"key": "C", "type": "Plausible alternative", "explanation": "It looks like a reasonable compromise, but creates a figure no source published and hides where each value comes from."}, {"key": "D", "type": "Conceptual distractor", "explanation": "Misapplies temporal awareness: dates help interpret differences, they do not license keeping one value. Besides, both figures measure the same year."}], "reference": "5_6 Information Provenance & Multi-Source Synthesis (\"Conflict Handling\"); Quick Reference (\"Source Attribution\")"}, {"id": "D5-Q41", "domain": "5", "domain_name": "Context Management & Reliability", "subdomain_code": "5.6", "subdomain_name": "Information Provenance & Multi-Source Synthesis", "difficulty": "Intermediate", "question_type": "Medium", "reference_topic": "Attribution loss in synthesis", "question": "In a research pipeline (search subagents → analysis → synthesis → report), the search subagents write their prose with inline links to sources. The final report contains sentences such as \"energy prices have risen significantly\", with no figure, source or date. Which change fixes the cause?", "options": [{"key": "A", "text": "Ask the report agent to append a bibliography of every source consulted in the pipeline."}, {"key": "B", "text": "Have subagents emit structured claim-source mappings and require the synthesis to preserve and merge them."}, {"key": "C", "text": "Add a final step in which a human reviews the report and looks up the source of each claim."}, {"key": "D", "text": "Have the synthesis agent keep the inline links from the subagents' prose and reproduce them next to each sentence it paraphrases."}], "correct_answer": "B", "technical_explanation": "Attribution is most often lost in synthesis, which compresses and paraphrases. Structured mappings are data, not prose, so they survive if the synthesis agent is explicitly instructed to preserve and merge them, making every claim in the report traceable.", "distractor_analysis": [{"key": "A", "type": "Conceptual distractor", "explanation": "Uses a list of sources as if it were traceability: it does not say which source supports each claim, nor does it recover the figure or date."}, {"key": "B", "type": "Correct", "explanation": "Correct."}, {"key": "C", "type": "Plausible alternative", "explanation": "It may recover some attribution, but arrives after it has been lost, is costly and does not fix the cause in the pipeline."}, {"key": "D", "type": "Confusion distractor", "explanation": "It seems to preserve attribution, but still relies on links inside prose that gets compressed; the guide says this format does not survive synthesis."}], "reference": "5_6 Information Provenance & Multi-Source Synthesis (\"Why Attribution Dies in Synthesis\"); Quick Reference (\"Source Attribution\")"}, {"id": "D5-Q42", "domain": "5", "domain_name": "Context Management & Reliability", "subdomain_code": "5.6", "subdomain_name": "Information Provenance & Multi-Source Synthesis", "difficulty": "Intermediate", "question_type": "Medium", "reference_topic": "Temporal awareness", "question": "A synthesis agent receives two findings on a city's hotel occupancy rate: 64% and 71%. Since the subagents' outputs include no dates, it marks them as contradictory and leaves both out of the report. In reality, one comes from a 2022 study and the other from 2024. Which change prevents this error?", "options": [{"key": "A", "text": "Treat every numerical difference between sources as a data quality issue and escalate it to a human analyst."}, {"key": "B", "text": "Tell the synthesis agent that, when figures differ, it should always keep the most recent and discard the other."}, {"key": "C", "text": "Add publication dates only in the final report's references section, without including them in the subagents' outputs."}, {"key": "D", "text": "Require publication or collection dates in subagent outputs and preserve them when merging."}], "correct_answer": "D", "technical_explanation": "Different dates explain different numbers. Without them, the synthesis agent cannot order two values for the same measure, mistakes a trend for a data quality issue and suppresses consistent findings. With dates kept through the merge, the report shows the trend next to its dates.", "distractor_analysis": [{"key": "A", "type": "Conceptual distractor", "explanation": "Generalises the very error being fixed: many differences are not conflicts but changes over time."}, {"key": "B", "type": "Plausible alternative", "explanation": "It would avoid the omission, but chooses a value arbitrarily and destroys the trend information that both data points show together."}, {"key": "C", "type": "Confusion distractor", "explanation": "It includes dates, but in the wrong place: the synthesis agent needs them in the outputs it receives in order to sequence the values before writing."}, {"key": "D", "type": "Correct", "explanation": "Correct."}], "reference": "5_6 Information Provenance & Multi-Source Synthesis (\"Temporal Awareness\"); Glossary (\"Temporal Annotation\")"}, {"id": "D5-Q43", "domain": "5", "domain_name": "Context Management & Reliability", "subdomain_code": "5.6", "subdomain_name": "Information Provenance & Multi-Source Synthesis", "difficulty": "Intermediate", "question_type": "Short", "reference_topic": "Format by content type", "question": "A synthesis report includes a supplier's annual margin trend, the news of its change of ownership and the technical installation requirements of its product. Which format suits each content type?", "options": [{"key": "A", "text": "Everything in tables, so the report has a uniform format that is easy to compare."}, {"key": "B", "text": "Margins in a table, change of ownership in prose and technical requirements in a structured list."}, {"key": "C", "text": "Everything in prose, because the synthesis agent preserves attribution better in continuous paragraphs."}, {"key": "D", "text": "Margins in a table, change of ownership in a chronological bulleted list and technical requirements in prose."}], "correct_answer": "B", "technical_explanation": "The synthesis agent chooses the format by content type: financial data in tables, news and current events in prose, and technical findings in structured lists.", "distractor_analysis": [{"key": "A", "type": "Plausible alternative", "explanation": "Uniformity looks tidy, but the guide identifies it as a trap: news in a table loses its narrative context."}, {"key": "B", "type": "Correct", "explanation": "Correct."}, {"key": "C", "type": "Conceptual distractor", "explanation": "Inverts the logic of attribution: prose is exactly where source details get lost; attribution is preserved with structured mappings."}, {"key": "D", "type": "Confusion distractor", "explanation": "Gets the financial data right, but swaps the other two: news reads best as narrative and technical content as a hierarchical list."}], "reference": "5_6 Information Provenance & Multi-Source Synthesis (\"Content-Appropriate Rendering\")"}, {"id": "D5-Q44", "domain": "5", "domain_name": "Context Management & Reliability", "subdomain_code": "5.6", "subdomain_name": "Information Provenance & Multi-Source Synthesis", "difficulty": "Difficult", "question_type": "Long", "reference_topic": "Completing analysis with conflicts intact", "question": "An analysis agent assesses a supplier's solvency and finds two annual revenue figures: €4.2M in the audited annual accounts (fiscal year ending in December) and €3.8M in an unaudited quarterly preview for the calendar year. Afterwards, the coordinator will decide whether to present both values, investigate further or escalate to an analyst. What should the analysis agent do?", "options": [{"key": "A", "text": "Mark the revenue field as null and state \"data not available\", to avoid propagating a possibly wrong figure."}, {"key": "B", "text": "Complete the analysis with the audited figure, as the more reliable one, and leave the preliminary figure in an internal note for the coordinator."}, {"key": "C", "text": "Finish the analysis with the conflict annotated (both values, source, context and a possible explanation), without resolving it."}, {"key": "D", "text": "Stop the analysis and escalate to the human analyst before continuing, because solvency cannot be assessed with conflicting data."}], "correct_answer": "C", "technical_explanation": "The analysis agent completes its work with the conflicts included and annotated, but does not resolve them: that decision belongs to the coordinator or the consumer, who may present both values, investigate or escalate.", "distractor_analysis": [{"key": "A", "type": "Conceptual distractor", "explanation": "Confuses a conflict with missing data: there are two documented values, and nulling them destroys information the coordinator needs."}, {"key": "B", "type": "Confusion distractor", "explanation": "It seems prudent and keeps the other figure, but the agent resolves the conflict itself and its analysis already depends on the chosen value, leaving the coordinator no real decision."}, {"key": "C", "type": "Correct", "explanation": "Correct."}, {"key": "D", "type": "Plausible alternative", "explanation": "Escalating is a legitimate option, but it belongs to the coordinator; stopping leaves the analysis unfinished when the guide says to complete it."}], "reference": "5_6 Information Provenance & Multi-Source Synthesis (\"Completing Analysis with Conflicts Intact\")"}, {"id": "D5-Q45", "domain": "5", "domain_name": "Context Management & Reliability", "subdomain_code": "5.6", "subdomain_name": "Information Provenance & Multi-Source Synthesis", "difficulty": "Difficult", "question_type": "Long", "reference_topic": "Established versus contested findings", "question": "A heating engineer uses a multi-agent system to review suppliers before buying stock. Three independent distributor reports agree on a rise in valve prices; only one manufacturer bulletin mentions a possible shortage of heat exchangers. The current report presents both claims in a single list, with the same tone of certainty and without stating their sources. Which pipeline design fixes the problem?", "options": [{"key": "A", "text": "Keep claim-source mappings through to the report, with inline citations, and separate established findings from contested or single-source ones in explicit sections, preserving how each source characterises its claim."}, {"key": "B", "text": "Have the report agent assign each claim a self-assessed certainty level and append the sources it remembers from the process."}, {"key": "C", "text": "Keep claim-source mappings at every stage and add inline citations, presenting all findings in a single list ordered by publication date."}, {"key": "D", "text": "Have the synthesis agent discard claims supported by a single source, so the report contains only confirmed findings."}], "correct_answer": "A", "technical_explanation": "Attribution must be kept at every stage, with citations in the final output. The guide also asks for separating established findings from contested ones and preserving the original characterisations and methodological context: three independent sources are not the same as one.", "distractor_analysis": [{"key": "A", "type": "Correct", "explanation": "Correct."}, {"key": "B", "type": "Conceptual distractor", "explanation": "Replaces structured provenance with self-assessment and memory: no claim is traceable to a specific source."}, {"key": "C", "type": "Confusion distractor", "explanation": "It solves traceability, but keeps everything in one list with equal weight: the reader still cannot see that one claim has three sources and the other only one."}, {"key": "D", "type": "Plausible alternative", "explanation": "It increases the report's certainty, but destroys information that may matter for the purchase; the guide asks to distinguish it, not remove it."}], "reference": "5_6 Information Provenance & Multi-Source Synthesis (\"Why Attribution Dies in Synthesis\" — established vs contested findings)"}]}
</script>

{"metadata": {"title": "Practical Test", "language": "en", "note": "Domain, subdomain and difficulty assigned by content."}, "questions": [{"id": "PT-Q01", "domain": 5, "domain_name": "Context Management & Reliability", "subdomain_code": "5.6", "subdomain_name": "Information Provenance & Multi-Source Synthesis", "difficulty": "Intermediate", "question_type": "Medium", "reference_topic": "", "scenario": "Multi-agent Research System", "question": "A document analysis agent discovers that two credible sources contain directly contradictory statistics for a key metric: a government report states 40% growth, while an industry analysis states 12%. Both sources look credible, and the discrepancy could materially affect the research conclusions. How should the document analysis agent handle this situation most effectively?\n\nWhich approach is most effective?", "options": [{"key": "A", "text": "Apply credibility heuristics to pick the most likely correct number, finish analysis with that value, and add a footnote mentioning the discrepancy."}, {"key": "B", "text": "Include both numbers in the analysis output without marking them as conflicting, letting the synthesis agent decide which to use based on broader context."}, {"key": "C", "text": "Stop analysis and immediately escalate to the coordinator, asking it to decide which source is more authoritative before continuing."}, {"key": "D", "text": "Complete analysis with both numbers, explicitly annotate the conflict with source attribution, and let the coordinator decide how to reconcile the data before passing to synthesis."}], "correct_answer": "D", "technical_explanation": "This approach preserves separation of responsibilities: the analysis agent completes its core work without blocking, preserves both conflicting values with clear attribution, and correctly passes reconciliation to the coordinator, which has broader context.", "distractor_analysis": [], "reference": "Practice test, Multi-agent Research System scenario"}, {"id": "PT-Q02", "domain": 1, "domain_name": "Agentic Architecture & Orchestration", "subdomain_code": "1.2", "subdomain_name": "Multi-Agent Orchestration", "difficulty": "Easy", "question_type": "Short", "reference_topic": "", "scenario": "Multi-agent Research System", "question": "The web-search and document-analysis agents have completed their tasks and returned results to the coordinator. What is the next step for creating an integrated research report?\n\nWhich next step is most appropriate?", "options": [{"key": "A", "text": "Each agent sends its results directly to the report-writing agent, bypassing the coordinator."}, {"key": "B", "text": "The document analysis agent requests web-search results and merges them internally."}, {"key": "C", "text": "The coordinator passes both sets of results to the synthesis agent for a unified integration."}, {"key": "D", "text": "The coordinator concatenates the raw outputs from both agents and returns them as the final result."}], "correct_answer": "C", "technical_explanation": "In a coordinator–subagent architecture, the coordinator forwards both result sets to the synthesis agent for centralized integration, preserving control and ensuring high-quality merging.", "distractor_analysis": [], "reference": "Practice test, Multi-agent Research System scenario"}, {"id": "PT-Q03", "domain": 5, "domain_name": "Context Management & Reliability", "subdomain_code": "5.3", "subdomain_name": "Error Propagation in Multi-Agent Systems", "difficulty": "Intermediate", "question_type": "Long", "reference_topic": "", "scenario": "Multi-agent Research System", "question": "A document analysis subagent frequently fails when processing PDF files: some have corrupted sections that trigger parsing exceptions, others are password-protected, and sometimes the parsing library hangs on large files. Currently, any exception immediately terminates the subagent and returns an error to the coordinator, which must decide whether to retry, skip, or fail the whole task. This causes excessive coordinator involvement in routine error handling. What architectural improvement is most effective?\n\nWhich improvement is most effective?", "options": [{"key": "A", "text": "Create a dedicated error-handling agent that monitors all failures via a shared queue and decides recovery actions, sending restart commands directly to subagents."}, {"key": "B", "text": "Configure the subagent to always return partial results with a success status, embedding error details in metadata; the coordinator treats all responses as successful."}, {"key": "C", "text": "Make the coordinator validate all documents before sending them to the subagent, rejecting documents that might cause failures."}, {"key": "D", "text": "Implement local recovery in the subagent for transient failures and escalate to the coordinator only errors it cannot resolve, including attempted steps and partial results."}], "correct_answer": "D", "technical_explanation": "Handle errors at the lowest level capable of resolving them. Local recovery reduces coordinator workload while still escalating truly unrecoverable issues with full context and partial progress.", "distractor_analysis": [], "reference": "Practice test, Multi-agent Research System scenario"}, {"id": "PT-Q04", "domain": 1, "domain_name": "Agentic Architecture & Orchestration", "subdomain_code": "1.6", "subdomain_name": "Task Decomposition Strategies", "difficulty": "Intermediate", "question_type": "Long", "reference_topic": "", "scenario": "Multi-agent Research System", "question": "After running the system on “AI impact on creative industries,” you observe that every subagent completes successfully: the web-search agent finds relevant articles, the document analysis agent summarizes them correctly, and the synthesis agent produces coherent text. However, final reports cover only visual art and completely miss music, literature, and film. In the coordinator logs, you see it decomposed the topic into three subtasks: “AI in digital art,” “AI in graphic design,” and “AI in photography.” What is the most likely root cause?", "options": [{"key": "A", "text": "The synthesis agent lacks instructions to detect coverage gaps."}, {"key": "B", "text": "The document analysis agent filters out non-visual sources due to overly strict relevance criteria."}, {"key": "C", "text": "The coordinator’s task decomposition is too narrow, assigning subagents work that does not cover all relevant areas."}, {"key": "D", "text": "The web-search agent’s queries are insufficient and should be broadened to cover more sectors."}], "correct_answer": "C", "technical_explanation": "The coordinator decomposed a broad topic only into visual-art subtasks, missing music, literature, and film entirely. Since subagents executed their assignments correctly, the narrow decomposition is the obvious root cause.", "distractor_analysis": [], "reference": "Practice test, Multi-agent Research System scenario"}, {"id": "PT-Q05", "domain": 5, "domain_name": "Context Management & Reliability", "subdomain_code": "5.6", "subdomain_name": "Information Provenance & Multi-Source Synthesis", "difficulty": "Difficult", "question_type": "Medium", "reference_topic": "", "scenario": "Multi-agent Research System", "question": "The web-search subagent returns results for only 3 of 5 requested source categories (competitor sites and industry reports succeed, but news archives and social feeds time out). The document analysis subagent successfully processes all provided documents. The synthesis subagent must produce a summary from mixed-quality upstream inputs. Which error-propagation strategy is most effective?", "options": [{"key": "A", "text": "Continue synthesis using only successful sources and produce an output without mentioning which data was unavailable."}, {"key": "B", "text": "The synthesis subagent returns an error to the coordinator, triggering a full retry or task failure due to incomplete data."}, {"key": "C", "text": "The synthesis subagent asks the coordinator to retry timed-out sources with a longer timeout before starting synthesis."}, {"key": "D", "text": "Structure the synthesis output with coverage annotations that indicate which conclusions are well-supported and where gaps exist due to unavailable sources."}], "correct_answer": "D", "technical_explanation": "Coverage annotations implement graceful degradation with transparency, preserving value from completed work while propagating uncertainty to enable informed decisions about confidence.", "distractor_analysis": [], "reference": "Practice test, Multi-agent Research System scenario"}, {"id": "PT-Q06", "domain": 5, "domain_name": "Context Management & Reliability", "subdomain_code": "5.3", "subdomain_name": "Error Propagation in Multi-Agent Systems", "difficulty": "Easy", "question_type": "Short", "reference_topic": "", "scenario": "Multi-agent Research System", "question": "The document analysis subagent encounters a corrupted PDF file that it cannot parse. When designing the system’s error handling, what is the most effective way to handle this failure?\n\nWhich approach is most effective?", "options": [{"key": "A", "text": "Return an error with context to the coordinator agent, allowing it to decide how to proceed."}, {"key": "B", "text": "Silently skip the corrupted document and continue processing the remaining files to avoid interrupting the workflow."}, {"key": "C", "text": "Automatically retry parsing the document three times with exponential backoff before reporting a failure."}, {"key": "D", "text": "Throw an exception that terminates the entire research workflow."}], "correct_answer": "A", "technical_explanation": "Returning an error with context to the coordinator is the most effective approach because it lets the coordinator make an informed decision—skip the file, try an alternative parsing method, or notify the user—while maintaining visibility into the failure.", "distractor_analysis": [], "reference": "Practice test, Multi-agent Research System scenario"}, {"id": "PT-Q07", "domain": 2, "domain_name": "Tool Design & MCP Integration", "subdomain_code": "2.1", "subdomain_name": "Tool Interface Design", "difficulty": "Intermediate", "question_type": "Long", "reference_topic": "", "scenario": "Multi-agent Research System", "question": "Production logs show a persistent pattern: requests like “analyze the uploaded quarterly report” are routed to the web-search agent 45% of the time instead of the document analysis agent. Reviewing tool definitions, you find that the web-search agent has a tool `analyze_content` described as “analyzes content and extracts key information,” while the document analysis agent has a tool `analyze_document` described as “analyzes documents and extracts key information.” How should you fix the misrouting problem?", "options": [{"key": "A", "text": "Add a pre-routing classifier that detects whether the user refers to uploaded files or web content before the coordinator decides on delegation."}, {"key": "B", "text": "Rename the web-search tool to `extract_web_results` and update its description to “processes and returns information retrieved from web search and URLs.”"}, {"key": "C", "text": "Add few-shot examples to the coordinator prompt showing correct routing: “User uploads a quarterly report → document analysis agent” and “User asks about a web page → web-search agent.”"}, {"key": "D", "text": "Expand the document analysis tool description with usage examples like “Use for uploaded PDFs, Word docs, and spreadsheets,” leaving the web-search tool unchanged."}], "correct_answer": "B", "technical_explanation": "Renaming the web-search tool to `extract_web_results` and updating its description to explicitly reference web search and URLs directly removes the root cause by eliminating semantic overlap between the two tool names and descriptions. This makes each tool’s purpose unambiguous, enabling the coordinator to reliably distinguish document analysis from web search.", "distractor_analysis": [], "reference": "Practice test, Multi-agent Research System scenario"}, {"id": "PT-Q08", "domain": 1, "domain_name": "Agentic Architecture & Orchestration", "subdomain_code": "1.2", "subdomain_name": "Multi-Agent Orchestration", "difficulty": "Easy", "question_type": "Medium", "reference_topic": "", "scenario": "Multi-agent Research System", "question": "A colleague proposes that the document analysis agent should send its results directly to the synthesis agent, bypassing the coordinator. What is the main advantage of keeping the coordinator as the central hub for all communication between subagents?\n\nWhat is the main advantage of keeping the coordinator as the central hub?", "options": [{"key": "A", "text": "The coordinator can observe all interactions, handle errors uniformly, and decide what information each subagent should receive."}, {"key": "B", "text": "The coordinator batches multiple requests to subagents, reducing total API calls and overall latency."}, {"key": "C", "text": "Routing through the coordinator enables automatic retry logic that direct inter-agent calls cannot support."}, {"key": "D", "text": "Subagents use isolated memory, and direct communication would require complex serialization that only the coordinator can perform."}], "correct_answer": "A", "technical_explanation": "The coordinator pattern provides centralized visibility into all interactions, uniform error handling across the system, and fine-grained control over what information each subagent receives—these are the primary advantages of a star-shaped communication topology.", "distractor_analysis": [], "reference": "Practice test, Multi-agent Research System scenario"}, {"id": "PT-Q09", "domain": 5, "domain_name": "Context Management & Reliability", "subdomain_code": "5.3", "subdomain_name": "Error Propagation in Multi-Agent Systems", "difficulty": "Easy", "question_type": "Short", "reference_topic": "", "scenario": "Multi-agent Research System", "question": "The web-search subagent times out while researching a complex topic. You need to design how information about this failure is returned to the coordinator. Which error-propagation approach best enables intelligent recovery?", "options": [{"key": "A", "text": "Return structured error context to the coordinator including the failure type, the query executed, any partial results, and potential alternative approaches."}, {"key": "B", "text": "Catch the timeout within the subagent and return an empty result set marked as successful."}, {"key": "C", "text": "Implement automatic exponential-backoff retries inside the subagent, only returning a generic “search unavailable” status after exhausting retries."}, {"key": "D", "text": "Propagate the timeout exception directly to the top-level handler, terminating the entire research workflow."}], "correct_answer": "A", "technical_explanation": "Returning structured error context—including failure type, executed query, partial results, and alternative approaches—gives the coordinator everything needed to make intelligent recovery decisions (e.g., retry with a modified query or continue with partial results). It preserves maximum context for informed coordination-level decision-making.", "distractor_analysis": [], "reference": "Practice test, Multi-agent Research System scenario"}, {"id": "PT-Q10", "domain": 2, "domain_name": "Tool Design & MCP Integration", "subdomain_code": "2.1", "subdomain_name": "Tool Interface Design", "difficulty": "Intermediate", "question_type": "Medium", "reference_topic": "", "scenario": "Multi-agent Research System", "question": "In your system design, you gave the document analysis agent access to a general-purpose tool `fetch_url` so it could download documents by URL. Production logs show this agent now frequently downloads search engine results pages to perform ad hoc web search—behavior that should be routed through the web-search agent—causing inconsistent results. Which fix is most effective?", "options": [{"key": "A", "text": "Replace `fetch_url` with a `load_document` tool that validates that URLs point to document formats."}, {"key": "B", "text": "Remove `fetch_url` from the document analysis agent and route all URL fetching through the coordinator to the web-search agent."}, {"key": "C", "text": "Implement filtering that blocks `fetch_url` calls to known search engine domains while allowing other URLs."}, {"key": "D", "text": "Add instructions to the document analysis agent prompt that `fetch_url` should only be used to download document URLs, not to search."}], "correct_answer": "A", "technical_explanation": "Replacing a general-purpose tool with a document-specific tool that validates URLs against document formats fixes the root cause by constraining capability at the interface level. This follows the principle of least privilege, making undesired search behavior impossible rather than merely discouraged.", "distractor_analysis": [], "reference": "Practice test, Multi-agent Research System scenario"}, {"id": "PT-Q11", "domain": 1, "domain_name": "Agentic Architecture & Orchestration", "subdomain_code": "1.6", "subdomain_name": "Task Decomposition Strategies", "difficulty": "Intermediate", "question_type": "Medium", "reference_topic": "", "scenario": "Multi-agent Research System", "question": "While researching a broad topic, you observe that the web-search agent and the document analysis agent investigate the same subtopics, leading to substantial duplication in their outputs. Token usage nearly doubles without a proportional increase in research breadth or depth. What is the most effective way to address this?", "options": [{"key": "A", "text": "Allow both agents to finish in parallel, then have the coordinator deduplicate overlapping results before passing them to the synthesis agent."}, {"key": "B", "text": "The coordinator explicitly partitions the research space before delegating, assigning each agent distinct subtopic
