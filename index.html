<script>
// Exam blueprint: domain numbering and weight in the certification exam.
const DOMAINS = [
  { id: 1, name: 'Agentic Architecture & Orchestration', weight: 0.27 },
  { id: 2, name: 'Tool Design & MCP Integration', weight: 0.18 },
  { id: 3, name: 'Claude Code Configuration & Workflows', weight: 0.20 },
  { id: 4, name: 'Prompt Engineering & Structured Output', weight: 0.20 },
  { id: 5, name: 'Context Management & Reliability', weight: 0.15 }
];
const DIFFICULTY = {
  easy: { label: 'Easy', level: 1 },
  intermediate: { label: 'Intermediate', level: 2 },
  difficult: { label: 'Difficult', level: 3 }
};
const EXAM_RULES = {
  officialQuestions: 60, officialMinutes: 120, minutesPerQuestion: 2,
  minScore: 100, passScore: 720, maxScore: 1000, warnAtMinutes: [15, 5],
  questionCounts: [10, 20, 30, 60]
};
const QUESTION_BY_ID = Object.fromEntries(QUESTION_BANK.map(q => [q.id, q]));
const EXAM_LEVELS = ['intermediate', 'difficult'];
const domainById = id => DOMAINS.find(d => d.id === Number(id));
EXAM_RULES.passRatio = (EXAM_RULES.passScore - EXAM_RULES.minScore) / (EXAM_RULES.maxScore - EXAM_RULES.minScore);
const PASS_PCT = Math.round(EXAM_RULES.passRatio * 100);
// Flag files whose domain name doesn't match the blueprint's numbering.
const BANK_WARNINGS = [];
Object.entries(BANK_META).forEach(([id, m]) => {
  const d = domainById(id);
  if (!d) BANK_WARNINGS.push(`${m.source} uses domain ${id}, which isn’t in the exam blueprint.`);
  else if (m.domainName && m.domainName.trim().toLowerCase() !== d.name.toLowerCase())
    BANK_WARNINGS.push(`${m.source} calls domain ${id} “${m.domainName}”, but in the blueprint domain ${id} is “${d.name}”. Check the domain number.`);
});

function shuffle(list) {
  const a = list.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

const ExamEngine = (() => {
  let s = null;

  // Exams use only intermediate and difficult questions.
  function pool(scope, difficulty) {
    return QUESTION_BANK.filter(q =>
      EXAM_LEVELS.includes(q.difficulty) &&
      (scope === 'full' || q.domain === Number(scope)) &&
      (difficulty === 'all' || q.difficulty === difficulty));
  }

  // Questions per domain. Full exams follow the blueprint weights, rounded
  // with the largest-remainder method so the parts always add up to the total.
  function quotas(config) {
    if (config.scope !== 'full') return [{ domain: Number(config.scope), n: config.count }];
    const parts = DOMAINS.map(d => {
      const exact = config.count * d.weight;
      return { domain: d.id, n: Math.floor(exact), rem: exact - Math.floor(exact), exact };
    });
    const left = config.count - parts.reduce((a, p) => a + p.n, 0);
    [...parts].sort((a, b) => b.rem - a.rem || b.exact - a.exact).slice(0, left).forEach(p => p.n++);
    return parts.map(({ domain, n }) => ({ domain, n }));
  }

  function plan(config) {
    const parts = quotas(config).map(q => {
      const available = pool(String(q.domain), config.difficulty).length;
      return { ...q, available, short: Math.max(0, q.n - available) };
    });
    return { parts, feasible: parts.every(p => p.short === 0) && parts.some(p => p.n > 0) };
  }

  // A new exam: random questions per domain without repeats, mixed together,
  // each with its own shuffled answer order. Answers are stored as ORIGINAL
  // option indices, so shuffling never affects the correct-answer mapping.
  function buildItems(config) {
    const pl = plan(config);
    if (!pl.feasible) return null;
    const picked = pl.parts.flatMap(p => shuffle(pool(String(p.domain), config.difficulty)).slice(0, p.n));
    return shuffle(picked).map(q => ({ qid: q.id, order: shuffle(q.options.map((_, k) => k)) }));
  }

  function score(session) {
    const items = session.items.map((item, index) => {
      const q = QUESTION_BY_ID[item.qid];
      const answer = session.answers[index];
      const status = answer === null ? 'unanswered' : (answer === q.correct ? 'correct' : 'incorrect');
      return { index, item, q, answer, status, marked: session.marked[index] };
    });
    const total = items.length;
    const count = st => items.filter(x => x.status === st).length;
    const correct = count('correct'), incorrect = count('incorrect'), unanswered = count('unanswered');
    const ratio = total ? correct / total : 0;
    const scoreValue = Math.round(EXAM_RULES.minScore + ratio * (EXAM_RULES.maxScore - EXAM_RULES.minScore));
    const group = (keys, pick) => keys.map(key => {
      const xs = items.filter(x => pick(x.q) === key);
      const c = xs.filter(x => x.status === 'correct').length;
      return { key, total: xs.length, correct: c, pct: xs.length ? Math.round(c / xs.length * 100) : null };
    });
    return {
      items, total, correct, incorrect, unanswered, answered: total - unanswered,
      pct: Math.round(ratio * 100), score: scoreValue,
      passed: scoreValue >= EXAM_RULES.passScore,
      official: session.config.mode === 'timed' && total === EXAM_RULES.officialQuestions,
      byDomain: group(DOMAINS.map(d => d.id), q => q.domain),
      byDifficulty: group(EXAM_LEVELS, q => q.difficulty),
      timed: session.durationMs !== null,
      durationMs: session.durationMs,
      timeUsedMs: session.submittedAt - session.startedAt,
      expired: session.submitReason === 'expired'
    };
  }

  return {
    pool, plan,
    get session() { return s; },
    start(config) {
      const items = buildItems(config);
      if (!items) return false;
      const n = items.length, now = Date.now();
      const durationMs = config.mode === 'timed' ? n * EXAM_RULES.minutesPerQuestion * 60000 : null;
      s = {
        config: { ...config }, items,
        answers: new Array(n).fill(null), marked: new Array(n).fill(false), crossed: items.map(() => []),
        current: 0, startedAt: now, durationMs,
        endAt: durationMs ? now + durationMs : null,
        submittedAt: null, submitReason: null, results: null
      };
      return true;
    },
    select(orig) {
      if (!s || s.submittedAt) return;
      s.answers[s.current] = orig;
      s.crossed[s.current] = s.crossed[s.current].filter(o => o !== orig);
    },
    // Crossing out an option marks it as discarded; the selected answer can't be crossed out.
    toggleCross(orig) {
      if (!s || s.submittedAt) return;
      const c = s.crossed[s.current];
      if (c.includes(orig)) s.crossed[s.current] = c.filter(o => o !== orig);
      else if (s.answers[s.current] !== orig) c.push(orig);
    },
    clear() { if (s && !s.submittedAt) s.answers[s.current] = null; },
    toggleMark() { if (s && !s.submittedAt) s.marked[s.current] = !s.marked[s.current]; },
    goTo(i) { if (s && i >= 0 && i < s.items.length) s.current = i; },
    remaining() { return s && s.endAt ? Math.max(0, s.endAt - Date.now()) : null; },
    setRemaining(ms) { if (s && s.endAt) s.endAt = Date.now() + ms; },
    stats() {
      const total = s.items.length;
      const answered = s.answers.filter(a => a !== null).length;
      const marked = s.marked.filter(Boolean).length;
      return { total, answered, unanswered: total - answered, marked, pct: Math.round(answered / total * 100) };
    },
    submit(reason) {
      if (!s || s.submittedAt) return;
      s.submittedAt = s.endAt ? Math.min(Date.now(), s.endAt) : Date.now();
      s.submitReason = reason;
      s.results = score(s);
    },
    reset() { s = null; }
  };
})();

// Timer runs independently of navigation and rendering.
const ExamTimer = (() => {
  let id = null, warned = new Set(), h = {};
  function tick() {
    const s = ExamEngine.session;
    const rem = ExamEngine.remaining();
    if (!s || rem === null || s.submittedAt) return stop();
    h.onTick && h.onTick(rem);
    const crossed = EXAM_RULES.warnAtMinutes.filter(m =>
      !warned.has(m) && s.durationMs > m * 60000 && rem <= m * 60000 && rem > 0);
    if (crossed.length) { crossed.forEach(m => warned.add(m)); h.onWarn && h.onWarn(rem); }
    if (rem <= 0) { stop(); h.onExpire && h.onExpire(); }
  }
  function start(handlers) { stop(); warned = new Set(); h = handlers; id = setInterval(tick, 250); tick(); }
  function stop() { if (id) clearInterval(id); id = null; }
  return { start, stop, tick };
})();
</script>

const esc = v => String(v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const inline = v => esc(v).replace(/`([^`]+)`/g, '<code>$1</code>');
const LETTERS = 'ABCD';
const pad = n => String(n).padStart(2, '0');
function fmt(ms) {
  const t = Math.max(0, Math.ceil(ms / 1000));
  const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), sec = t % 60;
  return h ? `${h}:${pad(m)}:${pad(sec)}` : `${pad(m)}:${pad(sec)}`;
}
function fmtSpoken(ms) {
  const t = Math.max(0, Math.ceil(ms / 1000)), m = Math.floor(t / 60), s = t % 60;
  return `${m} minute${m === 1 ? '' : 's'} ${s} second${s === 1 ? '' : 's'}`;
}
const listJoin = xs => xs.length < 2 ? xs.join('') : `${xs.slice(0, -1).join(', ')} and ${xs[xs.length - 1]}`;

function examConfig(mode) {

const linkHost = url => { try { return new URL(url).hostname.replace(/^www\./, ''); } catch (e) { return ''; } };
const linkItem = r => `<li><a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">${esc(r.title)}${icon('external', 13)}<span class="sr-only"> (opens in a new tab)</span></a><span class="r-link-host">${esc(linkHost(r.url))}</span></li>`;
function studyLinks(q) {

}

const scopeLabel = scope => scope === 'full' ? 'Full Certification' : `Domain ${scope} – ${domainById(scope).name}`;

    <div class="dash-grid">

      <div class="mode-cards">

/* ---------- Screen 2: exam ---------- */
function renderExam() {
  const s = ExamEngine.session;
  const i = s.current, n = s.items.length;
  const item = s.items[i], q = QUESTION_BY_ID[item.qid];
  const st = ExamEngine.stats();
  const marked = s.marked[i];
  const answer = s.answers[i];
  const timed = s.durationMs !== null;
  const isLast = i === n - 1;
  const maxReach = maxReachable(s);
  const canSubmit = canSubmitExam(s);
  const lockNext = timed && answer === null;

  const crossed = s.crossed[i];
  const showAside = !timed || canSubmit;
  const options = item.order.map((orig, pos) => {
    const sel = answer === orig;
    const x = crossed.includes(orig);
    return `<div class="option-row">
      <button type="button" class="option ${sel ? 'is-selected' : ''} ${x ? 'is-crossed' : ''}" role="radio" aria-checked="${sel}" data-action="answer" data-opt="${orig}" data-focus="opt-${pos}">

        <span class="option__text"><span class="sr-only">Option ${LETTERS[pos]}${x ? ', crossed out' : ''}: </span><span lang="${q.lang}">${inline(q.options[orig])}</span></span>

      <button type="button" class="cross-btn" data-action="cross" data-opt="${orig}" data-focus="cross-${pos}" aria-pressed="${x}" aria-label="${x ? 'Restore' : 'Cross out'} option ${LETTERS[pos]}" title="${sel ? 'Your selected answer can’t be crossed out' : (x ? 'Restore this option' : 'Cross out this option')}" ${sel ? 'disabled' : ''}>${icon('strike', 18)}</button>
    </div>`;
  }).join('');

  const reviewRows = s.items.map((_, k) => {
    const m = s.marked[k], cur = k === i;
    return `<tr class="${cur ? 'is-current' : ''} ${m ? 'is-marked' : ''}">
      <td><button type="button" class="rt-link" data-action="goto" data-i="${k}" data-focus="rt-${k}" ${cur ? 'aria-current="true"' : ''}>Question ${k + 1}</button></td>
      <td>${m ? `<span class="tag tag--review">${icon('flag', 13)}Marked</span>` : '<span class="rt-none" aria-label="Not marked">–</span>'}</td>
    </tr>`;
  }).join('');

  const cells = s.items.map((_, k) => {
    const a = s.answers[k] !== null, m = s.marked[k], cur = k === i;
    const locked = k > maxReach;
    const label = `Question ${k + 1}, ${a ? 'answered' : 'unanswered'}${m ? ', marked for review' : ''}${cur ? ', current' : ''}${locked ? ', not yet available' : ''}`;
    return `<button type="button" class="cell ${a ? 'is-answered' : ''} ${m ? 'is-marked' : ''} ${cur ? 'is-current' : ''}" data-action="goto" data-i="${k}" data-focus="cell-${k}" aria-label="${label}" ${cur ? 'aria-current="step"' : ''} ${locked ? 'disabled' : ''}>${k + 1}</button>`;
  }).join('');

  const rem = ExamEngine.remaining();

  return `
  <header class="exam-bar">
    <div class="exam-bar__inner">
      <div class="exam-bar__title">
        <span class="exam-name">Claude Certified Architect – Foundations</span>
        <span class="tag ${timed ? 'tag--accent' : ''}">${timed ? 'Timed exam' : 'Practice exam'}</span>
      </div>
      <div class="exam-bar__pos">${timed
        ? `<span>Question <strong>${i + 1}</strong></span><span class="pos-sep" aria-hidden="true"></span><span>Answered <strong>${st.answered}/${n}</strong></span>`
        : `Question <strong>${i + 1}</strong> of ${n}`}</div>
      <div class="exam-bar__right">
        ${timed
          ? `<div class="timer" id="timer" role="timer">${icon('clock')}<span class="timer__value">${fmt(rem)}</span></div>`

  </header>

  <main class="exam-layout ${showAside ? '' : 'exam-layout--single'}">
    <div>
      <article class="q-card ${marked ? 'is-marked' : ''}" aria-labelledby="q-heading">

        <div class="q-controls__mid">
          <button class="btn btn--mark" data-action="mark" data-focus="mark" aria-pressed="${marked}">${icon('flag')}${marked ? 'Unmark' : 'Mark for review'}</button>

        </div>
        ${isLast
          ? `<button class="btn btn--primary" data-action="open-submit" data-focus="next" ${canSubmit ? '' : 'disabled'}>Review and submit</button>`
          : `<button class="btn btn--primary" data-action="next" data-focus="next" ${lockNext ? 'disabled' : ''}>Next question${icon('right')}</button>`}
      </div>
      ${timed ? `<p class="exam-rule">${icon('info')}<span>${canSubmit ? 'All questions are answered. Use the question table to review any question, including the ones you marked, then submit.' : 'Answer this question to move on. You can go back to answered questions with Previous, and submit once every question is answered.'}</span></p>` : ''}
      <p class="kbd-hint">Keyboard: <kbd>A</kbd>–<kbd>D</kbd> to answer, <kbd>←</kbd> <kbd>→</kbd> to move between questions, <kbd>M</kbd> to mark for review. Use the strikethrough button beside an option to cross it out.</p>
    </div>

    ${!showAside ? '' : timed ? `<aside class="exam-aside" aria-label="Question review">
      <section class="panel">
        <h3 class="aside-title">Review questions</h3>
        <p class="rt-note">${st.marked ? `${plural(st.marked, 'question')} marked for review.` : 'No questions are marked for review.'}</p>
        <div class="rt-wrap">
          <table class="rt">
            <thead><tr><th scope="col">Question</th><th scope="col">Marked for review</th></tr></thead>
            <tbody>${reviewRows}</tbody>

        <dl class="stats">
          <div><dt>Answered</dt><dd>${st.answered}</dd></div>
          <div><dt>Unanswered</dt><dd>${st.unanswered}</dd></div>
          <div><dt>Marked for review</dt><dd>${st.marked}</dd></div>
          <div><dt>Complete</dt><dd>${st.pct}%</dd></div>

      </section>
      <section class="panel">
        <h3 class="aside-title">Questions</h3>
        <div class="qgrid">${cells}</div>
        <div class="legend" aria-hidden="true">
          <span><i class="cell"></i>Unanswered</span>
          <span><i class="cell is-answered"></i>Answered</span>
          <span><i class="cell is-marked"></i>Marked</span>
          <span><i class="cell is-current"></i>Current</span>
        </div>
      </section>
    </aside>`}
  </main>`;
}

function updateTimerDisplay() {
  const el = document.getElementById('timer');
  if (!el) return;
  const rem = ExamEngine.remaining();
  if (rem === null) return;
  const v = el.querySelector('.timer__value');
  if (v) v.textContent = fmt(rem);
  el.classList.toggle('is-warn', rem <= 15 * 60000 && rem > 5 * 60000);
  el.classList.toggle('is-danger', rem <= 5 * 60000);
  el.setAttribute('aria-label', `Time remaining: ${fmtSpoken(rem)}`);
}

/* ---------- Screen 3: submission confirmation ---------- */
function openSubmitModal() {
  const s = ExamEngine.session;
  const st = ExamEngine.stats();
  const unansweredIdx = s.answers.map((a, k) => a === null ? k : -1).filter(k => k >= 0);
  const markedIdx = s.marked.map((m, k) => m ? k : -1).filter(k => k >= 0);
  const jumpList = idx => `<div class="jump-list">${idx.slice(0, 20).map(k => `<button data-action="modal-goto" data-i="${k}" aria-label="Go to question ${k + 1}">${k + 1}</button>`).join('')}${idx.length > 20 ? `<span>and ${idx.length - 20} more</span>` : ''}</div>`;
  const rem = ExamEngine.remaining();

  openModal(`
    <h2 id="modal-title">Submit your exam?</h2>
    <p class="modal__lead">You can’t change your answers after you submit.${rem !== null ? ` Time remaining: ${fmt(rem)}.` : ''}</p>

      <div><dt>Total</dt><dd>${st.total}</dd></div>
      <div><dt>Answered</dt><dd>${st.answered}</dd></div>
      <div><dt>Unanswered</dt><dd>${st.unanswered}</dd></div>
      <div><dt>Marked</dt><dd>${st.marked}</dd></div>
    </dl>
    ${st.unanswered ? `<div class="alert alert--warn" role="alert">${icon('alert', 18)}<div><p><strong>${plural(st.unanswered, 'question')} ${st.unanswered === 1 ? 'is' : 'are'} unanswered.</strong> Unanswered questions are scored as incorrect, and there’s no penalty for guessing.</p>${jumpList(unansweredIdx)}</div></div>` : ''}
    ${st.marked ? `<div class="alert alert--review">${icon('flag', 18)}<div><p>${plural(st.marked, 'question')} ${st.marked === 1 ? 'is' : 'are'} still marked for review.</p>${jumpList(markedIdx)}</div></div>` : ''}
    ${!st.unanswered && !st.marked ? `<div class="alert alert--info">${icon('check', 18)}<p>Every question has an answer.</p></div>` : ''}
    <div class="modal__actions">
      <button class="btn" data-action="close-modal" data-autofocus>Return to Exam</button>
      <button class="btn ${st.unanswered ? 'btn--danger' : 'btn--primary'}" data-action="confirm-submit">Submit Exam</button>
    </div>`);
}

let modalReturnFocus = null;
function openModal(html) {
  modalReturnFocus = document.activeElement;
  modalRoot.innerHTML = `<div class="scrim" data-action="close-modal"></div><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">${html}</div>`;
  modalRoot.hidden = false;
  const f = modalRoot.querySelector('[data-autofocus]');
  f && f.focus();
}
function closeModal(restore = true) {
  if (modalRoot.hidden) return;
  modalRoot.hidden = true;
  modalRoot.innerHTML = '';
  if (restore && modalReturnFocus && document.contains(modalReturnFocus)) modalReturnFocus.focus();
}
function trapFocus(e) {
  const f = [...modalRoot.querySelectorAll('.modal button:not(:disabled)')];
  if (!f.length) return;
  const first = f[0], last = f[f.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
}

/* ---------- Screen 4: results ---------- */
function renderResults() {
  const s = ExamEngine.session, r = s.results, c = s.config;
  const official = r.official;
  const verdict = official
    ? (r.passed ? `<span class="verdict verdict--pass">${icon('check', 18)}Pass</span>` : `<span class="verdict verdict--fail">${icon('x', 18)}Fail</span>`)
    : `<span class="verdict verdict--practice">Practice score</span>`;
  const gap = EXAM_RULES.passScore - r.score;
  const explain = official
    ? (r.passed ? `You reached the passing score of 720 with ${r.score - EXAM_RULES.passScore} points to spare.` : `The passing score is 720. You were ${gap} points short.`)
    : `This is a practice score, not a certification result. Your score is ${r.score >= EXAM_RULES.passScore ? 'at or above' : `${gap} points below`} the 720 benchmark. Only the timed exam gives a pass or fail result.`;
  const lowDomains = r.byDomain.filter(d => d.total && d.pct < PASS_PCT);

  const perfRow = (label, sub, d, extra = '') => {
    if (!d.total) return `<div class="perf-row is-empty"><div class="perf-row__label"><span class="perf-row__name">${label}</span><span class="perf-row__sub">${sub}Not in this exam</span></div><div></div><div class="perf-row__num">–</div><div class="perf-row__pct">–</div></div>`;
    const low = d.pct < PASS_PCT;
    return `<div class="perf-row ${low ? 'is-low' : ''}">
      <div class="perf-row__label"><span class="perf-row__name">${label}</span><span class="perf-row__sub">${sub}${low ? '<span class="tag tag--wrong">Needs improvement</span>' : ''}${extra}</span></div>
      <div class="bar" role="img" aria-label="${d.correct} of ${d.total} correct, ${d.pct} percent"><div class="bar__fill" style="width:${d.pct}%"></div><span class="bar__mark"></span></div>
      <div class="perf-row__num">${d.correct}/${d.total}</div>
      <div class="perf-row__pct">${d.pct}%</div>
    </div>`;
  };

  return `
  <header class="page-head">
    <div class="container page-head__inner">
      <div>
        <h1>${official ? 'Certification simulation result' : 'Practice exam result'}</h1>
        <p>${c.mode === 'timed' ? 'Timed exam' : 'Practice exam'}, ${r.total} questions</p>
      </div>
      <div class="page-head__actions">
        <button class="btn" data-action="new-exam">Change setup</button>
        <button class="btn" data-action="retake">New exam, same setup</button>
        <button class="btn btn--primary" data-action="open-review">Review Answers</button>
      </div>
    </div>
  </header>
  <main class="container results">
    ${r.expired ? `<div class="alert alert--review" role="status">${icon('clock', 18)}<p>Time expired. Your exam was submitted automatically with the answers you had selected.</p></div>` : ''}
    <section class="score-panel" aria-labelledby="score-h">
      <h2 id="score-h" class="sr-only">Overall performance</h2>
      <div class="score-line">
        <span class="score-value">${r.score}</span><span class="score-max">/ 1000</span>
        <span class="score-pct">${r.pct}% correct</span>
      </div>
      <div>${verdict}</div>
      <div class="scale" role="img" aria-label="Score ${r.score} on a scale from 100 to 1000; passing score 720">
        <div class="scale__fill ${official ? (r.passed ? 'is-pass' : 'is-fail') : ''}" style="width:${(r.score - EXAM_RULES.minScore) / (EXAM_RULES.maxScore - EXAM_RULES.minScore) * 100}%"></div>
        <div class="scale__mark"><span>720 to pass</span></div>
      </div>
      <div class="scale__ticks" aria-hidden="true"><span>100</span><span>1000</span></div>
      <p class="score-explain">${explain}</p>
    </section>

    <dl class="tiles">
      <div class="tile tile--correct"><dt>${icon('check', 14)}Correct</dt><dd>${r.correct}</dd></div>
      <div class="tile tile--wrong"><dt>${icon('x', 14)}Incorrect</dt><dd>${r.incorrect}</dd></div>
      <div class="tile"><dt>Unanswered</dt><dd>${r.unanswered}</dd></div>
      <div class="tile"><dt>Questions completed</dt><dd>${r.answered} <small>of ${r.total}</small></dd></div>
      <div class="tile"><dt>${icon('clock', 14)}Time used</dt><dd>${r.timed ? `${fmt(r.timeUsedMs)} <small>of ${fmt(r.durationMs)}</small>` : `${fmt(r.timeUsedMs)} <small>untimed</small>`}</dd></div>
    </dl>

    <div class="perf-grid">
      <section class="panel" aria-labelledby="dom-h">
        <div class="perf-head"><h2 id="dom-h">Performance by domain</h2><span>Line marks the passing level, ${PASS_PCT}%</span></div>
        ${r.byDomain.map(d => perfRow(esc(domainById(d.key).name), `Domain ${d.key}`, d)).join('')}
        ${lowDomains.length
          ? `<div class="focus-box"><h3>Focus your study here</h3><ul>${lowDomains.map(d => `<li><span>Domain ${d.key} – ${esc(domainById(d.key).name)}: ${d.pct}%</span><button class="link-btn" data-action="review-domain" data-domain="${d.key}">Review these questions</button></li>`).join('')}</ul></div>`
          : `<div class="focus-box focus-box--ok"><h3>No weak domains</h3><p style="margin:0;font-size:14px">Every domain in this exam is at ${PASS_PCT}% or higher.</p></div>`}
      </section>
    </div>
    <div class="results-actions">
      <button class="btn btn--primary" data-action="open-review">Review Answers</button>
      <button class="btn" data-action="retake">New exam, same setup</button>
      <button class="btn" data-action="new-exam">Change setup</button>
    </div>
  </main>`;
}

/* ---------- Screen 5: answer review ---------- */
function reviewList() {
  const r = ExamEngine.session.results, f = App.review;
  return r.items.filter(x =>
    (f.status === 'all' || (f.status === 'marked' ? x.marked : x.status === f.status)) &&
    (f.domain === 'all' || x.q.domain === Number(f.domain)) &&
    (f.difficulty === 'all' || x.q.difficulty === f.difficulty));
}
function renderReview() {
  const r = ExamEngine.session.results, f = App.review;
  const list = reviewList();
  const filtered = f.status !== 'all' || f.domain !== 'all' || f.difficulty !== 'all';
  const counts = { all: r.total, correct: r.correct, incorrect: r.incorrect, marked: r.items.filter(x => x.marked).length, unanswered: r.unanswered };
  const statusLabels = { all: 'All questions', correct: 'Correct', incorrect: 'Incorrect', marked: 'Marked', unanswered: 'Unanswered' };
  const cards = list.length
    ? list.map(reviewCard).join('')
    : `<div class="empty"><h2>No questions match these filters</h2><p>Try a different result or domain.</p><button class="btn" data-action="review-reset">Show all questions</button></div>`;
  const countLine = filtered
    ? `<p class="r-count"><span>Showing ${list.length} of ${r.total} questions</span><button class="link-btn" data-action="review-reset">Clear filters</button></p>`
    : `<p class="r-count"><span>Showing all ${r.total} questions</span></p>`;

  return REVIEW_PAGE(r, f, counts, statusLabels, countLine, cards);
}

function reviewCard(cur) {
    const q = cur.q;
    const statusTag = cur.status === 'correct'
      ? `<span class="tag tag--correct">${icon('check', 13)}Correct</span>`
      : cur.status === 'incorrect' ? `<span class="tag tag--wrong">${icon('x', 13)}Incorrect</span>` : `<span class="tag">Unanswered</span>`;
    const opts = cur.item.order.map((orig, pos) => {
      const isCorrect = orig === q.correct, isChosen = orig === cur.answer;
      const cls = isCorrect ? 'is-correct' : (isChosen ? 'is-wrong' : '');
      const tags = [isCorrect ? `<span class="tag tag--correct">Correct answer</span>` : '', isChosen ? `<span class="tag ${isCorrect ? 'tag--correct' : 'tag--wrong'}">Your answer</span>` : ''].join('');
      return `<div class="r-option ${cls}">
        <span class="option__key" aria-hidden="true">${isCorrect ? icon('check', 14) : (isChosen ? icon('x', 14) : LETTERS[pos])}</span>
        <div class="option__text"><span class="sr-only">Option ${LETTERS[pos]}${isCorrect ? ', correct answer' : ''}${isChosen ? ', your answer' : ''}: </span><span lang="${q.lang}">${inline(q.options[orig])}</span>
          ${tags ? `<div class="r-option__tags">${tags}</div>` : ''}
          ${!isCorrect && q.analysis[orig] && q.analysis[orig].text ? `<p class="r-option__why">${q.analysis[orig].typeLabel ? `<span class="tag">${esc(q.analysis[orig].typeLabel)}</span> ` : ''}<strong>Why it’s wrong:</strong> <span lang="${q.lang}">${inline(q.analysis[orig].text)}</span></p>` : ''}
        </div>
      </div>`;
    }).join('');
    const yourLetter = cur.answer === null ? 'No answer' : LETTERS[cur.item.order.indexOf(cur.answer)];
    const correctLetter = LETTERS[cur.item.order.indexOf(q.correct)];
    const yourCls = cur.status === 'correct' ? 'is-correct-letter' : (cur.status === 'incorrect' ? 'is-wrong-letter' : '');

    return `
    <article class="r-card r-card--${cur.status}" aria-labelledby="rq-${cur.index}">
      <header class="r-card__head">
        <div class="r-card__title"><h2 id="rq-${cur.index}">Question ${cur.index + 1}</h2>${statusTag}${cur.marked ? `<span class="tag tag--review">${icon('flag', 13)}Marked</span>` : ''}</div>
        <div class="r-card__meta">
          <span class="q-domain"><b>Domain ${q.domain} – ${esc(domainById(q.domain).name)}</b>, ${esc(q.subdomain)}</span>
          ${difficultyBadge(q.difficulty)}<span class="q-id">${esc(q.id)}</span>
        </div>
      </header>
      <section class="r-block" aria-label="Question ${cur.index + 1}: question">
        <h3 class="r-block__label">Question</h3>
        <div>${scenarioLine(q)}<div class="q-body" lang="${q.lang}">${renderBlocks(q.body)}</div></div>
      </section>
      <section class="r-block" aria-label="Question ${cur.index + 1}: answer">
        <h3 class="r-block__label">Answer</h3>
        <div>
          <p class="r-answer-line"><span>Your answer: <strong class="${yourCls}">${yourLetter}</strong></span><span>Correct answer: <strong class="is-correct-letter">${correctLetter}</strong></span></p>
          <div class="options">${opts}</div>
        </div>
      </section>
      <section class="r-block" aria-label="Question ${cur.index + 1}: explanation">
        <h3 class="r-block__label">Explanation</h3>
        <div lang="${q.lang}"><p>${inline(q.explanation)}</p></div>
      </section>
      <section class="r-block" aria-label="Question ${cur.index + 1}: reference">
        <h3 class="r-block__label">References</h3>
        <div>${q.topic ? `<p class="r-ref" lang="${q.lang}">Topic: ${inline(q.topic)}</p>` : ''}${studyLinks(q)}</div>
      </section>
    </article>`;
}

function REVIEW_PAGE(r, f, counts, statusLabels, countLine, cards) {
  return `
  <header class="page-head">
    <div class="container page-head__inner">
      <div>
        <h1>Answer review</h1>
        <p>${r.correct} correct, ${r.incorrect} incorrect, ${r.unanswered} unanswered</p>
      </div>
      <div class="page-head__actions">
        <button class="btn" data-action="back-results">${icon('left')}Back to results</button>
        <button class="btn" data-action="new-exam">Start a new exam</button>
      </div>
    </div>
  </header>
  <main class="container">
    <details class="docs-panel">
      <summary>Official documentation</summary>
      <p>These resources apply to every domain. Links open in a new tab.</p>
      <ul class="r-links r-links--grid">${STUDY_RESOURCES.official.map(linkItem).join('')}</ul>
    </details>
    <div class="filters">
      <div class="seg" role="group" aria-label="Filter by result">
        ${Object.keys(statusLabels).map(k => `<button type="button" data-action="review-status" data-value="${k}" aria-pressed="${f.status === k}">${statusLabels[k]}<span class="count">${counts[k]}</span></button>`).join('')}
      </div>
      <label>Domain
        <select class="select" data-change="review-domain">
          <option value="all">All domains</option>
          ${DOMAINS.map(d => `<option value="${d.id}" ${String(f.domain) === String(d.id) ? 'selected' : ''}>Domain ${d.id} – ${esc(d.name)}</option>`).join('')}
        </select>
      </label>
    </div>
    ${countLine}
    <div class="r-stack">${cards}</div>
  </main>`;
}

/* ---------- toasts ---------- */
function toast(html, tone = 'info') {
  const t = document.createElement('div');
  t.className = `toast toast--${tone}`;
  t.setAttribute('role', tone === 'info' ? 'status' : 'alert');
  t.innerHTML = html;
  toastRoot.appendChild(t);
  setTimeout(() => { t.classList.add('is-leaving'); setTimeout(() => t.remove(), 320); }, 6500);
}

/* ---------- flow ---------- */
function startExam(mode) {
  App.config.mode = mode;
  if (!ExamEngine.start(examConfig(mode))) return;
  App.screen = 'exam';
  render();
  window.scrollTo(0, 0);
  if (mode === 'timed') {
    ExamTimer.start({
      onTick: updateTimerDisplay,
      onWarn: rem => toast(`${icon('clock', 18)}<span><strong>${rem <= 5 * 60000 ? 'Less than 5 minutes left.' : 'Less than 15 minutes left.'}</strong> The exam submits automatically when time runs out.</span>`, rem <= 5 * 60000 ? 'danger' : 'warn'),
      onExpire: () => finishExam('expired')
    });
  }
}
function finishExam(reason) {
  ExamTimer.stop();
  ExamEngine.submit(reason);
  closeModal(false);
  App.review = { status: 'all', domain: 'all', difficulty: 'all', pos: 0 };
  App.screen = 'results';
  render();
  window.scrollTo(0, 0);
}
// Timed exams: no skipping ahead past the first unanswered question,
// and no submitting until every question has an answer.
function maxReachable(s) {
  if (s.durationMs === null) return s.items.length - 1;
  const firstOpen = s.answers.indexOf(null);
  return firstOpen < 0 ? s.items.length - 1 : firstOpen;
}
function canSubmitExam(s) {
  return s.durationMs === null || s.answers.indexOf(null) < 0;
}
function moveQuestion(i) {
  if (i > maxReachable(ExamEngine.session)) return;
  const before = ExamEngine.session.current;
  ExamEngine.goTo(i);
  render();
  if (ExamEngine.session.current !== before) window.scrollTo({ top: 0 });
}

const actions = {
  set: el => {
    const { field, value } = el.dataset;
    App.config[field] = field === 'count' ? Number(value) : value;
    render();
  },
  start: el => startExam(el.dataset.mode),
  answer: el => { ExamEngine.select(Number(el.dataset.opt)); render(); },
  clear: () => { ExamEngine.clear(); render(); },
  mark: () => { ExamEngine.toggleMark(); render(); },
  prev: () => moveQuestion(ExamEngine.session.current - 1),
  next: () => moveQuestion(ExamEngine.session.current + 1),
  goto: el => moveQuestion(Number(el.dataset.i)),
  'open-submit': () => { if (canSubmitExam(ExamEngine.session)) openSubmitModal(); },
  'close-modal': () => closeModal(),
  'modal-goto': el => { closeModal(false); moveQuestion(Number(el.dataset.i)); },
  'confirm-submit': () => finishExam('manual'),
  cross: el => { ExamEngine.toggleCross(Number(el.dataset.opt)); render(); },
  'open-exit': () => openModal(`
    <h2 id="modal-title">Leave this exam?</h2>
    <p class="modal__lead">You’ll return to the main screen. Your answers won’t be saved, and the exam won’t be scored.</p>
    <div class="modal__actions">
      <button class="btn" data-action="close-modal" data-autofocus>Stay in exam</button>
      <button class="btn btn--danger" data-action="confirm-exit">Leave exam</button>
    </div>`),
  'confirm-exit': () => { ExamTimer.stop(); ExamEngine.reset(); closeModal(false); App.screen = 'dashboard'; render(); window.scrollTo(0, 0); },
  'open-review': () => { App.screen = 'review'; App.review.pos = 0; render(); window.scrollTo(0, 0); },
  'review-domain': el => { App.review = { status: 'all', domain: el.dataset.domain, difficulty: 'all', pos: 0 }; App.screen = 'review'; render(); window.scrollTo(0, 0); },
  'back-results': () => { App.screen = 'results'; render(); window.scrollTo(0, 0); },
  retake: () => { const cfg = ExamEngine.session.config; if (cfg.mode === 'practice') { App.config.count = cfg.count; App.config.difficulty = cfg.difficulty; } startExam(cfg.mode); },
  'new-exam': () => { ExamTimer.stop(); ExamEngine.reset(); App.screen = 'dashboard'; render(); window.scrollTo(0, 0); },
  'review-status': el => { App.review.status = el.dataset.value; App.review.pos = 0; render(); },
  'review-reset': () => { App.review = { status: 'all', domain: 'all', difficulty: 'all', pos: 0 }; render(); }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el || el.disabled) return;
  const fn = actions[el.dataset.action];
  if (fn) { e.preventDefault(); fn(el, e); }
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-change]');
  if (!el) return;
  const k = el.dataset.change;
  if (k === 'scope') App.config.scope = el.value;
  if (k === 'review-domain') { App.review.domain = el.value; App.review.pos = 0; }
  if (k === 'review-difficulty') { App.review.difficulty = el.value; App.review.pos = 0; }
  render();
  const again = root.querySelector(k === 'scope' ? `input[name="scope"][value="${el.value}"]` : `[data-change="${k}"]`);
  again && again.focus();
});
document.addEventListener('keydown', e => {
  if (!modalRoot.hidden) {
    if (e.key === 'Escape') { e.preventDefault(); closeModal(); }
    else if (e.key === 'Tab') trapFocus(e);
    return;
  }
  if (App.screen !== 'exam' || e.metaKey || e.ctrlKey || e.altKey) return;
  const tag = e.target.tagName;
  if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA' || tag === 'SUMMARY') return;
  const s = ExamEngine.session;
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  const pos = 'abcd'.indexOf(k) >= 0 && k.length === 1 ? 'abcd'.indexOf(k) : ('1234'.indexOf(k) >= 0 && k.length === 1 ? '1234'.indexOf(k) : -1);
  if (pos >= 0) { const orig = s.items[s.current].order[pos]; if (orig !== undefined) { ExamEngine.select(orig); render(); } e.preventDefault(); return; }
  if (k === 'ArrowRight' && s.current < s.items.length - 1) { e.preventDefault(); moveQuestion(s.current + 1); }
  else if (k === 'ArrowLeft' && s.current > 0) { e.preventDefault(); moveQuestion(s.current - 1); }
  else if (k === 'm') { e.preventDefault(); ExamEngine.toggleMark(); render(); }
});

document.documentElement.style.setProperty('--pass-pos', `${EXAM_RULES.passRatio * 100}%`);
render();
</script>
</body>
</html>
