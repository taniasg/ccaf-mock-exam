s fail all five attempts with errors such as \"matter reference missing\", a value the document does not contain. Which policy is most appropriate?", "options": [{"key": "A", "text": "Retry absent-information errors with a higher-tier model, which has more knowledge to fill in the value."}, {"key": "B", "text": "Keep the five retries, but enrich the error message with more detail to increase the chance of success."}, {"key": "C", "text": "Reduce the limit to two retries with the specific error for every type of error, and escalate to human review any documents still failing after the second attempt."}, {"key": "D", "text": "Classify before retrying: format, structural, placement or calculation errors are retried with feedback (and escalated if they fail repeatedly); absent-information errors go to human review or return null."}], "correct_answer": "D", "technical_explanation": "The documentation says to identify whether a failure is fixable before retrying. Retries work for format, structural, misplaced-value and mathematical errors; the Quick Reference adds escalation after repeated failures (more than two retries). Absent information cannot be fixed by retrying: it goes to human review or returns null.", "distractor_analysis": [{"key": "A", "type": "Conceptual distractor", "explanation": "It misunderstands the boundary: no model can produce data that is absent from the source; asking another model only changes who invents it."}, {"key": "B", "type": "Plausible alternative", "explanation": "A better message helps with fixable errors, but changes nothing when the data does not exist in the source; costs would remain high."}, {"key": "C", "type": "Confusion distractor", "explanation": "Escalating after repeated failures is right, but it still spends two retries on absent-information errors that can never succeed; it is missing the step of identifying whether an error is fixable before retrying."}, {"key": "D", "type": "Correct", "explanation": "Correct."}], "reference": "4_4 Validation, Retry, and Feedback Loops (\"The Retry Effectiveness Boundary\", \"Key Concept\"); Quick Reference Domain 4 (\"When to retry vs. escalate\")"}, {"id": "D4-Q31", "domain": "4", "domain_name": "Prompt Engineering & Structured Output", "subdomain_code": "4.4", "subdomain_name": "Validation, Retry, and Feedback Loops", "difficulty": "Difficult", "question_type": "Long", "reference_topic": "A discrepancy in the source itself", "question": "When an expert's invoice is extracted, the line items sum to £450 against a stated total of £500. The pipeline retries with the document, the extraction and the specific error. The second attempt returns the same line items, and the model states that it re-examined the document and found no further lines. A manual check confirms that the line items printed on the invoice do indeed sum to £450. The schema includes calculated_total, stated_total and total_discrepancy. What should the pipeline do?", "options": [{"key": "A", "text": "Keep the extraction with calculated_total 450, stated_total 500 and total_discrepancy set to true, and route it to review without further retries."}, {"key": "B", "text": "Make stated_total nullable and return null when it does not match the calculated sum."}, {"key": "C", "text": "Replace stated_total with the calculated value (£450) so the entry reaches the accounting system consistent and does not block the import."}, {"key": "D", "text": "Retry again with a more emphatic error message and add few-shot examples of invoices whose line items sum correctly to their total."}], "correct_answer": "A", "technical_explanation": "A retry only lets the model look again at what it was given. If the discrepancy exists in the document, neither retrying nor picking a value resolves it. The correct pattern is to extract both values (calculated_total and stated_total), flag the discrepancy and route the case to review.", "distractor_analysis": [{"key": "A", "type": "Correct", "explanation": "Correct."}, {"key": "B", "type": "Conceptual distractor", "explanation": "It misapplies nullable fields: the total is in the document, and returning null discards real data and the evidence of the discrepancy."}, {"key": "C", "type": "Plausible alternative", "explanation": "It leaves a seemingly clean record, but it means picking a value without knowing which is correct (a line item may be missing from the invoice), and it hides the discrepancy."}, {"key": "D", "type": "Confusion distractor", "explanation": "It insists on a technique that works for extraction errors, but here the error is not the model's: the discrepancy is in the invoice itself, and no retry can resolve it."}], "reference": "4_4 Validation, Retry, and Feedback Loops (\"The Retry Effectiveness Boundary\", \"Self-Correction Flow Design\", \"Exam Traps\")"}, {"id": "D4-Q32", "domain": "4", "domain_name": "Prompt Engineering & Structured Output", "subdomain_code": "4.5", "subdomain_name": "Batch Processing Strategies", "difficulty": "Easy", "question_type": "Short", "reference_topic": "Workflows suited to batch", "question": "Which of these workflows is a suitable candidate for the Message Batches API?", "options": [{"key": "A", "text": "Nightly test generation, whose results the team reviews the next morning."}, {"key": "B", "text": "A pre-merge check that blocks integration, since batches usually finish within minutes."}, {"key": "C", "text": "Immediate classification of each incoming support ticket so it can be assigned to an agent on the spot."}, {"key": "D", "text": "An agent that must query an internal database during processing and continue with the result."}], "correct_answer": "A", "technical_explanation": "The matching rule is to use the synchronous API for blocking workflows and the batch API for latency-tolerant ones. Nightly test generation consumes its results later, so it loses nothing by waiting and costs 50% less.", "distractor_analysis": [{"key": "A", "type": "Correct", "explanation": "Correct."}, {"key": "B", "type": "Confusion distractor", "explanation": "It relies on the best case: batches often finish sooner, but there is no latency SLA and they can take up to 24 hours; a blocking workflow cannot be designed that way."}, {"key": "C", "type": "Plausible alternative", "explanation": "It is a high-volume workload, but someone is waiting for the result in real time; according to the guide, if the scenario says \"real-time\" or user-facing, batch is not the answer."}, {"key": "D", "type": "Conceptual distractor", "explanation": "It hits a specific limitation: according to the guide, a batch request cannot execute your own tools mid-request and continue from the result."}], "reference": "4_5 Batch Processing Strategies (\"The Matching Rule\", \"Message Batches API: The Facts\")"}, {"id": "D4-Q33", "domain": "4", "domain_name": "Prompt Engineering & Structured Output", "subdomain_code": "4.5", "subdomain_name": "Batch Processing Strategies", "difficulty": "Easy", "question_type": "Short", "reference_topic": "custom_id", "question": "What is the custom_id field on each request in a batch used for?", "options": [{"key": "A", "text": "So that the API reuses the earlier result, at no extra cost, if a request is resubmitted with the same custom_id."}, {"key": "B", "text": "To tag each request with the end customer and split the batch cost by customer."}, {"key": "C", "text": "To set the order in which requests are processed within the batch."}, {"key": "D", "text": "To correlate each request with its response and identify which documents failed and must be resubmitted."}], "correct_answer": "D", "technical_explanation": "Each request in a batch carries a unique identifier that lets it be matched with its response. Without it, you cannot tell which documents succeeded and which failed, and failure handling becomes impossible.", "distractor_analysis": [{"key": "A", "type": "Confusion distractor", "explanation": "It sounds like a plausible optimisation, but the documentation describes no such behaviour; on the contrary, it states that resubmitting documents that already succeeded is paid for again, which is why only failures are resubmitted."}, {"key": "B", "type": "Plausible alternative", "explanation": "An identifier can serve as business metadata in other systems, but its documented use is matching requests and responses in order to handle failures."}, {"key": "C", "type": "Conceptual distractor", "explanation": "It attributes a scheduling function to the field that it does not have; its purpose is request–response correlation."}, {"key": "D", "type": "Correct", "explanation": "Correct."}], "reference": "4_5 Batch Processing Strategies (\"Message Batches API: The Facts\", \"Batch Failure Handling\")"}, {"id": "D4-Q34", "domain": "4", "domain_name": "Prompt Engineering & Structured Output", "subdomain_code": "4.5", "subdomain_name": "Batch Processing Strategies", "difficulty": "Easy", "question_type": "Long", "reference_topic": "A proposal to move everything to batch", "question": "A company runs three workflows with Claude: (1) a mandatory automated review before every merge, which developers wait on before they can integrate; (2) a weekly code audit summary that is read on Mondays; (3) a nightly technical debt report that the team checks in the morning. Management proposes moving all three to the Message Batches API to save 50% and asks for that saving on any workload that can wait for its results. In testing, batch results almost always arrived in under an hour. How should the proposal be evaluated?", "options": [{"key": "A", "text": "Move all three to batch, since the batch's parallel processing reduces latency compared with synchronous calls."}, {"key": "B", "text": "Move the weekly summary and the nightly report to batch, and keep the pre-merge review synchronous."}, {"key": "C", "text": "Keep all three workflows synchronous to avoid the complexity of managing batches."}, {"key": "D", "text": "Move all three to batch with status polling and, if a pre-merge review batch takes more than an hour, rerun it synchronously."}], "correct_answer": "B", "technical_explanation": "The matching rule is the most tested concept in Task Statement 4.5: blocking workflows (pre-merge checks) remain synchronous, and only latency-tolerant workflows (weekly and nightly reports) move to batch. Fast test results change nothing, because there is no latency SLA.", "distractor_analysis": [{"key": "A", "type": "Conceptual distractor", "explanation": "It misunderstands the API: batch trades latency for cost; it is not designed for faster responses."}, {"key": "B", "type": "Correct", "explanation": "Correct."}, {"key": "C", "type": "Plausible alternative", "explanation": "It avoids complexity, but gives up the saving on two latency-tolerant workflows, which is exactly what management wants to capture."}, {"key": "D", "type": "Confusion distractor", "explanation": "It looks prudent because it adds a fallback, but it designs a blocking workflow around typical timing: without a latency SLA, developers may wait up to the threshold, and in those cases you pay twice."}], "reference": "4_5 Batch Processing Strategies (\"The Matching Rule\", \"In the exam\", \"Exam Traps\")"}, {"id": "D4-Q35", "domain": "4", "domain_name": "Prompt Engineering & Structured Output", "subdomain_code": "4.5", "subdomain_name": "Batch Processing Strategies", "difficulty": "Intermediate", "question_type": "Medium", "reference_topic": "SLA calculation", "question": "A broker promises to deliver renewal summaries within at most 36 hours of each document's arrival. Documents accumulate and are submitted in periodic batches. Which analysis of the submission frequency is correct?", "options": [{"key": "A", "text": "With a 36 h SLA and a 24 h worst case there are 12 h of buffer; submitting every 12 h meets the SLA comfortably, because batches usually finish in under 24 h and no higher frequency is needed."}, {"key": "B", "text": "Submit a batch every 24 h, aligned with the processing window, and immediately resubmit any batches that expire."}, {"key": "C", "text": "The SLA depends only on processing time: as long as each batch finishes within 24 h, any submission frequency meets the 36 h."}, {"key": "D", "text": "With a 36 h SLA and a 24 h worst case there are 12 h of buffer; submitting every 12 h would use up all of it, so batches must be submitted more often, for example every 8 h."}], "correct_answer": "D", "technical_explanation": "Work backwards from the SLA: 36 h minus the 24 h worst case leaves 12 h for waiting until submission and for operational delays. A document arriving just after a submission waits the full interval, so the interval must be shorter than the buffer; at 12 h there is no margin left.", "distractor_analysis": [{"key": "A", "type": "Confusion distractor", "explanation": "The buffer calculation is correct, but the conclusion relies on the typical case: a document arriving just after a submission waits 12 h and can take another 24 h, using all 36 h with no margin."}, {"key": "B", "type": "Plausible alternative", "explanation": "It is a reasonable schedule for a looser SLA, but here 24 h of waiting plus 24 h of processing add up to 48 h, more than the 36 h promised."}, {"key": "C", "type": "Conceptual distractor", "explanation": "It ignores the time each document waits for the next submission, which also consumes SLA."}, {"key": "D", "type": "Correct", "explanation": "Correct."}], "reference": "4_5 Batch Processing Strategies (\"SLA Calculation\")"}, {"id": "D4-Q36", "domain": "4", "domain_name": "Prompt Engineering & Structured Output", "subdomain_code": "4.5", "subdomain_name": "Batch Processing Strategies", "difficulty": "Intermediate", "question_type": "Long", "reference_topic": "Batch failure handling", "question": "A batch of 2,000 contracts ends with 140 unsuccessful results: 90 errored because the longest contracts exceeded context limits, 30 expired because the batch did not finish within the window, and 20 errored on documents with an unusual structure. The other 1,860 results are correct. What is the best strategy?", "options": [{"key": "A", "text": "Identify the 140 failures by custom_id and resubmit only those, with changes: chunk the long ones, add targeted few-shot examples for the unusual ones and resubmit the expired ones."}, {"key": "B", "text": "Resubmit the whole batch with an improved prompt, so every contract is processed with the same prompt version."}, {"key": "C", "text": "Resubmit only the 110 errored results with modifications and wait for the 30 expired ones, whose results will be delivered later."}, {"key": "D", "text": "Identify the 140 failures by custom_id and resubmit them in a new batch with the same parameters and the same prompt, since processing errors tend to be transient."}], "correct_answer": "A", "technical_explanation": "Documented failure handling has three steps: identify failures by custom_id, resubmit only the failures with modifications (chunking oversized documents, simplifying prompts or adding few-shot examples for unusual structures) and refine prompts on a sample before processing. Expired results count as failures.", "distractor_analysis": [{"key": "A", "type": "Correct", "explanation": "Correct."}, {"key": "B", "type": "Plausible alternative", "explanation": "Version consistency may matter in some cases, but here you pay again for 1,860 documents that already worked."}, {"key": "C", "type": "Conceptual distractor", "explanation": "It misunderstands the expired status: it is what a batch that did not finish within the window returns, and it must be treated as work to resubmit."}, {"key": "D", "type": "Confusion distractor", "explanation": "It is right to resubmit only the failures, but it omits the modifications: oversized contracts and those with an atypical structure will fail again for the same reason."}], "reference": "4_5 Batch Processing Strategies (\"Batch Failure Handling\")"}, {"id": "D4-Q37", "domain": "4", "domain_name": "Prompt Engineering & Structured Output", "subdomain_code": "4.5", "subdomain_name": "Batch Processing Strategies", "difficulty": "Difficult", "question_type": "Long", "reference_topic": "Your own tools and batch", "question": "A nightly pipeline extracts cover details from 5,000 renewal documents. For 15% of them, the calculation requires querying an internal rates database, which only the company's own code can access, in the middle of processing, and continuing with the result. The team wants the batch saving on as much of the volume as possible. According to the exam guide, which design is appropriate?", "options": [{"key": "A", "text": "Process the whole volume with the synchronous API, since some of the documents need tools."}, {"key": "B", "text": "Include the tool in the batch with tool_choice \"any\" to guarantee the lookup runs for every document."}, {"key": "C", "text": "Keep in batch whatever does not need the lookup; for the rest, run the step that needs the tool synchronously, or resolve the lookup before submission and include the rates."}, {"key": "D", "text": "Define the lookup tool in the batch requests so the model calls it when needed and each request continues with the rates it obtained, with no synchronous steps."}], "correct_answer": "C", "technical_explanation": "The batch API does not support multi-turn tool calling within a single request. A workflow that must execute its own tool during processing has to use the synchronous API for that step, or resolve the call before submission or between batches. That preserves the saving on everything else.", "distractor_analysis": [{"key": "A", "type": "Plausible alternative", "explanation": "It works, but it gives up the 50% saving on the 85% of documents that do not need the lookup."}, {"key": "B", "type": "Conceptual distractor", "explanation": "It misapplies tool_choice: it forces a tool call to be emitted, but does not make that call execute inside the batch, and it would also force the call on documents that do not need it."}, {"key": "C", "type": "Correct", "explanation": "Correct."}, {"key": "D", "type": "Confusion distractor", "explanation": "It is the most direct option, but according to the guide a batch request cannot execute a tool and continue from its result; with your own tools, the request ends at tool_use."}], "reference": "4_5 Batch Processing Strategies (\"Multi-Turn Tool Calling Limitation\", \"Current State\", \"Exam Traps\")"}, {"id": "D4-Q38", "domain": "4", "domain_name": "Prompt Engineering & Structured Output", "subdomain_code": "4.5", "subdomain_name": "Batch Processing Strategies", "difficulty": "Difficult", "question_type": "Medium", "reference_topic": "Prompt optimisation before batch submission", "question": "A team is about to process 10,000 documents of widely varying formats with the batch API. In a previous run with a similar prompt, only 60% succeeded on the first pass. What is the most cost-effective strategy?", "options": [{"key": "A", "text": "Refine the prompt, examples and schema on a sample of 5 to 10 documents covering every format and edge case, then submit the full batch."}, {"key": "B", "text": "Refine the prompt, examples and schema on a sample of 5 to 10 documents of the most common format, to iterate faster, then submit the full batch."}, {"key": "C", "text": "Submit the full batch now and afterwards resubmit only the failures, with targeted modifications."}, {"key": "D", "text": "Increase max_tokens on every request in the batch to reduce failures."}], "correct_answer": "A", "technical_explanation": "The most cost-effective strategy is to refine prompts before submitting large volumes: test on a representative sample of 5–10 documents, iterate until accuracy is high, submit the full batch and resubmit only the failures. Every failure costs a retry: with 10,000 documents, a 90% success rate means about 1,000 resubmissions, compared with 4,000 at 60%.", "distractor_analysis": [{"key": "A", "type": "Correct", "explanation": "Correct."}, {"key": "B", "type": "Confusion distractor", "explanation": "It follows the right workflow, but with a biased sample: if it does not cover the variety of formats and edge cases, the atypical documents will keep failing on the first pass."}, {"key": "C", "type": "Plausible alternative", "explanation": "It is correct failure handling, but without refining first you start from 60%: about 4,000 resubmissions, compared with about 1,000 at a 90% first-pass success rate."}, {"key": "D", "type": "Conceptual distractor", "explanation": "It takes a modification that is valid for oversized documents and applies it to the whole volume; it does not fix failures caused by structure or the prompt, and it makes every request more expensive."}], "reference": "4_5 Batch Processing Strategies (\"Prompt Optimisation Before Batch Submission\")"}, {"id": "D4-Q39", "domain": "4", "domain_name": "Prompt Engineering & Structured Output", "subdomain_code": "4.6", "subdomain_name": "Multi-Instance and Multi-Pass Review", "difficulty": "Easy", "question_type": "Short", "reference_topic": "The self-review limitation", "question": "Why is a review carried out in the same session that generated the code less effective than an independent review?", "options": [{"key": "A", "text": "Because in the same session the model reasons too little; with extended thinking enabled in that session, the review reaches the quality of an independent one."}, {"key": "B", "text": "Because the model retains its original reasoning chain and tends to confirm its decisions rather than challenge them."}, {"key": "C", "text": "Because the context window fills up with the generation and the review gets truncated."}, {"key": "D", "text": "Because a model cannot detect its own errors, so the review must be done by a different, higher-tier model."}], "correct_answer": "B", "technical_explanation": "In self-review, the model already \"knows\" why it chose each approach and tends to confirm it. An independent instance, without that reasoning context, judges the output only on what it sees and is better at catching subtle issues.", "distractor_analysis": [{"key": "A", "type": "Confusion distractor", "explanation": "Extended thinking within the generating session leaves the original reasoning in context; the guide explicitly marks it as a wrong answer."}, {"key": "B", "type": "Correct", "explanation": "Correct."}, {"key": "C", "type": "Conceptual distractor", "explanation": "It confuses context size with bias: the documented problem is that the model retains its reasoning, not a lack of space."}, {"key": "D", "type": "Plausible alternative", "explanation": "It is right to separate the review, but what is needed is an independent instance without the prior context, not necessarily a different model."}], "reference": "4_6 Multi-Instance and Multi-Pass Review (\"The Self-Review Limitation\", \"In the exam\")"}, {"id": "D4-Q40", "domain": "4", "domain_name": "Prompt Engineering & Structured Output", "subdomain_code": "4.6", "subdomain_name": "Multi-Instance and Multi-Pass Review", "difficulty": "Easy", "question_type": "Medium", "reference_topic": "Multi-pass review", "question": "A pull request that modifies 22 files receives a single-pass review with detailed comments on the first files, superficial remarks on the middle ones and contradictory findings: the same pattern is flagged as a problem in one file and approved in another. Which restructuring is most appropriate?", "options": [{"key": "A", "text": "Review each file in an independent local pass with a focused prompt, and concatenate all the per-file findings into the PR's final report."}, {"key": "B", "text": "An independent local pass per file, followed by a separate integration pass that receives all the per-file findings."}, {"key": "C", "text": "Run three full passes over the whole PR and keep only the findings that appear in at least two of them."}, {"key": "D", "text": "Switch to a higher-tier model with a larger context window that processes the whole PR in one pass."}], "correct_answer": "B", "technical_explanation": "The symptoms described (uneven depth, missed bugs and contradictory findings) are those of attention dilution. The fix is the multi-pass architecture: a per-file pass for local analysis at consistent depth and an integration pass that reviews cross-file issues and contradictions.", "distractor_analysis": [{"key": "A", "type": "Confusion distractor", "explanation": "It fixes the uneven depth, but without the integration pass it does not detect cross-file issues (data flow, API contracts) or contradictions between findings."}, {"key": "B", "type": "Correct", "explanation": "Correct."}, {"key": "C", "type": "Plausible alternative", "explanation": "Consensus can filter noise in other contexts, but every pass suffers the same attention dilution, and bugs in the middle files may be missing from all three."}, {"key": "D", "type": "Conceptual distractor", "explanation": "A larger window holds more text, but attention is still spread unevenly; the problem is attention quality, not context size."}], "reference": "4_6 Multi-Instance and Multi-Pass Review (\"Multi-Pass Review Architecture\", \"Why Larger Context Windows Do Not Fix This\")"}, {"id": "D4-Q41", "domain": "4", "domain_name": "Prompt Engineering & Structured Output", "subdomain_code": "4.6", "subdomain_name": "Multi-Instance and Multi-Pass Review", "difficulty": "Intermediate", "question_type": "Medium", "reference_topic": "Calibrating confidence thresholds", "question": "A system automatically publishes findings with a self-reported confidence of 0.8 or higher and sends the rest to human review. When reviewing a sample, the team sees that several findings at 0.9 were wrong and some at 0.5 were correct. Which change is appropriate?", "options": [{"key": "A", "text": "Send every finding to human review until the model stops making mistakes."}, {"key": "B", "text": "Raise the threshold to 0.95 so that only the most certain findings are published automatically."}, {"key": "C", "text": "Run a labelled validation set through the system, measure how closely reported confidence tracks actual accuracy and adjust the thresholds from that data."}, {"key": "D", "text": "Ask the model to report its estimated accuracy instead of its confidence, because the value will then directly reflect the actual hit rate."}], "correct_answer": "C", "technical_explanation": "An uncalibrated score is unreliable for automated decisions. To calibrate it, you run labelled examples (where the answer is already known) through the system, measure how closely reported confidence tracks actual accuracy and adjust the routing thresholds from that data.", "distractor_analysis": [{"key": "A", "type": "Plausible alternative", "explanation": "It removes the risk in the short term, but gives up routing and overwhelms review capacity without providing any way to calibrate."}, {"key": "B", "type": "Confusion distractor", "explanation": "It looks more prudent, but it is still an uncalibrated threshold: if confidence does not track accuracy, a higher number does not guarantee correctness."}, {"key": "C", "type": "Correct", "explanation": "Correct."}, {"key": "D", "type": "Conceptual distractor", "explanation": "It misunderstands the score: it is the model's own view of its certainty, and renaming it does not calibrate it. The relationship with actual accuracy can only be measured with labelled data."}], "reference": "4_6 Multi-Instance and Multi-Pass Review (\"Confidence-Based Routing\")"}, {"id": "D4-Q42", "domain": "4", "domain_name": "Prompt Engineering & Structured Output", "subdomain_code": "4.6", "subdomain_name": "Multi-Instance and Multi-Pass Review", "difficulty": "Intermediate", "question_type": "Long", "reference_topic": "Review by an independent instance", "question": "An agent generates database migration scripts. After generating them, the same flow appends the message \"Now review your code carefully for bugs\" to the conversation. Migrations with errors that the review did not catch have reached production, such as indexes dropped before their data was copied. The team wants to improve review quality without putting every migration through human review. Which change is most effective?", "options": [{"key": "A", "text": "Keep the review in the same conversation, but with a detailed checklist of error categories."}, {"key": "B", "text": "Review with an independent invocation that receives only the script and a prompt focused on bugs, security and edge cases, without the generation history."}, {"key": "C", "text": "Review with a new invocation that receives the full generation history, including the agent's reasoning, so the reviewer has as much context as possible."}, {"key": "D", "text": "Enable extended thinking in the session that generates the code so the model self-reviews in more depth."}], "correct_answer": "B", "technical_explanation": "An independent instance, without the prior reasoning context, judges the output only on what it sees, without the \"I chose this because...\" bias, and is much better at finding subtle issues. Neither more instructions nor extended thinking in the same session removes that bias.", "distractor_analysis": [{"key": "A", "type": "Plausible alternative", "explanation": "Improving the review instructions is reasonable, but the model retains its reasoning and still tends to confirm its decisions; the guide marks adding \"review carefully\" instructions in the same session as wrong."}, {"key": "B", "type": "Correct", "explanation": "Correct."}, {"key": "C", "type": "Confusion distractor", "explanation": "It uses another invocation, but passes it the original reasoning, so the review inherits the confirmation bias it was meant to remove."}, {"key": "D", "type": "Conceptual distractor", "explanation": "More reasoning within the generating session does not change the problem: the original reasoning is still in context."}], "reference": "4_6 Multi-Instance and Multi-Pass Review (\"The Self-Review Limitation\", \"In the exam\")"}, {"id": "D4-Q43", "domain": "4", "domain_name": "Prompt Engineering & Structured Output", "subdomain_code": "4.6", "subdomain_name": "Multi-Instance and Multi-Pass Review", "difficulty": "Intermediate", "question_type": "Medium", "reference_topic": "The cross-file integration pass", "question": "In a multi-pass review architecture, when does the integration pass run, and what does it receive?", "options": [{"key": "A", "text": "It runs at the end, but receives only the files with critical findings in order to dig deeper into them."}, {"key": "B", "text": "It runs at the end and re-analyses each file with a different prompt to confirm the local findings."}, {"key": "C", "text": "Once every per-file review has finished; it receives all the per-file findings and looks for data flow issues, cross-service API issues and contradictions."}, {"key": "D", "text": "It runs in parallel with the per-file passes and receives the PR's full diff, so that the final result does not have to wait for them to finish."}], "correct_answer": "C", "technical_explanation": "Pass 2 runs after every file has been reviewed and receives all the per-file findings. It checks data flow between modules, consistent API usage across services, dependency conflicts and contradictions in the per-file findings themselves.", "distractor_analysis": [{"key": "A", "type": "Conceptual distractor", "explanation": "It confuses integration with deeper analysis: the integration pass looks for issues between modules, which can involve files with no critical findings."}, {"key": "B", "type": "Plausible alternative", "explanation": "A second local review may have value as verification, but it is not the job of integration, which works on the findings to find cross-file issues."}, {"key": "C", "type": "Correct", "explanation": "Correct."}, {"key": "D", "type": "Confusion distractor", "explanation": "It saves time, but changes the architecture: without the per-file findings it cannot detect contradictions between them, and reviewing the full diff reintroduces attention dilution."}], "reference": "4_6 Multi-Instance and Multi-Pass Review (\"Multi-Pass Review Architecture\")"}, {"id": "D4-Q44", "domain": "4", "domain_name": "Prompt Engineering & Structured Output", "subdomain_code": "4.6", "subdomain_name": "Multi-Instance and Multi-Pass Review", "difficulty": "Difficult", "question_type": "Long", "reference_topic": "A complete review architecture", "question": "A mortgage broker uses Claude to extract income and outgoings from application packs containing payslips, bank statements, a credit report and a valuation. An undetected error affects the loan decision. Human advisers have limited capacity and should only receive doubtful cases. In addition, inconsistencies between documents must be detected, such as a payslip salary that does not match the credits on the bank statement. The team has hundreds of past packs that have already been verified. Which architecture meets every requirement?", "options": [{"key": "A", "text": "One instance extracts; independent instances review each document; another separate instance checks cross-document consistency, and findings with self-reported confidence below 0.7 go to an adviser; the threshold will be calibrated once production data is available."}, {"key": "B", "text": "An independent instance reviews the whole pack in a single pass and sends every high-severity finding to an adviser."}, {"key": "C", "text": "One instance extracts; independent instances review each document; another separate instance checks cross-document consistency from those findings, and low-confidence findings go to an adviser according to thresholds calibrated on the verified packs."}, {"key": "D", "text": "The same session that extracts reviews each document separately and then checks cross-document consistency; doubtful findings go to an adviser according to calibrated thresholds."}], "correct_answer": "C", "technical_explanation": "The documented production architecture combines generation, independent per-unit review, a separate instance for cross-unit consistency, confidence-based routing to human review and a calibration loop with labelled validation sets. The verified packs are that labelled set.", "distractor_analysis": [{"key": "A", "type": "Confusion distractor", "explanation": "The review architecture is correct, but it routes on an uncalibrated threshold from day one, even though verified packs already exist to calibrate it. Using uncalibrated confidence for automated decisions is an anti-pattern."}, {"key": "B", "type": "Plausible alternative", "explanation": "Independence avoids self-review bias, but a single pass over the whole pack suffers attention dilution; moreover, severity does not indicate which findings are doubtful."}, {"key": "C", "type": "Correct", "explanation": "Correct."}, {"key": "D", "type": "Conceptual distractor", "explanation": "It applies the multi-pass structure and the calibration correctly, but performs the reviews in the generating session, which retains its reasoning and tends to confirm what it extracted."}], "reference": "4_6 Multi-Instance and Multi-Pass Review (\"Putting It All Together\", \"Confidence-Based Routing\")"}, {"id": "D4-Q45", "domain": "4", "domain_name": "Prompt Engineering & Structured Output", "subdomain_code": "4.6", "subdomain_name": "Multi-Instance and Multi-Pass Review", "difficulty": "Difficult", "question_type": "Medium", "reference_topic": "When the cost is worth it", "question": "A company is considering applying the multi-pass architecture with independent instances to two workflows: (1) internal draft summaries of meetings, which a person always edits before sharing; (2) the CI/CD quality gate for the payments service, which blocks every merge until there is a result. Which decision is most appropriate?", "options": [{"key": "A", "text": "Apply it to both workflows and run it through the Message Batches API to offset the extra cost with the 50% saving."}, {"key": "B", "text": "In CI/CD, replace it with a model with a larger context window that reviews the whole diff in one pass, at equivalent quality and lower cost."}, {"key": "C", "text": "Apply it synchronously to both workflows, because multi-pass review always improves quality."}, {"key": "D", "text": "Apply it synchronously to the payments service's CI/CD gate and keep a single pass for the internal drafts."}], "correct_answer": "D", "technical_explanation": "The multi-pass architecture is more expensive than a single pass and is worth it when review quality directly affects production reliability: CI/CD pipelines, financial extraction or compliance analysis. For a draft that a person always reviews, the cost is not justified.", "distractor_analysis": [{"key": "A", "type": "Confusion distractor", "explanation": "It combines two valid ideas, but the CI/CD gate is a blocking workflow: without a latency SLA, batches can take up to 24 hours while developers wait."}, {"key": "B", "type": "Conceptual distractor", "explanation": "A larger window does not solve attention dilution, so the quality is not equivalent."}, {"key": "C", "type": "Plausible alternative", "explanation": "It improves quality, but it is more expensive; for drafts that a person always edits, missed issues have little downstream impact and the cost is not justified."}, {"key": "D", "type": "Correct", "explanation": "Correct."}], "reference": "4_6 Multi-Instance and Multi-Pass Review (\"When the Cost Is Worth It\"); 4_5 Batch Processing Strategies (\"The Matching Rule\")"}]}

{"metadata": {"title": "Question Bank – Domain 5: Context Management & Reliability", "certification": "Claude Certified Architect – Foundations", "language": "en", "version": "1.0", "total_questions": 45, "difficulty_levels": ["Easy", "Intermediate", "Difficult"], "question_types": ["Short", "Medium", "Long"], "distractor_types": ["Correct", "Plausible alternative", "Conceptual distractor", "Confusion distractor"], "subdomains": [{"code": "5.1", "name": "Context Window Management"}, {"code": "5.2", "name": "Escalation & Ambiguity Resolution"}, {"code": "5.3", "name": "Error Propagation in Multi-Agent Systems"}, {"code": "5.4", "name": "Codebase Exploration & Context Degradation"}, {"code": "5.5", "name": "Human Review & Confidence Calibration"}, {"code": "5.6", "name": "Information Provenance & Multi-Source Synthesis"}], "sources": ["5_1 Context Window Management", "5_2 Escalation & Ambiguity Resolution", "5_3 Error Propagation in Multi-Agent Systems", "5_4 Codebase Exploration & Context Degradation", "5_5 Human Review & Confidence Calibration", "5_6 Information Provenance & Multi-Source Synthesis", "Glossary Domain 5", "Quick Reference Domain 5"]}, "questions": [{"id": "D5-Q01", "domain": "5", "domain_name": "Context Management & Reliability", "subdomain_code": "5.1", "subdomain_name": "Context Window Management", "difficulty": "Easy", "question_type": "Short", "reference_topic": "Stateless API and full history", "question": "A conversational application calls Claude's Messages API on every user turn. What must each request include for the model to keep the conversation coherent?", "options": [{"key": "A", "text": "The complete conversation history, because the API keeps no server-side session state."}, {"key": "B", "text": "Only the most recent turns, since the model infers the rest of the context from them."}, {"key": "C", "text": "The new user message plus a session identifier, which the API uses to retrieve the earlier turns."}, {"key": "D", "text": "The complete history only on the first request; afterwards the new message is enough, because prompt caching keeps the earlier turns."}], "correct_answer": "A", "technical_explanation": "The Claude API is stateless: there is no server-side session state, so each request must include the complete history. If earlier messages are omitted, the model loses conversational coherence. The conflict with context limits is resolved with a persistent case facts block, not by dropping turns.", "distractor_analysis": [{"key": "A", "type": "Correct", "explanation": "Correct."}, {"key": "B", "type": "Plausible alternative", "explanation": "Truncating history is a real token-saving practice, but the guide flags it as a trap: the model cannot infer what it does not receive, and facts and coherence are lost."}, {"key": "C", "type": "Conceptual distractor", "explanation": "Misapplies the concept of a session: the API keeps no server-side state, so there are no turns to retrieve from an identifier."}, {"key": "D", "type": "Confusion distractor", "explanation": "Confuses prompt caching with session state. The cache avoids reprocessing a prefix that is still sent on every request; it does not replace the history or remember it on its own."}], "reference": "5_1 Context Window Management (\"Full Conversation History\"); Quick Reference (\"The API is stateless\")"}, {"id": "D5-Q02", "domain": "5", "domain_name": "Context Management & Reliability", "subdomain_code": "5.1", "subdomain_name": "Context Window Management", "difficulty": "Easy", "question_type": "Short", "reference_topic": "Lost in the middle effect", "question": "A synthesis agent receives a long aggregated input containing reports from six sources, one after another. Conclusions from the sources in the middle are often missing from its response. What is the recommended fix?", "options": [{"key": "A", "text": "Send each report in a separate call and then concatenate the six responses into the final report."}, {"key": "B", "text": "Put a key findings summary at the start and place each report under its own section header."}, {"key": "C", "text": "Place the key findings summary in the middle of the input, between the reports, next to the details it summarises."}, {"key": "D", "text": "Add an instruction to the prompt to read and consider every section with equal attention."}], "correct_answer": "B", "technical_explanation": "Models reliably process the beginning and end of long inputs and may omit or underweight what sits in the middle. The fix is structural: a \"Key Findings Summary\" at the start and the detailed results under explicit headers.", "distractor_analysis": [{"key": "A", "type": "Plausible alternative", "explanation": "It avoids the middle position, but gives up the cross-source synthesis that is precisely the agent's task. It is not the documented structural fix."}, {"key": "B", "type": "Correct", "explanation": "Correct."}, {"key": "C", "type": "Confusion distractor", "explanation": "Uses the right element (the summary) but in the worst possible place: the middle is exactly the area the model processes least reliably."}, {"key": "D", "type": "Conceptual distractor", "explanation": "This is the documented trap: a reminder leaves each finding in the same position, and the effect is caused by position, not by a lack of instructions."}], "reference": "5_1 Context Window Management (\"The 'Lost in the Middle' Effect\"); Quick Reference (\"Lost in the middle\")"}, {"id": "D5-Q03", "domain": "5", "domain_name": "Context Management & Reliability", "subdomain_code": "5.1", "subdomain_name": "Context Window Management", "difficulty": "Easy", "question_type": "Medium", "reference_topic": "Tool result trimming", "question": "An insurer's support agent calls get_policy, which returns 42 fields (audit timestamps, internal branch codes, legacy system IDs...). To handle a claim it only needs five: policy number, start date, coverage, deductible and status. Sessions are long and the context budget runs out. Which change correctly applies the recommended practice?", "options": [{"key": "A", "text": "Trim the result to the five relevant fields in a PostToolUse hook or in the tool itself, before it enters the history."}, {"key": "B", "text": "State in the system prompt that it should ignore the irrelevant get_policy fields and focus on the five it needs."}, {"key": "C", "text": "Mark the get_policy result with a cache_control breakpoint so the extra fields do not consume budget on later turns."}, {"key": "D", "text": "Keep the full result during the session in case a later turn needs some field, and summarise the history when it nears the limit."}], "correct_answer": "A", "technical_explanation": "Verbose results consume tokens on every later turn because they are resent with the history. They must be trimmed to the relevant fields before entering the conversation, in a PostToolUse hook or in the tool implementation; once inside, they stay for every turn.", "distractor_analysis": [{"key": "A", "type": "Correct", "explanation": "Correct."}, {"key": "B", "type": "Conceptual distractor", "explanation": "An instruction does not reduce tokens: all 42 fields remain in the history and are resent with every request. Trimming must happen before the result enters the context."}, {"key": "C", "type": "Confusion distractor", "explanation": "Confuses two mechanisms: caching makes reprocessing a stable prefix cheaper, but does not change what the model sees. The 42 fields still occupy the context window."}, {"key": "D", "type": "Plausible alternative", "explanation": "This is the \"the model might need it later\" trap: the 37 extra fields drain the budget turn after turn, and the later summary also destroys figures and dates."}], "reference": "5_1 Context Window Management (\"Tool Result Trimming\"; Exam Traps)"}, {"id": "D5-Q04", "domain": "5", "domain_name": "Context Management & Reliability", "subdomain_code": "5.1", "subdomain_name": "Context Window Management", "difficulty": "Intermediate", "question_type": "Medium", "reference_topic": "Separate context layer per issue", "question": "In a single session, an e-commerce customer raises two problems: a €89.90 refund for order #5512 and a size exchange for order #5530, awaiting pickup. After several turns and a history summary, the agent attributes the €89.90 amount to order #5530. Which design prevents this failure?", "options": [{"key": "A", "text": "Summarise more often and in smaller chunks, so each summary better preserves the amounts in its segment."}, {"key": "B", "text": "Ask the customer to open a separate conversation for each problem, so each session has a single order."}, {"key": "C", "text": "A context layer kept apart from the summarised history, with one entry per issue (order, amount, status), included in every prompt."}, {"key": "D", "text": "Keep a persistent case facts block outside the history, but regenerate it on each summariser pass from the latest summary."}], "correct_answer": "C", "technical_explanation": "When a customer raises several problems, each one's structured data is extracted into a context layer separate from the summarised history. Each issue has its own entry with IDs, amounts and statuses, which prevents one issue's data from mixing with another's during summarisation.", "distractor_analysis": [{"key": "A", "type": "Conceptual distractor", "explanation": "It is still progressive summarisation, which by default keeps the general meaning and drops the details. Nor does it separate the issues from each other."}, {"key": "B", "type": "Plausible alternative", "explanation": "It separates the data, but shifts the burden to the customer and sidesteps the problem instead of solving it: the documented pattern is designed precisely for multi-issue sessions."}, {"key": "C", "type": "Correct", "explanation": "Correct."}, {"key": "D", "type": "Confusion distractor", "explanation": "It looks like the right pattern, but if the block is rebuilt from the summary it inherits the data loss and mixing. The block is never summarised; it persists regardless of what happens to the history."}], "reference": "5_1 Context Window Management (\"The Progressive Summarisation Trap\" — separate context layer)"}, {"id": "D5-Q05", "domain": "5", "domain_name": "Context Management & Reliability", "subdomain_code": "5.1", "subdomain_name": "Context Window Management", "difficulty": "Intermediate", "question_type": "Medium", "reference_topic": "Prompt order and prompt caching", "question": "A team uses prompt caching. Its system prompt starts with the request date and time and the customer's name, continues with 6,000 tokens of instructions and terms of service that never change, and ends with the cache_control breakpoint. The cache hit rate is practically zero. What is the fix?", "options": [{"key": "A", "text": "Put the static block first, with the breakpoint at its end, and move the date and name after it."}, {"key": "B", "text": "Shrink the static instructions so the cost of reprocessing them without caching is lower."}, {"key": "C", "text": "Change the breakpoint to {\"type\": \"ephemeral\", \"ttl\": \"1h\"} so the stored prefix lasts longer between requests."}, {"key": "D", "text": "Move the cache_control breakpoint to the end of the last user message, so the cache covers each request's full prompt."}], "correct_answer": "A", "technical_explanation": "The cache matches the prompt from its start, prefix by prefix. If dynamic content comes before the static block, the prefix changes on every request and never matches. Constant content goes first, the breakpoint at the end of that block, and variable content after it.", "distractor_analysis": [{"key": "A", "type": "Correct", "explanation": "Correct."}, {"key": "B", "type": "Plausible alternative", "explanation": "It lowers the per-request cost, but does not fix the ordering that prevents cache hits; the design problem remains."}, {"key": "C", "type": "Conceptual distractor", "explanation": "The TTL extends a cache entry's lifetime, but here the prefix is different on every request: there is no valid entry to keep."}, {"key": "D", "type": "Confusion distractor", "explanation": "It seems to widen coverage, but the prompt still starts with content that changes on every request, and the last message is volatile too. Since matching starts from the beginning, it never matches."}], "reference": "5_1 Context Window Management (\"Prompt Caching\"); Glossary (\"Prompt Caching\")"}, {"id": "D5-Q06", "domain": "5", "domain_name": "Context Management & Reliability", "subdomain_code": "5.1", "subdomain_name": "Context Window Management", "difficulty": "Intermediate", "question_type": "Short", "reference_topic": "Full history versus context limits", "question": "The API requires resending the history, and the history grows every turn. Which approach resolves this conflict without losing transactional data?", "options": [{"key": "A", "text": "Summarise the whole history, facts included, with an instruction to copy every amount, date and order number verbatim."}, {"key": "B", "text": "Move the transactional facts to the end of the summary, where the lost in the middle effect does not affect them."}, {"key": "C", "text": "Drop the oldest messages once the history exceeds a threshold, always keeping the latest turns."}, {"key": "D", "text": "Summarise the history's narrative and keep a separate persistent case facts block in every prompt."}], "correct_answer": "D", "technical_explanation": "The persistent case facts block separates critical data (amounts, dates, order numbers, statuses) from the rest of the conversation, which can be summarised. This respects the need to resend the history while controlling its size without losing details.", "distractor_analysis": [{"key": "A", "type": "Confusion distractor", "explanation": "It seems sufficient, but the summariser can lose figures even when told to keep them. The facts must sit outside the material being summarised."}, {"key": "B", "type": "Conceptual distractor", "explanation": "Misapplies lost in the middle: the problem is not position but that the facts are still inside the summarised text, which gets compressed again on the next pass."}, {"key": "C", "type": "Plausible alternative", "explanation": "This is selective truncation, a documented trap: it loses facts that a later turn may need, and you cannot know in advance which ones."}, {"key": "D", "type": "Correct", "explanation": "Correct."}], "reference": "5_1 Context Window Management (\"Full Conversation History\", Practice Scenario); Quick Reference (\"Progressive Summarisation Trap\")"}, {"id": "D5-Q07", "domain": "5", "domain_name": "Context Management & Reliability", "subdomain_code": "5.1", "subdomain_name": "Context Window Management", "difficulty": "Difficult", "question_type": "Long", "reference_topic": "Upstream agent optimisation", "question": "A research system for an energy consultancy has four subagents (market, regulation, patents and competitors) and a synthesis agent with a limited context budget. Each subagent returns its full reasoning chain, excerpts of the pages it read and its conclusions in prose. Three problems are observed: the synthesis agent exhausts its budget, omits conclusions from the reports in the middle of the input, and cannot date or attribute some figures. Which redesign addresses all three problems?", "options": [{"key": "A", "text": "Have subagents return only structured claims and relevance scores, dropping source and date to save tokens, and start the aggregated input with a key findings summary and headers per report."}, {"key": "B", "text": "Subagents that return structured data (claim, source, date, relevance) without their reasoning, and an input that opens with a key findings summary followed by a header per report."}, {"key": "C", "text": "Have the synthesis agent progressively summarise each subagent's output as it arrives, before combining them."}, {"key": "D", "text": "Give the synthesis agent a model with a larger context window, so it receives the four subagents' outputs in full."}], "correct_answer": "B", "technical_explanation": "Structured outputs without reasoning chains free up budget; date and source metadata are what the guide requires for accurate synthesis; and the summary at the start with explicit headers mitigates lost in the middle. It is the only option that covers all three symptoms.", "distractor_analysis": [{"key": "A", "type": "Confusion distractor", "explanation": "It solves the budget and position problems, but drops the metadata (date, source) the guide requires in upstream outputs. The attribution problem remains."}, {"key": "B", "type": "Correct", "explanation": "Correct."}, {"key": "C", "type": "Conceptual distractor", "explanation": "Applies progressive summarisation exactly where it does the most damage: it destroys figures, dates and sources, so the third problem gets worse."}, {"key": "D", "type": "Plausible alternative", "explanation": "It relieves the budget, but still spends tokens on reasoning the synthesis cannot use, and fixes neither the omission of middle reports nor the missing metadata."}], "reference": "5_1 Context Window Management (\"Upstream Agent Optimisation\", \"The 'Lost in the Middle' Effect\")"}, {"id": "D5-Q08", "domain": "5", "domain_name": "Context Management & Reliability", "subdomain_code": "5.1", "subdomain_name": "Context Window Management", "difficulty": "Difficult", "question_type": "Long", "reference_topic": "Selective truncation of old results", "question": "In a telecom operator's billing assistant, each session chains calls to get_invoice, get_plan and get_payments, each with dozens of fields. To stay within the window, an architect proposes removing from the history any tool_result messages older than three turns. In testing, the agent loses the amount of a disputed invoice (€63.40) and the date the customer gave as a payment commitment. Some sessions also exceed any possible window. Which alternative is most robust?", "options": [{"key": "A", "text": "Replace each old tool_result with a model-generated one-line summary and move only the invoice identifiers into a persistent block."}, {"key": "B", "text": "Apply prompt caching to the full history, so old tool_results no longer count against the context window."}, {"key": "C", "text": "Trim each result to its relevant fields before it enters the history, move amounts, dates and customer commitments into a persistent case facts block outside the history, and summarise the rest of the conversation."}, {"key": "D", "text": "Keep removing old tool_results, but call the tool again whenever the agent needs a removed piece of data."}], "correct_answer": "C", "technical_explanation": "It combines the three documented pieces: trimming results on entry, a persistent case facts block (never summarised and present in every prompt) and summarising the rest of the history. It protects both tool data and customer-stated data, even in sessions longer than the window.", "distractor_analysis": [{"key": "A", "type": "Confusion distractor", "explanation": "It goes in the right direction, but one-line summaries keep the general meaning and lose figures, and a block with only identifiers leaves out amounts, dates and commitments, which are what was lost."}, {"key": "B", "type": "Conceptual distractor", "explanation": "Misapplies caching: it reduces the cost and latency of reprocessing a prefix, but cached tokens are still part of the context the model processes."}, {"key": "C", "type": "Correct", "explanation": "Correct."}, {"key": "D", "type": "Plausible alternative", "explanation": "It can recover system data, but not what the customer stated (the commitment date), and the agent cannot know in advance which data it will need. It is still unplanned truncation."}], "reference": "5_1 Context Window Management (\"Tool Result Trimming\", \"Full Conversation History\"; Exam Traps: \"Selectively truncating\")"}, {"id": "D5-Q09", "domain": "5", "domain_name": "Context Management & Reliability", "subdomain_code": "5.2", "subdomain_name": "Escalation & Ambiguity Resolution", "difficulty": "Easy", "question_type": "Short", "reference_topic": "Valid escalation triggers", "question": "Which set contains exactly the three valid triggers for escalating a support conversation to a human?", "options": [{"key": "A", "text": "Explicit request for a human, a violation of documented policy, and inability to make meaningful progress."}, {"key": "B", "text": "Explicit request for a human, negative sentiment above a threshold, and self-reported confidence below 7/10."}, {"key": "C", "text": "Explicit request for a human, a policy gap, and cases whose amount exceeds a limit set by the company."}, {"key": "D", "text": "Explicit request for a human, a policy exception or gap, and inability to make meaningful progress."}], "correct_answer": "D", "technical_explanation": "There are only three valid triggers: the customer's explicit request (honoured immediately), policy exceptions or gaps (the agent cannot make policy), and inability to make progress after a genuine attempt.", "distractor_analysis": [{"key": "A", "type": "Confusion distractor", "explanation": "Confuses violation with gap. A violation has a documented answer (\"no\") and the agent handles it; only a gap, where the policy is silent, requires escalation."}, {"key": "B", "type": "Conceptual distractor", "explanation": "Includes the two unreliable triggers: sentiment does not correlate with complexity, and self-reported confidence is poorly calibrated."}, {"key": "C", "type": "Plausible alternative", "explanation": "An amount limit can be a reasonable business rule, but it is not one of the three documented triggers, and the set omits inability to make progress."}, {"key": "D", "type": "Correct", "explanation": "Correct."}], "reference": "5_2 Escalation & Ambiguity Resolution (\"The Three Valid Escalation Triggers\"); Glossary (\"Escalation Triggers\")"}, {"id": "D5-Q10", "domain": "5", "domain_name": "Context Management & Reliability", "subdomain_code": "5.2", "subdomain_name": "Escalation & Ambiguity Resolution", "difficulty": "Easy", "question_type": "Short", "reference_topic": "Explicit request for a human", "question": "A user's first message to a dental clinic's support agent is: \"Put me through to a person, please.\" What should the agent do?", "options": [{"key": "A", "text": "Measure the message's sentiment and escalate only if it is negative, since a polite tone indicates a simple case."}, {"key": "B", "text": "Acknowledge the request, offer to solve the problem, and escalate only if the user repeats that they prefer a person."}, {"key": "C", "text": "Ask about the reason for the enquiry so it can be routed to the right human department before transferring."}, {"key": "D", "text": "Escalate to human staff in that same reply, without investigating the case first."}], "correct_answer": "D", "technical_explanation": "An explicit request for a human is honoured immediately, in that reply, without investigating or offering help first. It is an absolute rule with no exceptions.", "distractor_analysis": [{"key": "A", "type": "Conceptual distractor", "explanation": "Misapplies sentiment analysis: it is an unreliable trigger, and here it is not even relevant because the user's preference is already explicit."}, {"key": "B", "type": "Confusion distractor", "explanation": "That is the pattern for a frustrated customer who has not asked for a human. Applied here, it turns a clear instruction into a negotiation."}, {"key": "C", "type": "Plausible alternative", "explanation": "It looks like a routing improvement, but delays the transfer with prior investigation; the guide requires escalating in that same reply."}, {"key": "D", "type": "Correct", "explanation": "Correct."}], "reference": "5_2 Escalation & Ambiguity Resolution (\"The Three Valid Escalation Triggers\", \"Frustrated Customers\"; Exam Traps)"}, {"id": "D5-Q11", "domain": "5", "domain_name": "Context Management & Reliability", "subdomain_code": "5.2", "subdomain_name": "Escalation & Ambiguity Resolution", "difficulty": "Easy", "question_type": "Medium", "reference_topic": "Ambiguous customer matches", "question": "An electricity company's agent looks up the customer \"Javier Ruiz\" to apply a credit to his bill. The search_customer tool returns three records with that name in different cities. What is the agent's correct response?", "options": [{"key": "A", "text": "Escalate to a human, because a multiple result means the agent cannot make progress."}, {"key": "B", "text": "Ask for an additional identifier (email, phone or contract number) before acting on any account."}, {"key": "C", "text": "Select the record with the most recent activity, since it is the one most likely to belong to the person writing."}, {"key": "D", "text": "Show the customer the three records, with their city and the last digits of the contract, so he can pick his own."}], "correct_answer": "B", "technical_explanation": "With several matches, the only safe response is to ask for additional identifiers that distinguish the records. Picking one by any heuristic risks a privacy violation or an action on the wrong account.", "distractor_analysis": [{"key": "A", "type": "Conceptual distractor", "explanation": "Misapplies the inability-to-progress trigger: the agent can progress by asking for an identifier. Escalating here lowers first-contact resolution."}, {"key": "B", "type": "Correct", "explanation": "Correct."}, {"key": "C", "type": "Plausible alternative", "explanation": "This is the heuristic the guide explicitly forbids: it may often be right, but when it fails it applies the credit to, or exposes data from, someone else's account."}, {"key": "D", "type": "Confusion distractor", "explanation": "It resembles disambiguation, but reveals data belonging to two other customers: exactly the privacy violation disambiguation is meant to prevent."}], "reference": "5_2 Escalation & Ambiguity Resolution (\"Ambiguous Customer Matching\")"}, {"id": "D5-Q12", "domain": "5", "domain_name": "Context Management & Reliability", "subdomain_code": "5.2", "subdomain_name": "Escalation & Ambiguity Resolution", "difficulty": "Intermediate", "question_type": "Medium", "reference_topic": "Policy gap versus policy violation", "question": "An appliance store's policy says: \"Returns are accepted within 30 days of purchase\" and \"We adjust the price if we reduce our own product's price within 14 days.\" Two requests arrive: (1) a customer wants to return a fridge bought 45 days ago; (2) another asks the store to match a competitor's lower price. How should the agent act?", "options": [{"key": "A", "text": "Escalate both requests, because both fall outside what the agent can grant."}, {"key": "B", "text": "Escalate return (1) as an exception request and decline (2), since competitor price matching does not appear in the policy."}, {"key": "C", "text": "Resolve both autonomously: accept the return as a goodwill gesture and apply the competitor's price by analogy with the adjustment policy."}, {"key": "D", "text": "Decline return (1), explaining the policy, and escalate request (2), because the policy does not cover it."}], "correct_answer": "D", "technical_explanation": "Request (1) is a violation: the policy has a documented answer and the agent applies it. Request (2) is a gap: the policy only covers adjustments to the store's own price and is silent on competitors, so a human decides.", "distractor_analysis": [{"key": "A", "type": "Plausible alternative", "explanation": "It is a cautious option, but poorly calibrated: escalating violations that have a documented answer lowers first-contact resolution and adds nothing."}, {"key": "B", "type": "Confusion distractor", "explanation": "Inverts the distinction: it confuses the policy's silence with a prohibition. (1) has a documented answer; (2) is exactly the textbook gap."}, {"key": "C", "type": "Conceptual distractor", "explanation": "Misapplies the agent's autonomy: it cannot make policy during the conversation or grant exceptions by analogy."}, {"key": "D", "type": "Correct", "explanation": "Correct."}], "reference": "5_2 Escalation & Ambiguity Resolution (\"Policy exceptions or gaps\"); Glossary (\"Policy Gap vs Policy Violation\")"}, {"id": "D5-Q13", "domain": "5", "domain_name": "Context Management & Reliability", "subdomain_code": "5.2", "subdomain_name": "Escalation & Ambiguity Resolution", "difficulty": "Intermediate", "question_type": "Medium", "reference_topic": "Frustrated customer with a simple case", "question": "A courier company's customer writes in capital letters, very angry, because his parcel is arriving three days late. The case is within the agent's capabilities (apology, compensation and reshipment) and the customer has not asked to speak to anyone. Which sequence is correct?", "options": [{"key": "A", "text": "Acknowledge the frustration and offer the resolution directly; escalate only if, after that offer, the customer repeats that he prefers a human."}, {"key": "B", "text": "Escalate immediately, because such negative sentiment indicates the case needs human attention."}, {"key": "C", "text": "Resolve the case without mentioning the anger, to keep the conversation focused on the facts and avoid reinforcing the emotion."}, {"key": "D", "text": "Acknowledge the frustration and offer the resolution; if the customer insists on speaking to a person, propose a second alternative before transferring him."}], "correct_answer": "A", "technical_explanation": "Frustration alone does not decide the response. With a simple case, the agent acknowledges the frustration and offers the resolution; if the customer declines the offer and repeats his preference for a human, the agent then escalates.", "distractor_analysis": [{"key": "A", "type": "Correct", "explanation": "Correct."}, {"key": "B", "type": "Conceptual distractor", "explanation": "Uses sentiment as a trigger, which the guide considers unreliable: anger does not correlate with complexity, and this case is simple."}, {"key": "C", "type": "Plausible alternative", "explanation": "It resolves the case, but omits acknowledging the frustration, which is part of the documented pattern, and does not plan for the customer asking for a human."}, {"key": "D", "type": "Confusion distractor", "explanation": "It starts well, but when the customer repeats his preference the agent must escalate. A second offer turns that preference into a negotiation."}], "reference": "5_2 Escalation & Ambiguity Resolution (\"Frustrated Customers\"); Quick Reference (\"Escalation & Ambiguity\")"}, {"id": "D5-Q14", "domain": "5", "domain_name": "Context Management & Reliability", "subdomain_code": "5.2", "subdomain_name": "Escalation & Ambiguity Resolution", "difficulty": "Difficult", "question_type": "Long", "reference_topic": "Escalation calibration: the proportionate first response", "question": "An insurer deploys an assistant for claim reports. First-contact resolution is 52%, against a 78% target. Logs show that it transfers simple windscreen-breakage claims to human handlers, while trying to resolve on its own coverage requests that the policy does not mention. Its self-reported confidence is high on both types. There are no historical labels on which claims should have been escalated, and the team wants the most proportionate improvement. What should it do first?", "options": [{"key": "A", "text": "Ask the assistant to rate its confidence from 1 to 10 on each claim and transfer to a human those scoring below 8."}, {"key": "B", "text": "Train a separate classifier that predicts which claims should be escalated from historical tickets."}, {"key": "C", "text": "Add explicit escalation criteria with few-shot examples to the system prompt."}, {"key": "D", "text": "Automatically escalate when sentiment analysis detects anger above a threshold in any message."}], "correct_answer": "C", "technical_explanation": "The root cause of poor calibration is unclear decision boundaries. Explicit criteria with few-shot examples fix it directly and are the proportionate response: prompt optimisation should precede architectural changes.", "distractor_analysis": [{"key": "A", "type": "Confusion distractor", "explanation": "It looks like a way to calibrate, but self-reported confidence is poorly calibrated; here it is high on both types, so the threshold would not separate easy cases from hard ones."}, {"key": "B", "type": "Plausible alternative", "explanation": "It is a real solution in other contexts, but adds infrastructure before optimising the prompt and, in addition, there are no historical labels to train it on."}, {"key": "C", "type": "Correct", "explanation": "Correct."}, {"key": "D", "type": "Conceptual distractor", "explanation": "Applies an unreliable trigger: anger does not indicate complexity. Uncovered coverage requests can arrive in a perfectly calm tone."}], "reference": "5_2 Escalation & Ambiguity Resolution (\"Explicit Escalation Criteria in System Prompts\", \"The Two Unreliable Triggers\")"}, {"id": "D5-Q15", "domain": "5", "domain_name": "Context Management & Reliability", "subdomain_code": "5.2", "subdomain_name": "Escalation & Ambiguity Resolution", "difficulty": "Difficult", "question_type": "Long", "reference_topic": "Inability to progress and structured handoff", "question": "A sports-court booking platform's support agent calls modify_booking to change a reservation. With the current implementation, on the first 503 error the agent replies \"I might not be able to handle this\" and transfers the case with the message \"I couldn't help the customer.\" Handlers complain that they receive cases that would have been resolved by retrying, and that they do not know what happened. Which escalation policy is appropriate?", "options": [{"key": "A", "text": "Escalate for inability to progress only after a genuine attempt (retries exhausted, missing access, or a bug needing engineering), with a handoff that includes the customer ID, root cause and recommended action."}, {"key": "B", "text": "Keep escalating on the first error, but add the customer ID, root cause and recommended action to the handoff."}, {"key": "C", "text": "Escalate only after exhausting local retries, keeping the current handoff message so internal technical details are not exposed to the handler."}, {"key": "D", "text": "Never escalate for technical errors: the agent should retry indefinitely, because a tool failure is not a business reason."}], "correct_answer": "A", "technical_explanation": "The inability-to-progress trigger only applies after a genuine attempt; \"I might not be able to\" is not enough. And the documented escalation format is a structured handoff with customer ID, root cause and recommended action.", "distractor_analysis": [{"key": "A", "type": "Correct", "explanation": "Correct."}, {"key": "B", "type": "Plausible alternative", "explanation": "It fixes the format, but still escalates cases that retrying would resolve: there is no genuine attempt before the handoff."}, {"key": "C", "type": "Confusion distractor", "explanation": "It fixes the timing of the escalation, but keeps a generic handoff. The handler still does not know what failed or what to do, which was the second complaint."}, {"key": "D", "type": "Conceptual distractor", "explanation": "Misapplies the trigger: tool errors that retry logic cannot resolve are precisely one of the inability-to-progress cases."}], "reference": "5_2 Escalation & Ambiguity Resolution (\"Inability to make meaningful progress\", \"Explicit Escalation Criteria in System Prompts\")"}, {"id": "D5-Q16", "domain": "5", "domain_name": "Context Management & Reliability", "subdomain_code": "5.2", "subdomain_name": "Escalation & Ambiguity Resolution", "difficulty": "Difficult", "question_type": "Medium", "reference_topic": "Designing few-shot examples for escalation", "question": "You are adding three few-shot examples to the system prompt of a building firm's support agent to fix its escalation calibration. Which set of examples demonstrates what the guide asks for?", "options": [{"key": "A", "text": "A customer who asks for a person and is escalated in that reply; a request not covered by policy, escalated with a structured handoff; and a persistent tool failure escalated after several retries."}, {"key": "B", "text": "A customer who asks for a person and is escalated in that reply; one furious about a simple delay who is resolved without escalation; and a request not covered by policy, escalated with a structured handoff."}, {"key": "C", "text": "Replace the examples with a detailed list of prose rules on when to escalate, since examples consume more tokens."}, {"key": "D", "text": "Three examples in which the agent rates its confidence and escalates when the value falls below 7, so it learns to apply the threshold."}], "correct_answer": "B", "technical_explanation": "The examples must show when to escalate, when to resolve autonomously (including the frustrated-but-resolvable case) and the exact escalation format. This set covers all three aspects.", "distractor_analysis": [{"key": "A", "type": "Confusion distractor", "explanation": "All three escalations are valid, but the autonomous-resolution example (frustrated but resolvable) is missing. Without it, only one side of the boundary is taught and the agent tends to over-escalate."}, {"key": "B", "type": "Correct", "explanation": "Correct."}, {"key": "C", "type": "Plausible alternative", "explanation": "Explicit criteria are part of the solution, but the guide pairs them with few-shot examples, which are what fix the decision boundary."}, {"key": "D", "type": "Conceptual distractor", "explanation": "Uses the few-shot technique correctly but to teach an unreliable trigger: self-reported confidence is not calibrated."}], "reference": "5_2 Escalation & Ambiguity Resolution (\"Explicit Escalation Criteria in System Prompts\")"}, {"id": "D5-Q17", "domain": "5", "domain_name": "Context Management & Reliability", "subdomain_code": "5.3", "subdomain_name": "Error Propagation in Multi-Agent Systems", "difficulty": "Easy", "question_type": "Short", "reference_topic": "Elements of structured error context", "question": "A subagent cannot complete its task and must report to the coordinator. Which four elements should its structured error context contain?", "options": [{"key": "A", "text": "Failure type, attempted action, partial results and potential alternative approaches."}, {"key": "B", "text": "An error status and a readable message that describes the problem clearly."}, {"key": "C", "text": "Failure type, attempted action, partial results and a log of the retries already performed as a recovery plan."}, {"key": "D", "text": "HTTP code, exception stack trace, timestamp and number of retries performed."}], "correct_answer": "A", "technical_explanation": "The coordinator can only decide on recovery based on what the subagent tells it. The four elements are the failure type, what was attempted (query, parameters and target system), the partial results obtained and the alternative approaches the coordinator can choose from.", "distractor_analysis": [{"key": "A", "type": "Correct", "explanation": "Correct."}, {"key": "B", "type": "Plausible alternative", "explanation": "Useful for a person, but it is a generic error: it hides the query, partial results and alternatives, and the guide says never to propagate generic errors."}, {"key": "C", "type": "Confusion distractor", "explanation": "Almost matches, but swaps the alternatives for a log of recovery already attempted. The guide asks for approaches the coordinator can try; \"retried twice\" belongs under the attempted action."}, {"key": "D", "type": "Conceptual distractor", "explanation": "These are legitimate debugging data, but not what the coordinator needs to decide: they do not say what was attempted, what was obtained or what alternatives exist."}], "reference": "5_3 Error Propagation in Multi-Agent Systems (\"Structured Error Context\"); Quick Reference (\"Error Propagation\")"}, {"id": "D5-Q18", "domain": "5", "domain_name": "Context Management & Reliability", "subdomain_code": "5.3", "subdomain_name": "Error Propagation in Multi-Agent Systems", "difficulty": "Easy", "question_type": "Short", "reference_topic": "Valid empty result", "question": "Which of these situations is a valid empty result rather than an access failure?", "options": [{"key": "A", "text": "The connection times out after 30 seconds without returning data."}, {"key": "B", "text": "The database query executes successfully and returns an empty set."}, {"key": "C", "text": "The API returns a 429 for rate limiting and the response contains no records."}, {"key": "D", "text": "The API responds 401 Unauthorized, so there are no results accessible to that user."}], "correct_answer": "B", "technical_explanation": "A valid empty result means the tool reached the source, executed the query and found no matches: the absence of data is the answer and there is nothing to retry. Timeouts, 401s and 429s are access failures: the query never executed.", "distractor_analysis": [{"key": "A", "type": "Plausible alternative", "explanation": "There is no data either, but the search did not execute: it is a transient failure that calls for considering a retry or a fallback source."}, {"key": "B", "type": "Correct", "explanation": "Correct."}, {"key": "C", "type": "Confusion distractor", "explanation": "Convincing because the response arrives with no records, but the query did not execute: it is an access failure that calls for waiting and retrying while respecting Retry-After."}, {"key": "D", "type": "Conceptual distractor", "explanation": "Misreads an authentication failure as \"no data\". The query did not execute; the right move is to retry with correct credentials or escalate."}], "refe
